name: P101 B5 isolated real-physics fast lane
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p101-b5-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a13-native:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A13 shape integrity and actual native road machine tests
        run: node --test tests/p101-a13-road.test.mjs tests/p101-a13-machine-visual.test.mjs
      - name: A13 true 240Hz 28-machine pilot (finish NOT required, record failures)
        run: |
          set -o pipefail
          node scripts/p101-a13-native-pilot.mjs | tee a13-native-pilot.jsonl
      - name: A13 W6 2x2 240Hz causal ablations (failure is evidence, no finish assumption)
        run: |
          set -o pipefail
          node --test tests/p101-a13-ablation.test.mjs
          node scripts/p101-a13-ablation.mjs | tee a13-w6-ablation.jsonl
      - name: A13 W6B 28-station scripted steering feasibility only (NEVER in gameplay)
        run: |
          set -o pipefail
          node --test tests/p101-a13-28aware-audit.test.mjs
          node scripts/p101-a13-28aware-audit.mjs | tee a13-w6b-28aware.jsonl
      - name: W7 true 240Hz 8-candidate actual shoulder/width diagnostic (unshipped)
        run: |
          set -o pipefail
          node --test tests/p101-a13-w7-candidate-matrix.test.mjs
          node scripts/p101-a13-w7-candidate-matrix.mjs | tee a13-w7-matrix.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p101-a13-native-pilot-${{ github.run_id }}
          path: |
            a13-native-pilot.jsonl
            a13-w6-ablation.jsonl
            a13-w6b-28aware.jsonl
            a13-w7-matrix.jsonl
          if-no-files-found: ignore
          retention-days: 7
  b5-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress actual P100/P101 B4E, B5 geometry seams, native 12 obstacle mechanics
        run: node --test tests/p101-b5.test.mjs tests/p101-overdrive.test.mjs tests/p101-b5-forward.test.mjs tests/p101-b5-optic.test.mjs
      - name: A13 independent genuine narrow-road geometry and native steering integrity
        run: node --test tests/p101-a13-road.test.mjs
      - name: B5 A6 true 240Hz 7.28km course 155m-drop safe-then-surge acceleration test
        run: |
          set -o pipefail
          node scripts/p101-b5-a6-surge.mjs | tee p101-b5-a6-true-physics.jsonl
      - name: B5 A9 real startup-speed safety envelope using EXACT browser physical boost law
        run: |
          set -o pipefail
          node scripts/p101-b5-startup.mjs | tee p101-b5-startup.jsonl
      - name: A11 manual in-browser audit, no automatic report transmission or physics drift
        run: node --test tests/p101-b5-manual-qa.test.mjs
      - name: Package A11 PR-only Windows one-click offline-local B5 manual QA
        run: |
          npm run build:site
          node scripts/pack-p101-b5-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p101-b5-a11-local-oneclick-review-${{ github.run_id }}
          path: b5-manual-review/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p101-b5-a6-physical-results-${{ github.run_id }}
          path: |
            p101-b5-a6-true-physics.jsonl
            p101-b5-startup.jsonl
          if-no-files-found: ignore
          retention-days: 7
