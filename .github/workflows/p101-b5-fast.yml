name: P101 B5 isolated real-physics fast lane
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p101-b5-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  b5-native:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect P100/P101 B4E, B5 real geometry, B48 240Hz and original 12 machines
        run: node --test tests/p101-b5.test.mjs tests/p101-overdrive.test.mjs
      - name: B5 A5 physically finish 7.28km near 200m/s at 8 true native speed settings
        run: |
          set -o pipefail
          node scripts/p101-b5-a5-narrow.mjs | tee p101-b5-a5-narrow.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p101-b5-a5-native-evidence-${{ github.run_id }}
          path: p101-b5-a5-narrow.jsonl
          if-no-files-found: ignore
          retention-days: 7
