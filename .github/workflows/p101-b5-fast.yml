name: P101 B5 isolated real-physics fast lane
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p101-b5-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  b5-native:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authored full 3D seams, 2000m bounds, 12 B51-C machines and frozen original
        run: node --test tests/p101-b5.test.mjs
      - name: Measure all authentic 240Hz B48 collision runs (no scripted success assertion)
        run: |
          set -o pipefail
          node scripts/p101-b5-native-fast.mjs | tee p101-b5-true-native.jsonl
      - name: P101 B5 genuine speed tuning, fine forward power sweep (full native 240Hz)
        run: |
          set -o pipefail
          node scripts/p101-b5-speed-tune.mjs | tee p101-b5-speed-sweep.jsonl
      - name: B5 real physics steering input sensitivity at strong native 4.8x lateral authority
        run: |
          set -o pipefail
          node scripts/p101-b5-steering-sweep.mjs | tee p101-b5-steering-grid.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p101-b5-physical-evidence-${{ github.run_id }}
          path: |
            p101-b5-true-native.jsonl
            p101-b5-speed-sweep.jsonl
            p101-b5-steering-grid.jsonl
          if-no-files-found: ignore
          retention-days: 7
