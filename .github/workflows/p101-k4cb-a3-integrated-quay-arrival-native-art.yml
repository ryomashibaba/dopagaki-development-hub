name: DOPAGAKI K4CB A3 real Blender habitable quay arrival and tidal ground ART HOLD
on:
  push:
    branches: [research/k4cb-a3-integrated-quay-arrival-art-20261105]
    paths:
      - scripts/p101-k4cb-a3-integrated-quay-arrival-source-locked.py
      - .github/workflows/p101-k4cb-a3-integrated-quay-arrival-native-art.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dopagaki-k4cb-a3-native-quay-arrival
  cancel-in-progress: true
jobs:
  protected-authentic-native-a3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preflight source Game, Blender author syntax and real Road5 lineage
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4cb-a3-integrated-quay-arrival-art-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-k4cb-a3-integrated-quay-arrival-source-locked.py
          node --test tests/p101-r19a6p4r2f5k4ay-source-native-context.test.mjs
      - name: Download the exact already-verified A2 editable Blender parent
        uses: actions/download-artifact@v4
        with:
          name: K4CB_A2_TRUE_SCULPTED_TERMINAL_EDITABLE_CHASE_ART_HOLD
          repository: ryomashibaba/dopagaki-development-hub
          run-id: 41914599116
          github-token: ${{ github.token }}
          path: research/evidence/k4cb-a3/parent
      - name: Verify actual parent bytes independently against strict source and SHA locks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('research/evidence/k4cb-a3/parent')
          a=json.loads((d/'K4CB_A2_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4CB_A1_exact_sha256']=='ea0cadc1db9dde9b01faac17d1cddc7b81c4d6c011eae2ea3c8bf68e90ec5b5d'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          assert a['originalSixCameraPosesUnchanged'] and a['originalCHASEUnchanged']
          assert a['K4BZ_bad_duplicate_road_hidden'] and a['originalElevenTreeTransformsUnchanged']
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          for name,meta in a['files'].items():
              raw=(d/name).read_bytes()
              assert len(raw)==meta['bytes'] and hashlib.sha256(raw).hexdigest()==meta['sha256'],name
          name='K4CB_A2_SCULPTED_FERRY_TERMINAL_EDITABLE_NATIVE_ART_HOLD.blend'
          assert a['files'][name]['sha256']=='5f57d64654ff8df6b6ecd852699432cda50f1afc1af3723779170ccb4cbed5b1'
          print('A3_PARENT_A2_GENUINE_BYTES_AND_IMMUTABLE_SOURCE_PASS')
          PY
      - name: Install actual Blender EEVEE, Python image verification and protect K4BZ black seam
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-pil python3-numpy xvfb libegl1 libgl1-mesa-dri libopengl0 libgbm1 libgl1
          /usr/bin/python3 tests/p101-k4bz-proven-dark-wedge-regression.py
          /usr/bin/python3 tests/p101-k4ca-protected-coastal-frame-regression.py
      - name: Run editable A3 real 3D functional quay arrival authoring and native same CHASE render
        run: |
          set -euo pipefail
          mkdir -p research/evidence/k4cb-a3/render
          xvfb-run -a -s '-screen 0 1280x900x24' env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 blender -b --factory-startup --python-exit-code 3 \
            --python scripts/p101-k4cb-a3-integrated-quay-arrival-source-locked.py -- \
            --base research/evidence/k4cb-a3/parent/K4CB_A2_SCULPTED_FERRY_TERMINAL_EDITABLE_NATIVE_ART_HOLD.blend \
            --out research/evidence/k4cb-a3/render 2>&1 | tee research/evidence/k4cb-a3/render/K4CB_A3_NATIVE_BLENDER.log
      - name: Independent SHA, original geometry and same-camera native PNG comparison
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          d=Path('research/evidence/k4cb-a3/render')
          a=json.loads((d/'K4CB_A3_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4CB_A2_exact_sha256']=='5f57d64654ff8df6b6ecd852699432cda50f1afc1af3723779170ccb4cbed5b1'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          for k in ('originalSixCameraPosesUnchanged','originalCHASEUnchanged',
                    'originalElevenTreeTransformsUnchanged','originalLightsUnchanged',
                    'K4BZ_bad_duplicate_road_hidden','allOriginalObjectVisibilityUnchanged',
                    'originalRoofAndPiersUnmodified','noExtraRoadSurfaceAdded',
                    'sourceA2ObjectsUnchanged','singlePortGatewayAndTidalShelfNotGame'):
              assert a[k],k
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          assert a['ART']=='UNJUDGED_HOLD' and a['renderEngine']=='BLENDER_EEVEE'
          for name,m in a['files'].items():
              raw=(d/name).read_bytes()
              assert len(raw)==m['bytes'] and hashlib.sha256(raw).hexdigest()==m['sha256'],name
          prev=Image.open('research/evidence/k4cb-a3/parent/K4CB_A2_TRUE_SAME_CHASE_SCULPTED_TERMINAL_NOT_GAME.png').convert('RGB')
          new=Image.open(d/'K4CB_A3_TRUE_SAME_CHASE_INTEGRATED_QUAY_ARRIVAL_NOT_GAME.png').convert('RGB')
          assert prev.size==new.size==(768,480)
          region=ImageChops.difference(prev,new).crop((495,95,768,445))
          n=sum(max(px)>15 for px in region.getdata())
          assert n>450,('NEW_QUAY_NOT_RENDERED_SIGNIFICANTLY',n)
          pairs=[((292,300),(317,300)),((280,330),(310,330)),
                 ((267,360),(310,360)),((250,400),(295,400)),
                 ((235,440),(280,440)),((225,470),(270,470))]
          wedge=[]
          for dark,normal in pairs:
              before=(sum(prev.getpixel(normal))-sum(prev.getpixel(dark)))/3
              after=(sum(new.getpixel(normal))-sum(new.getpixel(dark)))/3
              assert abs(after-before)<12,('REINTRODUCED_K4BZ_BLACK_WEDGE',dark,before,after)
              wedge.append({'dark':dark,'normal':normal,'before':round(before,3),'after':round(after,3)})
          comparison='K4CB_A3_VS_A2_TRUE_SAME_CHASE_QUAY_ARRIVAL_ART_REVIEW_NOT_GAME.png'
          canvas=Image.new('RGB',(1560,552),(15,19,22))
          canvas.paste(prev,(12,50));canvas.paste(new,(780,50))
          draw=ImageDraw.Draw(canvas)
          draw.text((12,18),'A2 REAL Blender CHASE - ART REJECT',fill='white')
          draw.text((780,18),'A3 REAL Blender CHASE - ART UNJUDGED',fill='white')
          draw.text((12,536),'True editable DCC, not native WebGL2 game, not FPS, not ART approval.',fill='white')
          canvas.save(d/comparison)
          a['imageIndependentQA']={'changedRightPortPixelsNotArtScore':n,
              'originalK4BZWedgePairs':wedge,'comparisonName':comparison,
              'comparisonSHA256':hashlib.sha256((d/comparison).read_bytes()).hexdigest(),
              'ART':'UNJUDGED_HOLD'}
          (d/'K4CB_A3_REAL_NATIVE_AUDIT.json').write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          print('K4CB_A3_TRUE_EDITABLE_BLENDER_SHA_ORIGINAL_SOURCE_AND_FRAME_QA_PASS',n)
          PY
      - name: Commit only actual research evidence and never merge original source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4cb-a3-integrated-quay-arrival-art-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          mkdir -p docs/research-evidence/k4cb-a3
          cp research/evidence/k4cb-a3/render/*.png docs/research-evidence/k4cb-a3/
          cp research/evidence/k4cb-a3/render/*.json docs/research-evidence/k4cb-a3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-evidence/k4cb-a3
          if ! git diff --cached --quiet; then
            git commit -m "evidence(k4cb-a3): authentic editable 3D functional quay arrival same-CHASE ART HOLD"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/research/k4cb-a3-integrated-quay-arrival-art-20261105
          fi
      - name: Archive true editable source, actual frame, logs, hash audit, even if technical hold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CB_A3_TRUE_INTEGRATED_QUAY_ARRIVAL_EDITABLE_CHASE_ART_HOLD
          path: research/evidence/k4cb-a3/render/
          if-no-files-found: warn
          retention-days: 21
