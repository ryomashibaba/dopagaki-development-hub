name: DOPAGAKI K4CJ genuine original Road5 coastal cut speed-rhythm native ART HOLD
on:
  push:
    branches: [research/k4cj-source-locked-roadcut-speed-rhythm-20261105]
    paths:
      - scripts/p101-k4cj-native-source-roadcut-speed-rhythm.py
      - .github/workflows/p101-k4cj-native-source-roadcut-art.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dopagaki-k4cj-roadcut-rhythm
  cancel-in-progress: true
jobs:
  protected-authentic-native-k4cj:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preflight source Game, Blender author syntax and real Road5 lineage
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4cj-source-locked-roadcut-speed-rhythm-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-k4cj-native-source-roadcut-speed-rhythm.py
          node --test tests/p101-r19a6p4r2f5k4ay-source-native-context.test.mjs
      - name: Download immutable successful K4CI real editable Blender and original CHASE
        uses: actions/download-artifact@v4
        with:
          name: K4CI_TRUE_SHIPYARD_TIDEGATE_SOURCE_LOCKED_ART_HOLD
          repository: ryomashibaba/dopagaki-development-hub
          run-id: 41966161805
          github-token: ${{ github.token }}
          path: research/evidence/k4cj/parent
      - name: Independently authenticate exact real K4CI parent and original game Road5 SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('research/evidence/k4cj/parent')
          a=json.loads((d/'K4CI_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4CHExactSHA256']=='74dadf53327e7fff0fd3b57a9b9ff369371e2c0fffa43241eb27bee1ca19cace'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          for k in ('originalSixCameraPosesUnchanged','originalCHASEUnchanged',
                    'originalElevenTreeTransformsUnchanged','originalLightsUnchanged',
                    'allExistingSourceAndResearchObjectsIdentical','K4BZ_bad_duplicate_road_hidden'):
              assert a[k],k
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          assert a['realGantryEditableObjects']==1
          for name,m in a['files'].items():
              raw=(d/name).read_bytes()
              assert len(raw)==m['bytes'] and hashlib.sha256(raw).hexdigest()==m['sha256'],name
          assert a['files']['K4CI_EDITABLE_SOURCE_LOCKED_MARITIME_TIDE_GATE_ART_HOLD.blend']['sha256']=='f1ce87fff6c88841890b6fc2dd4840db4b35a86be75236d90c02613a26ac7bb4'
          print('K4CJ_FIXED_SOURCE_PARENT_ACTUAL_NATIVE_SHA_PASS')
          PY
      - name: Install genuine Blender from official Ubuntu archive instead of stalled Azure mirror
        timeout-minutes: 18
        run: |
          set -euo pipefail
          # Actual hosted runner failure #41950843684: Azure mirror took over 6m
          # for the first 35.9MB blender-data, then apt timeout 124.
          # Fix package transport only, never source, geometry, camera or road.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          echo 'K4CJ_OFFICIAL_UBUNTU_PACKAGE_SOURCE'
          if ! sudo timeout --signal=TERM --kill-after=10s 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq; then
            echo 'K4CJ_OFFICIAL_MIRROR_UPDATE_FAILED_USING_SIGNED_RUNNER_INDEX'
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 900s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender python3-pil python3-numpy xvfb libegl1 libgl1-mesa-dri libopengl0 libgbm1 libgl1
          command -v blender
          blender -b -noaudio --factory-startup --python-expr "import bpy; print('K4CJ_REAL_BLENDER_VERSION', bpy.app.version_string)"
          /usr/bin/python3 tests/p101-k4bz-proven-dark-wedge-regression.py
          /usr/bin/python3 tests/p101-k4ca-protected-coastal-frame-regression.py
      - name: Sculpt real 198m source Road5 geological cut and one windbreak world-depth structure in Blender
        run: |
          set -euo pipefail
          mkdir -p research/evidence/k4cj/render
          xvfb-run -a -s '-screen 0 1280x900x24' env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 blender -b --factory-startup --python-exit-code 3 \
            --python scripts/p101-k4cj-native-source-roadcut-speed-rhythm.py -- \
            --base research/evidence/k4cj/parent/K4CI_EDITABLE_SOURCE_LOCKED_MARITIME_TIDE_GATE_ART_HOLD.blend \
            --out research/evidence/k4cj/render 2>&1 | tee research/evidence/k4cj/render/K4CJ_REAL_BLENDER.log
      - name: Independent original Road5 source SHA, true road-facing coast visual and native material image QA
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          d=Path('research/evidence/k4cj/render')
          a=json.loads((d/'K4CJ_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4CIExactSHA256']=='f1ce87fff6c88841890b6fc2dd4840db4b35a86be75236d90c02613a26ac7bb4'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          for k in ('originalSixCameraPosesUnchanged','originalCHASEUnchanged',
                    'originalElevenTreeTransformsUnchanged','originalLightsUnchanged',
                    'allInheritedSourceAndResearchGeometryIdentical',
                    'K4BZ_bad_duplicate_road_hidden'):
              assert a[k],k
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          assert a['trueResearchEditableMeshes']==4
          assert a['actualReauthoredForegroundRockCopyCount']==2
          assert len(a['nonDestructiveResearchRockRenderSwaps'])==2
          assert a['windbreakStartsAfterSourceStationMetres']>=30
          assert a['actualRoadCutRealWorldVertices']>850
          assert a['actualRoadCutRealWorldTriangleFaces']>1600
          assert a['actualRealWindbreakVertices']>350
          assert a['actualRealWindbreakFaces']>260
          assert a['realLongitudinalRoadCutStations']>80
          assert a['realIntegratedWindbreakBays']>=9
          assert a['minimumRoadCentreLateralDistanceOfNewCoastMetres']>16.4
          assert a['maxVisibleNewRoadCutXNotArtScore']<.49
          assert a['maxVisibleWindbreakXNotArtScore']<.49
          assert a['ART']=='UNJUDGED_HOLD' and a['renderEngine']=='BLENDER_EEVEE'
          for name,m in a['files'].items():
              raw=(d/name).read_bytes()
              assert len(raw)==m['bytes'] and hashlib.sha256(raw).hexdigest()==m['sha256'],name
          old=Image.open('research/evidence/k4cj/parent/K4CI_TRUE_SOURCE_CHASE_MARITIME_TIDEGATE_NOT_GAME.png').convert('RGB')
          new=Image.open(d/'K4CJ_TRUE_CHASE_ROAD_EDGE_SPEED_RHYTHM_NOT_GAME.png').convert('RGB')
          assert old.size==new.size==(768,480)
          diff=ImageChops.difference(old,new)
          def count(area,cut=15):
              return sum(max(p)>cut for p in diff.crop(area).getdata())
          left=count((5,148,300,466),15)
          harbor=count((500,55,768,434),16)
          road=count((330,265,480,470),12)
          assert left>6500,('NEW_SOURCE_ALIGNED_ROADCUT_NOT_VISIBLE',left)
          assert harbor<110,('RIGHT_HARBOR_OR_LANDMARK_UNEXPECTEDLY_CHANGED',harbor)
          assert road<60,('ORIGINAL_ROAD_CENTER_PIXELS_CHANGED',road)
          for pt in ((390,270),(400,320),(380,380),(420,440),(470,465)):
              a0=old.getpixel(pt);b0=new.getpixel(pt)
              assert max(abs(a0[k]-b0[k]) for k in range(3))<=10,('PROTECTED_ROAD_PIXEL_CHANGED',pt,a0,b0)
          pairs=[((292,300),(317,300)),((280,330),(310,330)),
                 ((267,360),(310,360)),((250,400),(295,400)),
                 ((235,440),(280,440)),((225,470),(270,470))]
          for dark,normal in pairs:
              p=(sum(old.getpixel(normal))-sum(old.getpixel(dark)))/3.
              q=(sum(new.getpixel(normal))-sum(new.getpixel(dark)))/3.
              assert abs(p-q)<14,('K4BZ_KNOWN_BLACK_WEDGE_REGRESSION',dark,p,q)
          image=Image.new('RGB',(1560,555),(13,17,22))
          image.paste(old,(12,50));image.paste(new,(780,50))
          draw=ImageDraw.Draw(image)
          draw.text((12,18),'K4CI genuine Blender CHASE baseline | ART REJECT',fill='white')
          draw.text((780,18),'K4CJ original Road5 world-scale cut/windbreak | ART UNJUDGED',fill='white')
          draw.text((12,536),'Actual editable DCC only; not human play or official ART pass.',fill='white')
          name='K4CJ_VS_K4CI_TRUE_SOURCE_CHASE_ROAD_DEPTH_ART_REVIEW.png'
          image.save(d/name)
          a['independentSameChaseImageQA']={
              'genuineLeftRoadcutVisibleChangedPixelsNotArtScore':left,
              'unchangedRightPortPixelDifference':harbor,
              'unchangedSourceRoadCentrePixelDifference':road,
              'comparisonName':name,
              'comparisonSHA256':hashlib.sha256((d/name).read_bytes()).hexdigest(),
              'ART':'UNJUDGED_HOLD'}
          (d/'K4CJ_REAL_NATIVE_AUDIT.json').write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          print('K4CJ_GENUINE_FROZEN_ROAD5_ART_NATIVE_TECH_PASS',left,harbor,road)
          PY
      - name: Commit only actual research evidence and never merge original source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4cj-source-locked-roadcut-speed-rhythm-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          mkdir -p docs/research-evidence/k4cj
          cp research/evidence/k4cj/render/*.png docs/research-evidence/k4cj/
          cp research/evidence/k4cj/render/*.json docs/research-evidence/k4cj/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-evidence/k4cj
          if ! git diff --cached --quiet; then
            git commit -m "evidence(k4cj): source Road5 original depth-matched coastal roadcut and windbreak true same-CHASE ART HOLD"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/research/k4cj-source-locked-roadcut-speed-rhythm-20261105
          fi
      - name: Archive actual K4CG Blender worldscape and independent audit even when ART HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CJ_TRUE_ROAD5_CUT_NATIVE_EDITABLE_ART_HOLD
          path: research/evidence/k4cj/render/
          if-no-files-found: warn
          retention-days: 21
