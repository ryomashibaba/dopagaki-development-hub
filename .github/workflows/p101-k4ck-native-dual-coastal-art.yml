name: DOPAGAKI K4CK genuine source-locked dual coastal cut art alternatives
on:
  push:
    branches: [research/k4ck-continuous-coastal-cut-retaining-wall-20261105]
    paths:
      - scripts/p101-k4ck-source-locked-two-coastal-corridors.py
      - .github/workflows/p101-k4ck-native-dual-coastal-art.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dopagaki-k4ck-coastal-directions
  cancel-in-progress: true
jobs:
  protected-authentic-native-k4ck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preflight source Game, Blender author syntax and real Road5 lineage
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4ck-continuous-coastal-cut-retaining-wall-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-k4ck-source-locked-two-coastal-corridors.py
          node --test tests/p101-r19a6p4r2f5k4ay-source-native-context.test.mjs
      - name: Download exact successful K4CJ R2 genuine Blender DCC parent
        uses: actions/download-artifact@v4
        with:
          name: K4CJ_TRUE_ROAD5_CUT_NATIVE_EDITABLE_ART_HOLD
          repository: ryomashibaba/dopagaki-development-hub
          run-id: 41968702663
          github-token: ${{ github.token }}
          path: research/evidence/k4ck/parent
      - name: Independently pin K4CJ genuine DCC parent plus source Game Road5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('research/evidence/k4ck/parent')
          a=json.loads((d/'K4CJ_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4CIExactSHA256']=='f1ce87fff6c88841890b6fc2dd4840db4b35a86be75236d90c02613a26ac7bb4'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          for k in ('originalSixCameraPosesUnchanged','originalCHASEUnchanged',
                    'originalElevenTreeTransformsUnchanged','originalLightsUnchanged',
                    'allInheritedSourceAndResearchGeometryIdentical','K4BZ_bad_duplicate_road_hidden'):
              assert a[k],k
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          assert a['trueResearchEditableMeshes']==4
          for name,meta in a['files'].items():
              raw=(d/name).read_bytes()
              assert len(raw)==meta['bytes'] and hashlib.sha256(raw).hexdigest()==meta['sha256'],name
          assert a['files']['K4CJ_SOURCE_ROAD5_CONTINUOUS_COAST_CUT_EDITABLE_ART_HOLD.blend']['sha256']=='296326d18c446e70c25ca45598ad623affaf20c07a26e263b1789e9dc2bb04d2'
          print('K4CK_GENUINE_K4CJ_PARENT_SOURCE_ROAD5_AND_OLD_ART_SHA_PASS')
          PY
      - name: Install genuine Blender from official Ubuntu archive instead of stalled Azure mirror
        timeout-minutes: 18
        run: |
          set -euo pipefail
          # Actual hosted runner failure #41950843684: Azure mirror took over 6m
          # for the first 35.9MB blender-data, then apt timeout 124.
          # Fix package transport only, never source, geometry, camera or road.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          echo 'K4CK_OFFICIAL_UBUNTU_PACKAGE_SOURCE'
          if ! sudo timeout --signal=TERM --kill-after=10s 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq; then
            echo 'K4CK_OFFICIAL_MIRROR_UPDATE_FAILED_USING_SIGNED_RUNNER_INDEX'
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 900s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender python3-pil python3-numpy xvfb libegl1 libgl1-mesa-dri libopengl0 libgbm1 libgl1
          command -v blender
          blender -b -noaudio --factory-startup --python-expr "import bpy; print('K4CK_REAL_BLENDER_VERSION', bpy.app.version_string)"
          /usr/bin/python3 tests/p101-k4bz-proven-dark-wedge-regression.py
          /usr/bin/python3 tests/p101-k4ca-protected-coastal-frame-regression.py
      - name: Author two distinct physical world-coastal race corridor landforms and a connected retaining wall
        run: |
          set -euo pipefail
          mkdir -p research/evidence/k4ck/render
          xvfb-run -a -s '-screen 0 1280x900x24' env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 blender -b --factory-startup --python-exit-code 3 \
            --python scripts/p101-k4ck-source-locked-two-coastal-corridors.py -- \
            --base research/evidence/k4ck/parent/K4CJ_SOURCE_ROAD5_CONTINUOUS_COAST_CUT_EDITABLE_ART_HOLD.blend \
            --out research/evidence/k4ck/render 2>&1 | tee research/evidence/k4ck/render/K4CK_REAL_BLENDER.log
      - name: Independent A/B true native images, source road preservation, editability and ART audit
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          d=Path('research/evidence/k4ck/render')
          a=json.loads((d/'K4CK_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4CJR2ExactSHA256']=='296326d18c446e70c25ca45598ad623affaf20c07a26e263b1789e9dc2bb04d2'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          for k in ('originalSixCameraPosesUnchanged','originalCHASEUnchanged',
                    'originalElevenTreeTransformsUnchanged','originalLightsUnchanged',
                    'parentSourceAndAllMeshesMatrixUnchanged'):
              assert a[k],k
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          assert len(a['originalResearchCutAndTriangleWindbreakHiddenOnlyInStudy'])==2
          assert len(a['hiddenResearchOriginalMeshFingerprints'])==2
          assert a['allThreeRealEditableGeometryMeshes']==3
          assert a['realCoastLongitudinalStations']>=95
          assert a['realDirectionACliffVertices']>1400 and a['realDirectionBCliffVertices']>1400
          assert a['realDirectionACliffFaces']>2800 and a['realDirectionBCliffFaces']>2800
          assert a['realConnectedTrafficRetainingWallVertices']>600
          assert a['realConnectedTrafficRetainingWallFaces']>600
          assert a['minimumPhysicalNewRoadcutLateralMetres']>16.4
          assert a['ART']=='UNJUDGED_HOLD' and a['renderEngine']=='BLENDER_EEVEE'
          for name,meta in a['files'].items():
              raw=(d/name).read_bytes()
              assert len(raw)==meta['bytes'] and hashlib.sha256(raw).hexdigest()==meta['sha256'],name
          old=Image.open('research/evidence/k4ck/parent/K4CJ_TRUE_CHASE_ROAD_EDGE_SPEED_RHYTHM_NOT_GAME.png').convert('RGB')
          imageA=Image.open(d/'K4CK_A_TRUE_CHASE_CONTINUOUS_BASALT_CUT_AND_RETAINING_WALL_NOT_GAME.png').convert('RGB')
          imageB=Image.open(d/'K4CK_B_TRUE_CHASE_ERODED_NATURAL_CLIFF_NO_WALL_NOT_GAME.png').convert('RGB')
          assert old.size==imageA.size==imageB.size==(768,480)
          def count(p,q,area,threshold=15):
              diff=ImageChops.difference(p.crop(area),q.crop(area))
              return sum(max(rgb)>threshold for rgb in diff.getdata())
          variants={}
          for label,new in (('A',imageA),('B',imageB)):
              left=count(old,new,(5,150,300,465))
              road=count(old,new,(330,265,480,470),12)
              port=count(old,new,(510,65,768,450),16)
              assert left>7000,('NOT_SUBSTANTIALLY_DIFFERENT_REAL_WORLDSCAPE',label,left)
              assert road<65,('ORIGINAL_GAME_ROAD_CORRIDOR_PIXELS_CHANGED',label,road)
              assert port<110,('ORIGINAL_GAME_HARBOR_SCENERY_CHANGED_UNEXPECTEDLY',label,port)
              for pt in ((390,270),(400,320),(380,380),(420,440),(470,465)):
                  p=old.getpixel(pt);q=new.getpixel(pt)
                  assert max(abs(p[k]-q[k]) for k in range(3))<=10,('ROAD5_PROTECTED_POINT_CHANGED',label,pt,p,q)
              pairs=[((292,300),(317,300)),((280,330),(310,330)),
                     ((267,360),(310,360)),((250,400),(295,400)),
                     ((235,440),(280,440)),((225,470),(270,470))]
              for dark,normal in pairs:
                  p=(sum(old.getpixel(normal))-sum(old.getpixel(dark)))/3.
                  q=(sum(new.getpixel(normal))-sum(new.getpixel(dark)))/3.
                  assert abs(p-q)<14,('K4BZ_BLACK_WEDGE_REGRESSION',label,dark,p,q)
              variants[label]={'leftRealChangedPixelsNotArtScore':left,
                               'originalRoadChangedPixels':road,
                               'protectedPortChangedPixels':port}
          between=count(imageA,imageB,(5,150,340,465))
          assert between>2700,('A_B_ARE_NOT_REAL_DIFFERENT_ART_DIRECTIONS',between)
          comp=Image.new('RGB',(2340,553),(13,18,22))
          for x,im in ((12,old),(780,imageA),(1548,imageB)):
              comp.paste(im,(x,49))
          draw=ImageDraw.Draw(comp)
          draw.text((12,16),'K4CJ R2 original true CHASE | ART REJECT',fill='white')
          draw.text((780,16),'K4CK A real cut with connected stone parapet | ART UNJUDGED',fill='white')
          draw.text((1548,16),'K4CK B real eroded natural rock corridor | ART UNJUDGED',fill='white')
          draw.text((12,535),'Genuine source-locked editable Blender only; NOT WebGL2 official game or human play.',fill='white')
          name='K4CK_K4CJ_TRUE_CHASE_THREE_WORLDSCAPE_ART_COMPARISON.png'
          comp.save(d/name)
          a['independentThreeTrueChaseImagesQA']={
              'variants':variants,
              'A_vs_B_left_changed_pixelsNotArtScore':between,
              'comparisonName':name,
              'comparisonSHA256':hashlib.sha256((d/name).read_bytes()).hexdigest(),
              'ART':'UNJUDGED_HOLD'}
          (d/'K4CK_REAL_NATIVE_AUDIT.json').write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          print('K4CK_TWO_GENUINE_NATIVE_BLENDER_COASTAL_ALTERNATIVES_QA_PASS',variants,between)
          PY
      - name: Commit only actual research evidence and never merge original source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4ck-continuous-coastal-cut-retaining-wall-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          mkdir -p docs/research-evidence/k4ck
          cp research/evidence/k4ck/render/*.png docs/research-evidence/k4ck/
          cp research/evidence/k4ck/render/*.json docs/research-evidence/k4ck/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-evidence/k4ck
          if ! git diff --cached --quiet; then
            git commit -m "evidence(k4ck): real native alternative coastal raceworld A and B retaining wall and natural geology same frozen Road5 chase"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/research/k4ck-continuous-coastal-cut-retaining-wall-20261105
          fi
      - name: Archive actual K4CG Blender worldscape and independent audit even when ART HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CK_TRUE_DUAL_COASTAL_CORRIDOR_EDITABLE_ART_HOLD
          path: research/evidence/k4ck/render/
          if-no-files-found: warn
          retention-days: 21
