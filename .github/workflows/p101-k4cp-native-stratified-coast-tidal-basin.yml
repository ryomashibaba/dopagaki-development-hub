name: DOPAGAKI K4CP native stratified coastline and actual one-datum tidal basin ART HOLD
on:
  push:
    branches: [research/k4cp-stratified-coast-tidal-basin-20261105]
    paths:
      - scripts/p101-k4cp-native-stratified-coast-tidal-basin.py
      - .github/workflows/p101-k4cp-native-stratified-coast-tidal-basin.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dopagaki-k4cp-real-fullscreen-native-art
  cancel-in-progress: false
jobs:
  authentic-k4cp-blender-source-protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preflight exact original Game and author source syntax
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4cp-stratified-coast-tidal-basin-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-k4cp-native-stratified-coast-tidal-basin.py
          node --test tests/p101-r19a6p4r2f5k4ay-source-native-context.test.mjs
      - name: Fetch K4CO R2 truly editable full Blender parent, never substitute proxies
        uses: actions/download-artifact@v4
        with:
          name: K4CO_TRUE_SOURCE_GROUNDED_FREIGHT_VIADUCT_EDITABLE_ART_HOLD
          repository: ryomashibaba/dopagaki-development-hub
          run-id: 42012187718
          github-token: ${{ github.token }}
          path: research/evidence/k4cp/parent
      - name: Authenticate exact original Road5, K4CO parent, immutable research meshes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path('research/evidence/k4cp/parent')
          a=json.loads((d/'K4CO_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4CNR2ExactSHA256']=='f66531d8596e67a19f4c6f2debcf2521efbae54d9fc5ac911f94963dd6a45156'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          for k in ('originalSixCameraPosesUnchanged','originalCHASEUnchanged',
                    'originalElevenTreeTransformsUnchanged','originalLightsUnchanged',
                    'allInheritedMeshGeometryAndTransformsUnchanged'):
              assert a[k],k
          assert not a['sourceGameEdited'] and not a['sourcePhysicsEdited']
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          assert a['realSpanBetweenGroundedAbutmentsMetres']==95
          assert a['realSourceRoadClearanceMetres']>20
          for name,meta in a['files'].items():
              p=d/name
              assert p.stat().st_size==meta['bytes'],name
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda:f.read(1048576),b''):h.update(block)
              assert h.hexdigest()==meta['sha256'],name
          assert a['files']['K4CO_TRUE_SOURCE_LOCKED_FREIGHT_VIADUCT_EDITABLE_ART_HOLD.blend']['sha256']=='9574e6f49865cf962280caa073f2c5583cf1a3ed1ae41a9efb2a4167d6ed3c91'
          print('K4CP_EXACT_GENUINE_K4CO_R2_PARENT_SHA_PASS')
          PY
      - name: Install genuine Blender from official Ubuntu archive instead of stalled Azure mirror
        timeout-minutes: 18
        run: |
          set -euo pipefail
          # Actual hosted runner failure #41950843684: Azure mirror took over 6m
          # for the first 35.9MB blender-data, then apt timeout 124.
          # Fix package transport only, never source, geometry, camera or road.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          echo 'K4CP_OFFICIAL_UBUNTU_PACKAGE_SOURCE'
          if ! sudo timeout --signal=TERM --kill-after=10s 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq; then
            echo 'K4CP_OFFICIAL_MIRROR_UPDATE_FAILED_USING_SIGNED_RUNNER_INDEX'
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 900s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender python3-pil python3-numpy xvfb libegl1 libgl1-mesa-dri libopengl0 libgbm1 libgl1
          command -v blender
          blender -b -noaudio --factory-startup --python-expr "import bpy; print('K4CP_REAL_BLENDER_VERSION', bpy.app.version_string)"
          /usr/bin/python3 tests/p101-k4bz-proven-dark-wedge-regression.py
          /usr/bin/python3 tests/p101-k4ca-protected-coastal-frame-regression.py

      - name: Author true 3D continuous cliff and open fixed sea-datum tidal basin using inherited camera
        run: |
          set -euo pipefail
          mkdir -p research/evidence/k4cp/render
          xvfb-run -a -s '-screen 0 1280x900x24' env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 blender -b --factory-startup --python-exit-code 3 --python scripts/p101-k4cp-native-stratified-coast-tidal-basin.py -- --base research/evidence/k4cp/parent/K4CO_TRUE_SOURCE_LOCKED_FREIGHT_VIADUCT_EDITABLE_ART_HOLD.blend --out research/evidence/k4cp/render 2>&1 | tee research/evidence/k4cp/render/K4CP_REAL_BLENDER.log
      - name: Independent actual Road5 original frame, left geology, right tidal view QA
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          d=Path('research/evidence/k4cp/render')
          a=json.loads((d/'K4CP_REAL_NATIVE_AUDIT.json').read_text())
          assert a['parentK4COR2ExactSHA256']=='9574e6f49865cf962280caa073f2c5583cf1a3ed1ae41a9efb2a4167d6ed3c91'
          assert a['originalGameGitBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert a['originalRoad5FullVertexFaceSHA256']=='f7c6091d5b6ca1498ac8bfc7808242ba05477d0a8c798cb41753c2e016ec58d2'
          for key in ('originalSixCameraPosesUnchanged','originalCHASEUnchanged',
                      'originalElevenTreeTransformsUnchanged','originalLightsUnchanged',
                      'allInheritedMeshGeometryAndTransformsUnchanged',
                      'oldRejectedK4CNCliffAndTerminalHiddenInResearchRenderOnly',
                      'realK4COFreightSpanInheritedAndGeometryIdentical'):
              assert a[key],key
          assert a['sourceGameEdited'] is False and a['sourcePhysicsEdited'] is False
          assert a['newGameColliders']==a['formalARTAccepted']==a['formalSlope2DNAMetres']==0
          assert a['newNativeEditableResearchMeshes']==2
          assert a['actualOriginalTopologyCliffVertices']==1600
          assert a['reshapedNaturalRockVertices']>600
          assert a['bridgeRealTerrainAnchorVerticesUnchanged']>30
          assert a['tidalBasinContinuousStations']>=60
          assert a['tidalBasinRealVertices']>500 and a['tidalBasinRealFaces']>400
          assert a['visibleProjectedVerticesNotArtScore']['left']>200
          assert a['visibleProjectedVerticesNotArtScore']['right']>100
          assert a['realNativeCHASE768x480'] and a['renderEngine']=='BLENDER_EEVEE'
          assert a['ART']=='UNJUDGED_HOLD'
          for name,meta in a['files'].items():
              raw=(d/name).read_bytes()
              assert len(raw)==meta['bytes'],name
              assert hashlib.sha256(raw).hexdigest()==meta['sha256'],name
          before=Image.open('research/evidence/k4cp/parent/K4CO_TRUE_SOURCE_CHASE_FREIGHT_VIADUCT_NOT_GAME.png').convert('RGB')
          after=Image.open(d/'K4CP_TRUE_SOURCE_CHASE_STRATIFIED_COAST_TIDAL_BASIN_NOT_GAME.png').convert('RGB')
          assert before.size==after.size==(768,480)
          diff=ImageChops.difference(before,after)
          def count(rect,threshold=15):
              return sum(max(p)>threshold for p in diff.crop(rect).getdata())
          left=count((8,148,285,466),15)
          right=count((510,184,768,448),15)
          road=count((329,270,476,466),13)
          assert left>7000,('NATURAL_GEOMETRY_STILL_NOT_SUBSTANTIVE_IN_REAL_CHASE',left)
          assert right>3000,('REAL_TIDAL_HARBOUR_NOT_VISIBLE_IN_CHASE',right)
          assert road<120,('ORIGINAL_SOURCE_ROAD5_CENTRE_VISUAL_CORRIDOR_CHANGED',road)
          for pt in ((390,270),(400,320),(380,380),(420,440),(470,465)):
              x=before.getpixel(pt);y=after.getpixel(pt)
              assert max(abs(x[k]-y[k]) for k in range(3))<=10,('SOURCE_ROAD5_PROTECTED_PIXEL_MODIFIED',pt,x,y)
          compare=Image.new('RGB',(1560,554),(14,19,24))
          compare.paste(before,(12,50));compare.paste(after,(780,50))
          draw=ImageDraw.Draw(compare)
          draw.text((12,20),'K4CO R2 true-source-locked freight bridge | ART REJECT',fill='white')
          draw.text((780,20),'K4CP actual stratified coast + tidal bay | ART UNJUDGED',fill='white')
          draw.text((12,537),'Genuine editable Blender DCC research only, not WebGL2, formal ART, or human game QA.',fill='white')
          name='K4CP_VS_K4CO_TRUE_SOURCE_CHASE_WHOLEFRAME_ART_REVIEW.png'
          compare.save(d/name)
          a['independentActualFrameImageQA']={
              'naturalCoastChangedPixelsNotArtScore':left,
              'workingHarborBasinChangedPixelsNotArtScore':right,
              'protectedRoadCentreChangedPixels':road,
              'comparisonName':name,
              'comparisonSHA256':hashlib.sha256((d/name).read_bytes()).hexdigest(),
              'ART':'UNJUDGED_HOLD'}
          (d/'K4CP_REAL_NATIVE_AUDIT.json').write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          (d/'K4CP_INDEPENDENT_NATIVE_GATE_PASS.flag').write_text('Actual native editable Blender & source-protected image TECH ONLY PASS. ART HOLD.\n')
          print('K4CP_GENUINE_ACTUAL_NATIVE_TECH_ONLY_PASS',left,right,road)
          PY
      - name: Preserve only actual research evidence and not protected Game
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4cp-stratified-coast-tidal-basin-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          mkdir -p docs/research-evidence/k4cp
          cp research/evidence/k4cp/render/*.png docs/research-evidence/k4cp/
          cp research/evidence/k4cp/render/*.json docs/research-evidence/k4cp/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-evidence/k4cp
          if ! git diff --cached --quiet; then
            git commit -m "evidence(k4cp): true Blender coast and tidal basin from SOURCE-locked Road5 chase"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/research/k4cp-stratified-coast-tidal-basin-20261105
          fi
      - name: Archive actual editable Blender and true PNG even when ART remains HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CP_TRUE_STRATIFIED_COAST_TIDAL_BASIN_EDITABLE_ART_HOLD
          path: research/evidence/k4cp/render/
          if-no-files-found: warn
          retention-days: 21
      - name: Persist actual CI status without fake TECH or ART acceptance
        if: always()
        env:
          K4CP_JOB_STATUS: ${{ job.status }}
          K4CP_RUN_ID: ${{ github.run_id }}
          K4CP_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/k4cp-stratified-coast-tidal-basin-20261105
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          mkdir -p docs/research-evidence/k4cp
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          status=os.environ['K4CP_JOB_STATUS']
          assert status in ('success','failure','cancelled'),status
          evidence=Path('research/evidence/k4cp/render/K4CP_REAL_NATIVE_AUDIT.json')
          passed=Path('research/evidence/k4cp/render/K4CP_INDEPENDENT_NATIVE_GATE_PASS.flag')
          result={'schema':'dopagaki.k4cp.actual-native-run-v1',
                  'runId':int(os.environ['K4CP_RUN_ID']),
                  'inputCodeCommit':os.environ['K4CP_SOURCE_SHA'],
                  'jobStatus':status,
                  'actualBlenderAuditGenerated':evidence.is_file(),
                  'independentOriginalSourceImageQA':status=='success' and passed.is_file(),
                  'art':'UNJUDGED_HOLD','formalARTAccepted':0,'formalSlope2DNAMetres':0,
                  'human':'HOLD','sat':'HOLD','ccd':'HOLD','fps':'HOLD',
                  'release':'HOLD','merge':'HOLD'}
          Path('docs/research-evidence/k4cp/K4CP_CI_LATEST.json').write_text(json.dumps(result,indent=2)+'\n')
          print('K4CP_ACTUAL_CI_STATUS_SAVED',result)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research-evidence/k4cp/K4CP_CI_LATEST.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(k4cp): preserve real CI outcome without ART promotion"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase -X ours FETCH_HEAD
            git push origin HEAD:refs/heads/research/k4cp-stratified-coast-tidal-basin-20261105
          fi
