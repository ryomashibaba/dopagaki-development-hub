name: K4CS original native B48/B51 early-readable hazard plus real keyboard take-over
on:
  push:
    branches:
      - research/k4cs-native-road-hazard-early-cue-choice-20261105
    paths:
      - scripts/p101-k4cs-true-b48-ahead-b51-readable-cues.mjs
      - scripts/p101-k4cs-private-readable-actual-game-pack.mjs
      - scripts/p101-k4cs-true-native-240hz-hazard-and-control-compare.mjs
      - scripts/p101-k4cs-native-editable-true-b48-warning-scene.py
      - .github/workflows/p101-k4cs-early-real-b51-lane-choice-source-webgl.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-original-engine-danger-and-real-input-integrated-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original source before native build
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-k4cs-true-b48-ahead-b51-readable-cues.mjs
          node --check scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node --check scripts/p101-k4cs-true-native-240hz-hazard-and-control-compare.mjs
          python3 -m py_compile scripts/p101-k4cs-native-editable-true-b48-warning-scene.py
      - name: Build original PRIVATE 240Hz real game plus exact K4CR physics and K4CS in-world early warnings
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node --check dist-private/k4cs/drive3d.mjs
          test -f test-results/k4cs-native-readable/K4CS_GATES.obj
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: GENUINE original source WebGL2 240Hz dynamic real B51 and manual original A/D takeover
        id: realwebgl
        continue-on-error: true
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-k4cs-true-native-240hz-hazard-and-control-compare.mjs
      - name: Blender native editable source-road and real outboard early warning triangles
        id: nativeblender
        timeout-minutes: 19
        continue-on-error: true
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 900s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender python3-pil libegl1 libgl1-mesa-dri libopengl0 libgbm1
          blender -b --factory-startup --python-exit-code 3 --python scripts/p101-k4cs-native-editable-true-b48-warning-scene.py
      - name: Independent source native 240Hz parity, warning lead evidence and manual A/D physical distinction
        run: |
          python3 - <<'PY'
          import json, pathlib
          from PIL import Image, ImageChops, ImageDraw
          d=pathlib.Path('test-results/k4cs-native-readable')
          build=json.loads((d/'K4CS_BUILD_AUDIT.json').read_text())
          assert build['physicallyIdenticalK4CRAndK4CS']
          assert build['originalB51Identical'] and build['newColliders']==0
          assert build['originalPhysicalRoad5SHA256']==build['candidatePhysicalRoad5SHA256']
          assert len(build['originalB51Warnings'])==6 and len(build['sourceRoadOutsideMarkers'])>=12
          report={'schema':'k4cs-independent-source-hazard-and-native-control-v1',
                  'oldGameBlob':'af076d67492a677d2235e4730aef8cdf4808e106',
                  'road5AndAll28RealB51UnmodifiedInK4CS':True,
                  'officialART':0,'SLOPE2DNA':0,'HUMAN':'HOLD','SAT':'HOLD','CCD':'HOLD',
                  'FPS':'HOLD','RELEASE':'HOLD','MERGE':'HOLD'}
          if (d/'K4CS_REAL_CHROMIUM_AND_CONTROLS_RESULT.json').is_file():
            r=json.loads((d/'K4CS_REAL_CHROMIUM_AND_CONTROLS_RESULT.json').read_text())
            report['realSourceSessions']=len(r['sessions'])
            report['nativeManualAAndDTrials']=len(r.get('nativeKeyboardTrials',[]))
            report['realRunFailures']=r['failures']
            report['actualManualPositionSeparationM']=r.get('originalNativeManualWorldPositionSeparationM')
            if len(r['sessions'])==2 and not r['failures']:
              a,b=[x['pictures'] for x in r['sessions']]
              assert len(a)==len(b)==5
              records=[]
              for x,y in zip(a,b):
                assert x['seconds']==y['seconds'] and x['nativeTicks']==y['nativeTicks']
                assert x['runnerStatus']==y['runnerStatus']=='running'
                assert x['realRoad']==y['realRoad'],'changed actual road or native timing'
                assert x['sourceSpeedHud']==y['sourceSpeedHud'],'warning changed source 240Hz physics!'
                first=Image.open(d/x['file']).convert('RGB')
                second=Image.open(d/y['file']).convert('RGB')
                assert first.size==second.size
                changed=ImageChops.difference(first,second).convert('L')
                count=sum(v for i,v in enumerate(changed.histogram()) if i>30)
                sheet=Image.new('RGB',(first.width*2,first.height+48),'#111827')
                sheet.paste(first,(0,48));sheet.paste(second,(first.width,48))
                ImageDraw.Draw(sheet).text((11,13),f"REAL SOURCE K4CR LEFT / SAME PHYSICS + ORIGINAL B51 EARLY CUE RIGHT t={x['seconds']}s; ART/HUMAN HOLD",fill='white')
                sheet.save(d/f"K4CS_PHYSICS_IDENTICAL_EARLY_CUE_T{x['seconds']}_TRUE_SOURCE.png")
                records.append({'seconds':x['seconds'],'sourceTicks':x['nativeTicks'],
                  'realRoad':x['realRoad'],'sourceSpeed':x['sourceSpeedHud'],
                  'warningRealB51':y.get('earlyB51'),'warningMetres':y.get('earlyMetres'),
                  'warningSecondsAtCurrentSpeed':y.get('earlySeconds'),
                  'warningPredictedSide':y.get('earlySide'),'pixelsVisiblyDifferent':count})
              report['nativeEarlyWarnings']=records
              assert any(v['warningSecondsAtCurrentSpeed']!='none' and float(v['warningSecondsAtCurrentSpeed'])>=1.5 for v in records)
              assert any(v['pixelsVisiblyDifferent']>1000 for v in records),'no actual in-game visual advance cue'
          if (d/'K4CS_NATIVE_DCC_RESULT.json').is_file():
            native=json.loads((d/'K4CS_NATIVE_DCC_RESULT.json').read_text())
            assert native['editableBlender'] and native['originalRealRoadOutsideBeacons']==build['actualWarningGateTriangles']
            assert native['actualRoadTriangles']==2400 and native['sameARTRejectCoastTriangles']==4616
            report['nativeBlenderTrueTriangles']=native['originalRealRoadOutsideBeacons']
          (d/'K4CS_INDEPENDENT_NATIVE_GAMEPLAY_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print('K4CS_INDEPENDENT_REAL_GAME_NOT_HUMAN_ART',json.dumps(report))
          assert report.get('realSourceSessions')==2 and not report.get('realRunFailures')
          assert report.get('nativeManualAAndDTrials')==2
          assert report.get('actualManualPositionSeparationM',0)>.2
          assert report.get('nativeBlenderTrueTriangles',0)>150
          PY
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Archive original native game images and failures, exact source B48/B51 and editable DCC
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4CS_TRUE_B48_REAL_B51_EARLY_CUE_NATIVE_CONTROLS_ART_HOLD
          path: test-results/k4cs-native-readable/
          retention-days: 7
          if-no-files-found: warn
