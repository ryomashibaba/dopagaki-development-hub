          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node scripts/p101-k4ct-install-authored-dcc.mjs
      - name: Capture five actual ORIGINAL 240Hz Chromium RAW for independent ART-first review
        timeout-minutes: 10
        run: |
          node scripts/k4ct-r35-source-forebay-visibility.mjs
      - name: R35 verify exact original protected 8 groups and diagnostic visibility (not ART)
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('test-results')
          scene=json.loads((root/'k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json').read_text())
          original=json.loads((root/'k4ct-r35-site-probe/R35_ORIGINAL_PROTECTED_BASELINE.json').read_text())
          test=json.loads((root/'k4ct-r35-site-probe/K4CT_R35_TRUE_SOURCE_PHASED_VISIBILITY.json').read_text())
          sites=json.loads((root/'k4ct-r35-site-probe/R35_THREE_REAL_DCC_SITE_COORDINATES.json').read_text())
          assert scene['sourcePhysicalRoad5SHA256']=='4957a0e1ffb1a394c4bbaa2c502caad3fdec219c9713073f5236d7bbb6ab4e2b'
          assert scene['originalB48']==7 and scene['originalB51']==28 and scene['newColliders']==0
          assert test['schema']=='k4ct-r35-original-webgl-forebay-inner-three-point-visibility-v1'
