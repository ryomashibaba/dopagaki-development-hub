name: K4CT active source camera ART-first true Blender harbor R34
on:
  push:
    branches:
      - research/k4ct-two-native-b51-choice-consequence-20261105
    paths:
      - scripts/k4ct-source-camera-group-influence-probe.mjs
      - scripts/p101-k4ct-r35-true-blender-forebay-markers.py
      - scripts/k4ct-r35-source-forebay-visibility.mjs
      - scripts/k4ct-active-art-original-camera-five-raw.mjs
      - scripts/p101-k4ct-active-source-camera-art-slice.py
      - .github/workflows/p101-k4ct-active-source-camera-art.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  active-camera-art-source-r34-five-raw:
    if: ${{ !contains(github.event.head_commit.message, '[R33 group visibility]') && !contains(github.event.head_commit.message, '[R35 site probe]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-hash protection and cheap syntax before Blender
        run: |
          set -euo pipefail
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-k4ct-native-spillway-dcc.py)" = 096fffbc1627915eb0122224955bb02cfba6b3ae
          node --check scripts/k4ct-active-art-original-camera-five-raw.mjs
          node --check scripts/p101-k4ct-install-authored-dcc.mjs
          python3 - <<'PY'
          import ast,pathlib
          for p in ('scripts/p101-k4ct-native-spillway-dcc.py','scripts/p101-k4ct-active-source-camera-art-slice.py'):
              ast.parse(pathlib.Path(p).read_text(),filename=p)
          print('R34_SYNTAX_PASS_NO_PYC_WRITTEN')
          PY
      - name: Build ORIGINAL PRIVATE native physics and source DCC site
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node scripts/p101-k4ct-dcc-source-export.mjs
      - name: Install real Blender 4 and original Chromium dependencies
        timeout-minutes: 16
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 850s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender libegl1 libgl1-mesa-dri libopengl0 libgbm1 fonts-noto-cjk
          blender --version | head -3
          npx playwright install --only-shell chromium
      - name: Author one low-profile source camera harbor in TEMP verified R12A Blender copy
        timeout-minutes: 9
        run: |
          blender -b --factory-startup --python-exit-code 3 --python scripts/p101-k4ct-native-spillway-dcc.py
          mkdir -p test-results/k4ct-active-art
          cp test-results/k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json test-results/k4ct-active-art/R34_ORIGINAL_PROTECTED_BASELINE.json
          python3 - <<'PY'
          from pathlib import Path
          import ast,subprocess
          p=Path('scripts/p101-k4ct-native-spillway-dcc.py')
          expected='096fffbc1627915eb0122224955bb02cfba6b3ae'
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==expected
          marker='# Editability: separate mesh objects by functional zones'
          original=p.read_text()
          assert original.count(marker)==1
          inject="exec(compile(Path('scripts/p101-k4ct-active-source-camera-art-slice.py').read_text(), 'R34_TEMP_HARBOR', 'exec'))\n"
          isolated=Path('test-results/k4ct-r34-temporary-blender-author.py')
          isolated.parent.mkdir(parents=True,exist_ok=True)
          isolated.write_text(original.replace(marker,inject+marker))
          ast.parse(isolated.read_text(),filename=str(isolated))
          print('R34_ISOLATED_DCC_PROBE_PREPARED_NO_REPO_AUTHOR_CHANGE')
          PY
          blender -b --factory-startup --python-exit-code 3 --python test-results/k4ct-r34-temporary-blender-author.py
          test "$(git hash-object scripts/p101-k4ct-native-spillway-dcc.py)" = 096fffbc1627915eb0122224955bb02cfba6b3ae
      - name: Rebuild original PRIVATE WebGL2 renderer and install genuine temporary Blender DCC once
        run: |
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node scripts/p101-k4ct-install-authored-dcc.mjs
      - name: Capture five actual ORIGINAL 240Hz Chromium RAW for independent ART-first review
        timeout-minutes: 10
        run: |
          node scripts/k4ct-active-art-original-camera-five-raw.mjs
      - name: Independent actual ART scene/source protection audit (no approval)
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          d=pathlib.Path('test-results/k4ct-active-art-raw-native')
          p=d/'K4CT_R34_TRUE_SOURCE_PHASED_VISIBILITY.json'
          assert p.exists(),'Native source probe did not complete'
          v=json.loads(p.read_text())
          assert v['schema']=='k4ct-active-art-r34-two-stage-source-camera-five-raw-v1'
          assert v['originalWebGL2'] and v['originalCamera'] and v['originalRunner240Hz']
          assert v['originalB48']==7 and v['originalB51']==28 and v['newColliders']==0
          assert v['formalARTAdopted']==v['slope2DNAmeters']==0 and v['ART']=='HOLD'
          assert all(v[k]=='HOLD' for k in ('HUMAN','SAT','CCD','FPS','RELEASE','MERGE'))
          assert [x['sourceTick'] for x in v['sourceFramesRAW']]==[15660,15744,15924,16128,16332]
          assert v['siteSignals']==[] and v['earlyRAWOnly'] and v['restorationParityNotMeasured']
          for f in v['sourceFramesRAW']:
              assert f['source']['depthEnabled'] and f['source']['depthBits']>0
              assert f['source']['depthBits']>0 and f['originalCamera'] and f['originalGameFrame']
              assert f['independentRestorationMeasurement']=='NOT_ATTEMPTED'
              assert (d/f['cleanRAW']).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          g=json.loads(pathlib.Path('test-results/k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json').read_text())
          assert g['originalB48']==7 and g['originalB51']==28 and g['newColliders']==0 and len(g['objects'])==43
          baseline=json.loads(pathlib.Path('test-results/k4ct-active-art/R34_ORIGINAL_PROTECTED_BASELINE.json').read_text())
          protected=('00','12','13','19','34','35','41','42')
          def read_group(g,name):
              cursor=0
              for title,count in g['objects'].items():
                  amount=count*18
                  if title==name:return g['vertices'][cursor:cursor+amount]
                  cursor+=amount
              raise AssertionError('missing protected group '+name)
          for name in baseline['objects']:
              if name[:2] in protected:
                  assert g['objects'][name]==baseline['objects'][name]
                  assert read_group(g,name)==read_group(baseline,name),('R34_PROTECTED_GEOMETRY_OR_COLOR_CHANGED',name)
          print('R34_ALL_EIGHT_PROTECTED_GROUPS_SOURCE_XYZ_RGB_EXACT_PARITY')
          scene=json.loads(pathlib.Path('test-results/k4ct-active-art/R34_SCENE_MANIFEST.json').read_text())
          assert len(scene['protectedGroupCounts'])==8 and len(scene['reworkedGroups'])==35
          assert scene['newColliders']==scene['formalArtAdopted']==scene['slope2DNAmeters']==0
          assert len(scene['realBlenderBeveledStoneVolumes'])==3
          assert sum(x['beveledRealBlenderFaces'] for x in scene['realBlenderBeveledStoneVolumes'])>350
          assert scene['requiresActualOriginalCameraWebGL2RAW'] and scene['sourceGameplayPhysicsAndCameraUnchanged']
          assert scene['bankSide']=='R' and scene['original19ForebayProtectedExact']
          assert len(scene['realDCCGateAbutments'])==3
          assert min(scene['realWaterfallDropDepths'])>20
          assert scene['waterSurfaceFaces']==504 and scene['foamTriangles']==36
          assert scene['requiresActualOriginalCameraWebGL2RAW']
          assert g['sourcePhysicalRoad5SHA256']=='4957a0e1ffb1a394c4bbaa2c502caad3fdec219c9713073f5236d7bbb6ab4e2b'
          assert subprocess.check_output(['git','hash-object','scripts/p101-k4ct-native-spillway-dcc.py'],text=True).strip()=='096fffbc1627915eb0122224955bb02cfba6b3ae'
          assert subprocess.check_output(['git','hash-object','web/p101-w9c2-g4e7ci-integrated-streetscape.mjs'],text=True).strip()=='af076d67492a677d2235e4730aef8cdf4808e106'
          status=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          print('R34_EXACT_GIT_STATUS',status)
          bad=[s for s in status if not(s.startswith('?? ') and s[3:].startswith('test-results/'))]
          assert not bad,'R34_UNEXPECTED_TRACKED_OR_NON_RESULT_UNTRACKED_PATHS'
          print('R34_FIVE_GENUINE_BLENDER_NATIVE_RAW_EARLY_REVIEW_NOT_ART_PASS',[(s['id'],s['cleanObservedTicks']) for s in v['siteSignals']])
          PY
      - name: Preserve true source RAW, source-depth measurements, real Blender and QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CT_R34_AUTHORED_OPEN_LOCKYARD_REAL_BLENDER_SOURCE_RAW_ART_HOLD
          path: |
            test-results/k4ct-active-art-raw-native/
            test-results/k4ct-active-art/R34_SCENE_MANIFEST.json
            test-results/k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json
            test-results/k4ct-contact-retry/K4CT_R9_BLENDER_TRUE_MATERIAL_BRIDGE.json
            test-results/k4ct-contact-retry/K4CT_EDITABLE_SOURCE_ALIGNED_TIDAL_SPILLWAY_ART_REJECT.blend
          if-no-files-found: warn
          retention-days: 7

  source-camera-targeted-group-influence:
    # R33 is a read-only capture/visibility probe. Skip the costlier Blender
    # art pipeline and reuse immutable TRUE R32 DCC from Actions artifact.
    if: ${{ contains(github.event.head_commit.message, '[R33 group visibility]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R33 protected source fingerprints and cheap script validation
        run: |
          set -euo pipefail
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-k4ct-native-spillway-dcc.py)" = 096fffbc1627915eb0122224955bb02cfba6b3ae
          node --check scripts/k4ct-source-camera-group-influence-probe.mjs
          node --check scripts/p101-k4ct-install-authored-dcc.mjs
      - name: Recover exactly R32 true editable Blender geometry without rerunning Blender
        uses: actions/download-artifact@v4
        with:
          name: K4CT_R32_AUTHORED_OPEN_LOCKYARD_REAL_BLENDER_SOURCE_RAW_ART_HOLD
          run-id: 42357674018
          github-token: ${{ github.token }}
          path: test-results
      - name: Independently verify recovered REAL original R32 geometry and bridge
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          base=pathlib.Path('test-results')
          d=json.loads((base/'k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json').read_text())
          a=json.loads((base/'k4ct-contact-retry/K4CT_R9_BLENDER_TRUE_MATERIAL_BRIDGE.json').read_text())
          m=json.loads((base/'k4ct-active-art/R32_SCENE_MANIFEST.json').read_text())
          assert d['schema']=='k4ct-blender-authored-true-source-integrated-scene/1'
          assert d['triangles']==10309 and len(d['objects'])==43
          assert d['originalB48']==7 and d['originalB51']==28 and d['newColliders']==0
          assert d['sourcePhysicalRoad5SHA256']=='4957a0e1ffb1a394c4bbaa2c502caad3fdec219c9713073f5236d7bbb6ab4e2b'
          assert a['schema']=='k4ct-r9-blender-native-attribute-bridge-v1'
          assert a['totalDccTriangles']==d['triangles']
          assert m['schema']=='k4ct-active-art-r32-camera-anchored-double-drop-intake-turbine-v1'
          assert m['formalArtAdopted']==m['slope2DNAmeters']==0
          assert (base/'k4ct-contact-retry/K4CT_EDITABLE_SOURCE_ALIGNED_TIDAL_SPILLWAY_ART_REJECT.blend').is_file()
          print('R33_REUSED_TRUE_R32_BLENDER_SOURCE_BYTES',[(str(x),x.stat().st_size) for x in (base/'k4ct-contact-retry').iterdir()])
          PY
      - name: Build only ORIGINAL PRIVATE 240Hz game; no Blender installation or DCC art rerun
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node scripts/p101-k4ct-dcc-source-export.mjs
          node scripts/p101-k4ct-install-authored-dcc.mjs
      - name: Install headless Chromium for actual original WebGL2 only
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=1 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 install -y --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 libgbm1
          npx playwright install --only-shell chromium
      - name: Same-tick 8-group original WebGL2 visible-water influence 5-phase probe
        timeout-minutes: 9
        run: |
          node scripts/k4ct-source-camera-group-influence-probe.mjs
      - name: Independent R33 genuine original WebGL2 and source protection gate
        run: |
          python3 - <<'PY'
          import pathlib,json,subprocess
          p=pathlib.Path('test-results/k4ct-source-ownership/K4CT_R33_GROUP_INFLUENCE.json')
          o=json.loads(p.read_text())
          assert o['schema']=='k4ct-r33-original-camera-targeted-group-influence-v1'
          assert o['originalWebGL2'] and o['originalRunner240Hz'] and o['unmodifiedOriginalSourceCamera']
          assert o['originalB48']==7 and o['originalB51']==28 and o['newColliders']==0
          assert o['sampledTicks']==[15660,15744,15924,16128,16332]
          assert o['restorationEveryFrameValid'] and o['validRestorationFrames']==5
          assert set(o['groups'])=={'03','05','23','24','19','34','41','42'}
          assert not o['waterOwnerDetermined'] and o['pixelChangeNotUniqueOwnership']
          assert o['formalARTAdopted']==o['slope2DNAmeters']==0
          assert all(o[k]=='HOLD' for k in ('ART','HUMAN','SAT','CCD','FPS','RELEASE','MERGE'))
          assert all(x['source']['realWebGL2'] and x['source']['depthEnabled'] and x['source']['depthBits']>0 for x in o['frames'])
          assert subprocess.check_output(['git','hash-object','web/p101-w9c2-g4e7ci-integrated-streetscape.mjs'],text=True).strip()=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert subprocess.check_output(['git','hash-object','scripts/p101-k4ct-native-spillway-dcc.py'],text=True).strip()=='096fffbc1627915eb0122224955bb02cfba6b3ae'
          print('R33_ORIGINAL_SOURCE_TARGETED_PIXEL_INFLUENCE_TECH_PASS')
          PY
      - name: Preserve R33 real source RAW and target group leave-one-out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CT_R33_ORIGINAL_WEBGL2_TARGETED_GROUP_INFLUENCE
          path: test-results/k4ct-source-ownership/
          if-no-files-found: warn
          retention-days: 7

  true-original-source-forebay-site-r35:
    if: ${{ contains(github.event.head_commit.message, '[R35 site probe]') }}
