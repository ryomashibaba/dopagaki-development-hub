  source-r39-one-real-blender-open-cut-native-review:
    if: ${{ contains(github.event.head_commit.message, '[R39 art]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected exact blobs and syntax first
        run: |
          set -euo pipefail
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-k4ct-native-spillway-dcc.py)" = 096fffbc1627915eb0122224955bb02cfba6b3ae
          node --check scripts/k4ct-r39-original-three-raw.mjs
          python3 - <<'PY'
          import ast,pathlib
          for s in ['scripts/p101-k4ct-native-spillway-dcc.py',
                    'scripts/p101-k4ct-r36-genuine-sluice-architecture.py',
                    'scripts/p101-k4ct-r39-open-quarry-hydraulic-cut.py']:
              ast.parse(pathlib.Path(s).read_text(),filename=s)
          print('R39_REAL_BLENDER_SOURCE_SYNTAX_CHECKED')
          PY
      - name: Build immutable original PRIVATE stage and source DCC station export
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node scripts/p101-k4ct-dcc-source-export.mjs
      - name: Install REAL Blender and native browser prerequisites
        timeout-minutes: 17
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 850s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender libegl1 libgl1-mesa-dri libopengl0 libgbm1 fonts-noto-cjk
          blender --version | head -3
          npx playwright install --only-shell chromium
      - name: Genuine Blender R39 authored from isolated verified R12A source
        timeout-minutes: 9
        run: |
          set -euo pipefail
          blender -b --factory-startup --python-exit-code 3 --python scripts/p101-k4ct-native-spillway-dcc.py
          mkdir -p test-results/k4ct-r39-art
          cp test-results/k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json test-results/k4ct-r39-art/R39_BASELINE_EIGHT_PROTECTED.json
          python3 - <<'PY'
          import pathlib,ast,subprocess
          p=pathlib.Path('scripts/p101-k4ct-native-spillway-dcc.py')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='096fffbc1627915eb0122224955bb02cfba6b3ae'
          s=p.read_text()
          marker='# Editability: separate mesh objects by functional zones'
          assert s.count(marker)==1
          inject="exec(compile(Path('scripts/p101-k4ct-r36-genuine-sluice-architecture.py').read_text(),'R36_ISOLATED_PREVIOUS_REJECTED_STUDY','exec'))\nexec(compile(Path('scripts/p101-k4ct-r39-open-quarry-hydraulic-cut.py').read_text(),'R39_ISOLATED_NEW_REAL_OPEN_CUT','exec'))\n"
          temp=pathlib.Path('test-results/k4ct-r39-isolated-true-author.py')
          temp.write_text(s.replace(marker,inject+marker))
          ast.parse(temp.read_text(),filename=str(temp))
