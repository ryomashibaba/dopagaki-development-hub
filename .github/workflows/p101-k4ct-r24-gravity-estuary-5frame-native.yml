name: K4CT R24 original source gravity cascade and functional real shoreline five frames
on:
  push:
    branches:
      - research/k4ct-two-native-b51-choice-consequence-20261105
    paths:
      - scripts/k4ct-r24-real-gravity-estuary-5frame-native-review.mjs
      - .github/workflows/p101-k4ct-r24-gravity-estuary-5frame-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-source-camera-art-veto:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static original source, native 240Hz and R24 hydraulic water profile preflight
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/k4ct-r24-real-gravity-estuary-5frame-native-review.mjs
          node --check scripts/p101-k4ct-install-authored-dcc.mjs
          python3 -m py_compile scripts/p101-k4ct-native-spillway-dcc.py scripts/p101-k4ct-r19-source-three-act-open-harbor.py scripts/p101-k4ct-r24-gravity-cascade-integrated-shoreline.py
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('research-evidence/k4ct/K4CT_R24_TRUE_SOURCE_GRAVITY_TIDAL_SHORELINE_ART_CONTRACT_20261107.json').read_text())
          assert d['schema']=='k4ct-r24-functional-gravity-estuary-source-five-frame-v1'
          assert d['run']['ticks']==[15660,15744,15924,16128,16332]
          assert d['safety']['formalART']==d['safety']['slope2DNAmeters']==0
          assert d['basedOn']['authorR12ABlob']=='096fffbc1627915eb0122224955bb02cfba6b3ae'
          assert d['rewriteGroups']==['03','04','05','06','07','08']
          print('R24_GRAVITY_SHORELINE_ART_HOLD_CONTRACT_PASS')
          PY
      - name: Retrieve genuine R23 original Chromium 5 RAW for actual source A-B review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results/k4ct-r24-original-r23
          gh run download 42314880298 --repo "$GITHUB_REPOSITORY" --name K4CT_R23_REAL_VOLUTE_SOURCE_FIVE_FRAME_ART_HOLD --dir test-results/k4ct-r24-original-r23
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('test-results/k4ct-r24-original-r23/k4ct-r23-native-blockout')
          for t in ('65_25','65_6','66_35','67_2','68_05'):
            assert (p/('R23_TRUE_SOURCE_CHASE_T'+t+'_CLEAN_RAW.png')).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('R24_ALL_FIVE_PREVIOUS_R23_TRUE_NATIVE_IMAGES_PRESENT')
          PY
      - name: Build only PRIVATE original WebGL2 and native 240Hz source game
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node scripts/p101-k4ct-dcc-source-export.mjs
          node --check dist-private/k4ct/drive3d.mjs
      - name: ONE genuine Blender4 gravitational stepped tidal basin and true 2-gate weir
        timeout-minutes: 20
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 900s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender libegl1 libgl1-mesa-dri libopengl0 libgbm1 fonts-noto-cjk
          blender -b --factory-startup --python-exit-code 3 --python scripts/p101-k4ct-native-spillway-dcc.py
      - name: Install ONLY actual Blender editables in original PRIVATE game
        run: |
          node scripts/p101-k4ct-install-authored-dcc.mjs
          node --check dist-private/k4ct/drive3d.mjs
          node --check dist-private/k4ct/k4ct-dcc-world-geometry.mjs
      - name: Five original Chromium 240Hz RAW and eight actual group GL probes
        run: |
          npx playwright install --only-shell chromium
          node scripts/k4ct-r24-real-gravity-estuary-5frame-native-review.mjs
      - name: Independent tech/safety/art-hold audit
        run: |
          python3 - <<'PY'
          import pathlib,json,subprocess
          p=pathlib.Path('test-results/k4ct-r24-native-blockout')
          d=json.loads((p/'K4CT_R24_TRUE_SOURCE_5FRAME_ART_CRITICAL_PREFLIGHT.json').read_text())
          assert d['schema']=='k4ct-r24-actual-gravity-estuary-native-5frame-source-review-v1'
          assert d['genuineBlenderPolygons'] and d['editableBlenderGroups']==43 and d['totalTriangles']>3500
          assert d['originalWebGL2'] and d['originalCamera'] and d['originalRunner240Hz']
          assert d['originalB48']==7 and d['originalB51']==28 and d['newColliders']==0
          assert d['full42GroupRunIntentionallySkipped'] and len(d['selectiveGroupsOnly'])==8
          assert d['formalARTAdopted']==d['slope2DNAmeters']==0
          assert d['ART']=='REJECT' and all(d[x]=='HOLD' for x in ('HUMAN','SAT','CCD','FPS','RELEASE','MERGE'))
          assert len(d['source5FrameRAW'])==5
          for t,r in zip((15660,15744,15924,16128,16332),d['source5FrameRAW']):
            assert r['sourceTick']==t
            assert len(r['selectiveGroupInfluence'])==8
            assert r['reproducibility']['changedPctRGBgt25']<.5
            assert r['source']['originalB51']==28 and r['source']['depthBits']>0
            assert r['source']['depthEnabled']
            assert (p/r['cleanRAW']).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          assert d['R19NonadoptedResearchSubstrate'] and d['originalIntakeTowerTurbinePreserved'] and d['R23SourceOriginalFiveFrameCompared'] and d['realWaterElevationAndTwoGateReauthor']
          assert [round(r['timeSec'],2) for r in d['source5FrameRAW']]==[65.25,65.6,66.35,67.2,68.05]
          assert all(r['priorR23OriginalTrueSourceDifference'] is not None for r in d['source5FrameRAW'])
          assert subprocess.check_output(['git','hash-object','web/p101-w9c2-g4e7ci-integrated-streetscape.mjs'],text=True).strip()=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert (pathlib.Path('test-results/k4ct-contact-retry')/'K4CT_EDITABLE_SOURCE_ALIGNED_TIDAL_SPILLWAY_ART_REJECT.blend').stat().st_size>30000
          print('R24_REAL_BLENDER_GRAVITY_ESTUARY_NATIVE_FIVE_FRAME_TECH_PASS_ART_HOLD')
          PY
      - name: Preserve R24 genuine Blender gravity water/sluice + 5 source RAW for art veto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CT_R24_REAL_GRAVITY_SHORELINE_FIVE_FRAME_ART_HOLD
          path: |
            test-results/k4ct-r24-native-blockout/
            test-results/k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json
            test-results/k4ct-contact-retry/K4CT_R9_BLENDER_TRUE_MATERIAL_BRIDGE.json
            test-results/k4ct-contact-retry/K4CT_EDITABLE_SOURCE_ALIGNED_TIDAL_SPILLWAY_ART_REJECT.blend
          if-no-files-found: warn
          retention-days: 7
