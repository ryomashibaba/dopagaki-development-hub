name: K4CT R70 one true fixed B51 rotor pivot left-bank Blender cantilever native GL
on:
  push:
    branches:
      - research/k4ct-two-native-b51-choice-consequence-20261105
    paths:
      - .github/workflows/p101-k4ct-r60-genuine-rocker-art.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-blender-and-original-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected original and syntax preflight
        run: |
          set -euo pipefail
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-k4ct-native-spillway-dcc.py)" = 096fffbc1627915eb0122224955bb02cfba6b3ae
          node --check scripts/k4ct-r70-pivot-native-art.mjs
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path('scripts/p101-k4ct-r70-authored-true-pivot-bearing.py').read_text())
          print('R70_AUTHORED_SCRIPT_SYNTAX_PASS')
          PY
      - name: Reuse the R49 actual editable Blender and original data
        uses: actions/download-artifact@v4
        with:
          name: K4CT_R49_ORIGINAL_WEBGL2_VOLUMETRIC_SIPHON_ART_HOLD
          run-id: 42437685590
          github-token: ${{ github.token }}
          path: test-results
      - name: Reuse the genuine 65.25/65.60/66.35 original source camera and B51 poses
        uses: actions/download-artifact@v4
        with:
          name: K4CT_R60_REAL_ORIGINAL_240HZ_EARLY_CAMERA_B51_POSES_ART_HOLD
          run-id: 42448441488
          github-token: ${{ github.token }}
          path: test-results/k4ct-r60-early
      - name: One Blender installation and original source GL dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=1 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 780s apt-get -o Acquire::Retries=1 install -y --no-install-recommends blender libegl1 libgl1-mesa-dri libopengl0 libgbm1
          blender --version | head -2
      - name: Author only ONE genuine 3D research machine on top of actual R49 BLEND
        timeout-minutes: 10
        run: |
          blender -b --factory-startup --python-exit-code 3 --python scripts/p101-k4ct-r70-authored-true-pivot-bearing.py
      - name: Independent R60 Blender and protected8 exact XYZRGB check
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path('test-results')
          d=json.loads((p/'k4ct-contact-retry/K4CT_DCC_BLENDER_TO_NATIVE_GEOMETRY.json').read_text())
          r=json.loads((p/'k4ct-contact-retry/K4CT_R9_BLENDER_TRUE_MATERIAL_BRIDGE.json').read_text())
          m=json.loads((p/'k4ct-r70-authored/R70_TRUE_PIVOT_BEARING_MANIFEST.json').read_text())
          a=json.loads((p/'k4ct-r39-art/R39_BASELINE_EIGHT_PROTECTED.json').read_text())
          assert m['trueEditableBlenderMeshes']==10 and m['newEvaluatedTriangles']>130
          assert d['triangles']==r['totalDccTriangles']==m['wholeSceneTriangles']>32004
          assert r['roadLegacyTriangles']+r['triangles']==d['triangles']
          assert d['originalB48']==r['originalB48']==7 and d['originalB51']==r['originalB51']==28
          assert d['newColliders']==r['newColliders']==0
          ps={'00','12','13','19','34','35','41','42'}
          def take(x):
            i=0;z={}
            for name,n in x['objects'].items():
              if name[:2] in ps:z[name]=x['vertices'][i:i+18*n]
              i+=18*n
            assert i==len(x['vertices'])
            return z
          assert take(a)==take(d)
          assert (p/'k4ct-r70-authored/R70_TRUE_NATIVE_PIVOT_CANTILEVER_ART_HOLD.blend').stat().st_size>100000
          for f,h in [('web/p101-w9c2-g4e7ci-integrated-streetscape.mjs','af076d67492a677d2235e4730aef8cdf4808e106'),('scripts/p101-k4ct-native-spillway-dcc.py','096fffbc1627915eb0122224955bb02cfba6b3ae')]:
            assert subprocess.check_output(['git','hash-object',f],text=True).strip()==h
          print('R70_TRUE_EDITABLE_BLENDER_8_PROTECTED_EXACT_PASS')
          PY
      - name: Build true original private 240Hz game and install the new authored 3D
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node scripts/p101-k4ct-install-authored-dcc.mjs
          node scripts/k4ct-r57-install-private-live-hud.mjs
          node scripts/k4ct-r60-private-source-frustum-patch.mjs
          node --check dist-private/k4ct/drive3d.mjs
      - name: Install headless Chromium without any further Blender
        timeout-minutes: 6
        run: |
          npx playwright install --only-shell --with-deps chromium
      - name: True original source 240Hz WebGL2 at 65.25, 65.60, 66.35
        timeout-minutes: 10
        run: |
          node scripts/k4ct-r70-pivot-native-art.mjs
      - name: Preserve editable Blender mesh and source actual GL RAW
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CT_R70_TRUE_PIVOT_BEARING_BLENDER_NATIVE_GL_ART_HOLD
          path: |
            test-results/k4ct-r70-authored/
            test-results/k4ct-r70-pivot-native-art/
          if-no-files-found: warn
          retention-days: 7
