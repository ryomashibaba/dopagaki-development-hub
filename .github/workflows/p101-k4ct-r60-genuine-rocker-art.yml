name: K4CT R72 single cached local trial WebGL2 handover verification (HUMAN HOLD)
on:
  push:
    branches:
      - research/k4ct-two-native-b51-choice-consequence-20261105
    paths:
      - .github/workflows/p101-k4ct-r60-genuine-rocker-art.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cached-r72-original-chromium-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect game and original Blender authors
        run: |
          set -euo pipefail
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-k4ct-native-spillway-dcc.py)" = 096fffbc1627915eb0122224955bb02cfba6b3ae
          node --check scripts/k4ct-r72-check-local-human-trial-bundle.mjs
      - name: Download exact previously built R72 trial bundle; no game or Blender rebuild
        uses: actions/download-artifact@v4
        with:
          name: K4CT_R72_LOCAL_HUMAN_TRIAL_BUNDLE_RESEARCH_NOT_RELEASED
          run-id: 42465824622
          github-token: ${{ github.token }}
          path: test-results
      - name: Verify local artifact self-contained modules and no physical changes
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib,re
          root=pathlib.Path('test-results/k4ct-r72-human-trial-bundle')
          m=json.loads((root/'R72_PACKAGE_MANIFEST.json').read_text())
          assert m['nativeSourceGameBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert m['originalBlenderAuthorBlob']=='096fffbc1627915eb0122224955bb02cfba6b3ae'
          assert (m['originalB48'],m['originalB51'],m['newColliders'])==(7,28,0)
          assert m['autoNetworkUpload'] is False and m['launchTestedOnWindows'] is False
          for field,file in [('UIAddonSHA256',root/'k4ct/r72-one-click-human-trial.mjs'),
                             ('launcherSHA256',root/'R72_DOPAGAKI_LOCAL_TRIAL.cmd')]:
            assert hashlib.sha256(file.read_bytes()).hexdigest()==m[field]
          missing=[]
          for file in root.rglob('*'):
            if file.suffix not in ('.mjs','.js'):continue
            for p in re.findall(r"""(?:from|import)\s*\(?\s*['"]([.][.]?/[^'"]+)['"]""",file.read_text(errors='replace')):
              if not (file.parent/p).resolve().is_file():
                missing.append([str(file.relative_to(root)),p])
          assert not missing,missing
          print('R72_CACHED_ORIGINAL_BUNDLE_SELF_CONTAINED_SHA_AND_NATIVE_MODULES_PASS')
          PY
      - name: Install only Chromium smoke dependencies (no Blender or long rebuild)
        timeout-minutes: 6
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npx playwright install --only-shell --with-deps chromium
      - name: Verify native original 240Hz handover clock and local JSON export
        timeout-minutes: 5
        run: |
          node scripts/k4ct-r72-check-local-human-trial-bundle.mjs test-results/k4ct-r72-human-trial-bundle
      - name: Save one factual browser result, not a HUMAN gameplay certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CT_R72_CACHED_TRUE_MANUAL_HANDOVER_SOURCE_GL_SMOKE
          path: test-results/k4ct-r72-bundle-native-smoke/
          retention-days: 7
          if-no-files-found: warn
