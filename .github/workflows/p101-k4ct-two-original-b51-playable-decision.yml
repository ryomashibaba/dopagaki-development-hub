name: K4CT original B51-13 to 14 native 240Hz real contact and retry
on:
  push:
    branches:
      - research/k4ct-two-native-b51-choice-consequence-20261105
    paths:
      - scripts/p101-k4ct-native-contact-retry.mjs
      - scripts/p101-k4ct-second-b51-controlled-keyboard.mjs
      - scripts/p101-k4ct-dcc-source-export.mjs
      - scripts/p101-k4ct-native-spillway-dcc.py
      - scripts/p101-k4ct-install-authored-dcc.mjs
      - scripts/p101-k4ct-private-native-two-choice-game.mjs
      - .github/workflows/p101-k4ct-two-original-b51-playable-decision.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-b51-contact-and-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen source and code preflight
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-k4ct-private-native-two-choice-game.mjs
          node --check scripts/p101-k4ct-native-contact-retry.mjs
          node --check scripts/p101-k4ct-second-b51-controlled-keyboard.mjs
          node --check scripts/p101-k4ct-dcc-source-export.mjs
          node --check scripts/p101-k4ct-install-authored-dcc.mjs
          python3 -m py_compile scripts/p101-k4ct-native-spillway-dcc.py
      - name: Reuse native K4CT original WebGL2 and 240Hz physics research build
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node --check dist-private/k4ct/drive3d.mjs
      - name: Export EXACT original B48/B51 physical site for Blender authorship
        run: |
          node scripts/p101-k4ct-dcc-source-export.mjs
      - name: True Blender editable integrated tidal spillway / functional seaport
        id: k4ct_dcc
        timeout-minutes: 22
        continue-on-error: true
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 900s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=45 install -y --no-install-recommends blender libegl1 libgl1-mesa-dri libopengl0 libgbm1
          blender -b --factory-startup --python-exit-code 3 --python scripts/p101-k4ct-native-spillway-dcc.py
      - name: Install only genuine Blender-emitted scene in PRIVATE original WebGL2 game
        if: steps.k4ct_dcc.outcome == 'success'
        run: |
          node scripts/p101-k4ct-install-authored-dcc.mjs
          node --check dist-private/k4ct/drive3d.mjs
          node --check dist-private/k4ct/k4ct-dcc-world-geometry.mjs
      - name: Truly run native keyboard through contact and native retry without proxies
        continue-on-error: true
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-k4ct-second-b51-controlled-keyboard.mjs
      - name: Independent original 240Hz Road6 B51-14 and Blender art gate
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          d=pathlib.Path('test-results/k4ct-contact-retry')
          game=json.loads((d/'K4CT_SECOND_B51_CONTROLLED_NATIVE_RESULT.json').read_text())
          assert game['schema']=='k4ct-actual-source-road6-b51-14-native-keyboard-corrective-v1'
          assert game['real240Hz'] and game['rawSourceGame'] and game['nativeKeyAKeyDOnly']
          assert game['HUMAN']==game['SAT']==game['CCD']==game['FPS']==game['RELEASE']==game['MERGE']=='HOLD'
          assert game['ART']=='REJECT' and game['formalART']==0 and game['slope2DNAmeters']==0
          assert game['newColliders']==0
          assert len(game['experiments'])>=3 and not game['errors']
          actual=[]
          for experiment in game['experiments']:
            trace=json.loads((d/experiment['traceName']).read_text())
            assert len(trace['stations'])==2
            assert {x['id'] for x in trace['stations']}=={'a13-machine-13','a13-machine-14'}
            samples=trace['samples']
            assert len(samples)>250 and all(len(x['hazards'])==2 for x in samples)
            assert all(x['t']>=63.65 and x['t']<=73.5 for x in samples)
            assert any(x['mode']=='REAL_KEYBOARD' for x in samples)
            assert experiment['renderer']['realGL']
            assert experiment['renderer']['dcc']=='GENUINE_BLENDER_EDITABLE_NONCOLLIDING'
            assert experiment['renderer']['dccTriangles']>2500
            assert experiment['actualKeyboardInputs']
            assert all(p['actual']['mode']=='ORIGINAL_MANUAL_KEYBOARD' for p in experiment['actualKeyboardInputs'])
            assert (d/experiment['imageName']).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
            native14=[e for x in samples for e in x['events'] if e['type']=='moving-contact' and e['id']=='a13-machine-14']
            assert len(native14)==len(experiment['measured']['actualNativeContact14'])
            actual.append({'name':experiment['name'],'realRoad6GroundedSamples':experiment['measured']['road6GroundedSamples'],
              'passedB51_14':experiment['measured']['trueRoad6B51_14Passed'],
              'minGap13M':experiment['measured']['minimumGap13M'],
              'minGap14M':experiment['measured']['minimumGap14M'],
              'nativeB51_14Contacts':len(native14),
              'failure':experiment['measured']['failure']})
          dcc=json.loads((d/'K4CT_BLENDER_TO_ORIGINAL_WEBGL2_INSTALL_AUDIT.json').read_text())
          assert dcc['createdViaRealBlender'] and dcc['extraCollisionSolids']==0
          assert dcc['newWebGLNonCollidingTriangles']>2500
          assert (d/'K4CT_EDITABLE_SOURCE_ALIGNED_TIDAL_SPILLWAY_ART_REJECT.blend').stat().st_size>30000
          assert subprocess.check_output(['git','hash-object','web/p101-w9c2-g4e7ci-integrated-streetscape.mjs'],text=True).strip()=='af076d67492a677d2235e4730aef8cdf4808e106'
          independent={'schema':'k4ct-independent-recovery-to-b51-14-v1','realChromium240HzTrials':len(actual),
            'physicalTrialOutcomes':actual,'sourceProtected':True,'originalRoad5AndB51CountPreserved':True,
            'nativeDccBlenderIntegrated':True,'newColliders':0,
            'realRoad6Grounded':game['road6GroundedObserved'],
            'realB51_14Passed':game['b51_14ActualPassed'],
            'realB51_14Contacts':game['actualB51_14Contacts'],
            'notHuman':True,'ART':'REJECT','HUMAN':'HOLD','SAT':'HOLD','CCD':'HOLD',
            'FPS':'HOLD','RELEASE':'HOLD','MERGE':'HOLD'}
          (d/'K4CT_ROAD6_B51_14_INDEPENDENT_RESULT.json').write_text(json.dumps(independent,indent=2)+'\n')
          print(json.dumps(independent))
          PY
      - name: Always archive native failures and raw true WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CT_B51_13_14_ACTUAL_NATIVE_CONTACT_RETRY_HOLD
          path: test-results/k4ct-contact-retry/
          if-no-files-found: warn
          retention-days: 7
