name: K4CT original B51-13 to 14 native 240Hz real contact and retry
on:
  push:
    branches:
      - research/k4ct-two-native-b51-choice-consequence-20261105
    paths:
      - scripts/p101-k4ct-native-contact-retry.mjs
      - scripts/p101-k4ct-private-native-two-choice-game.mjs
      - .github/workflows/p101-k4ct-two-original-b51-playable-decision.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-b51-contact-and-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen source and code preflight
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-k4ct-private-native-two-choice-game.mjs
          node --check scripts/p101-k4ct-native-contact-retry.mjs
      - name: Reuse native K4CT original WebGL2 and 240Hz physics research build
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-k4cq-private-integrated-pack.mjs
          node scripts/p101-k4cr-true-game-and-blender-pack.mjs
          node scripts/p101-k4cs-private-readable-actual-game-pack.mjs
          node scripts/p101-k4ct-private-native-two-choice-game.mjs
          node --check dist-private/k4ct/drive3d.mjs
      - name: Truly run native keyboard through contact and native retry without proxies
        continue-on-error: true
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-k4ct-native-contact-retry.mjs
      - name: Independently classify actual source collisions and reject unsupported passes
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          d=pathlib.Path('test-results/k4ct-contact-retry')
          p=d/'K4CT_CONTACT_RETRY_REAL_RESULT.json'
          assert p.exists(),'native real-run evidence not produced'
          j=json.loads(p.read_text())
          assert j['nativeInput']=='PLAYWRIGHT_KEYBOARD_NOT_HUMAN'
          assert j['formalART']==0 and j['slope2DNAmeters']==0
          assert j['HUMAN']==j['SAT']==j['CCD']==j['FPS']==j['RELEASE']==j['MERGE']=='HOLD'
          assert len(j['trials'])>=3 and not j['errors']
          verdict=[]
          for trial in j['trials']:
            t=json.loads((d/trial['traceName']).read_text())
            assert len(t['stations'])==2
            assert {s['id'] for s in t['stations']}=={'a13-machine-13','a13-machine-14'}
            assert len(t['samples'])>=30
            assert all(s['hazards'] and len(s['hazards'])==2 for s in t['samples'])
            assert any(s['mode']=='REAL_KEYBOARD' for s in t['samples'])
            assert (d/trial['imageName']).read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
            measured=trial['result']
            contacts=[e for s in t['samples'] for e in s['events'] if e['type']=='moving-contact']
            assert len(contacts)==len(measured['movingContactEvents'])
            if measured['outcome']=='B51_13_GEOMETRIC_PASS_NOT_HUMAN':
              assert measured['passedStation']['a13-machine-13'] and measured['lastStatus']=='running'
              assert not any(e['id']=='a13-machine-13' for e in contacts)
            verdict.append({'label':trial['label'],'result':measured['outcome'],'minGapM':measured['minGapM'],
              'contact13':measured['contact13'],'contact14':measured['contact14'],
              'failureReason':measured['failureReason']})
          if j['realRetryObserved']:
            assert j['retry']['restartedFromTickZero'] and j['retry']['via']=='ORIGINAL_RETRY_RUN_UI'
            assert j['realFailureObserved']
          assert __import__('subprocess').check_output(['git','hash-object','web/p101-w9c2-g4e7ci-integrated-streetscape.mjs'],text=True).strip()=='af076d67492a677d2235e4730aef8cdf4808e106'
          report={'schema':'k4ct-independent-actual-contact-and-retry-v1','sourceFrozen':True,
            'real240HzTrialsVerified':len(verdict),'physicalTrialOutcomes':verdict,
            'realFailure':j['realFailureObserved'],'realRetry':j['realRetryObserved'],
            'realContact13':j['contactEventsB51_13'],'realContact14':j['contactEventsB51_14'],
            'noAutomaticPlayFairnessCertification':True,'ART':'REJECT','HUMAN':'HOLD',
            'SAT':'HOLD','CCD':'HOLD','FPS':'HOLD','RELEASE':'HOLD','MERGE':'HOLD'}
          (d/'K4CT_INDEPENDENT_ACTUAL_VERDICT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Always archive native failures and raw true WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K4CT_B51_13_14_ACTUAL_NATIVE_CONTACT_RETRY_HOLD
          path: test-results/k4ct-contact-retry/
          if-no-files-found: warn
          retention-days: 7
