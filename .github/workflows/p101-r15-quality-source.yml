          a=[json.load(open(p)) for p in sources];b=[json.load(open(p)) for p in gates]
          assert {x['design'] for x in a}=={'LANDSCAPE','RIFT'}
          assert {x['originalRoad'] for x in a}=={'true-pinch','pinch-switch'}
          assert len({tuple(x['originalRoadRimWorldXYZ']) for x in a})==1
          assert len({tuple(x['originalCXExactLandingXYZ']) for x in a})==1
          assert all(x['officialArt']==x['officialSlope2Meters']==x['newSourceGameColliders']==0 for x in a)
          assert all(x['ART'] in ('HOLD','REJECT') and x['GAMEPLAY']=='HOLD' and x['HUMAN']=='HOLD' for x in b)
          print('R15J_REAL_BLENDER_NATIVE_CAMERA_ART_PRIVATE',[(x['variant'],x['road'],
            x['mean13To17SevenFrameSourceNewFirstHitNotBeauty'],x['sourceIntersectionStatus'],
            x['B51ConservativeSourceStatus'],x['ART']) for x in b],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15J_TWO_MACROS_FOUR_EDITABLE_SOURCE_BLEND_28_TRUE_R1_IMAGES_ART_HOLD
          path: |
            test-results/r15j/LANDSCAPE-*/
            test-results/r15j/RIFT-*/
            test-results/r15j/independent/
          retention-days: 7
          if-no-files-found: warn

