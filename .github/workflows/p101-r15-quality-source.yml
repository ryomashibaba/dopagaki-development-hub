                --python scripts/p101-r15j-two-source-grounded-macro-studies.py -- \
                --road "$road" --variant "$design" \
                --source "test-results/r15j/r1/result-$road/R1_$road"_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
                --native "test-results/r15j/r1/source/$road.json" \
                --hazards "test-results/r15j/r4/source/$road.json" \
                --r15i test-results/r15j/r15i/R15I_TRUE_B48_ROAD_FIRST_TWO_WORLD_PREFLIGHT.json \
                --r15i4 test-results/r15j/r15i4/R15I4_ORIGINAL_TWO_ROAD_CX_MACRO_SITE_PREFLIGHT.json \
                --out "test-results/r15j/$design-$road"
