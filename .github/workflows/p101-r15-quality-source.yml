              python3 scripts/p101-r15j-independent-two-macro-source-art-veto.py \
                --audit "test-results/r15j/$design-$road/R15J_${design}_${road}_SOURCE_MASSING_AND_CAMERA_AUDIT.json" \
                --original "test-results/r15j/r1/result-$road" \
                --trial "test-results/r15j/$design-$road" \
                --out test-results/r15j/independent
