name: P101 R15 unified native game-experience source audit (PRIVATE HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r15a-native-game-experience-audit.mjs'
      - 'scripts/p101-r15b-one-native-macro-city.py'
      - 'scripts/p101-r15b-independent-art-veto.py'
      - 'scripts/p101-r15c-true-source-macro-domain.py'
      - 'scripts/p101-r15c-independent-domain-gate.py'
      - 'scripts/p101-r15d-real-two-road-swept-detours.py'
      - 'scripts/p101-r15d-independent-detour-gate.py'
      - 'scripts/p101-r15e-editable-native-civic-spine.py'
      - 'scripts/p101-r15e-independent-native-art-gate.py'
      - 'scripts/p101-r15f-source-camera-first-landmark-sites.py'
      - 'scripts/p101-r15f-independent-camera-site-gate.py'
      - 'scripts/p101-r15g-three-true-original-cinematic-sites.py'
      - 'scripts/p101-r15h-editable-real-three-76m-sculptures.py'
      - 'scripts/p101-r15h-independent-real-r1-image-art-veto.py'
      - 'scripts/p101-r15i-original-road-rim-entrance-preflight.py'
      - 'scripts/p101-r15i-independent-road-first-gate.py'
      - 'scripts/p101-r15i2-cx-terrain-anchor-options.py'
      - 'scripts/p101-r15i2-independent-terrain-source-gate.py'
      - 'scripts/p101-r15i3-true-source-road-to-cx-civic-entry.py'
      - 'scripts/p101-r15i3-independent-true-r1-civic-entry-art.py'
      - 'scripts/p101-r15i4-source-camera-cx-access-grade-sites.py'
      - 'scripts/p101-r15i4-independent-source-camera-grade-gate.py'
      - 'scripts/p101-r15j-two-source-grounded-macro-studies.py'
      - 'scripts/p101-r15j-independent-two-macro-source-art-veto.py'
      - 'scripts/p101-r15k-actual-cx-connected-surface-original-camera.py'
      - 'scripts/p101-r15k-independent-cx-camera-gate.py'
      - 'tests/p101-r15a-native-game-experience.test.mjs'
      - '.github/workflows/p101-r15-quality-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15a-source-immutable-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm frozen original source and module syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15a-native-game-experience-audit.mjs
          node --test tests/p101-r15a-native-game-experience.test.mjs
      - name: Reconstruct actual original 240Hz scripted trajectory and project original movers
        run: node scripts/p101-r15a-native-game-experience-audit.mjs
      - name: Independently verify both source datasets and NO false promotion
        run: |
          python3 - <<'PY'
          import json,glob,math
          p=glob.glob('test-results/r15a-native-game-audit/*.json')
          assert len(p)==2,p
          roads=set()
          for f in p:
           d=json.load(open(f,encoding='utf8'))
           roads.add(d['road'])
           assert d['schema']=='dopagaki.r15a-native-kinematic-hazard-visibility-readonly/1'
           assert d['sourceCXBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
           assert (d['originalCX'],d['originalB48'],d['originalB51'],d['originalCameras'],d['sourcePhysicsHz'])==(18,7,28,5,240)
           assert len(d['observedFrames'])==13 and len(d['trajectoryParityWithPreviousR1'])==7
           assert all(len(x['originalMoverReadOnlyProjection'])==28 for x in d['observedFrames'])
           assert all(x['originalMoverCount']==28 and math.isfinite(x['sourceSpeedMps']) for x in d['observedFrames'])
           assert d['actualBrowserWebGL']=='NOT_RUN' and d['actualJumpRecovery']=='NOT_TESTED'
           assert d['officialArt']==d['officialSlope2Meters']==d['newGameColliders']==0
           assert d['sourceGameChanged'] is False
           assert all(d[k]=='HOLD' for k in ('ART','GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
          assert roads=={'true-pinch','pinch-switch'},roads
          print('R15A_TRUE_240HZ_SOURCE_ONLY_CANDIDATES_NEVER_REAL_HUMAN_VISIBILITY_CERTIFICATION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15A_NATIVE_240HZ_SOURCE_EXPERIENCE_READONLY_HOLD
          path: test-results/r15a-native-game-audit/
          retention-days: 7
          if-no-files-found: warn
  r15b-actual-native-macro-city-private-art:
    if: github.event_name == 'workflow_dispatch'
    needs: r15a-source-immutable-native
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original game source and compile true Blender study
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r15b-one-native-macro-city.py
      - name: Reuse true R1 original editable Blender + R4 source moving hazard whole-duration envelopes
        run: |
          mkdir -p test-results/r15b/r1 test-results/r15b/r4
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/r15b/r1
          gh run download 40671430779 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R4_28HAZARD_7VIEW_TRUE_SOURCE_WORLD_DIAG_HOLD \
            --dir test-results/r15b/r4
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Create ONE shared-world full-trajectory city 3D and run original-camera/physics audits
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/r15b/result-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-r15b-one-native-macro-city.py -- \
              --source "test-results/r15b/r1/result-$r/R1_$r"_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
              --native "test-results/r15b/r1/source/$r.json" \
              --shared-true test-results/r15b/r1/source/true-pinch.json \
              --shared-pinch test-results/r15b/r1/source/pinch-switch.json \
              --hazards "test-results/r15b/r4/source/$r.json" \
              --road "$r" --out "test-results/r15b/result-$r"
          done
      - name: Independently reject claims of game completion, merge, safe route, or art adoption
        run: |
          python3 - <<'PY'
          import glob,json
          root='test-results/r15b'
          reports=glob.glob(root+'/result-*/*_SOURCE_MACRO_ART_AUDIT.json')
          pngs=glob.glob(root+'/result-*/*.png')
          blends=glob.glob(root+'/result-*/*.blend')
          assert len(reports)==2 and len(pngs)==14 and len(blends)==2,(reports,len(pngs),len(blends))
          result={}
          for p in reports:
           d=json.load(open(p))
           result[d['road']]=d
           assert d['schema']=='dopagaki.r15b-one-actual-paired-world-macro-city-source-art/1'
           assert d['sourceCXBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
           assert d['originalCX18B48_7B51_28Cameras5Unchanged']
           assert d['bothOriginalRoadSharedWorldGeometry'] and d['bothRoadsInputToExactSharedWorldCoords']
           assert d['originalPhysicsHz']==240 and d['sourceCameraFramesOriginal13']==13
           assert d['originalTrajectoryPathSpanMetres']>350
           assert d['trueWorldMacroCityObjectCount']>=25
           assert len(d['originalSevenTrueBlenderRenders'])==7
           assert len(d['original13CameraFirstHit'])==13
           assert len(d['original13CourtActualRayClear'])==13
           assert len(d['original13MoverPosesTriangleIntersections'])==13
           assert all(0<=v['newCityFirstHitFraction']<=1 for v in d['original13CameraFirstHit'].values())
           assert d['newGameColliders']==d['officialArt']==d['officialSlope2Meters']==0
           assert d['sourceGameChanged'] is False
           assert d['originalGameTrueWebGLRendered'] is False
           assert not d['continuousWalkableTrafficFloorCertified'] and not d['humanAestheticApproval']
           assert not d['originalB51ContinuousTimeSafetyCertified']
           assert all(d[k]=='HOLD' for k in ('GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
          assert set(result)=={'true-pinch','pinch-switch'}
          assert result['true-pinch']['cityActualWorldBoundingBoxMetres']==result['pinch-switch']['cityActualWorldBoundingBoxMetres']
          for road,d in result.items():
           print('R15B_REAL_3D_SOURCE_ONLY_ART_REQUIRES_INDEPENDENT_IMAGE_REVIEW',road,
            'meshes',d['trueWorldMacroCityObjectCount'],
            'CX intersection objects',len(d['actualSourceCXTriangleIntersections']),
            'B48 intersection objects',len(d['actualSourceB48TriangleIntersections']),
            'B51 conservative envelope warnings',len(d['all28B51_721TickSampledEnvelopeWarnings']),
            'seven real camera first hits',
            [(k,d['original13CameraFirstHit'][k]['newCityFirstHitFraction']) for k in ('t1100','t1200','t1300','t1400','t1500','t1600','t1700')])
          PY
      - name: Original source baseline vs actual new images and independently veto false ART acceptance
        run: |
          python3 -m pip install --quiet Pillow
          python3 -m py_compile scripts/p101-r15b-independent-art-veto.py
          for r in true-pinch pinch-switch; do
            python3 scripts/p101-r15b-independent-art-veto.py \
              --audit "test-results/r15b/result-$r/R15B_$r"_SOURCE_MACRO_ART_AUDIT.json \
              --original "test-results/r15b/r1/result-$r" \
              --trial "test-results/r15b/result-$r" \
              --out "test-results/r15b/independent"
          done
          python3 - <<'PY'
          import glob,json,importlib.util,copy
          z=glob.glob('test-results/r15b/independent/*_INDEPENDENT_REAL_IMAGE_ART_REJECT.json')
          assert len(z)==2,z
          for p in z:
           x=json.load(open(p))
           assert x['R15BIndependentART']=='REJECT' and not x['R15BOriginalSourceGeometrySafe']
           assert x['CXActualTriangleIntersectionPairs']>0
           assert len(x['lateBelow2PctCityFirstHit'])>=2
           assert len(x['pairedOriginalCameraImageAnyChannelDiff45'])==7
           assert x['officialArt']==x['officialSlope2Meters']==x['newGameColliders']==0
           assert all(x[k]=='HOLD' for k in ('GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
           print('R15B_STOPS_UNSAFE_INVISIBLE_MACRO_CITY',x['road'],
            'CX',x['CXActualTriangleIntersectionPairs'],
            'city initial hit',x['sourceSevenFrameMeanCityFirstHit'])
          s=importlib.util.spec_from_file_location('art','scripts/p101-r15b-independent-art-veto.py')
          mod=importlib.util.module_from_spec(s);s.loader.exec_module(mod)
          source=json.load(open('test-results/r15b/result-true-pinch/R15B_true-pinch_SOURCE_MACRO_ART_AUDIT.json'))
          fake=copy.deepcopy(source);fake['humanAestheticApproval']=True
          try:
           mod.compare(fake,'test-results/r15b/r1/result-true-pinch','test-results/r15b/result-true-pinch','test-results/r15b/independent')
           raise AssertionError('FAKE_ART_ACCEPTANCE_NOT_REJECTED')
          except AssertionError as e:
           assert 'FAKE_ART_ACCEPTANCE_NOT_REJECTED' not in str(e)
           print('R15B_NEGATIVE_FAKE_ART_APPROVAL_REJECTED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15B_ONE_REAL_MACRO_CITY_NATIVE_BLENDER_14_SOURCE_IMAGES_ART_HOLD
          path: |
            test-results/r15b/result-*/
            test-results/r15b/independent/
          if-no-files-found: warn
          retention-days: 7

  r15c-shared-original-game-safe-camera-domain:
    if: github.event_name == 'workflow_dispatch'
    needs: r15a-source-immutable-native
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify original protected source and compile both R15C studies
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r15c-true-source-macro-domain.py scripts/p101-r15c-independent-domain-gate.py
      - name: Reuse original 240Hz R1 Blender scenes, all B51 721-tick and R14B identical two-road original safe sites
        run: |
          mkdir -p test-results/r15c/r1 test-results/r15c/r4 test-results/r15c/r14b test-results/r15c/results
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/r15c/r1
          gh run download 40671430779 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R4_28HAZARD_7VIEW_TRUE_SOURCE_WORLD_DIAG_HOLD \
            --dir test-results/r15c/r4
          gh run download 40693102074 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R14B_BOTH_ORIGINAL_ROADS_IDENTICAL_WORLD_SAFE_VISIBLE_SITES_HOLD \
            --dir test-results/r15c/r14b
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Exact two-road original CX/B48/B51 source intersection and original camera multi-frame 32-96m macro-domain pretest
        run: |
          blender -b --factory-startup -t 2 --python-exit-code 5 \
            --python scripts/p101-r15c-true-source-macro-domain.py -- \
            --source-true-pinch test-results/r15c/r1/result-true-pinch/R1_true-pinch_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
            --source-pinch-switch test-results/r15c/r1/result-pinch-switch/R1_pinch-switch_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
            --native-true-pinch test-results/r15c/r1/source/true-pinch.json \
            --native-pinch-switch test-results/r15c/r1/source/pinch-switch.json \
            --hazards-true-pinch test-results/r15c/r4/source/true-pinch.json \
            --hazards-pinch-switch test-results/r15c/r4/source/pinch-switch.json \
            --r14b test-results/r15c/r14b/R14B_REAL_BOTH_ROADS_COMMON_SITE_AUDIT.json \
            --out test-results/r15c/results
      - name: Independently recompute safe source-camera domains and reject fabricated acceptance
        run: |
          python3 scripts/p101-r15c-independent-domain-gate.py \
            --in test-results/r15c/results/R15C_BOTH_SOURCE_MACRO_DOMAIN_AUDIT.json \
            --out test-results/r15c/results/R15C_INDEPENDENT_PROVENANCE_AND_FALSE_PASS_REJECT.json
          python3 - <<'PY'
          import json
          root='test-results/r15c/results/'
          a=json.load(open(root+'R15C_BOTH_SOURCE_MACRO_DOMAIN_AUDIT.json'))
          b=json.load(open(root+'R15C_INDEPENDENT_PROVENANCE_AND_FALSE_PASS_REJECT.json'))
          assert a['R15CNewGeometryScaleTests']>=36
          assert a['genuineIntegratedCityArchitectureBuilt'] is False
          assert a['originalGameColliderChangeCount']==a['officialArt']==a['officialSlope2Meters']==0
          assert b['sourceEvidenceLogicalIntegrity']=='PASS'
          assert b['cannotPromoteGeometryToPublicGame']
          assert a['bothVariantsEligibleCount']==b['derivedBothRoadSafetyCameraHazardConservativeEligible']
          assert all(a[k]=='HOLD' for k in ('ART','GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
          print('R15C_REFERENCE_PARITY_AND_CROSS_ROAD_SAFE_DOMAIN_AUDIT',a['R14BProvenSharedSmallSitesReused'],
            'macro-scale tests',a['R15CNewGeometryScaleTests'],
            'screened conditional candidates',a['bothVariantsEligibleCount'],
            'all7 discrete cross-section safe pairs',len(a['bothVariants7DiscreteStationClearCandidateLinks']),
            'NO AUTOMATIC CITY OR HUMAN ART CERTIFICATION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15C_TWO_ROAD_REAL_ORIGINAL_SOURCE_SAFE_VISIBLE_MACRO_DOMAIN_NO_ART
          path: test-results/r15c/results/
          if-no-files-found: warn
          retention-days: 7

  r15d-original-two-road-true-swept-detours:
    if: github.event_name == 'workflow_dispatch'
    needs: r15a-source-immutable-native
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve frozen original game source and compile R15D geometric code
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r15d-real-two-road-swept-detours.py scripts/p101-r15d-independent-detour-gate.py
      - name: Reuse proven actual R1 240Hz Blender sources, R4 28 x 721 envelopes, audited R15C report
        run: |
          mkdir -p test-results/r15d/r1 test-results/r15d/r4 test-results/r15d/r15c test-results/r15d/results
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/r15d/r1
          gh run download 40671430779 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R4_28HAZARD_7VIEW_TRUE_SOURCE_WORLD_DIAG_HOLD \
            --dir test-results/r15d/r4
          gh run download 40705855639 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15C_TWO_ROAD_REAL_ORIGINAL_SOURCE_SAFE_VISIBLE_MACRO_DOMAIN_NO_ART \
            --dir test-results/r15d/r15c
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Actual original two-road CX/B48+B51 3D swept 8/12m non-straight four-link A-star search
        run: |
          blender -b --factory-startup -t 2 --python-exit-code 5 \
            --python scripts/p101-r15d-real-two-road-swept-detours.py -- \
            --source-true-pinch test-results/r15d/r1/result-true-pinch/R1_true-pinch_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
            --source-pinch-switch test-results/r15d/r1/result-pinch-switch/R1_pinch-switch_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
            --native-true-pinch test-results/r15d/r1/source/true-pinch.json \
            --native-pinch-switch test-results/r15d/r1/source/pinch-switch.json \
            --hazards-true-pinch test-results/r15d/r4/source/true-pinch.json \
            --hazards-pinch-switch test-results/r15d/r4/source/pinch-switch.json \
            --r15c test-results/r15d/r15c/R15C_BOTH_SOURCE_MACRO_DOMAIN_AUDIT.json \
            --out test-results/r15d/results
      - name: Independent two-original-roads route and false-acceptance gate
        run: |
          python3 scripts/p101-r15d-independent-detour-gate.py \
            --r15d test-results/r15d/results/R15D_TWO_ORIGINAL_WORLDS_3D_DETOUR_AUDIT.json \
            --r15c test-results/r15d/r15c/R15C_BOTH_SOURCE_MACRO_DOMAIN_AUDIT.json \
            --out test-results/r15d/results/R15D_INDEPENDENT_LOGICAL_ROUTE_GATE.json
          python3 - <<'PY'
          import json
          root='test-results/r15d/results/'
          d=json.load(open(root+'R15D_TWO_ORIGINAL_WORLDS_3D_DETOUR_AUDIT.json'))
          x=json.load(open(root+'R15D_INDEPENDENT_LOGICAL_ROUTE_GATE.json'))
          assert d['sourceCXBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert d['newGameColliders']==d['officialArt']==d['officialSlope2Meters']==0
          assert len(d['researchWorldNonStraightDetours4CandidatePairs'])==8
          assert x['independentPathShapeAndTwoRoadProofLogicalContract']=='PASS'
          assert d['allTwoRoadConservativeSourceSweptRoutesFound']==x['conservativeActualTwoRoadPaths']
          assert all(d[k]=='HOLD' for k in ('ART','GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
          print('R15D_TRUE_TWO_ORIGINAL_SOURCE_SWEPT_SEARCH_FINISHED',
            'paths',d['allTwoRoadConservativeSourceSweptRoutesFound'],
            'node and swept-source tests',d['counts'],
            'PUBLIC GAME ART HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15D_TRUE_TWO_ROAD_3D_ASTAR_SWEPT_VOLUMES_PRIVATE_SOURCE_HOLD
          path: test-results/r15d/results/
          if-no-files-found: warn
          retention-days: 7

  r15e-real-two-road-3d-civic-spine-native-art:
    if: github.event_name == 'workflow_dispatch'
    needs: r15a-source-immutable-native
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable game source and compile source scene plus independent image gate
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r15e-editable-native-civic-spine.py scripts/p101-r15e-independent-native-art-gate.py
      - name: Download immutable R1 original Blender / R4 all-original moving / R15D independently validated two-road swept route
        run: |
          mkdir -p test-results/r15e/r1 test-results/r15e/r4 test-results/r15e/r15d
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/r15e/r1
          gh run download 40671430779 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R4_28HAZARD_7VIEW_TRUE_SOURCE_WORLD_DIAG_HOLD \
            --dir test-results/r15e/r4
          gh run download 40709760374 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15D_TRUE_TWO_ROAD_3D_ASTAR_SWEPT_VOLUMES_PRIVATE_SOURCE_HOLD \
            --dir test-results/r15e/r15d
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Build editable REAL Blender civic transit, same original 3D shared corridor and 14 source cameras
