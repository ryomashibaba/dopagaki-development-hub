          sources=glob.glob('test-results/r15j/*-*/*_SOURCE_MASSING_AND_CAMERA_AUDIT.json')
          gates=glob.glob('test-results/r15j/independent/R15J_*_INDEPENDENT_IMAGE_AND_SOURCE_GATE.json')
