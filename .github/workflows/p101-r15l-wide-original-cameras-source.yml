name: P101 R15L actual full native 240Hz two-road wide 18CX source atlas (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15l-actual-native-full-route-survey.mjs
      - scripts/p101-r15l-actual-wide-18cx-original-road-and-2road-camera-atlas.py
      - scripts/p101-r15l-independent-actual-full-route-18cx-atlas-gate.py
      - .github/workflows/p101-r15l-wide-original-cameras-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15l-real-original-240hz-both-road-extended-camera-source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original game script exact unmodified fingerprint and Python syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15l-actual-native-full-route-survey.mjs
          python3 -m py_compile scripts/p101-r15l-actual-wide-18cx-original-road-and-2road-camera-atlas.py scripts/p101-r15l-independent-actual-full-route-18cx-atlas-gate.py
      - name: TRUE original start00 P96 240Hz up to actual real runner end, 11-17 exact R1 camera parity both source roads
        run: |
          node scripts/p101-r15l-actual-native-full-route-survey.mjs
          python3 - <<'PY'
          import json
          path='test-results/r15l/native/'
          for road in ('true-pinch','pinch-switch'):
            d=json.load(open(path+road+'.json'))
            assert d['sourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
            assert len(d['originalR1OverlappingTrue13FramesParity'])==13
            assert d['observedToTimeSeconds']>=17
            assert len(d['originalFullTimelineFrames'])>=34
            assert all(len(x['moving'])==28 for x in d['originalFullTimelineFrames'])
            assert d['newSourceGameColliders']==d['officialArt']==d['officialSlope2Meters']==0
            print('R15L_REAL_ORIGINAL_START00',road,'samples',len(d['originalFullTimelineFrames']),
              'runner',d['actualRunnerStatus'],'ending',d['actualRunnerTimeSeconds'],
              'observed',d['observedToTimeSeconds'],flush=True)
          PY
      - name: Recover verified immutable native original 18 CX, B48x7 source and 28 B51 Blender scene
        run: |
          mkdir -p test-results/r15l/original-r1 test-results/r15l/results
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/r15l/original-r1
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: All original 18 CX upward face terrain, 7 actual B48, actual native frames, two roads B51 boxes
        run: |
          blender -b --factory-startup -t 2 --python-exit-code 5 \
            --python scripts/p101-r15l-actual-wide-18cx-original-road-and-2road-camera-atlas.py -- \
            --source-true-pinch test-results/r15l/original-r1/result-true-pinch/R1_true-pinch_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
            --source-pinch-switch test-results/r15l/original-r1/result-pinch-switch/R1_pinch-switch_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
            --native-true-pinch test-results/r15l/native/true-pinch.json \
            --native-pinch-switch test-results/r15l/native/pinch-switch.json \
            --out test-results/r15l/results
      - name: Independently cross-audit 240Hz replay, 18 real CX meshes, two original B48 variants, moving B51 and source vetoes
        run: |
          python3 scripts/p101-r15l-independent-actual-full-route-18cx-atlas-gate.py \
            --native-true-pinch test-results/r15l/native/true-pinch.json \
            --native-pinch-switch test-results/r15l/native/pinch-switch.json \
            --atlas test-results/r15l/results/R15L_ACTUAL_ORIGINAL_TWO_ROAD_WIDE_TIME_CX_B48_SOURCE_ATLAS.json \
            --out test-results/r15l/results
          python3 - <<'PY'
          import json
          p='test-results/r15l/results/'
          d=json.load(open(p+'R15L_ACTUAL_ORIGINAL_TWO_ROAD_WIDE_TIME_CX_B48_SOURCE_ATLAS.json'))
          a=json.load(open(p+'R15L_INDEPENDENT_WIDE_ORIGINAL_NATIVE_CX_B48_B51_ATLAS_QA.json'))
          assert a['sourceOriginalCXMeshesInspected']==18
          assert len(a['adversarialFalsePromotionRejected'])>=16
          assert a['independentCrossRoadSourcePointAndFrameCountRecomputed']
          assert d['newGameColliders']==d['officialArt']==d['officialSlope2Meters']==0
          assert not d['actualNewBlenderCityCreated'] and not d['fullHumanWalkCertified']
          print('R15L_TRUE_ORIGINAL_WIDE_ATLAS_SOURCE_ONLY',a,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15L_TRUE_NATIVE_ALL_PLAYABLE_TIME_CX18_B48_7_TWO_ROAD_B51_WIDE_RESEARCH_NO_ART
          path: |
            test-results/r15l/native/
            test-results/r15l/results/
          retention-days: 7
          if-no-files-found: warn

  r15l-independent-verify-saved-genuine-source-no-expensive-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Frozen original game SHA and independent source audit script syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r15l-independent-actual-full-route-18cx-atlas-gate.py
      - name: Reuse EXACT true original R15L 240Hz 0-19.5s native replay, Blender CX18 B48x7 screen and B51 saved source
        run: |
          mkdir -p test-results/r15l-review
          gh run download 40802904554 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15L_TRUE_NATIVE_ALL_PLAYABLE_TIME_CX18_B48_7_TWO_ROAD_B51_WIDE_RESEARCH_NO_ART \
            --dir test-results/r15l-review
          test -s test-results/r15l-review/native/true-pinch.json
          test -s test-results/r15l-review/native/pinch-switch.json
          test -s test-results/r15l-review/results/R15L_ACTUAL_ORIGINAL_TWO_ROAD_WIDE_TIME_CX_B48_SOURCE_ATLAS.json
      - name: Independently verify exact 38 same 0.5s source frames, 18 terrain meshes, 240 paired sites and B51 no-art veto
        run: |
          python3 scripts/p101-r15l-independent-actual-full-route-18cx-atlas-gate.py \
            --native-true-pinch test-results/r15l-review/native/true-pinch.json \
            --native-pinch-switch test-results/r15l-review/native/pinch-switch.json \
            --atlas test-results/r15l-review/results/R15L_ACTUAL_ORIGINAL_TWO_ROAD_WIDE_TIME_CX_B48_SOURCE_ATLAS.json \
            --out test-results/r15l-review/results
          python3 - <<'PY'
          import json
          p='test-results/r15l-review/results/'
          q=json.load(open(p+'R15L_INDEPENDENT_WIDE_ORIGINAL_NATIVE_CX_B48_B51_ATLAS_QA.json'))
          d=json.load(open(p+'R15L_ACTUAL_ORIGINAL_TWO_ROAD_WIDE_TIME_CX_B48_SOURCE_ATLAS.json'))
          assert q['originalTwoRoadSharedActual0p5sFrames']==38
          assert q['sourceOriginalCXMeshesInspected']==18 and q['originalB48RoadVariantsInspected']==2
          assert q['twoRoadSameXYZSourceSiteCount']==240
          assert len(q['adversarialFalsePromotionRejected'])>=16
          assert q['independentCrossRoadSourcePointAndFrameCountRecomputed']
          assert d['preliminaryResearchGateSurvivorCount']==q['strictResearchCandidateCount']
          assert q['realWebGLOrHumanWalkOrArtApproved'] is False
          assert d['newGameColliders']==d['officialArt']==d['officialSlope2Meters']==0
          print('R15L_SOURCE_ONLY_FINAL_VERIFIED',q,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15L_VERIFIED_ORIGINAL_BROAD_18CX_240_SOURCE_ATLAS_INDEPENDENT_QA_NO_ART
          path: test-results/r15l-review/results/R15L_INDEPENDENT_WIDE_ORIGINAL_NATIVE_CX_B48_B51_ATLAS_QA.json
          retention-days: 7
          if-no-files-found: warn
