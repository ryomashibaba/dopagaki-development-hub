name: P101 R15N2 original 240Hz early steering 24 native source road retention trials (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15n2-early-curve-genuine-native-24-input-sweep.mjs
      - scripts/p101-r15n2-independent-native-24-curve-sweep-veto.py
      - .github/workflows/p101-r15n2-real-original-curving-road-input.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-24-early-steering-replays-two-b48-worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze original source game SHA and validate new source-engine-only study
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15n2-early-curve-genuine-native-24-input-sweep.mjs
          python3 -m py_compile scripts/p101-r15n2-independent-native-24-curve-sweep-veto.py
      - name: Fetch unchanged original R15L 240Hz source camera t14 two road variants as exact parity proofs
        run: |
          mkdir -p test-results/r15n2/r15l test-results/r15n2/results
          gh run download 40802904554 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15L_TRUE_NATIVE_ALL_PLAYABLE_TIME_CX18_B48_7_TWO_ROAD_B51_WIDE_RESEARCH_NO_ART \
            --dir test-results/r15n2/r15l
          test -s test-results/r15n2/r15l/native/true-pinch.json
          test -s test-results/r15n2/r15l/native/pinch-switch.json
      - name: 24 exact original physics time-variant P96 input-only trials, 4 starts times x 3 right biases x 2 original B48 roads
        run: |
          node scripts/p101-r15n2-early-curve-genuine-native-24-input-sweep.mjs \
            --true-pinch test-results/r15n2/r15l/native/true-pinch.json \
            --pinch-switch test-results/r15n2/r15l/native/pinch-switch.json \
            --out test-results/r15n2/results
      - name: Independently veto 52s fake completion, art/human/WebGL promotion and recompute all distinct real native source input studies
        run: |
          python3 scripts/p101-r15n2-independent-native-24-curve-sweep-veto.py \
            --native test-results/r15n2/results/R15N2_24_GENUINE_ORIGINAL_NATIVE_B48_EARLIER_RIGHT_INPUT_TRIALS.json \
            --true-pinch test-results/r15n2/r15l/native/true-pinch.json \
            --pinch-switch test-results/r15n2/r15l/native/pinch-switch.json \
            --out test-results/r15n2/results
          python3 - <<'PY'
          import json
          p='test-results/r15n2/results/'
          q=json.load(open(p+'R15N2_INDEPENDENT_ACTUAL_EARLY_RIGHT_STEER_24_NATIVE_QA.json'))
          assert len(q['forgedSourceAndGameApprovalsRejected'])==12
          assert q['officialArt']==q['officialSlope2Meters']==0
          assert all(x['genuinelyDifferentNative240HzExperiments']==12 for x in q['genuineSourceObservations'].values())
          print("R15N2_TRUE_SOURCE_NATIVE_P96_EARLY_STEER_ONLY",q,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15N2_ORIGINAL_REAL_240HZ_24_EARLIER_STEERING_CURVE_CONTACT_STUDY_HOLD
          path: test-results/r15n2/results/
          retention-days: 7
          if-no-files-found: warn
