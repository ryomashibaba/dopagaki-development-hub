name: P101 R15O isolated original B48 real physical road geometry 16 native 240Hz trials HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15o-isolated-original-crown-physical-shape-variants.mjs
      - scripts/p101-r15o-16-real-native-original-b48-geometry-trials.mjs
      - scripts/p101-r15o-independent-16-real-road-geometry-veto.py
      - .github/workflows/p101-r15o-real-original-b48-physical-correction-trials.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-genuine-240hz-physical-b48-original-a-b-c-with-original-and-best-steering:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original game protected and new isolated source physical B48 tested scripts syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15o-isolated-original-crown-physical-shape-variants.mjs
          node --check scripts/p101-r15o-16-real-native-original-b48-geometry-trials.mjs
          python3 -m py_compile scripts/p101-r15o-independent-16-real-road-geometry-veto.py
      - name: Get original genuine R15L 240Hz source and 24 true R15N2 steering experiments
        run: |
          mkdir -p test-results/r15o/old test-results/r15o/r15n2 test-results/r15o/results
          gh run download 40802904554 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15L_TRUE_NATIVE_ALL_PLAYABLE_TIME_CX18_B48_7_TWO_ROAD_B51_WIDE_RESEARCH_NO_ART \
            --dir test-results/r15o/old
          gh run download 40815591798 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15N2_ORIGINAL_REAL_240HZ_24_EARLIER_STEERING_CURVE_CONTACT_STUDY_HOLD \
            --dir test-results/r15o/r15n2
          test -s test-results/r15o/old/native/true-pinch.json
          test -s test-results/r15o/r15n2/R15N2_24_GENUINE_ORIGINAL_NATIVE_B48_EARLIER_RIGHT_INPUT_TRIALS.json
      - name: GENUINE original P101 240Hz native drive with 2 original B48 road worlds, 4 physical contour variants, 2 unchanged native steering controls = 16 trials
        run: |
          node scripts/p101-r15o-16-real-native-original-b48-geometry-trials.mjs \
            --true-pinch test-results/r15o/old/native/true-pinch.json \
            --pinch-switch test-results/r15o/old/native/pinch-switch.json \
            --r15n2 test-results/r15o/r15n2/R15N2_24_GENUINE_ORIGINAL_NATIVE_B48_EARLIER_RIGHT_INPUT_TRIALS.json \
            --out test-results/r15o/results
      - name: Independent genuine 16 original 240Hz physical geometry and real contact QA with 12 forged claims rejected
        run: |
          python3 scripts/p101-r15o-independent-16-real-road-geometry-veto.py \
            --result test-results/r15o/results/R15O_REAL_16_NATIVE_CROWN_PHYSICAL_RESHAPE_240HZ_DRIVING.json \
            --native-true-pinch test-results/r15o/old/native/true-pinch.json \
            --native-pinch-switch test-results/r15o/old/native/pinch-switch.json \
            --r15n2 test-results/r15o/r15n2/R15N2_24_GENUINE_ORIGINAL_NATIVE_B48_EARLIER_RIGHT_INPUT_TRIALS.json \
            --out test-results/r15o/results
          python3 - <<'PY'
          import json
          p="test-results/r15o/results/"
          x=json.load(open(p+"R15O_INDEPENDENT_REAL_B48_16_NATIVE_GEOMETRY_CHANGE_QA.json"))
          assert x["comparisonWithoutOriginalGameSourceEdits"]
          assert len(x["forgedSourceAndArtGameplayHumanPromotionRejected"])==12
          assert sum(map(len,x["allSixteenSourceStudyCases"].values()))==16
          assert x["officialArt"]==x["officialSlope2Meters"]==0
          print("R15O_GENUINE_NATIVE_REAL_ROAD_GEOMETRY_ONLY_16_VERIFIED",x,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15O_GENUINE_ORIGINAL_240HZ_B48_REAL_3_GEOMETRY_CORRECTIONS_16_RUNS_ART_HOLD
          path: test-results/r15o/results/
          retention-days: 7
          if-no-files-found: warn
