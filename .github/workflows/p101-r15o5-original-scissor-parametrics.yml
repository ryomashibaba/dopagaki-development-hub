name: P101 R15O5 original B48 SCISSOR_RISE true native next-exit UV source
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15o5-source-second-road-scissor-real-exit.mjs
      - .github/workflows/p101-r15o5-original-scissor-parametrics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-original-scissor-physical-contact-after-source-crown-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze original game before source UV inspector
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15o5-source-second-road-scissor-real-exit.mjs
      - name: Source original B16 physically grounded next real road from genuine extended 240Hz Runner
        run: |
          mkdir -p test-results/r15o5/source test-results/r15o5/results
          gh run download 40830811488 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15O4_TRUE_NATIVE_SOURCE_BANKED_B48_16M_REPLAY_BEYOND24_REAL_END_HOLD \
            --dir test-results/r15o5/source
          node scripts/p101-r15o5-source-second-road-scissor-real-exit.mjs \
            --r15o4 test-results/r15o5/source/R15O4_ACTUAL_NATIVE_B16_REAL_PHYSICAL_ROAD_SOURCE_EXTENDED_TO_36.json \
            --out test-results/r15o5/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15O5_ORIGINAL_SCISSOR_REAL_NATIVE_UV_AFTER_B16_SOURCE_HOLD
          path: test-results/r15o5/results/
          retention-days: 7
          if-no-files-found: warn
