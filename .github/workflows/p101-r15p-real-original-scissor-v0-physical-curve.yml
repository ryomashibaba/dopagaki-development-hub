name: P101 R15P source ORIGINAL B48 SCISSOR v0 seamless physical 8 trials after B16 crown HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15p-isolated-original-scissor-entry-geometry-correction.mjs
      - scripts/p101-r15p-eight-genuine-b48-scissor-physics-replays.mjs
      - scripts/p101-r15p-independent-8-original-scissor-source-veto.py
      - .github/workflows/p101-r15p-real-original-scissor-v0-physical-curve.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15p-genuine-b48-original-240hz-two-worlds-and-4-real-scissor-shapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected original game and B48 3rd road source JS/Python compile
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15p-isolated-original-scissor-entry-geometry-correction.mjs
          node --check scripts/p101-r15p-eight-genuine-b48-scissor-physics-replays.mjs
          node --check scripts/p101-r15o-16-real-native-original-b48-geometry-trials.mjs
          python3 -m py_compile scripts/p101-r15p-independent-8-original-scissor-source-veto.py
      - name: True original native 0-24 reference + real B16 extended physics + original R15N2 steering
        run: |
          mkdir -p test-results/r15p/o4 test-results/r15p/r15l test-results/r15p/n2 test-results/r15p/results
          gh run download 40830811488 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15O4_TRUE_NATIVE_SOURCE_BANKED_B48_16M_REPLAY_BEYOND24_REAL_END_HOLD \
            --dir test-results/r15p/o4
          gh run download 40802904554 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15L_TRUE_NATIVE_ALL_PLAYABLE_TIME_CX18_B48_7_TWO_ROAD_B51_WIDE_RESEARCH_NO_ART \
            --dir test-results/r15p/r15l
          gh run download 40815591798 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15N2_ORIGINAL_REAL_240HZ_24_EARLIER_STEERING_CURVE_CONTACT_STUDY_HOLD \
            --dir test-results/r15p/n2
      - name: Actual real rideable B48 CROWN B16 plus SCISSOR v0 original seamless 8/16/24m ramp, 8 original 240Hz P96 source trials
        run: |
          node scripts/p101-r15p-eight-genuine-b48-scissor-physics-replays.mjs \
            --true-pinch test-results/r15p/r15l/native/true-pinch.json \
            --pinch-switch test-results/r15p/r15l/native/pinch-switch.json \
            --r15n2 test-results/r15p/n2/R15N2_24_GENUINE_ORIGINAL_NATIVE_B48_EARLIER_RIGHT_INPUT_TRIALS.json \
            --r15o4 test-results/r15p/o4/R15O4_ACTUAL_NATIVE_B16_REAL_PHYSICAL_ROAD_SOURCE_EXTENDED_TO_36.json \
            --out test-results/r15p/results
      - name: Independently source original B16 baseline 36s trace parity, 8 native real B48 physics runs and fake-art/game vetoes
        run: |
          python3 scripts/p101-r15p-independent-8-original-scissor-source-veto.py \
            --result test-results/r15p/results/R15P_8_ORIGINAL_240HZ_SCISSOR_REAL_PHYSICAL_ENTRY_VARIANTS.json \
            --old test-results/r15p/o4/R15O4_ACTUAL_NATIVE_B16_REAL_PHYSICAL_ROAD_SOURCE_EXTENDED_TO_36.json \
            --out test-results/r15p/results
          python3 - <<'PY'
          import json
          p="test-results/r15p/results/"
          d=json.load(open(p+"R15P_INDEPENDENT_REAL_SCISSOR_B48_NATIVE_8_TRIALS_QA.json"))
          assert len(d["forgedGameplayRoadSafetyAndArtClaimsRejected"])==10
          assert sum(map(len,d["eightActualNewPhysicalOriginalSourceRoadTrials"].values()))==8
          assert d["originalGameSourceUnchanged"]
          assert d["officialArt"]==d["officialSlope2Meters"]==0
          print("R15P_REAL_8_NATIVE_SOURCE_SCISSOR_RISE_RIDEABLE_ONLY_ART_HOLD",d,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15P_REAL_NATIVE_B48_8_SCISSOR_CONNECTED_RAMP_SOURCE_GAMEPLAY_HOLD
          path: test-results/r15p/results/
          retention-days: 7
          if-no-files-found: warn
