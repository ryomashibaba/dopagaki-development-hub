name: P101 R15S2A source P96 desired steering offset vs genuine narrow 16m B48 road HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s2a-narrow-p96-desired-offset-source-audit.mjs
      - .github/workflows/p101-r15s2a-native-narrow-p96-steering-static-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15s2a-p96-wide-road-desired-lane-versus-source-real-narrow-road:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard original protected game and source script syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s2a-narrow-p96-desired-offset-source-audit.mjs
      - name: Independently generated original actual B48 wide-versus-16m source width cross section and P96 input target
        run: |
          mkdir -p test-results/r15s2a
          node scripts/p101-r15s2a-narrow-p96-desired-offset-source-audit.mjs --out test-results/r15s2a
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const a=JSON.parse(fs.readFileSync('test-results/r15s2a/R15S2A_SOURCE_16M_P96_DESIRED_STEERING_WIDTH_COMPATIBILITY.json'));
          assert.equal(a.originalGameBlob,'af076d67492a677d2235e4730aef8cdf4808e106');
          assert.equal(a.genuineFull240HzRunsInThisAudit,0);
          assert.equal(a.humanFairnessMeasured,false);
          assert.equal(a.officialArt,0);
          assert.equal(a.officialSlope2Meters,0);
          assert.equal(a.GAMEPLAY,'HOLD');
          assert.deepEqual(Object.keys(a.worlds),['true-pinch','pinch-switch']);
          for(const w of Object.values(a.worlds)){
            assert.equal(w.sourceB51Count,28);
            assert.equal(w.sourceB48Count,7);
            assert.equal(w.profiles.length,4);
            assert(w.profiles.every(p=>p.rawRequestedOffsetExceedsApproximateRoadEdge));
            assert(w.narrowedSCISSOREarlySampleMinimumXZWidth.widthM<=20);
          }
          console.log('R15S2A_SOURCE_INPUT_WIDTH_CONFLICT_IN_TWO_WORLDS_STATIC_ONLY');
          JS
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S2A_ORIGINAL_NARROW_B48_VS_P96_LATERAL_DESIRED_OFFSET_STATIC_ONLY_HOLD
          path: test-results/r15s2a/
          retention-days: 7
          if-no-files-found: warn
