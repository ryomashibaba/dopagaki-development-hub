name: P101 R15S3B 240Hz frozen B16 CROWN three trajectory-informed SCISSOR roads x 2 worlds x 2 legal inputs HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3b-isolated-source-trail-aware-scissor-macro-candidates.mjs
      - scripts/p101-r15s3b-twelve-native-trace-aligned-scissor-replays.mjs
      - scripts/p101-r15s3b-independent-source-scissor-native-veto.py
      - .github/workflows/p101-r15s3b-source-trail-aware-scissor-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15s3b-genuine-240hz-3-macro-two-road-x-2-worlds-x-2-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected original game blob and isolated-source syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3b-isolated-source-trail-aware-scissor-macro-candidates.mjs
          node --check scripts/p101-r15s3b-twelve-native-trace-aligned-scissor-replays.mjs
          python3 -m py_compile scripts/p101-r15s3b-independent-source-scissor-native-veto.py
      - name: Download original R15Q 8 saved genuine source trials for exact frozen CROWN path parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results/r15s3b/reference
          gh run download 40833907561 --repo ryomashibaba/dopagaki-development-hub             --name P101_R15Q_TRUE_ORIGINAL_B48_C1_CURVATURE_NARROW16_8_NATIVE_240HZ_SOURCE_HOLD             --dir test-results/r15s3b/reference
          test -s test-results/r15s3b/reference/R15Q_8_GENUINE_SOURCE_240HZ_C1_CURVE_AND_NARROW_ACTUAL_ROAD_TRIALS.json
      - name: Generate three source SCISSOR geometry proposals preserving entire B16 CROWN and true 240Hz 12 trials
        run: |
          mkdir -p test-results/r15s3b/actual
          node scripts/p101-r15s3b-twelve-native-trace-aligned-scissor-replays.mjs \
            --r15q test-results/r15s3b/reference/R15Q_8_GENUINE_SOURCE_240HZ_C1_CURVE_AND_NARROW_ACTUAL_ROAD_TRIALS.json \
            --out test-results/r15s3b/actual
      - name: Independent QA of true 12 Native conditions, real road changes, B51, no false art/game/human adoption
        run: |
          python3 scripts/p101-r15s3b-independent-source-scissor-native-veto.py \
            --native test-results/r15s3b/actual/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json \
            --out test-results/r15s3b/actual
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3B_12_NATIVE_240HZ_FROZEN_CROWN_TRAIL_AWARE_SCISSOR_MACRO_NO_ART_HOLD
          path: test-results/r15s3b/actual/
          retention-days: 7
          if-no-files-found: warn
