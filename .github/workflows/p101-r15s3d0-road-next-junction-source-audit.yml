name: P101 R15S3D0 original banked SCISSOR road and next-road geometry vs real 240Hz trail investigation HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d0-source-geometry-signed-trail-audit.mjs
      - .github/workflows/p101-r15s3d0-road-next-junction-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-road-next-junction-readonly-source-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected source and diagnostic syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d0-source-geometry-signed-trail-audit.mjs
      - name: Fetch R15S3B genuine saved original 240Hz trial reference
        run: |
          mkdir -p test-results/r15s3d0/ref test-results/r15s3d0/out
          gh run download 40866341059 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3B_12_NATIVE_240HZ_FROZEN_CROWN_TRAIL_AWARE_SCISSOR_MACRO_NO_ART_HOLD \
            --dir test-results/r15s3d0/ref
          test -s test-results/r15s3d0/ref/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json
      - name: Analyze physical SCISSOR/next B48 true centerline and source original saved motion only
        run: |
          node scripts/p101-r15s3d0-source-geometry-signed-trail-audit.mjs \
            --source test-results/r15s3d0/ref/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json \
            --out test-results/r15s3d0/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D0_SOURCE_SCISSOR_NEXT_ROAD_TRAJECTORY_GEOMETRY_NO_CERTIFICATION
          path: test-results/r15s3d0/out/
          retention-days: 7
          if-no-files-found: warn
