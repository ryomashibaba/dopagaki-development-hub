name: P101 R15S3D10 actual original game PRIVATE WebGL2 screenshots + native HUD HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d10-private-real-webgl-pack.mjs
      - scripts/p101-r15s3d10-real-webgl-playwright-capture.mjs
      - .github/workflows/p101-r15s3d10-actual-game-private-webgl2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-original-webgl2-drive3d-renderer-original-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify untouched original production source and syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node --check scripts/p101-r15s3d10-real-webgl-playwright-capture.mjs
      - name: Build original PRIVATE game, never publish
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
      - name: Attach R15S3D9 winning true B48 into PRIVATE copy of actual game renderer only
        run: |
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node --check dist-private/r15s3d10/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          ! grep -q 'r15s3d10OptIn' dist-private/drive3d/drive3d.mjs
          grep -q 'r15s3d10OptIn' dist-private/r15s3d10/drive3d.mjs
      - name: Use genuine headless Chromium WebGL2 backend
        run: |
          npx playwright install --only-shell chromium
      - name: Two worlds original drive3d source renderer with original HUD/camera and 240Hz scripted evidence
        run: |
          node scripts/p101-r15s3d10-real-webgl-playwright-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D10_ACTUAL_SOURCE_GAME_PRIVATE_WEBGL2_CAMERA_HUD_FRAMES_HOLD
          path: test-results/r15s3d10-real-webgl/
          retention-days: 7
          if-no-files-found: warn
