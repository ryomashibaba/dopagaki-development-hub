name: P101 R15S3D10 genuine original 28 B51 time-space and camera approximation HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d10-b51-actual-source-trajectory-approach-audit.mjs
      - .github/workflows/p101-r15s3d10-real-b51-native-approach.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-28-moving-body-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect source and audit syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d10-b51-actual-source-trajectory-approach-audit.mjs
      - name: Obtain actual archived source 240Hz native finish traces
        run: |
          mkdir -p test-results/r15s3d10-b51/source test-results/r15s3d10-b51/out
          gh run download 40989026403 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3D9_FOUR_ORIGINAL_REAL_ROAD5_ROAD6_95S_240HZ_SOURCE_HOLD \
            --dir test-results/r15s3d10-b51/source
          test -s test-results/r15s3d10-b51/source/R15S3D9_FOUR_95S_GENUINE_NATIVE_ROAD5_ROAD6.json
      - name: Original 28 B51 actual time phase, closest separation and camera projected approach
        run: |
          node scripts/p101-r15s3d10-b51-actual-source-trajectory-approach-audit.mjs \
            --source test-results/r15s3d10-b51/source/R15S3D9_FOUR_95S_GENUINE_NATIVE_ROAD5_ROAD6.json \
            --out test-results/r15s3d10-b51/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D10_REAL_28_B51_NATIVE_FINISH_RELATIVE_CAM_APPROACH_HOLD
          path: test-results/r15s3d10-b51/out/
          retention-days: 7
          if-no-files-found: warn
