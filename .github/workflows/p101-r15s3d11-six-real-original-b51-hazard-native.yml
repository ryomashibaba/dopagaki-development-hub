name: P101 R15S3D11 six genuine B51 narrow-course hazard candidate original native 4x240Hz
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d11-six-real-b51-lane-reanchor-candidates.mjs
      - scripts/p101-r15s3d11-native-four-240hz-real-six-hazards.mjs
      - scripts/p101-r15s3d11-independent-original-b51-native-gate.py
      - .github/workflows/p101-r15s3d11-six-real-original-b51-hazard-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-genuine-b51-original-runner-four-world-modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original game source and check all new candidate programs
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d11-six-real-b51-lane-reanchor-candidates.mjs
          node --check scripts/p101-r15s3d11-native-four-240hz-real-six-hazards.mjs
          python3 -m py_compile scripts/p101-r15s3d11-independent-original-b51-native-gate.py
      - name: Download original genuine CROWN prefix and true R15S3D9 2-world finish
        run: |
          mkdir -p test-results/r15s3d11/b16 test-results/r15s3d11/d9 test-results/r15s3d11/out
          gh run download 40866341059 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3B_12_NATIVE_240HZ_FROZEN_CROWN_TRAIL_AWARE_SCISSOR_MACRO_NO_ART_HOLD \
            --dir test-results/r15s3d11/b16
          gh run download 40989026403 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3D9_FOUR_ORIGINAL_REAL_ROAD5_ROAD6_95S_240HZ_SOURCE_HOLD \
            --dir test-results/r15s3d11/d9
          test -s test-results/r15s3d11/b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json
          test -s test-results/r15s3d11/d9/R15S3D9_FOUR_95S_GENUINE_NATIVE_ROAD5_ROAD6.json
      - name: Four actual original 240Hz from spawn 0 with two six-B51 placements
        run: |
          node scripts/p101-r15s3d11-native-four-240hz-real-six-hazards.mjs \
            --b16 test-results/r15s3d11/b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json \
            --d9 test-results/r15s3d11/d9/R15S3D9_FOUR_95S_GENUINE_NATIVE_ROAD5_ROAD6.json \
            --out test-results/r15s3d11/out
      - name: Independent no-fabricated native finish, CROWN and hazard test gate
        run: |
          python3 scripts/p101-r15s3d11-independent-original-b51-native-gate.py \
            --source test-results/r15s3d11/out/R15S3D11_FOUR_GENUINE_240HZ_B51_ALTERNATIVES.json \
            --out test-results/r15s3d11/out
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D11_FOUR_REAL_ORIGINAL_240HZ_SIX_B51_HAZARD_VARIANT_HOLD
          path: test-results/r15s3d11/out/
          retention-days: 7
          if-no-files-found: warn
