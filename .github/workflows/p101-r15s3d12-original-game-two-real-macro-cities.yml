name: P101 R15S3D12 source real WebGL2 2 competing urban cities 5 original native camera trials
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d12-two-real-camera-urban-macro-scenes.mjs
      - scripts/p101-r15s3d12-private-original-webgl-art-comparison-pack.mjs
      - scripts/p101-r15s3d12-original-webgl2-art-same-source-tick-capture.mjs
      - tests/p101-r15s3d12-real-urban-macro-geometry.test.mjs
      - .github/workflows/p101-r15s3d12-original-game-two-real-macro-cities.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-original-renderer-cities-on-same-native-tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and three-dimensional architecture geometry test
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d12-two-real-camera-urban-macro-scenes.mjs
          node --check scripts/p101-r15s3d12-private-original-webgl-art-comparison-pack.mjs
          node --check scripts/p101-r15s3d12-original-webgl2-art-same-source-tick-capture.mjs
          node --test tests/p101-r15s3d12-real-urban-macro-geometry.test.mjs
      - name: Original private source renderer and real B48/B51 physical stages, no public build
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-r15s3d11-private-genuine-webgl-hazard-pack.mjs
          node scripts/p101-r15s3d12-private-original-webgl-art-comparison-pack.mjs
          node --check dist-private/r15s3d12/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          ! grep -q 'r15s3d12ArtMesh' dist-private/drive3d/drive3d.mjs
          ! grep -q 'r15s3d12ArtMesh' dist-private/r15s3d11/drive3d.mjs
      - name: Genuine source-original WebGL2 GPU and Japanese font
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
          fc-list :lang=ja family | grep -q .
      - name: Compare 2 cities x 2 worlds vs unmodified original city, real same native tick and raw source camera
        run: |
          node scripts/p101-r15s3d12-original-webgl2-art-same-source-tick-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D12_FIVE_ACTUAL_REAL_WEBGL2_NATIVE_CAMERA_CITY_SCENES_ART_HOLD
          path: test-results/r15s3d12-real-webgl2/
          retention-days: 7
          if-no-files-found: warn
