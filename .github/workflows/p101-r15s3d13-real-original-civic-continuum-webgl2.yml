name: P101 R15S3D13 real continuous civic spine 7 original WebGL2 camera cases & tamper QA
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d13-real-continuous-civic-spine-3d.mjs
      - scripts/p101-r15s3d13-private-real-continuous-city-webgl2-pack.mjs
      - scripts/p101-r15s3d13-original-webgl2-seven-sessions-native-tick.mjs
      - scripts/p101-r15s3d13-independent-seven-native-screenshots-gate.py
      - tests/p101-r15s3d13-true-continuous-city-geometry.test.mjs
      - .github/workflows/p101-r15s3d13-real-original-civic-continuum-webgl2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-240hz-camera-real-webgl2-two-integrated-civic-hypotheses:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected source, real nonphysical megacity and original stage integrity tests
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d13-real-continuous-civic-spine-3d.mjs
          node --check scripts/p101-r15s3d13-private-real-continuous-city-webgl2-pack.mjs
          node --check scripts/p101-r15s3d13-original-webgl2-seven-sessions-native-tick.mjs
          python3 -m py_compile scripts/p101-r15s3d13-independent-seven-native-screenshots-gate.py
          node --test tests/p101-r15s3d13-true-continuous-city-geometry.test.mjs
      - name: Build source genuine PRIVATE game + D10 + D11 edge-hazard + prior D12 ART HOLD and D13 new candidates
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-r15s3d11-private-genuine-webgl-hazard-pack.mjs
          node scripts/p101-r15s3d12-private-original-webgl-art-comparison-pack.mjs
          node scripts/p101-r15s3d13-private-real-continuous-city-webgl2-pack.mjs
          node --check dist-private/r15s3d13/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          ! grep -q 'r15s3d13ArtMesh' dist-private/drive3d/drive3d.mjs
          ! grep -q 'r15s3d13ArtMesh' dist-private/r15s3d12/drive3d.mjs
          ! grep -q 'r15s3d13ArtMesh' dist-private/r15s3d11/drive3d.mjs
      - name: Genuine Chromium WebGL2 source shader/software GPU and Japanese fonts
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
          fc-list :lang=ja family | grep -q .
      - name: 7 real raw source camera physics-frozen screenshots, including D12 baseline x2 and D13 x4
        run: |
          node scripts/p101-r15s3d13-original-webgl2-seven-sessions-native-tick.mjs
      - name: Independent original native tick, image differences, original finish 4/4 and 10 false-claim rejections
        run: |
          python3 scripts/p101-r15s3d13-independent-seven-native-screenshots-gate.py \
            test-results/r15s3d13-real-webgl2/R15S3D13_REAL_WEBGL2_FIXED_NATIVE_TICK_CITY_VERSIONS.json \
            test-results/r15s3d13-real-webgl2
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D13_SEVEN_REAL_SOURCE_WEBGL2_NATIVE_CAMERA_CONTINUOUS_CITY_ART_HOLD
          path: test-results/r15s3d13-real-webgl2/
          retention-days: 7
          if-no-files-found: warn
