name: P101 R15S3D14 genuine source WebGL2 three hollow monumental landmarks vs R1 art baseline
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d14-monumental-inhabited-hollow-crescents.mjs
      - scripts/p101-r15s3d14-private-original-webgl-crescent-city-pack.mjs
      - scripts/p101-r15s3d14-original-webgl2-six-sessions.mjs
      - scripts/p101-r15s3d14-independent-six-real-webgl2-veto.py
      - tests/p101-r15s3d14-real-monumental-city.test.mjs
      - .github/workflows/p101-r15s3d14-genuine-original-webgl2-iconic-megacity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-original-source-240hz-3-iconic-cities-two-worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source game B48 B51 immutable, actual enormous hollow 3D city static QA
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d14-monumental-inhabited-hollow-crescents.mjs
          node --check scripts/p101-r15s3d14-private-original-webgl-crescent-city-pack.mjs
          node --check scripts/p101-r15s3d14-original-webgl2-six-sessions.mjs
          python3 -m py_compile scripts/p101-r15s3d14-independent-six-real-webgl2-veto.py
          node --test tests/p101-r15s3d14-real-monumental-city.test.mjs
      - name: Build ORIGINAL private game and frozen D10/D11/R1 before separately building two new real city candidates
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-r15s3d11-private-genuine-webgl-hazard-pack.mjs
          node scripts/p101-r15s3d13r1-private-open-sky-real-webgl2-pack.mjs
          node scripts/p101-r15s3d14-private-original-webgl-crescent-city-pack.mjs
          node --check dist-private/r15s3d14/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          ! grep -q 'r15s3d14ArtMesh' dist-private/drive3d/drive3d.mjs
          ! grep -q 'r15s3d14ArtMesh' dist-private/r15s3d13r1/drive3d.mjs
      - name: Real Chromium headless GPU original WebGL2 with Japanese fonts
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
          fc-list :lang=ja family | grep -q .
      - name: Two original world timelines x previous R1 + two new 3D city candidates, same 240Hz source ticks
        run: |
          node scripts/p101-r15s3d14-original-webgl2-six-sessions.mjs
      - name: Independent source 6-run finish/true WebGL2 camera and 10 false-evidence vetoes
        run: |
          python3 scripts/p101-r15s3d14-independent-six-real-webgl2-veto.py \
            test-results/r15s3d14-real-webgl2/R15S3D14_REAL_WEBGL2_FIXED_NATIVE_TICK_CITY_VERSIONS.json \
            test-results/r15s3d14-real-webgl2
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D14_6_TRUE_SOURCE_WEBGL2_THREE_INHABITED_MONUMENTS_ART_HOLD
          path: test-results/r15s3d14-real-webgl2/
          retention-days: 7
          if-no-files-found: warn
