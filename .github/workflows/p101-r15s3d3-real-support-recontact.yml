name: P101 R15S3D3 real B48 westward recontact 4 native 240Hz source trials HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d3-physical-westward-recontact-candidates.mjs
      - scripts/p101-r15s3d3-four-real-240hz-speed-joined-road-trials.mjs
      - scripts/p101-r15s3d3-independent-source-qa.py
      - .github/workflows/p101-r15s3d3-real-support-recontact.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15s3d3-source-native-4:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native original game integrity and syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d3-physical-westward-recontact-candidates.mjs
          node --check scripts/p101-r15s3d3-four-real-240hz-speed-joined-road-trials.mjs
          python3 -m py_compile scripts/p101-r15s3d3-independent-source-qa.py
      - name: Obtain true saved early native trajectory for B16 prefix regression
        run: |
          mkdir -p test-results/r15s3d3/ref test-results/r15s3d3/out
          gh run download 40866341059 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3B_12_NATIVE_240HZ_FROZEN_CROWN_TRAIL_AWARE_SCISSOR_MACRO_NO_ART_HOLD \
            --dir test-results/r15s3d3/ref
          test -s test-results/r15s3d3/ref/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json
      - name: Genuine 0-start source Runner 240Hz 4 real physical road trials
        run: |
          node scripts/p101-r15s3d3-four-real-240hz-speed-joined-road-trials.mjs \
            --r15s3b test-results/r15s3d3/ref/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json \
            --out test-results/r15s3d3/out
      - name: Independent forgery rejection and original source integrity
        run: |
          python3 scripts/p101-r15s3d3-independent-source-qa.py \
            --source test-results/r15s3d3/out/R15S3D3_4_REAL_240HZ_SUPPORT_RECONTACT_TRIALS.json \
            --out test-results/r15s3d3/out
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D3_4_NATIVE_REAL_B48_SUPPORT_RECONTACT_HOLD
          path: test-results/r15s3d3/out/
          retention-days: 7
          if-no-files-found: warn
