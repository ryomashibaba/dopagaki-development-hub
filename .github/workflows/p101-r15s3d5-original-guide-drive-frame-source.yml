name: P101 R15S3D5 original 240Hz drive frame and guide forensic HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d5-original-drive-frame-and-guide-replay.mjs
      - scripts/p101-r15s3d5-independent-original-guidance-honesty-qa.py
      - .github/workflows/p101-r15s3d5-original-guide-drive-frame-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r15s3d5-original-native-guide-and-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original game and syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d5-original-drive-frame-and-guide-replay.mjs
          python3 -m py_compile scripts/p101-r15s3d5-independent-original-guidance-honesty-qa.py
      - name: Retrieve frozen genuine B16 prefix and R15S3D4 all-tick forensic source
        run: |
          mkdir -p test-results/r15s3d5/reference-b16 test-results/r15s3d5/reference-d4 test-results/r15s3d5/output
          gh run download 40866341059 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3B_12_NATIVE_240HZ_FROZEN_CROWN_TRAIL_AWARE_SCISSOR_MACRO_NO_ART_HOLD \
            --dir test-results/r15s3d5/reference-b16
          gh run download 40900490016 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3D4_ORIGINAL_FOUR_NATIVE_CONTACT_VELOCITY_FORENSIC_HOLD \
            --dir test-results/r15s3d5/reference-d4
          test -s test-results/r15s3d5/reference-b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json
          test -s test-results/r15s3d5/reference-d4/R15S3D4_ORIGINAL_FOUR_CASE_SUPPORT_AND_VELOCITY_FORENSIC.json
      - name: Replay four original 240Hz cases with exact input and observational drive frame
        run: |
          node scripts/p101-r15s3d5-original-drive-frame-and-guide-replay.mjs \
            --r15s3b test-results/r15s3d5/reference-b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json \
            --r15s3d4 test-results/r15s3d5/reference-d4/R15S3D4_ORIGINAL_FOUR_CASE_SUPPORT_AND_VELOCITY_FORENSIC.json \
            --out test-results/r15s3d5/output
      - name: Independent numeric consistency and fake-certification rejection
        run: |
          python3 scripts/p101-r15s3d5-independent-original-guidance-honesty-qa.py \
            --source test-results/r15s3d5/reference-d4/R15S3D4_ORIGINAL_FOUR_CASE_SUPPORT_AND_VELOCITY_FORENSIC.json \
            --analysis test-results/r15s3d5/output/R15S3D5_FOUR_CASE_ORIGINAL_GUIDANCE_DRIVE_FRAME.json \
            --out test-results/r15s3d5/output
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D5_ORIGINAL_NATIVE_DRIVE_FRAME_GUIDE_FOUR_CASE_HOLD
          path: test-results/r15s3d5/output/
          retention-days: 7
          if-no-files-found: warn
