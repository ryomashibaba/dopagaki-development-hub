name: P101 R15S3D8 two macro B48 physical roads 4 original 240Hz cases HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d8-genuine-two-road-macro-alignments.mjs
      - scripts/p101-r15s3d8-original-four-macro-native-240hz.mjs
      - scripts/p101-r15s3d8-independent-four-case-macro-gate.py
      - .github/workflows/p101-r15s3d8-two-real-b48-macro-four-original-240hz.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-r15s3d8-two-macro-alignments-four-native-240hz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original source SHA and all trial scripts
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d8-genuine-two-road-macro-alignments.mjs
          node --check scripts/p101-r15s3d8-original-four-macro-native-240hz.mjs
          python3 -m py_compile scripts/p101-r15s3d8-independent-four-case-macro-gate.py
      - name: Retrieve genuine archived B16 and R15S3D6R1 whole-native comparisons
        run: |
          mkdir -p test-results/r15s3d8/ref-b16 test-results/r15s3d8/ref-r1 test-results/r15s3d8/output
          gh run download 40866341059 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3B_12_NATIVE_240HZ_FROZEN_CROWN_TRAIL_AWARE_SCISSOR_MACRO_NO_ART_HOLD \
            --dir test-results/r15s3d8/ref-b16
          gh run download 40958849153 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3D6R1_TWO_REAL_ORIGINAL_B48_RUNOUT_NATIVE_SOURCE_HOLD \
            --dir test-results/r15s3d8/ref-r1
          test -s test-results/r15s3d8/ref-b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json
          test -s test-results/r15s3d8/ref-r1/R15S3D6R1_TWO_GENUINE_NATIVE_B48_DOWNSTREAM_RUNOUT.json
      - name: Four genuine Runner 240Hz original-physics runs and physical B48 macro geometry
        run: |
          node scripts/p101-r15s3d8-original-four-macro-native-240hz.mjs \
            --b16 test-results/r15s3d8/ref-b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json \
            --r1 test-results/r15s3d8/ref-r1/R15S3D6R1_TWO_GENUINE_NATIVE_B48_DOWNSTREAM_RUNOUT.json \
            --out test-results/r15s3d8/output
      - name: Independent source integrity and 12 forged claim veto tests
        run: |
          python3 scripts/p101-r15s3d8-independent-four-case-macro-gate.py \
            --source test-results/r15s3d8/output/R15S3D8_TWO_ROAD_MACRO_FOUR_GENUINE_240HZ.json \
            --out test-results/r15s3d8/output
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D8_TWO_REAL_B48_MACRO_FOUR_ORIGINAL_240HZ_HOLD
          path: test-results/r15s3d8/output/
          retention-days: 7
          if-no-files-found: warn
