name: P101 R15S3D9 real B48 road5 road6 four ORIGINAL 95s 240Hz native HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d9-four-native-95s-two-real-downstream-macro.mjs
      - scripts/p101-r15s3d9-independent-95s-four-physical-road-support-veto.py
      - .github/workflows/p101-r15s3d9-four-original-95s-native-road5-road6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-seven-source-real-downstream-95s-four:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard original real source, native physics unchanged, source syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d9-four-native-95s-two-real-downstream-macro.mjs
          python3 -m py_compile scripts/p101-r15s3d9-independent-95s-four-physical-road-support-veto.py
      - name: Retrieve original frozen CROWN, R15S3D8R1 genuine 65s and R15S3D9 true 4-case static geometries
        run: |
          mkdir -p test-results/r15s3d9-native/b16 test-results/r15s3d9-native/d8r1 test-results/r15s3d9-native/static test-results/r15s3d9-native/out
          gh run download 40866341059 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3B_12_NATIVE_240HZ_FROZEN_CROWN_TRAIL_AWARE_SCISSOR_MACRO_NO_ART_HOLD \
            --dir test-results/r15s3d9-native/b16
          gh run download 40975463767 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3D8R1_ROAD4_CONTINUOUS_NORMAL_TWO_NATIVE_65S_SOURCE_HOLD \
            --dir test-results/r15s3d9-native/d8r1
          gh run download 40988252405 --repo ryomashibaba/dopagaki-development-hub \
            --name P101_R15S3D9_FOUR_REAL_B48_PAIR_GEOMETRY_STATIC_GATE_HOLD \
            --dir test-results/r15s3d9-native/static
          test -s test-results/r15s3d9-native/b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json
          test -s test-results/r15s3d9-native/d8r1/R15S3D8R1_TWO_SOURCE_NATIVE_65S_REAL_ROAD4.json
          test -s test-results/r15s3d9-native/static/R15S3D9_FOUR_REAL_B48_STATIC_GEOMETRY_GATE.json
      - name: Run 2 distinct real road5 road6 geometries across 2 original native 240Hz worlds 95s cap
        run: |
          node scripts/p101-r15s3d9-four-native-95s-two-real-downstream-macro.mjs \
            --b16 test-results/r15s3d9-native/b16/R15S3B_12_REAL_240HZ_SOURCE_TRAIL_AWARE_SCISSOR_RUNS.json \
            --r1 test-results/r15s3d9-native/d8r1/R15S3D8R1_TWO_SOURCE_NATIVE_65S_REAL_ROAD4.json \
            --static test-results/r15s3d9-native/static/R15S3D9_FOUR_REAL_B48_STATIC_GEOMETRY_GATE.json \
            --out test-results/r15s3d9-native/out
      - name: Independent source honesty with falsified 12-claim veto and source checksum
        run: |
          python3 scripts/p101-r15s3d9-independent-95s-four-physical-road-support-veto.py \
            --source test-results/r15s3d9-native/out/R15S3D9_FOUR_95S_GENUINE_NATIVE_ROAD5_ROAD6.json \
            --out test-results/r15s3d9-native/out
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D9_FOUR_ORIGINAL_REAL_ROAD5_ROAD6_95S_240HZ_SOURCE_HOLD
          path: test-results/r15s3d9-native/out/
          retention-days: 7
          if-no-files-found: warn
