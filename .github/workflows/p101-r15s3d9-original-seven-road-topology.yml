name: P101 R15S3D9 original B48x7 B51x28 downstream spatial topology AUDIT HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r15s3d9-downstream-seven-real-b48-topology-audit.mjs
      - .github/workflows/p101-r15s3d9-original-seven-road-topology.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-real-seven-road-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original game and inspect Node syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r15s3d9-downstream-seven-real-b48-topology-audit.mjs
      - name: Seven true physical roads source coordinates / seam / normals x both worlds
        run: |
          node scripts/p101-r15s3d9-downstream-seven-real-b48-topology-audit.mjs --out test-results/r15s3d9/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R15S3D9_ORIGINAL_SEVEN_REAL_B48_TWO_WORLD_TOPOLOGY_HOLD
          path: test-results/r15s3d9/
          retention-days: 7
          if-no-files-found: warn
