name: P101 R18P3 source-native original 240Hz single-landmark city and four quarters
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r18p3-single-landmark-city-architecture.mjs
      - scripts/p101-r18p3-private-original-webgl2-city-pack.mjs
      - scripts/p101-r18p3-six-real-original-webgl2-runs.mjs
      - scripts/p101-r18p3-independent-real-webgl2-source-gate.py
      - tests/p101-r18p3-single-landmark-source-geometry.test.mjs
      - .github/workflows/p101-r18p3-original-webgl2-single-landmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-single-landmark-city-source-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected original source SHA and giant anchored city actual geometry, noncollision test
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r18p3-single-landmark-city-architecture.mjs
          node --check scripts/p101-r18p3-private-original-webgl2-city-pack.mjs
          node --check scripts/p101-r18p3-six-real-original-webgl2-runs.mjs
          python3 -m py_compile scripts/p101-r18p3-independent-real-webgl2-source-gate.py
          node --test tests/p101-r18p3-single-landmark-source-geometry.test.mjs
      - name: Build untouched original D10 D11 D15R1 and two single-landmark private source city proposals
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-r15s3d11-private-genuine-webgl-hazard-pack.mjs
          node scripts/p101-r15s3d15r1-private-true-webgl2-city-pack.mjs
          node scripts/p101-r18p3-private-original-webgl2-city-pack.mjs
          node --check dist-private/r18p3/drive3d.mjs
          ! grep -q 'r18p3ArtMesh' dist-private/drive3d/drive3d.mjs
          ! grep -q 'r18p3ArtMesh' dist-private/r15s3d15r1/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Original Chromium WebGL2 GPU and Japanese fonts
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
          fc-list :lang=ja family | grep -q .
      - name: Capture two worlds and same original 240Hz RAW camera with alternative single-landmark cities
        run: |
          node scripts/p101-r18p3-six-real-original-webgl2-runs.mjs
      - name: Independent exact native camera/physical finish and 10 forged-result rejections
        run: |
          python3 scripts/p101-r18p3-independent-real-webgl2-source-gate.py \
            test-results/r18p3-real-webgl2/R18P3_REAL_WEBGL2_FIXED_NATIVE_TICK_CITY_VERSIONS.json \
            test-results/r18p3-real-webgl2
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R18P3_ORIGINAL_WEBGL2_SINGLE_CIVIC_HEART_TWO_STUDIES_ART_HOLD
          path: test-results/r18p3-real-webgl2/
          retention-days: 7
          if-no-files-found: warn
