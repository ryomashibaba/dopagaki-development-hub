name: P101 R18P4 original 240Hz source grounded city and full temporal urban fabric
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r18p4-original-road-grounded-urban-fabric.mjs
      - scripts/p101-r18p4-private-grounded-original-webgl2-pack.mjs
      - scripts/p101-r18p4-six-real-source-webgl2-runs.mjs
      - scripts/p101-r18p4-original-webgl2-independent-art-gate.py
      - tests/p101-r18p4-road-anchored-3d-original-source.test.mjs
      - .github/workflows/p101-r18p4-original-source-grounded-city.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-road-grounded-city-source-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protected original source SHA and giant anchored city actual geometry, noncollision test
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r18p4-original-road-grounded-urban-fabric.mjs
          node --check scripts/p101-r18p4-private-grounded-original-webgl2-pack.mjs
          node --check scripts/p101-r18p4-six-real-source-webgl2-runs.mjs
          python3 -m py_compile scripts/p101-r18p4-original-webgl2-independent-art-gate.py
          node --test tests/p101-r18p4-road-anchored-3d-original-source.test.mjs
      - name: Build untouched D10 D11 D15R1 + two nonfloating ground-linked original-source urban fabrics
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r15s3d10-private-real-webgl-pack.mjs
          node scripts/p101-r15s3d11-private-genuine-webgl-hazard-pack.mjs
          node scripts/p101-r15s3d15r1-private-true-webgl2-city-pack.mjs
          node scripts/p101-r18p4-private-grounded-original-webgl2-pack.mjs
          node --check dist-private/r18p4/drive3d.mjs
          ! grep -q 'r18p4ArtMesh' dist-private/drive3d/drive3d.mjs
          ! grep -q 'r18p4ArtMesh' dist-private/r15s3d15r1/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Original Chromium WebGL2 GPU and Japanese fonts
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
          fc-list :lang=ja family | grep -q .
      - name: Capture original two native 240Hz source worlds x reference / two grounded road-facing cities
        run: |
          node scripts/p101-r18p4-six-real-source-webgl2-runs.mjs
      - name: Independent exact native camera/physical finish and 10 forged-result rejections
        run: |
          python3 scripts/p101-r18p4-original-webgl2-independent-art-gate.py \
            test-results/r18p4-real-webgl2/R18P4_REAL_WEBGL2_FIXED_NATIVE_TICK_CITY_VERSIONS.json \
            test-results/r18p4-real-webgl2
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P101_R18P4_TRUE_ORIGINAL_WEBGL2_ROAD_GROUNDED_CITY_TWO_DESIGNS_ART_HOLD
          path: test-results/r18p4-real-webgl2/
          retention-days: 7
          if-no-files-found: warn
