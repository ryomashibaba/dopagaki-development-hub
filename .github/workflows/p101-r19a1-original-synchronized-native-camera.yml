name: R19 A1 real original WebGL2 camera synchronized with first 12 seconds native
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r19a1-private-original-native-camera-pack.mjs
      - scripts/p101-r19a1-six-true-native-matched-camera-frames.mjs
      - scripts/p101-r19a1-independent-24-native-frame-gate.mjs
      - .github/workflows/p101-r19a1-original-synchronized-native-camera.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r19a1-original-source-cameras:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Absolute original source and 7 B48/28 B51 real 240 Hz static gates
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node --check scripts/p101-r19a1-six-true-native-matched-camera-frames.mjs
          node --check scripts/p101-r19a1-independent-24-native-frame-gate.mjs
          node --test tests/p101-w9c1-physical.test.mjs tests/p101-w9c1-cue.test.mjs
      - name: Build genuine PRIVATE renderer and 12-second original source physics traces
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          test -s r19-evidence/R19_A1_NATIVE12S_SOURCE.json
          node --check dist-private/r19a1/drive3d.mjs
          ! grep -q 'r19a1OptIn' dist-private/drive3d/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Install real Chromium GPU emulation for source-native WebGL2
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
      - name: Actually drive 14m/28m original game from start00 240Hz to six matching ticks each, scenery off/on
        run: node scripts/p101-r19a1-six-true-native-matched-camera-frames.mjs
      - name: Independent PNG bytes hash, exact source physical 240Hz, B51 FOV-only and negative tampering
        run: |
          node scripts/p101-r19a1-independent-24-native-frame-gate.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R19_A1_TRUE_START00_NATIVE_24_WEBGL2_CAMERA_G5B_AND_B51_HOLD
          path: |
            r19-evidence/R19_A1_NATIVE12S_SOURCE.json
            r19-evidence/r19a1/
          retention-days: 7
          if-no-files-found: warn
