name: R19 A2 true 14m WebGL2 city source attribution 36 exact native frames
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r19a2-private-original-source-layer-isolation.mjs
      - scripts/p101-r19a2-nine-source-scene-native-camera-runs.mjs
      - scripts/p101-r19a2-independent-source-layers-36png-gate.mjs
      - .github/workflows/p101-r19a2-36-original-native-source-art-isolation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r19a2-source-layer-visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify untouched original and source-isolated 14m/28m physical track
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a2-private-original-source-layer-isolation.mjs
          node --check scripts/p101-r19a2-nine-source-scene-native-camera-runs.mjs
          node --check scripts/p101-r19a2-independent-source-layers-36png-gate.mjs
          node --test tests/p101-w9c1-physical.test.mjs tests/p101-w9c1-cue.test.mjs
      - name: Generate original protected PRIVATE game, R19A1 raw camera and isolated source artwork
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a2-private-original-source-layer-isolation.mjs
          test -s r19-evidence/R19_A1_NATIVE12S_SOURCE.json
          node --check dist-private/r19a2/drive3d.mjs
          ! grep -q 'r19a2Show' dist-private/drive3d/drive3d.mjs
          ! grep -q 'r19a2Show' dist-private/r19a1/drive3d.mjs
      - name: Prepare Chromium original WebGL2 and Japanese fonts
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
      - name: Capture actual 14m city source layers plus 28m control at exact native ticks
        run: node scripts/p101-r19a2-nine-source-scene-native-camera-runs.mjs
      - name: Independently verify PNG 36 hashes, same true native XYZ and original B51, reject forged success
        run: |
          node scripts/p101-r19a2-independent-source-layers-36png-gate.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R19_A2_TRUE_ORIGINAL_36_CAMERA_GEO_LAYER_SUBTRACTION_ART_HOLD
          path: |
            r19-evidence/R19_A1_NATIVE12S_SOURCE.json
            r19-evidence/r19a2/
          retention-days: 7
          if-no-files-found: warn
