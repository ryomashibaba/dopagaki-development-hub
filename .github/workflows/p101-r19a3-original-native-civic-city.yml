name: R19 A3 one source-civic city and original 14m native WebGL2 camera
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r19a3-one-integrated-civic-basilica-source.mjs
      - scripts/p101-r19a3-private-original-one-city-pack.mjs
      - scripts/p101-r19a3-four-native-source-city-sessions.mjs
      - scripts/p101-r19a3-independent-real-city-native-16png-gate.mjs
      - tests/p101-r19a3-one-civic-city-real-14m.test.mjs
      - .github/workflows/p101-r19a3-original-native-civic-city.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-game-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original source and generate real 14m 3D source candidate
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a3-one-integrated-civic-basilica-source.mjs
          node --check scripts/p101-r19a3-private-original-one-city-pack.mjs
          node --check scripts/p101-r19a3-four-native-source-city-sessions.mjs
          node --test tests/p101-r19a3-one-civic-city-real-14m.test.mjs tests/p101-w9c1-physical.test.mjs
      - name: Build real PRIVATE original game + exactly one source-based civic building
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a3-private-original-one-city-pack.mjs
          node --check dist-private/r19a3/drive3d.mjs
          test -s r19-evidence/R19_A1_NATIVE12S_SOURCE.json
          ! grep -q 'r19a3OptIn' dist-private/drive3d/drive3d.mjs
          ! grep -q 'r19a3OptIn' dist-private/r19a1/drive3d.mjs
      - name: Prepare original WebGL2 actual Chromium renderer
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
      - name: Test one new city as opposed to clean genuine road+B51, original 16 frames
        run: node scripts/p101-r19a3-four-native-source-city-sessions.mjs
      - name: Independently verify 16 SHA images, exact native XYZ, 28 B51, no fabricated art certification
        run: |
          node scripts/p101-r19a3-independent-real-city-native-16png-gate.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R19_A3_GENUINE_ONE_CIVIC_CITY_16_NATIVE_WEBGL2_PNG_ART_HOLD
          path: |
            r19-evidence/R19_A1_NATIVE12S_SOURCE.json
            r19-evidence/r19a3/
          retention-days: 7
          if-no-files-found: warn
