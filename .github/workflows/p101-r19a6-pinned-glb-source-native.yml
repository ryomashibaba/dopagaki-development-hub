name: R19 A6 P0 pinned original GLB to PRIVATE native WebGL2 (ART REJECT)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r19a6-source-glb-roundtrip.mjs
      - scripts/p101-r19a6-private-pinned-glb-scene-pack.mjs
      - scripts/p101-r19a6-real-glb-source-native-camera-compare.mjs
      - tests/p101-r19a6-pinned-city-glb-roundtrip.test.mjs
      - .github/workflows/p101-r19a6-pinned-glb-source-native.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r19a6-pinned-private-glb-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinned-glb-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original immutable native game + validate two GLB source readbacks
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a6-source-glb-roundtrip.mjs
          node --check scripts/p101-r19a6-private-pinned-glb-scene-pack.mjs
          node --check scripts/p101-r19a6-real-glb-source-native-camera-compare.mjs
          node --test tests/p101-r19a6-pinned-city-glb-roundtrip.test.mjs tests/p101-r19a4-editable-true-w9c1-gltf.test.mjs
      - name: Build only private original game and separate GLB readback renderer
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a3-private-original-one-city-pack.mjs
          node scripts/p101-r19a6-private-pinned-glb-scene-pack.mjs
          node --check dist-private/r19a6/drive3d.mjs
          test -s dist-private/r19a6/R19A6_ultra_GPU_VERTICES.bin
          test -s dist-private/r19a6/R19A6_control_GPU_VERTICES.bin
          ! grep -q 'r19a6OptIn' dist-private/r19a3/drive3d.mjs
          ! grep -q 'r19a6OptIn' dist-private/drive3d/drive3d.mjs
      - name: Install real Chromium source WebGL2
        run: |
          npx playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-ipafont-gothic
          fc-cache -f
      - name: Original source city 14m/28m real native camera evidence, 24 PNG
        run: |
          node scripts/p101-r19a3-four-native-source-city-sessions.mjs
          node scripts/p101-r19a3-independent-real-city-native-16png-gate.mjs
      - name: GLB-derived CITY versus ORIGINAL WebGL2 at same native tick
        run: |
          node scripts/p101-r19a6-real-glb-source-native-camera-compare.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Upload private test evidence only (no release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R19_A6_P0_PINNED_ORIGINAL_GLB_NATIVE_WEBGL2_ART_REJECT
          path: |
            r19-evidence/r19a6/
            dist-private/r19a6/R19A6_GLTF_ROUNDTRIP_MANIFEST.json
            r19-evidence/r19a3/R19_A3R_ONE_CITY_TWO_ROAD_TRUE_CAMERA.json
          retention-days: 7
          if-no-files-found: warn
