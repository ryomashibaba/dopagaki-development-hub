name: R2F4 near-road civic exchange original 12 camera and B51 SAT
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-r19a6p4r2f4-connected-urban-streets.py
      - scripts/p101-r19a6p4r2f4-private-source-game-pack.mjs
      - scripts/p101-r19a6p4r2f4-12-native-visual-qa.mjs
      - scripts/p101-r19a6p4r2f4-28-b51-source-sat.mjs
      - scripts/p101-r19a6p4r2f4-full-2881-b51-source-sat.mjs
      - scripts/p101-r19a6p4r2f4-b48-sampled-static-triangle-sat.mjs
      - scripts/p101-r19a6p4r2f4c-normal-bake.mjs
      - scripts/p101-r19a6p4r2f4c-4-native-shading-qa.mjs
      - tests/p101-r19a6p4r2f4c-normal-bake.test.mjs
      - scripts/p101-r19a6p4r2f-camera-geometry-audit.py
      - scripts/p101-r19a6p4r2f4-native-overlays.py
      - scripts/p101-r19a6p4r2f4-roadside-placement-gate.mjs
      - .github/workflows/p101-r19a6p4r2ec-connected-streets-source-native.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r19a6p4r2f4-camera-original-source-true-blender
  cancel-in-progress: true
jobs:
  real-Blender-connected-streets-source-12frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable original B48 B51 and preflight all P4 source
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r19a6p4r2f4-connected-urban-streets.py
          python3 -m py_compile scripts/p101-r19a6p4r2f-camera-geometry-audit.py scripts/p101-r19a6p4r2f4-native-overlays.py
          node --check scripts/p101-r19a6p4r2f4-private-source-game-pack.mjs
          node --check scripts/p101-r19a6p4r2f4c-4-native-shading-qa.mjs
          node --test tests/p101-r19a6p4r2f4c-normal-bake.test.mjs
          node --check scripts/p101-r19a6p4r2f4-12-native-visual-qa.mjs
          node --check scripts/p101-r19a6p4r2f4-28-b51-source-sat.mjs
          node --check scripts/p101-r19a6p4r2f4-full-2881-b51-source-sat.mjs
          node --check scripts/p101-r19a6p1-read-blender-glb.mjs
          node --test tests/p101-r19a6-pinned-city-glb-roundtrip.test.mjs
          test -s docs/R19_A6P3_PRIOR_A1_ORIGINAL_12_TRUE_CAMERAS.json
      - name: Build true untouched game, A5 source editable geometry and road0/1
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a3-private-original-one-city-pack.mjs
          node scripts/p101-r19a6-private-pinned-glb-scene-pack.mjs
          node scripts/p101-r19a4-export-editable-source-city-glb.mjs
          node scripts/p101-r19a6p2-real-road-spatial-anchors.mjs
      - name: R2F4 read-only road7 surface sampling, full B51 snapshots and true-camera roadside feasibility
        run: |
          node --check scripts/p101-r19a6p4r2f4-roadside-placement-gate.mjs
          node scripts/p101-r19a6p4r2f4-roadside-placement-gate.mjs
          test -s r19-evidence/r19a6p4r2f4/R2F4_SOURCE_ROADSIDE_PLACEMENT_GATE.json
      - name: Install actual Blender 4 and color-capable glTF exporter
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy python3-pil fonts-ipafont-gothic
          blender --version | head -4
      - name: Actual Blender R2D create five different carved civic landscapes with real open courts
        run: |
          mkdir -p r19-evidence/r19a6p4r2f4
          for mode in ultra control; do
            blender -b --factory-startup --python-exit-code 3 --python scripts/p101-r19a6p4r2f4-connected-urban-streets.py -- \
              --source "r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_${mode}_EDITABLE_CITY.glb" \
              --output "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_edited.glb" \
              --blend "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_editable.blend" \
              --report "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_blender_report.json" \
              --anchors "r19-evidence/r19a6p2/P2_${mode}_real_road_anchors.json" \
              --cameras "docs/R19_A6P3_PRIOR_A1_ORIGINAL_12_TRUE_CAMERAS.json" \
              --mode "$mode"
            test -s "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_edited.glb"
            test -s "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_editable.blend"
            test -s "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_blender_report.json"
          done
      - name: Verify actual independently parsed indexed glTF COLOR0 and source SHA
        run: |
          for mode in ultra control; do
            node scripts/p101-r19a6p1-read-blender-glb.mjs \
              "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_edited.glb" \
              "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_blender_report.json" \
              "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_audited_gpu.bin"
          done
          node scripts/p101-r19a6p4r2f4-private-source-game-pack.mjs
          node --check dist-private/r19a6p4r2f4/drive3d.mjs
          ! grep -q "r19a6p4r2f4" dist-private/r19a6/drive3d.mjs
      - name: R2F read-only Blender original-camera five-site projection (ART not certified)
        run: |
          for mode in ultra control; do
            blender -b "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_editable.blend" --python-exit-code 4 --python scripts/p101-r19a6p4r2f-camera-geometry-audit.py -- \
              --mode "$mode" \
              --cameras docs/R19_A6P3_PRIOR_A1_ORIGINAL_12_TRUE_CAMERAS.json \
              --report "r19-evidence/r19a6p4r2f4/R2F_${mode}_CAMERA_GEOMETRY_ONLY.json"
            test -s "r19-evidence/r19a6p4r2f4/R2F_${mode}_CAMERA_GEOMETRY_ONLY.json"
          done
      - name: Independent actual original B51 instantaneous 3D triangle-versus-rotating-box collision veto
        run: |
          node scripts/p101-r19a6p4r2f4-28-b51-source-sat.mjs
          test -s r19-evidence/r19a6p4r2f4/P4R2F4_NATIVE_SIX_TIME_B51_TRIANGLE_OBB_3D_CONTACT_AUDIT.json
      - name: R2F4-B independent real-city to all 7 source B48 sampled static triangle SAT
        run: |
          node --check scripts/p101-r19a6p4r2f4-b48-sampled-static-triangle-sat.mjs
          node scripts/p101-r19a6p4r2f4-b48-sampled-static-triangle-sat.mjs
          test -s r19-evidence/r19a6p4r2f4/R2F4B_SAMPLED_B48_STATIC_TRIANGLE_SAT_QA.json
      - name: Exhaustive original 240Hz 0 through 2880 all 28 B51 exact triangle SAT
        run: |
          node scripts/p101-r19a6p4r2f4-full-2881-b51-source-sat.mjs
          test -s r19-evidence/r19a6p4r2f4/P4R2F4_ALL_2881_NATIVE_TICKS_B51_TRIANGLE_OBB_CONTACT_AUDIT.json
      - name: Chromium original WebGL2 native renderer
        run: |
          npx playwright install --only-shell chromium
          fc-cache -f
      - name: Real original A5 24 native WebGL2 frames for trustworthy baseline
        run: |
          node scripts/p101-r19a3-four-native-source-city-sessions.mjs
          node scripts/p101-r19a3-independent-real-city-native-16png-gate.mjs
      - name: Real P4 14m and 28m x six exact 240Hz frames
        run: |
          node scripts/p101-r19a6p4r2f4-12-native-visual-qa.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: R2F4-C four genuine original source camera frames with isolated normal-baked vertex colors
        run: |
          test -s dist-private/r19a6p4r2f4shade/R2F4C_PRIVATE_NORMAL_BAKE_MANIFEST.json
          node scripts/p101-r19a6p4r2f4c-4-native-shading-qa.mjs
          test -s r19-evidence/r19a6p4r2f4shade/R19A6P4R2F4C_SHADE_REAL_12_NATIVE_WEBGL2_REPORT.json
      - name: R2F genuine source PNG checked camera-director overlays (read-only ART HOLD)
        run: |
          for mode in ultra control; do
            python3 scripts/p101-r19a6p4r2f4-native-overlays.py r19-evidence/r19a6p4r2f4 "$mode"
            test -s "r19-evidence/r19a6p4r2f4/R2F_${mode}_1921_SOURCE_CAMERA_DIRECTOR_ONLY.png"
          done
      - name: Save Blender native editable project, GLBs, raw game images and QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R2F4_NATIVE_CITY_ROAD1_CLIFF_GARDEN_12CAMERA_B51_ART_HOLD
          path: |
            r19-evidence/r19a6p4r2f4/
            r19-evidence/r19a6p4r2f4shade/
            dist-private/r19a6p4r2f4shade/R2F4C_PRIVATE_NORMAL_BAKE_MANIFEST.json
            r19-evidence/r19a6p4r2f4/
            dist-private/r19a6p4r2f4/P4R2F4_EDITABLE_BLENDER_PRIVATE_GLB_MANIFEST.json
          retention-days: 7
          if-no-files-found: warn
