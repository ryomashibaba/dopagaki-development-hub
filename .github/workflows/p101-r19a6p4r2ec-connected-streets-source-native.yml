          node --check scripts/p101-r19a6p4r2f4-full-2881-b51-source-sat.mjs
          node --check scripts/p101-r19a6p1-read-blender-glb.mjs
          node --test tests/p101-r19a6-pinned-city-glb-roundtrip.test.mjs
          test -s docs/R19_A6P3_PRIOR_A1_ORIGINAL_12_TRUE_CAMERAS.json
