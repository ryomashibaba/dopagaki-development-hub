              "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_edited.glb" \
              "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_blender_report.json" \
              "r19-evidence/r19a6p4r2f4/P4R2F4_${mode}_audited_gpu.bin"
