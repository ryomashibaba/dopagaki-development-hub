          node --check scripts/p101-r19a6p4r2f5f-private-and-native-qa.mjs
          node --check scripts/p101-r19a6p4r2f5e-private-and-native-qa.mjs
          node --check scripts/p101-r19a6p4r2f5d-private-and-native-qa.mjs
          node --check scripts/p101-r19a6p4r2f5b-private-scene-pack.mjs
          node --check scripts/p101-r19a6p4r2f5b-2-native-art-preview.mjs
          node --check scripts/p101-r19a6p4r2f5a-private-scene-pack.mjs
          node --check scripts/p101-r19a6p4r2f5a-4-native-art-preview.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f-camera-geometry-audit.py scripts/p101-r19a6p4r2f4-native-overlays.py
