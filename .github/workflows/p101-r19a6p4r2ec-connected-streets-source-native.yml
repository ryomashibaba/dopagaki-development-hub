        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a3-private-original-one-city-pack.mjs
          node scripts/p101-r19a6-private-pinned-glb-scene-pack.mjs
          node scripts/p101-r19a4-export-editable-source-city-glb.mjs
          node scripts/p101-r19a6p2-real-road-spatial-anchors.mjs
