name: DOPAGAKI R2F5-I longitudinal native city true temporal 56 camera frames
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5i-*'
      - '.github/workflows/p101-r19a6p4r2f5i-true-native-street.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-r2f5i-native-source-private
  cancel-in-progress: true
jobs:
  original-native-four-scene-56-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-blob strict preflight and all I scripts syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r19a6p4r2f5i-native-hall.py scripts/p101-r19a6p4r2f5i-native-placement.py scripts/p101-r19a6p4r2f5i-pixel-audit.py
          node --check scripts/p101-r19a6p4r2f5i-private-pack.mjs
          node --check scripts/p101-r19a6p4r2f5i-true-temporal-qa.mjs
      - name: Rehydrate F/G2 frozen original archived Blender evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/13080348046" --jq '[.id,.workflow_run.id,.expired,.size_in_bytes] | @tsv' > /tmp/r2f5i-artifact.txt
          test "$(cut -f1 /tmp/r2f5i-artifact.txt)" = 13080348046
          test "$(cut -f2 /tmp/r2f5i-artifact.txt)" = 41299372268
          test "$(cut -f3 /tmp/r2f5i-artifact.txt)" = false
          test "$(cut -f4 /tmp/r2f5i-artifact.txt)" = 31509900
          gh run download 41299372268 -n R2F4_NATIVE_CITY_ROAD1_CLIFF_GARDEN_12CAMERA_B51_ART_HOLD -D .
          test -s r19-evidence/r19a6p4r2f5g2/P4R2F5G2_control_edited.glb
      - name: Rebuild source PRIVATE game, original A5 and real road anchors
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a3-private-original-one-city-pack.mjs
          node scripts/p101-r19a4-export-editable-source-city-glb.mjs
          node scripts/p101-r19a6-private-pinned-glb-scene-pack.mjs
          node scripts/p101-r19a6p2-real-road-spatial-anchors.mjs
          test -s r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_ultra_EDITABLE_CITY.glb
          test -s r19-evidence/r19a6p2/P2_control_real_road_anchors.json
      - name: Blender 4 Native I street 14/28m original source GLB only
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy python3-pil
          mkdir -p r19-evidence/r19a6p4r2f5i
          for mode in ultra control; do
            blender -b --factory-startup --python-exit-code 3 --python scripts/p101-r19a6p4r2f5i-native-placement.py -- \
              --source "r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_${mode}_EDITABLE_CITY.glb" \
              --output "r19-evidence/r19a6p4r2f5i/P4R2F5I_${mode}_edited.glb" \
              --blend "r19-evidence/r19a6p4r2f5i/P4R2F5I_${mode}_editable.blend" \
              --report "r19-evidence/r19a6p4r2f5i/P4R2F5I_${mode}_blender_report.json" \
              --anchors "r19-evidence/r19a6p2/P2_${mode}_real_road_anchors.json" \
              --cameras "docs/R19_A6P3_PRIOR_A1_ORIGINAL_12_TRUE_CAMERAS.json" \
              --mode "$mode"
            node scripts/p101-r19a6p1-read-blender-glb.mjs \
              "r19-evidence/r19a6p4r2f5i/P4R2F5I_${mode}_edited.glb" \
              "r19-evidence/r19a6p4r2f5i/P4R2F5I_${mode}_blender_report.json" \
              "r19-evidence/r19a6p4r2f5i/P4R2F5I_${mode}_audited_gpu.bin"
          done
          node scripts/p101-r19a6p4r2f5i-private-pack.mjs
      - name: True Chromium original 240Hz F G2 I seven timestamps each
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5i-true-temporal-qa.mjs
          python3 scripts/p101-r19a6p4r2f5i-pixel-audit.py
          test -s r19-evidence/r19a6p4r2f5i/R2F5I_REAL_CAMERA_TEMPORAL_CONTACT_SHEET.png
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R2F5I_SOURCE_ORIGINAL_F_G2_I_NATIVE_56FRAMES_ART_HOLD
          path: r19-evidence/r19a6p4r2f5i/
          retention-days: 7
          if-no-files-found: warn
