name: DOPAGAKI R2F5-K original seven-road source camera coverage experiment
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k-*'
      - '.github/workflows/p101-r19a6p4r2f5k-seven-road-camera-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-r2f5k-source-camera-coverage
  cancel-in-progress: true
jobs:
  source-seven-road-true-camera-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source lock and new K research scripts syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a6p4r2f5k-seven-road-anchors.mjs
          node --check scripts/p101-r19a6p4r2f5k-extend-original-camera.mjs
      - name: Generate the authentic source B48 7x81 geometry for both widths
        run: |
          node scripts/p101-r19a6p4r2f5k-seven-road-anchors.mjs
          test -s r19-evidence/r19a6p4r2f5k/R2F5K_ALL7_FROZEN_SOURCE_ROAD_ANCHORS.json
      - name: Build original PRIVATE A1 scripted camera with unmodified core
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          test -s dist-private/r19a1/drive3d.mjs
      - name: Original native 240Hz source camera extension beyond 11.504s
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k-extend-original-camera.mjs
          test -s r19-evidence/r19a6p4r2f5k/R2F5K_REAL_ORIGINAL_EXTENDED_CAMERA_COVERAGE.json
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R2F5K_ORIGINAL_SOURCE_7ROAD_CAMERA_COVERAGE_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k/
          if-no-files-found: warn
          retention-days: 7
