name: DOPAGAKI R2F5-K2 source-frustum three-chapter limited research
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k2-*'
      - '.github/workflows/p101-r19a6p4r2f5k2-three-source-chapters.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-r2f5k2-projection
  cancel-in-progress: true
jobs:
  source-camera-frustum:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: K original camera evidence from immutable successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/13086435838" --jq '[.id,.workflow_run.id,.expired,.size_in_bytes,.digest] | @tsv' > /tmp/r2f5k2.txt
          cat /tmp/r2f5k2.txt
          test "$(cut -f1 /tmp/r2f5k2.txt)" = 13086435838
          test "$(cut -f2 /tmp/r2f5k2.txt)" = 41312758260
          test "$(cut -f3 /tmp/r2f5k2.txt)" = false
          test "$(cut -f4 /tmp/r2f5k2.txt)" = 3856011
          test "$(cut -f5 /tmp/r2f5k2.txt)" = sha256:b493ddaf0dd70d34660e47107e7cfca154d69bda2ab121206e24823dabf4586c
          mkdir -p r19-evidence/r19a6p4r2f5k
          gh run download 41312758260 -n R2F5K_ORIGINAL_SOURCE_7ROAD_CAMERA_COVERAGE_ART_HOLD -D r19-evidence/r19a6p4r2f5k
          test -s r19-evidence/r19a6p4r2f5k/R2F5K_ALL7_FROZEN_SOURCE_ROAD_ANCHORS.json
          test -s r19-evidence/r19a6p4r2f5k/R2F5K_REAL_ORIGINAL_EXTENDED_CAMERA_COVERAGE.json
      - name: Study only 3 distinct source-visible road chapters
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r19a6p4r2f5k2-three-site-frustum-proxy.py
          python3 scripts/p101-r19a6p4r2f5k2-three-site-frustum-proxy.py
          test -s r19-evidence/r19a6p4r2f5k2/R2F5K2_THREE_SITE_PROJECTION_RESEARCH_ONLY.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R2F5K2_THREE_REAL_SOURCE_FRUSTUM_PROXIES_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k2/
          retention-days: 7
          if-no-files-found: warn
