name: DOPAGAKI R2F5-K3 lawful late steering native physical matrix
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k3-*'
      - '.github/workflows/p101-r19a6p4r2f5k3-real-late-steering.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-r2f5k3-late-steering-native
  cancel-in-progress: true
jobs:
  native-continuous-road4-6-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source immutable physical engine and syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a6p4r2f5k3-late-steering-source-matrix.mjs
      - name: Genuinely native 240Hz 16 steering trials with unchanged first 32 seconds
        run: |
          node scripts/p101-r19a6p4r2f5k3-late-steering-source-matrix.mjs
          test -s r19-evidence/r19a6p4r2f5k3/R2F5K3_REAL_LATE_STEERING_NATIVE_MATRIX.json
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R2F5K3_16_NATIVE_LEGAL_STEERING_PHYSICAL_HOLD
          path: r19-evidence/r19a6p4r2f5k3/
          retention-days: 7
          if-no-files-found: warn
