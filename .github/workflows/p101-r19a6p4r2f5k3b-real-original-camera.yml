name: DOPAGAKI R2F5-K3B original source camera Road4-6 legal native replay
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k3b-*'
      - '.github/workflows/p101-r19a6p4r2f5k3b-real-original-camera.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-r2f5k3b-original-native-camera
  cancel-in-progress: true
jobs:
  original-camera-road4-6-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source is immutable, new research code parses
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node --check scripts/p101-r19a6p4r2f5k3b-seven-road-real-webgl2.mjs
      - name: Fetch independently successful K3 original native 16-run matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/13086649501" --jq '[.id,.workflow_run.id,.expired,.size_in_bytes,.digest] | @tsv' >/tmp/k3.txt
          cat /tmp/k3.txt
          test "$(cut -f1 /tmp/k3.txt)" = 13086649501
          test "$(cut -f2 /tmp/k3.txt)" = 41314887466
          test "$(cut -f3 /tmp/k3.txt)" = false
          test "$(cut -f4 /tmp/k3.txt)" = 10115
          test "$(cut -f5 /tmp/k3.txt)" = sha256:102079ddf56435a54769da34d3d1dbd999751a52c673b77a6f0d12504047704f
          mkdir -p r19-evidence/r19a6p4r2f5k3
          gh run download 41314887466 -n R2F5K3_16_NATIVE_LEGAL_STEERING_PHYSICAL_HOLD -D r19-evidence/r19a6p4r2f5k3
          test -s r19-evidence/r19a6p4r2f5k3/R2F5K3_REAL_LATE_STEERING_NATIVE_MATRIX.json
      - name: Original private A1 renderer, legal steering-only isolated copy
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          test -s dist-private/r19a6p4r2f5k3b/drive3d.mjs
      - name: Genuine source Chromium 240Hz cameras for original Road4-6
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k3b-seven-road-real-webgl2.mjs
          test -s r19-evidence/r19a6p4r2f5k3b/R2F5K3B_REAL_SEVEN_ROAD_WEBGL2_CAMERA.json
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R2F5K3B_GENUINE_ORIGINAL_ALL_SEVEN_ROAD_CAMERAS_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k3b/
          retention-days: 7
          if-no-files-found: warn
