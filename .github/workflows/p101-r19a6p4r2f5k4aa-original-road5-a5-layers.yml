name: DOPAGAKI K4AA true Road5 camera A5-only BVH ART-FIRST research HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4aa-*'
      - '.github/workflows/p101-r19a6p4r2f5k4aa-original-road5-a5-layers.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4aa-real-road5-original-a5-only
  cancel-in-progress: true
jobs:
  original-source-cameras-a5-five-mesh-no-new-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original immutable source physics and two read-only K4AA study scripts
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-r19a3-private-original-one-city-pack.mjs)" = "$(git rev-parse HEAD:scripts/p101-r19a3-private-original-one-city-pack.mjs)"
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4aa-original-a5-true-road5-bvh.py
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4aa-true-source-road5-ray-review.py
      - name: Retrieve pinned K4Z original native 82 PNG evidence, not a future-game building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4z
          gh run download 41427816258 \
            -n K4Z_2WIDTH_TRUE_240HZ_ORIGINAL_SOURCE_DENSE_ROAD5_AND_OTHERS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4z
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('r19-evidence/r19a6p4r2f5k4z')
          doc=root/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json'
          assert hashlib.sha256(doc.read_bytes()).hexdigest()=='da69e5d9283f6a8fc5190cc9fefd4e8476114eedfb218fe2eb802bbecfcddb6c'
          j=json.loads(doc.read_text())
          assert j['sourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert j['Hz']==240 and j['sourceB48']==7 and j['sourceB51']==28 and j['errors']==[]
          count=0
          for run in j['sessions']:
            assert len(run['frames'])==41
            for fr in run['frames']:
              source=(root/fr['file']).read_bytes()
              assert hashlib.sha256(source).hexdigest()==fr['sha256'] and len(source)==fr['bytes']
              count+=1
          assert count==82
          print('K4AA_PINNED_GENUINE_82_WEBGL2_PNG_SHA_PASS')
          PY
      - name: Rebuild unchanged ORIGINAL A5 five-mesh native source GLB for both widths
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a3-private-original-one-city-pack.mjs
          node scripts/p101-r19a4-export-editable-source-city-glb.mjs
          test -s r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_ultra_EDITABLE_CITY.glb
          test -s r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_control_EDITABLE_CITY.glb
          test "$(sha256sum r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_ultra_EDITABLE_CITY.glb | cut -d' ' -f1)" = 00197cab04222acbbb6c27f1c97c348ccbf9df0b74864235bed90c0598d3a527
          test "$(sha256sum r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_control_EDITABLE_CITY.glb | cut -d' ' -f1)" = bb7edbdcd850be94e49ada0cd148328e663e60d3ea7398542ff44336f38f226f
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Blender original A5-only BVH true Road5 14 cameras x 108 inverse-projection rays
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy python3-pil fonts-dejavu-core
          mkdir -p r19-evidence/r19a6p4r2f5k4aa
          blender -b --factory-startup --python-exit-code 3 --python scripts/p101-r19a6p4r2f5k4aa-original-a5-true-road5-bvh.py -- \
            --city-ultra r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_ultra_EDITABLE_CITY.glb \
            --city-control r19-evidence/r19a5/R19A5_ORIGINAL_W9C1_control_EDITABLE_CITY.glb \
            --k4z r19-evidence/r19a6p4r2f5k4z/K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json \
            --output r19-evidence/r19a6p4r2f5k4aa/K4AA_ORIGINAL_A5_FIVE_MESH_BVH_TRUE_14_ROAD5_CAMERA_RAYS.json
      - name: Verify real original 82 PNGs and render 14 source-camera A5-ray annotated review frames
        run: |
          python3 scripts/p101-r19a6p4r2f5k4aa-true-source-road5-ray-review.py \
            --k4z-dir r19-evidence/r19a6p4r2f5k4z \
            --rays r19-evidence/r19a6p4r2f5k4aa/K4AA_ORIGINAL_A5_FIVE_MESH_BVH_TRUE_14_ROAD5_CAMERA_RAYS.json \
            --out r19-evidence/r19a6p4r2f5k4aa
          python3 - <<'PY'
          import json,pathlib,importlib.util
          p=pathlib.Path('r19-evidence/r19a6p4r2f5k4aa')
          r=json.loads((p/'K4AA_ORIGINAL_A5_FIVE_MESH_BVH_TRUE_14_ROAD5_CAMERA_RAYS.json').read_text())
          q=json.loads((p/'K4AA_GENUINE_ROAD5_SOURCE_CAMERA_AND_ORIGINAL_A5_RAY_REVIEW.json').read_text())
          assert len(r['modeFrames'])==14 and all(len(f['rayGrid'])==108 for f in r['modeFrames'])
          assert sum(len(f['rayGrid']) for f in r['modeFrames'])==1512
          assert len(q['frameComparisons'])==14 and q['trueOriginalK4ZPNGshaVerified']==82
          assert len(q['reviewSheets'])==2
          assert q['art']=='NOT_TESTED_HOLD' and q['officialARTAccepted']==0
          assert r['officialARTAccepted']==r['slope2DNARecognizedMetres']==0
          assert r['newBuildingModels']==r['addedColliders']==0
          assert r['rayObjects']=='ONLY_ORIGINAL_A5_FIVE_STATIC_CITY_MESHES__NO_B48_B51_OR_OTHER'
          assert r['sampledTimeNotContinuousVisibility']
          for sheet in q['reviewSheets']:
            assert (p/sheet).is_file()
          for mode in ('ultra','control'):
            frames=[x for x in r['modeFrames'] if x['mode']==mode]
            assert len(frames)==7
            assert [f['tick'] for f in frames]==[10680,10800,10920,11040,11160,11280,11400]
            assert all(sum(c['sampledScreenRays'] for c in f['zoneCounts'].values())==108 for f in frames)
          # Negative test: original frame SHA tampering must be rejected.
          spec=importlib.util.spec_from_file_location('k4aa','scripts/p101-r19a6p4r2f5k4aa-true-source-road5-ray-review.py')
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          j=json.loads((pathlib.Path('r19-evidence/r19a6p4r2f5k4z')/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json').read_text())
          bad=dict(j['sessions'][0]['frames'][0],sha256='0'*64)
          try:m.c_image(pathlib.Path('r19-evidence/r19a6p4r2f5k4z'),bad)
          except AssertionError:pass
          else:raise AssertionError('tampered source PNG SHA was accepted')
          print('K4AA_ORIGINAL_CITY_BVH_AND_14_ROAD5_NATIVE_CAMERA_ART_REVIEW_TECH_ONLY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AA_SOURCE_ONLY_14_NATIVE_ROAD5_CAMERA_1512_A5_BVH_RAYS_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4aa/
          retention-days: 7
          if-no-files-found: warn
