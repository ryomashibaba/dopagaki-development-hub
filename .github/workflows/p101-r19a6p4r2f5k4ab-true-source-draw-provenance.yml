name: DOPAGAKI K4AB actual source WebGL2 draw provenance same-pause pixel A/B ART HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4ab-*'
      - '.github/workflows/p101-r19a6p4r2f5k4ab-true-source-draw-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4ab-actual-source-draw-provenance
  cancel-in-progress: true
jobs:
  native-source-only-gpu-draw-tagging-masked-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen source physics, original K3B pack, syntax and source layer gate
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs)" = 3096e5556189221d8411205a6cf96a1f5f5137bd
          test "$(git hash-object scripts/p101-r19a6p4r2f5k3b-seven-road-real-webgl2.mjs)" = 3a86620114c4c2ab08775bb6ac610ce29b9b5a76
          node --check scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node --check scripts/p101-r19a6p4r2f5k4ab-true-source-render-provenance-webgl2.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4ab-audit-native-source-layer-diffs.py
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const old=fs.readFileSync('scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs','utf8');
          const source=fs.readFileSync('web/drive3d.mjs','utf8');
          assert(old.includes("const from=path.join(root,'dist-private/r19a1');"));
          assert(source.includes('draw(roads);draw(g4e7pQuietMesh'));
          assert(source.includes('draw(a13ArchMesh);'));
          assert(source.includes('draw(scenery);'));
          assert(source.includes('draw(megaWorld);draw(g5bSceneryMesh);'));
          assert(source.includes('for(const o of doc.movingObstacles)'));
          assert(source.includes("gl.drawArrays(primitive,0,m.count);"));
          console.log('K4AB_SOURCE_PROVENANCE_DRAW_ORDER_GATE_REAL_RENDERER');
          JS
      - name: Download pinned genuine K4Z true 82 original WebGL2 PNG SHA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4z-source
          gh run download 41427816258 \
            -n K4Z_2WIDTH_TRUE_240HZ_ORIGINAL_SOURCE_DENSE_ROAD5_AND_OTHERS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4z-source
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('r19-evidence/r19a6p4r2f5k4z-source')
          raw=(p/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='da69e5d9283f6a8fc5190cc9fefd4e8476114eedfb218fe2eb802bbecfcddb6c'
          j=json.loads(raw)
          assert j['sourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert j['errors']==[] and j['Hz']==240 and j['sourceB48']==7 and j['sourceB51']==28
          n=0
          for session in j['sessions']:
            assert len(session['frames'])==41
            for s in session['frames']:
              data=(p/s['file']).read_bytes()
              assert len(data)==s['bytes'] and hashlib.sha256(data).hexdigest()==s['sha256']
              n+=1
          assert n==82
          print('K4AB_PRESERVED_82_GENUINE_SHA_SOURCE_SCREENSHOTS')
          PY
      - name: Build unmodified K3B original source and private K4AB draw-only diagnostics
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          test -s dist-private/r19a6p4r2f5k4ab/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          cmp -s dist-private/r19a6p4r2f5k3b/index.html dist-private/r19a6p4r2f5k4ab/index.html
      - name: Exact original K4Z WebGL2 14 images and six same-pose private draw-group masks per width
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4ab-true-source-render-provenance-webgl2.mjs
          test -s r19-evidence/r19a6p4r2f5k4ab/K4AB_TRUE_ORIGINAL_RENDERED_SOURCE_DRAW_PROVENANCE.json
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Independently audit 82 original PNG SHA and 12 subtractive WebGL2 pixels
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pil python3-numpy fonts-dejavu-core
          python3 scripts/p101-r19a6p4r2f5k4ab-audit-native-source-layer-diffs.py \
            --k4z-dir r19-evidence/r19a6p4r2f5k4z-source \
            --k4ab-dir r19-evidence/r19a6p4r2f5k4ab \
            --output r19-evidence/r19a6p4r2f5k4ab
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('r19-evidence/r19a6p4r2f5k4ab')
          a=json.loads((p/'K4AB_TRUE_ORIGINAL_RENDERED_SOURCE_DRAW_PROVENANCE.json').read_text())
          d=json.loads((p/'K4AB_ACTUALLY_RENDERED_ORIGINAL_SOURCE_GROUPS_AND_PIXEL_DIFFS.json').read_text())
          assert a['errors']==d['errors']==[]
          assert a['sourceOriginalK4ZPNGCountCompared']==14
          assert 0<=a['sourceOriginalK4ZPNGCountMatched']<=14
          assert d['genuineOriginalK4ZPNGshaVerified']==82
          assert d['sameSourceK4ZFrameOutsideP74HUDPixelIdentical']==14
          assert d['fullSourcePNGshaMatchedCount']==a['sourceOriginalK4ZPNGCountMatched']
          assert d['originalP74NearMissHUDExcludedROI']==[220,418,800,590]
          assert len(d['originalBaselinePixelAudits'])==14
          assert len(d['restoredMaskPixelAudits'])==2
          assert all(x['differentPixelsOutsideP74CSSNearMissHUD']==0 for x in d['originalBaselinePixelAudits']+d['restoredMaskPixelAudits'])
          assert len(a['sessions'])==2 and len(d['byMode'])==2
          assert len(a['sessions'][0]['maskShots'])==len(a['sessions'][1]['maskShots'])==6
          assert len(d['maskEvidence'])==12 and len(d['reviewSheets'])==2
          assert a['officialARTAccepted']==a['slope2DNARecognizedMetres']==0
          assert d['officialARTAccepted']==d['slope2DNARecognizedMetres']==0
          assert a['candidateArchitectureCreated']==a['newColliders']==0
          assert d['newModels']==d['addedColliders']==0
          assert d['sourceA5OverlayRendered'] is False
          assert d['art']=='NOT_TESTED_HOLD' and d['RELEASE']==d['MERGE']=='HOLD'
          for entry in d['maskEvidence']:
            assert entry['baselineNativeCameraAndBallExactlySame']
            assert entry['maskRemovedActualNativeDrawCallsNotPhysics']
            assert entry['pixelDifferenceNotObjectVisibilityOrFreeSpaceCertification']
          for name in d['reviewSheets']: assert (p/name).is_file()
          for original in a['sessions']:
            assert original['baselineAllSevenK4ZCompared']
            assert original['baselineAllSevenK4ZShaMatches']==all(
             x['imageExactByteReproductionOfK4Z'] for x in original['shots'])
          print('K4AB_GENUINE_SOURCE_DRAW_GROUPS_TECH_LIMITED_PASS_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AB_14_EXACT_ORIGINAL_GPU_FRAMES_12_SAME_CAMERA_SOURCE_LAYER_MASKS_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4ab/
          retention-days: 7
          if-no-files-found: warn
