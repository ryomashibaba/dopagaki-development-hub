name: DOPAGAKI K4AC original Road5 WebGL2 depth readback feasibility ART HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4ac-*'
      - '.github/workflows/p101-r19a6p4r2f5k4ac-native-depth-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4ac-depth-source-proof
  cancel-in-progress: true
jobs:
  original-native-depth-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source freeze and readback tool syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs)" = 3096e5556189221d8411205a6cf96a1f5f5137bd
          node --check scripts/p101-r19a6p4r2f5k4ac-native-depth-probe.mjs
          node --check scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4ac-audit-native-depth.py
      - name: Download and independently verify all 82 genuine K4Z original frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4z-source
          gh run download 41427816258 \
            -n K4Z_2WIDTH_TRUE_240HZ_ORIGINAL_SOURCE_DENSE_ROAD5_AND_OTHERS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4z-source
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('r19-evidence/r19a6p4r2f5k4z-source')
          raw=(p/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='da69e5d9283f6a8fc5190cc9fefd4e8476114eedfb218fe2eb802bbecfcddb6c'
          j=json.loads(raw)
          assert j['Hz']==240 and j['sourceB48']==7 and j['sourceB51']==28
          n=0
          for s in j['sessions']:
            for f in s['frames']:
              raw=(p/f['file']).read_bytes()
              assert len(raw)==f['bytes'] and hashlib.sha256(raw).hexdigest()==f['sha256']
              n+=1
          assert n==82
          print('K4AC_K4Z_TRUE_SOURCE_82_SHA_PASS')
          PY
      - name: Build original protected private source and private-only K4AB draw census
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          test -s dist-private/r19a6p4r2f5k4ab/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Genuine original Road5 14 WebGL2 frames and source 12 depth mask probes
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4ac-native-depth-probe.mjs
          test -s r19-evidence/r19a6p4r2f5k4ac/K4AC_NATIVE_GPU_DEPTH_CAPABILITY.json
      - name: Independent source image and depth negative-controls audit
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pil python3-numpy
          python3 scripts/p101-r19a6p4r2f5k4ac-audit-native-depth.py \
            --k4z-dir r19-evidence/r19a6p4r2f5k4z-source \
            --k4ac-dir r19-evidence/r19a6p4r2f5k4ac
          python3 - <<'PY'
          import json
          a=json.load(open('r19-evidence/r19a6p4r2f5k4ac/K4AC_INDEPENDENT_DEPTH_AND_ORIGINAL_PIXEL_AUDIT.json'))
          assert a['genuineK4ZPNGRechecked']==14
          assert a['allOriginal3DPixelsOutsideNativeCssROIIdentical']
          assert not a['perObjectDepthLabelsEstablished']
          assert not a['safeVacantBuildingSiteEstablished']
          assert not a['recognizablePublicVoidEstablished']
          assert a['officialARTAccepted']==a['slope2DNARecognizedMetres']==0
          assert a['release']==a['merge']=='HOLD'
          print('K4AC_SOURCE_IMAGE_PASS_DEPTH_GATE',a['genuine3DDepthMeasurementsEstablished'],
                'ART_NOT_TESTED_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AC_ORIGINAL_ROAD5_14_NATIVE_DEPTH_PROBE_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4ac/
          retention-days: 7
          if-no-files-found: warn
