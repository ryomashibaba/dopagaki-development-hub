name: DOPAGAKI K4AF native Road5 7tick x 2width x 6 original GPU masks ART HOLD
on:
  push:
    branches: [research/k4af-road5-7tick-six-layer-native-gpu-depth-20261103]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4af-*'
      - '.github/workflows/p101-r19a6p4r2f5k4af-allticks-source-masks.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4af-allticks-original-mesh-depth24
  cancel-in-progress: true
jobs:
  native-source-allseven-native-ticks-six-gpu-layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original untouched SHA and isolated research syntax gates
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs)" = 3096e5556189221d8411205a6cf96a1f5f5137bd
          node --check scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          node --check scripts/p101-r19a6p4r2f5k4af-road5-allticks-six-mask-webgl2.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4af-independent-alltick-mask-audit.py scripts/p101-r19a6p4r2f5k4af-source-mask-temporal-report.py
          node tests/k4ac-gl-state-restoration.mock.mjs
      - name: Download SHA pinned genuine original K4Z 82 WebGL2 frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4z-source
          gh run download 41427816258 \
            -n K4Z_2WIDTH_TRUE_240HZ_ORIGINAL_SOURCE_DENSE_ROAD5_AND_OTHERS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4z-source
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('r19-evidence/r19a6p4r2f5k4z-source')
          raw=(p/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='da69e5d9283f6a8fc5190cc9fefd4e8476114eedfb218fe2eb802bbecfcddb6c'
          j=json.loads(raw)
          assert j['sourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert j['Hz']==240 and j['sourceB48']==7 and j['sourceB51']==28
          n=0
          for sess in j['sessions']:
            assert len(sess['frames'])==41
            for frame in sess['frames']:
              data=(p/frame['file']).read_bytes()
              assert len(data)==frame['bytes']
              assert hashlib.sha256(data).hexdigest()==frame['sha256']
              n+=1
          assert n==82
          print('K4AF_GENUINE_ORIGINAL_K4Z_82_SHA_PASS')
          PY
      - name: Build exact K3B and K4AB originals then isolated K4AD renderer
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          test -s dist-private/r19a6p4r2f5k4ad/drive3d.mjs
          cmp -s dist-private/r19a6p4r2f5k4ab/index.html dist-private/r19a6p4r2f5k4ad/index.html
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check dist-private/r19a6p4r2f5k4ad/drive3d.mjs
      - name: Chromium genuine 14 native Road5 frames with 84 original GPU group masks
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4af-road5-allticks-six-mask-webgl2.mjs
          test -s r19-evidence/r19a6p4r2f5k4af/K4AF_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Independent original 82 SHA / 14 frames / 84 GPU mask and 14 restoration audits
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy python3-pil
          python3 scripts/p101-r19a6p4r2f5k4af-independent-alltick-mask-audit.py \
            --k4z-dir r19-evidence/r19a6p4r2f5k4z-source \
            --k4af-dir r19-evidence/r19a6p4r2f5k4af
          python3 - <<'PY'
          import json
          p='r19-evidence/r19a6p4r2f5k4af/K4AF_INDEPENDENT_GENUINE_SOURCE_GPU_AUDIT.json'
          j=json.load(open(p))
          assert j['originalK4ZAll82PNGshaVerified']==82
          assert j['originalRoad5NativePNGOutsideCSSExact']==14
          assert j['synchronousInRenderDepthMasksAvailable']==84
          assert j['sourceGPUrestorationCount']==14
          assert j['nativeGPUReadbackResult']=='ALL_7TICK_2WIDTH_84_GENUINE_SOURCE_GPU_DEPTH_MASKS_TECH_CANDIDATE_ONLY'
          assert j['ART']=='NOT_TESTED_HOLD'
          assert j['officialARTAccepted']==j['slope2DNARecognizedMetres']==0
          assert j['newModels']==j['newColliders']==0
          assert not j['confirmedPerObjectID']
          assert not j['confirmedPhysicalSafety']
          assert not j['confirmedPublicVoidART']
          assert j['RELEASE']==j['MERGE']=='HOLD'
          print('K4AF_SOURCE_VERIFIED_DEPTH_GATE',j['nativeGPUReadbackResult'])
          PY
      - name: Generate true native GPU mask time series from the independently audited 84 masks
        run: |
          python3 scripts/p101-r19a6p4r2f5k4af-source-mask-temporal-report.py \
            r19-evidence/r19a6p4r2f5k4af/K4AF_INDEPENDENT_GENUINE_SOURCE_GPU_AUDIT.json \
            r19-evidence/r19a6p4r2f5k4af
          python3 - <<'PY'
          import csv,pathlib
          p=pathlib.Path('r19-evidence/r19a6p4r2f5k4af')
          rows=list(csv.DictReader((p/'K4AF_TRUE_GPU_MASK_TIME_SERIES.csv').open()))
          assert len(rows)==84
          assert len({(r['mode'],r['tick'],r['mask']) for r in rows})==84
          assert all(int(r['nearerDepthViolation'])==0 for r in rows)
          assert all(int(r['sampledPixels'])==11176 for r in rows)
          md=(p/'K4AF_TRUE_GPU_MASK_TIME_SERIES_JA.md').read_text()
          assert 'ART HOLD' in md and '72' in md
          print('K4AF_84_NATIVE_GPU_MASK_TIMESERIES_PASS_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AF_ORIGINAL_ROAD5_14_TRUE_FRAMES_84_GPU_MASKS_14_RESTORATIONS_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4af/
          retention-days: 7
          if-no-files-found: warn
