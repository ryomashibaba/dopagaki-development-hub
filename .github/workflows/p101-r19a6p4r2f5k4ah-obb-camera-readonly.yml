name: DOPAGAKI K4AH original B51 camera OBB geometry truth (isolated ART HOLD)
on:
  push:
    branches: [research/k4ah-original-b51-camera-obb-geometry-20261103]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4ah-*'
      - '.github/workflows/p101-r19a6p4r2f5k4ah-obb-camera-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4ah-b51-camera-obb-source
  cancel-in-progress: true
jobs:
  original-native-camera-and-source-piston-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate protected source and isolated researcher syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object private/reference_only/director/moving/moving-obstacles.mjs)" = 22b92fe02d25408a14e4e71269e540049986299e
          node --check scripts/p101-r19a6p4r2f5k4ah-private-original-geometry-builder.mjs
          node --check scripts/p101-r19a6p4r2f5k4ah-original-b51-camera-seven-ticks.mjs
          node --check scripts/p101-r19a6p4r2f5k4ah-independent-source-geometry.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4ah-independent-pixel-gpu-audit.py
          node tests/k4ac-gl-state-restoration.mock.mjs
      - name: Retrieve true original K4Z 82 and true K4AF 84 native GPU source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4z-source
          mkdir -p r19-evidence/r19a6p4r2f5k4af-pinned
          gh run download 41427816258 \
            -n K4Z_2WIDTH_TRUE_240HZ_ORIGINAL_SOURCE_DENSE_ROAD5_AND_OTHERS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4z-source
          gh run download 41472149272 \
            -n K4AF_ORIGINAL_ROAD5_14_TRUE_FRAMES_84_GPU_MASKS_14_RESTORATIONS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4af-pinned
          python3 - <<'PY'
          import pathlib,hashlib,json
          o=pathlib.Path('r19-evidence/r19a6p4r2f5k4z-source')
          r=pathlib.Path('r19-evidence/r19a6p4r2f5k4af-pinned')
          orig=(o/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json').read_bytes()
          assert hashlib.sha256(orig).hexdigest()=='da69e5d9283f6a8fc5190cc9fefd4e8476114eedfb218fe2eb802bbecfcddb6c'
          doc=json.loads(orig)
          assert doc['Hz']==240 and doc['sourceB51']==28 and doc['sourceB48']==7
          n=0
          for sess in doc['sessions']:
            for f in sess['frames']:
              data=(o/f['file']).read_bytes()
              assert len(data)==f['bytes']
              assert hashlib.sha256(data).hexdigest()==f['sha256']
              n+=1
          assert n==82
          proofs=[
            ('K4AF_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json','016c28bf4fafa50748d8083496a81a5d66732540c0c3b50e863a7c39cfaddf26'),
            ('K4AF_INDEPENDENT_GENUINE_SOURCE_GPU_AUDIT.json','028f72fa8b40b450cb106e1484be488467c7dbcc4b9e69769cb2fa88a9aeec24')
          ]
          for file,sha in proofs:
            assert hashlib.sha256((r/file).read_bytes()).hexdigest()==sha
          j=json.loads((r/proofs[1][0]).read_text())
          assert j['originalK4ZAll82PNGshaVerified']==82
          assert j['synchronousInRenderDepthMasksAvailable']==84
          assert j['sourceGPUrestorationCount']==14
          assert j['ART']=='NOT_TESTED_HOLD'
          print('K4AH_ORIGINAL_K4Z82_AND_K4AF84_IMMUTABLE_SOURCE_SHA_PASS')
          PY
      - name: Build untouched native WebGL2 renderer and add private-only geometry inspector
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          node scripts/p101-r19a6p4r2f5k4ah-private-original-geometry-builder.mjs
          node --check dist-private/r19a6p4r2f5k4ah/drive3d.mjs
          cmp -s dist-private/r19a6p4r2f5k4ad/index.html dist-private/r19a6p4r2f5k4ah/index.html
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Real Chromium original seven ticks two widths camera ball B51 piston and depth
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4ah-original-b51-camera-seven-ticks.mjs
          test -s r19-evidence/r19a6p4r2f5k4ah/K4AH_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json
      - name: Independent true-source pixel and GPU comparison to immutable K4AF original
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy python3-pil
          python3 scripts/p101-r19a6p4r2f5k4ah-independent-pixel-gpu-audit.py \
            --k4z r19-evidence/r19a6p4r2f5k4z-source \
            --k4af r19-evidence/r19a6p4r2f5k4af-pinned \
            --k4ah r19-evidence/r19a6p4r2f5k4ah
      - name: Re-execute original B51 movingObstaclePose and sphereBoxSeparation independently
        run: |
          node scripts/p101-r19a6p4r2f5k4ah-independent-source-geometry.mjs \
            r19-evidence/r19a6p4r2f5k4ah/K4AH_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json \
            r19-evidence/r19a6p4r2f5k4ah/K4AH_INDEPENDENT_SOURCE_GPU_GEOMETRY_AUDIT.json \
            r19-evidence/r19a6p4r2f5k4ah
          node - <<'JS'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('r19-evidence/r19a6p4r2f5k4ah/K4AH_SOURCE_FUNCTION_REEXECUTED_GEOMETRY.json'));
          if(d.status!=='ORIGINAL_NATIVE_GEOMETRY_RECOMPUTED_TECH_PASS_ART_HOLD')process.exit(2);
          if(d.originalNativeFrames!==14||d.independentNegativeControls!==3)process.exit(3);
          if(d.officialARTAccepted!==0||d.slope2DNAMetres!==0||d.RELEASE!=='HOLD')process.exit(4);
          if(d.modes.some(x=>x.frames.length!==7))process.exit(5);
          console.log('K4AH_ORIGINAL_CAMERA_B51_OBB_SOURCE_FUNCTION_EVIDENCE_PASS_ART_HOLD');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AH_ORIGINAL_B51_CAMERA_14_NATIVE_OBB_SOURCE_GEOMETRY_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4ah/
          retention-days: 7
          if-no-files-found: warn
