name: DOPAGAKI K4AI real 240Hz original camera B51 proximity ART HOLD
on:
  push:
    branches: [research/k4ai-original-240hz-camera-obb-continuity-20261103]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4ai-*'
      - '.github/workflows/p101-r19a6p4r2f5k4ai-original-240hz-continuity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4ai-240hz-original-camera-obb
  cancel-in-progress: true
jobs:
  original-physics-240hz-camera-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect original source + camera + B51 + physics and validate scripts
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object web/drive3d-camera.mjs)" = c509518804e93c4cc6170a21f8b642ea6757f3ed
          test "$(git hash-object private/reference_only/director/moving/moving-obstacles.mjs)" = 22b92fe02d25408a14e4e71269e540049986299e
          test "$(git hash-object private/reference_only/director/physics.js)" = 67ce0485094c0c0da3f513ed7a8d427f636824e8
          node --check scripts/p101-r19a6p4r2f5k4ai-private-240hz-continuity-builder.mjs
          node --check scripts/p101-r19a6p4r2f5k4ai-original-240hz-two-widths.mjs
          node --check scripts/p101-r19a6p4r2f5k4ai-independent-seven-frame-source-geometry.mjs
          node --check scripts/p101-r19a6p4r2f5k4ai-independent-native-240hz-geometry.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4ai-independent-source-pixel-gpu-audit.py
          node tests/k4ac-gl-state-restoration.mock.mjs
      - name: Download pinned K4Z 82 PNG + K4AF 84 masks + K4AH 14 genuine OBB anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4z-source
          mkdir -p r19-evidence/r19a6p4r2f5k4af-pinned
          mkdir -p r19-evidence/r19a6p4r2f5k4ah-parent
          gh run download 41427816258 \
            -n K4Z_2WIDTH_TRUE_240HZ_ORIGINAL_SOURCE_DENSE_ROAD5_AND_OTHERS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4z-source
          gh run download 41472149272 \
            -n K4AF_ORIGINAL_ROAD5_14_TRUE_FRAMES_84_GPU_MASKS_14_RESTORATIONS_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4af-pinned
          gh run download 41554878800 \
            -n K4AH_ORIGINAL_B51_CAMERA_14_NATIVE_OBB_SOURCE_GEOMETRY_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4ah-parent
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          z=Path('r19-evidence/r19a6p4r2f5k4z-source')
          a=Path('r19-evidence/r19a6p4r2f5k4af-pinned')
          h=Path('r19-evidence/r19a6p4r2f5k4ah-parent')
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(z/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json')=='da69e5d9283f6a8fc5190cc9fefd4e8476114eedfb218fe2eb802bbecfcddb6c'
          doc=json.loads((z/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json').read_text())
          assert doc['sourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          n=0
          for s in doc['sessions']:
            assert len(s['frames'])==41
            for f in s['frames']:
              p=z/f['file']
              assert p.stat().st_size==f['bytes'] and digest(p)==f['sha256']
              n+=1
          assert n==82
          pins={
            a/'K4AF_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json':'016c28bf4fafa50748d8083496a81a5d66732540c0c3b50e863a7c39cfaddf26',
            a/'K4AF_INDEPENDENT_GENUINE_SOURCE_GPU_AUDIT.json':'028f72fa8b40b450cb106e1484be488467c7dbcc4b9e69769cb2fa88a9aeec24',
            h/'K4AH_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json':'84b4a185fb1c3c37454213b334c3c5db2a8fc6871500dca33d2255ec8a85beb0',
            h/'K4AH_INDEPENDENT_SOURCE_GPU_GEOMETRY_AUDIT.json':'ba557d0ae2dba320e120a3386086d521fc2249cd3f91813d4e0024305ebaf84b',
            h/'K4AH_SOURCE_FUNCTION_REEXECUTED_GEOMETRY.json':'683287e4c5b9dee60cff344f067e115c02964a40366cb62c8ee487de83d4a8e6'
          }
          for p,sha in pins.items():assert digest(p)==sha,(p,digest(p))
          assert json.loads((a/'K4AF_INDEPENDENT_GENUINE_SOURCE_GPU_AUDIT.json').read_text())['synchronousInRenderDepthMasksAvailable']==84
          parent=json.loads((h/'K4AH_SOURCE_FUNCTION_REEXECUTED_GEOMETRY.json').read_text())
          assert parent['status']=='ORIGINAL_NATIVE_GEOMETRY_RECOMPUTED_TECH_PASS_ART_HOLD'
          assert parent['originalNativeFrames']==14 and parent['independentNegativeControls']==3
          assert parent['ART']=='NOT_TESTED_HOLD'
          print('K4AI_PINNED_K4Z_82_K4AF_84_K4AH_14_SOURCE_PROOFS_SHA_PASS')
          PY
      - name: Build protected original WebGL renderer and K4AI private native tick recorder
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          node scripts/p101-r19a6p4r2f5k4ah-private-original-geometry-builder.mjs
          node scripts/p101-r19a6p4r2f5k4ai-private-240hz-continuity-builder.mjs
          node --check dist-private/r19a6p4r2f5k4ai/drive3d.mjs
          cmp -s dist-private/r19a6p4r2f5k4ah/index.html dist-private/r19a6p4r2f5k4ai/index.html
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Real Chromium original 721 consecutive physics ticks x 2 widths and exact 14 GPU references
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4ai-original-240hz-two-widths.mjs
          test -s r19-evidence/r19a6p4r2f5k4ai/K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json
      - name: Independent 82 source PNG SHA, 14 WebGL frame depth, 14 B51 masks, 14 restorations
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy python3-pil
          python3 scripts/p101-r19a6p4r2f5k4ai-independent-source-pixel-gpu-audit.py \
            --k4z r19-evidence/r19a6p4r2f5k4z-source \
            --k4af r19-evidence/r19a6p4r2f5k4af-pinned \
            --k4ai r19-evidence/r19a6p4r2f5k4ai
      - name: Re-execute original B51 source pose/eye separation at 14 original GPU anchors
        run: |
          node scripts/p101-r19a6p4r2f5k4ai-independent-seven-frame-source-geometry.mjs \
            r19-evidence/r19a6p4r2f5k4ai/K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json \
            r19-evidence/r19a6p4r2f5k4ai/K4AI_INDEPENDENT_SOURCE_GPU_GEOMETRY_AUDIT.json \
            r19-evidence/r19a6p4r2f5k4ai
      - name: Independently verify all 1442 real 240Hz source ticks vs K4AH SHA-pinned original geometry
        run: |
          node scripts/p101-r19a6p4r2f5k4ai-independent-native-240hz-geometry.mjs \
            r19-evidence/r19a6p4r2f5k4ai/K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json \
            r19-evidence/r19a6p4r2f5k4ah-parent/K4AH_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json \
            r19-evidence/r19a6p4r2f5k4ai
          node - <<'JS'
          const fs=require('node:fs'),p='r19-evidence/r19a6p4r2f5k4ai/';
          const d=JSON.parse(fs.readFileSync(p+'K4AI_240HZ_GEOMETRIC_WINDOWS.json'));
          if(d.decision!=='GEOMETRY_1442_NATIVE_TICKS_SOURCE_TECH_PASS_VISUAL_DURATION_ART_HOLD')process.exit(2);
          if(d.originalPhysicsTicks!==1442||d.independentTamperControls!==10)process.exit(3);
          if(d.trueGPUVerifiedGeometryAnchorCount!==14||d.continuousGPUVisualMaskCount!==0)process.exit(4);
          if(d.actualVisualObstructionDuration!=='UNKNOWN_NOT_MEASURED')process.exit(5);
          if(d.modes.length!==2||d.modes.some(x=>x.nativeTicksValidated!==721))process.exit(6);
          if(d.officialARTAccepted!==0||d.slope2DNARecognizedMetres!==0)process.exit(7);
          if(d.RELEASE!=='HOLD'||d.MERGE!=='HOLD')process.exit(8);
          console.log('K4AI_REAL_NATIVE_240HZ_GEOMETRIC_WINDOWS_PASS_VISUAL_OCCLUSION_DURATION_HOLD');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AI_GENUINE_1442_240HZ_CAMERA_B51_OBB_GEOMETRY_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4ai/
          retention-days: 7
          if-no-files-found: warn
