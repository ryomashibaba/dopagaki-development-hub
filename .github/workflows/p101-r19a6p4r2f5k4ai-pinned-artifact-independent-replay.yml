name: DOPAGAKI K4AI pinned real 1442 native-tick independent replay (ART HOLD)
on:
  push:
    branches: [research/k4ai-original-240hz-camera-obb-continuity-20261103]
    paths:
      - '.github/workflows/p101-r19a6p4r2f5k4ai-pinned-artifact-independent-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4ai-immutable-native-evidence-fast-replay
  cancel-in-progress: true
jobs:
  replay-real-captured-1442-source-native-ticks:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original source, camera, moving OBB and native physics; syntax checks
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object web/drive3d-camera.mjs)" = c509518804e93c4cc6170a21f8b642ea6757f3ed
          test "$(git hash-object private/reference_only/director/moving/moving-obstacles.mjs)" = 22b92fe02d25408a14e4e71269e540049986299e
          test "$(git hash-object private/reference_only/director/physics.js)" = 67ce0485094c0c0da3f513ed7a8d427f636824e8
          node --check scripts/p101-r19a6p4r2f5k4ai-independent-seven-frame-source-geometry.mjs
          node --check scripts/p101-r19a6p4r2f5k4ai-independent-native-240hz-geometry.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4ai-independent-source-pixel-gpu-audit.py
      - name: Download and SHA-pin frozen actual K4AI raw source GPU+1442 ticks and K4Z/K4AF/K4AH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4z-source
          mkdir -p r19-evidence/r19a6p4r2f5k4af-pinned
          mkdir -p r19-evidence/r19a6p4r2f5k4ah-parent
          mkdir -p r19-evidence/r19a6p4r2f5k4ai
          gh run download 41427816258 -n K4Z_2WIDTH_TRUE_240HZ_ORIGINAL_SOURCE_DENSE_ROAD5_AND_OTHERS_ART_HOLD -D r19-evidence/r19a6p4r2f5k4z-source
          gh run download 41472149272 -n K4AF_ORIGINAL_ROAD5_14_TRUE_FRAMES_84_GPU_MASKS_14_RESTORATIONS_ART_HOLD -D r19-evidence/r19a6p4r2f5k4af-pinned
          gh run download 41554878800 -n K4AH_ORIGINAL_B51_CAMERA_14_NATIVE_OBB_SOURCE_GEOMETRY_ART_HOLD -D r19-evidence/r19a6p4r2f5k4ah-parent
          gh run download 41559179613 -n K4AI_GENUINE_1442_240HZ_CAMERA_B51_OBB_GEOMETRY_ART_HOLD -D r19-evidence/r19a6p4r2f5k4ai
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          z=Path('r19-evidence/r19a6p4r2f5k4z-source')
          a=Path('r19-evidence/r19a6p4r2f5k4af-pinned')
          h=Path('r19-evidence/r19a6p4r2f5k4ah-parent')
          n=Path('r19-evidence/r19a6p4r2f5k4ai')
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          pinned={
            z/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json':'da69e5d9283f6a8fc5190cc9fefd4e8476114eedfb218fe2eb802bbecfcddb6c',
            a/'K4AF_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json':'016c28bf4fafa50748d8083496a81a5d66732540c0c3b50e863a7c39cfaddf26',
            a/'K4AF_INDEPENDENT_GENUINE_SOURCE_GPU_AUDIT.json':'028f72fa8b40b450cb106e1484be488467c7dbcc4b9e69769cb2fa88a9aeec24',
            h/'K4AH_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json':'84b4a185fb1c3c37454213b334c3c5db2a8fc6871500dca33d2255ec8a85beb0',
            h/'K4AH_INDEPENDENT_SOURCE_GPU_GEOMETRY_AUDIT.json':'ba557d0ae2dba320e120a3386086d521fc2249cd3f91813d4e0024305ebaf84b',
            h/'K4AH_SOURCE_FUNCTION_REEXECUTED_GEOMETRY.json':'683287e4c5b9dee60cff344f067e115c02964a40366cb62c8ee487de83d4a8e6',
            n/'K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json':'e04c9990ebc2573467e8d95cd3e497a7a6059a9f12384f46507c3c1dfdc0eb60',
            n/'K4AI_INDEPENDENT_SOURCE_GPU_GEOMETRY_AUDIT.json':'a39adcaf8b71068e4a37ce5421a7927a6159e6a9fcd52aedcd4f4e6d8ef3143d'
          }
          for p,d in pinned.items():assert sha(p)==d,('SOURCE_SHA_MISMATCH',p,sha(p))
          original=json.loads((z/'K4Z_ORIGINAL_SOURCE_DENSE_7ROAD_CAMERA.json').read_text())
          assert sum(len(s['frames']) for s in original['sessions'])==82
          for s in original['sessions']:
            for f in s['frames']:
              p=z/f['file'];assert p.stat().st_size==f['bytes'] and sha(p)==f['sha256']
          study=json.loads((n/'K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json').read_text())
          assert study['originalSourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert study['Hz']==240 and study['B48']==7 and study['B51']==28
          assert study['errors']==[] and len(study['sessions'])==2
          assert [s['mode'] for s in study['sessions']]==['ultra','control']
          for s in study['sessions']:
            assert len(s['frames'])==len(s['masks'])==len(s['restored'])==7
            assert len(s['continuousNative240Hz']['records'])==721
            assert [r['nativeTick'] for r in s['continuousNative240Hz']['records']]==list(range(10680,11401))
            assert s['continuousNative240Hz']['meta']['sampleRateHz']==240
          assert study['ART']=='NOT_TESTED_HOLD' and study['RELEASE']==study['MERGE']=='HOLD'
          print('K4AI_PINNED_REAL_CHROMIUM_1442_NATIVE_TICK_AND_14_GPU_FRAME_SHA_PASS')
          PY
      - name: Replay strict K4Z original pixels + K4AF genuine GPU frame/mask depth + restorations
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy python3-pil
          python3 scripts/p101-r19a6p4r2f5k4ai-independent-source-pixel-gpu-audit.py \
            --k4z r19-evidence/r19a6p4r2f5k4z-source \
            --k4af r19-evidence/r19a6p4r2f5k4af-pinned \
            --k4ai r19-evidence/r19a6p4r2f5k4ai
      - name: Replay original B51 OBB and separation on 14 independently proven GPU anchors
        run: |
          node scripts/p101-r19a6p4r2f5k4ai-independent-seven-frame-source-geometry.mjs \
            r19-evidence/r19a6p4r2f5k4ai/K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json \
            r19-evidence/r19a6p4r2f5k4ai/K4AI_INDEPENDENT_SOURCE_GPU_GEOMETRY_AUDIT.json \
            r19-evidence/r19a6p4r2f5k4ai
      - name: Independently re-execute all 1442 original native ticks with source camera/OBB functions
        run: |
          node scripts/p101-r19a6p4r2f5k4ai-independent-native-240hz-geometry.mjs \
            r19-evidence/r19a6p4r2f5k4ai/K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json \
            r19-evidence/r19a6p4r2f5k4ah-parent/K4AH_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json \
            r19-evidence/r19a6p4r2f5k4ai
          node - <<'JS'
          const fs=require('node:fs'),p='r19-evidence/r19a6p4r2f5k4ai/';
          const x=JSON.parse(fs.readFileSync(p+'K4AI_240HZ_GEOMETRIC_WINDOWS.json'));
          if(x.decision!=='GEOMETRY_1442_NATIVE_TICKS_SOURCE_TECH_PASS_VISUAL_DURATION_ART_HOLD')process.exit(2);
          if(x.originalPhysicsTicks!==1442||x.trueGPUVerifiedGeometryAnchorCount!==14||x.independentTamperControls!==10)process.exit(3);
          if(x.continuousGPUVisualMaskCount!==0||x.actualVisualObstructionDuration!=='UNKNOWN_NOT_MEASURED')process.exit(4);
          if(x.modes.length!==2||x.modes.some(m=>m.nativeTicksValidated!==721))process.exit(5);
          if(x.modes.some(m=>m.originalK4AHRealGPUReferenceAnchorsMatched!==7))process.exit(6);
          if(x.officialARTAccepted!==0||x.slope2DNARecognizedMetres!==0||x.RELEASE!=='HOLD'||x.MERGE!=='HOLD')process.exit(7);
          const csv=fs.readFileSync(p+'K4AI_ORIGINAL_NATIVE_1442_TICKS.csv','utf8').trim().split('\n');
          if(csv.length!==1443)process.exit(8);
          console.log('K4AI_1442_GENUINE_SOURCE_NATIVE_TICKS_INDEPENDENT_ARTIFACT_REPLAY_PASS');
          console.log('K4AI_PHYSICAL_CAMERA_GEOMETRY_TECH_ONLY_GPU_VISUAL_DURATION_ART_RELEASE_HOLD');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AI_PINNED_SOURCE_1442_NATIVE_GEOMETRY_INDEPENDENT_REPLAY_ART_HOLD
          path: |
            r19-evidence/r19a6p4r2f5k4ai/K4AI_INDEPENDENT_SOURCE_GPU_GEOMETRY_AUDIT.json
            r19-evidence/r19a6p4r2f5k4ai/K4AI_SOURCE_FUNCTION_REEXECUTED_GEOMETRY.json
            r19-evidence/r19a6p4r2f5k4ai/K4AI_240HZ_GEOMETRIC_WINDOWS.json
            r19-evidence/r19a6p4r2f5k4ai/K4AI_1442_VERIFIED_NATIVE_SOURCE_TICKS.json
            r19-evidence/r19a6p4r2f5k4ai/K4AI_ORIGINAL_NATIVE_1442_TICKS.csv
            r19-evidence/r19a6p4r2f5k4ai/K4AI_NATIVE_240HZ_GEOMETRY_FINDINGS_JA.md
          retention-days: 7
          if-no-files-found: warn
