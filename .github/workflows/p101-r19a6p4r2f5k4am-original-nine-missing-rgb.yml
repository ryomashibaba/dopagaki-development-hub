name: DOPAGAKI K4AM original WebGL2 missing nine RGB source frames ART HOLD
on:
  push:
    branches: [research/k4aj-native-b51-gpu-depth-contiguous-window-20261103]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4am-*'
      - 'tests/p101-r19a6p4r2f5k4am-*'
      - '.github/workflows/p101-r19a6p4r2f5k4am-original-nine-missing-rgb.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4am-nine-original-source-rgb-independent
  cancel-in-progress: false
jobs:
  capture-only-nine-genuine-native-rgb-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source pinned and K4AM static syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          test "$(git hash-object scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs)" = 3096e5556189221d8411205a6cf96a1f5f5137bd
          node --check scripts/p101-r19a6p4r2f5k4am-genuine-original-nine-rgb-gaps.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4am-independent-nine-rgb-depth-audit.py
          python3 -m py_compile tests/p101-r19a6p4r2f5k4am-independent-native-rgb-depth.test.py
      - name: Install read-only audit dependencies and run genuine-shape synthetic negatives
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-numpy python3-pil
          python3 tests/p101-r19a6p4r2f5k4am-independent-native-rgb-depth.test.py
      - name: Retrieve immutable K4AI native 1442-tick original evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k4ai-pinned
          gh run download 41560614512 \
            -n K4AI_GENUINE_1442_240HZ_CAMERA_B51_OBB_GEOMETRY_ART_HOLD \
            -D r19-evidence/r19a6p4r2f5k4ai-pinned
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          f=Path('r19-evidence/r19a6p4r2f5k4ai-pinned/K4AI_GENUINE_NATIVE_IN_RENDER_DEPTH_REPORT.json')
          assert sha256(f.read_bytes()).hexdigest()=='e04c9990ebc2573467e8d95cd3e497a7a6059a9f12384f46507c3c1dfdc0eb60'
          d=json.loads(f.read_text())
          assert d['originalSourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert d['errors']==[] and len(d['sessions'])==2
          for session in d['sessions']:
            a=session['continuousNative240Hz']['records']
            assert len(a)==721 and [r['nativeTick'] for r in a]==list(range(10680,11401))
          print('K4AM_PINNED_K4AI_GENUINE_NATIVE_1442_TICKS_PASS')
          PY
      - name: Build protected original-source private replay renderer
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Capture nine missing genuine original WebGL2 RGB and B51 group masks
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4am-genuine-original-nine-rgb-gaps.mjs
      - name: Independent original-native PNG SHA, RGB restoration and full GPU array audit
        run: |
          python3 scripts/p101-r19a6p4r2f5k4am-independent-nine-rgb-depth-audit.py \
            --k4ai r19-evidence/r19a6p4r2f5k4ai-pinned \
            --k4am r19-evidence/r19a6p4r2f5k4am
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('r19-evidence/r19a6p4r2f5k4am')
          x=json.loads((root/'K4AM_INDEPENDENT_NINE_SOURCE_RGB_AUDIT.json').read_text())
          assert x['verdict']=='K4AM_SOURCE_RGB_AND_GROUP_DEPTH_TECH_CANDIDATE_ART_HOLD'
          assert x['sourceNativeTicks']==9 and x['realSourcePNGProofs']==27
          assert x['inRenderDepthReadbackRequests']==27
          assert x['officialARTAccepted']==x['slope2DNAMetres']==x['newModels']==x['newColliders']==0
          assert x['ART']=='NOT_TESTED_HOLD' and x['RELEASE']==x['MERGE']=='HOLD'
          print('K4AM_9_GENUINE_SOURCE_RGB_27_PROOFS_TECH_CANDIDATE_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AM_9_GENUINE_ORIGINAL_SOURCE_RGB_27_GPU_DEPTH_PROOFS_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4am/
          retention-days: 7
          if-no-files-found: warn
