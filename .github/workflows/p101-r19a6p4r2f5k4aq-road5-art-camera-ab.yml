name: DOPAGAKI K4AQ Road5 material art genuine original-camera AB HOLD
on:
  push:
    branches:
      - research/k4aq-road5-art-direction-rebuild-20261103
    paths:
      - 'web/p101-k4aq-*'
      - 'scripts/p101-r19a6p4r2f5k4aq-*'
      - 'tests/p101-r19a6p4r2f5k4aq-*'
      - '.github/workflows/p101-r19a6p4r2f5k4aq-road5-art-camera-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-k4aq-road5-genuine-art-separate-from-k4am-k4an
  cancel-in-progress: false
jobs:
  authentic-road5-screen-art-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect source and static source-to-art contracts
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check web/p101-k4aq-road5-civic-rift-material-art.mjs
          node --check scripts/p101-r19a6p4r2f5k4aq-private-road5-art-pack.mjs
          node --check scripts/p101-r19a6p4r2f5k4aq-true-camera-road5-art-ab.mjs
          node --test tests/p101-r19a6p4r2f5k4aq-road5-art.test.mjs
      - name: Build genuinely isolated private original renderer with material-art A/B
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          node scripts/p101-r19a6p4r2f5k4aq-private-road5-art-pack.mjs
          node --check dist-private/r19a6p4r2f5k4aq/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Genuine Chromium WebGL2 Road5 original native camera AB
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4aq-true-camera-road5-art-ab.mjs
      - name: Independent capture-report checks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('r19-evidence/k4aq')
          x=json.loads((r/'K4AQ_TRUE_CAMERA_ART_AB_REPORT.json').read_text())
          assert x['sourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert x['originalPhysicsHz']==240 and x['realB48Roads']==7 and x['realB51Movers']==28
          assert len(x['comparisons'])==6 and len(x['runs'])==4
          assert {t['tick'] for t in x['comparisons']}=={11320,11341,11369,11259,11278,11307}
          assert all(t['cameraAndBallIdentical'] and t['sourcePhysicsPreserved'] for t in x['comparisons'])
          assert x['candidateART']=='NOT_TESTED_HOLD' and x['officialARTAccepted']==x['slope2DNAMetres']==0
          assert x['HUMAN']==x['SAT']==x['CCD']==x['FPS']==x['RELEASE']==x['MERGE']=='HOLD'
          for t in x['comparisons']:
            assert (r/t['original']['file']).exists()
            assert (r/t['candidate']['file']).exists()
          print('K4AQ_6_REAL_SOURCE_CAMERA_AB_TECH_CAPTURE_PASS_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AQ_GENUINE_ROAD5_MATERIAL_ART_AB_NOT_ACCEPTED
          path: r19-evidence/k4aq/
          retention-days: 14
          if-no-files-found: warn
