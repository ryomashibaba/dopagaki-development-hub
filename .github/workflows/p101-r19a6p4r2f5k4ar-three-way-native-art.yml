name: DOPAGAKI K4AR genuine Road5 3-way architecture-vs-sky pixels ART HOLD
on:
  push:
    branches:
      - research/k4ar-road5-massing-and-true-mesh-evidence-20261103
    paths:
      - 'web/p101-k4aq-*'
      - 'scripts/p101-r19a6p4r2f5k4aq-*'
      - 'scripts/p101-r19a6p4r2f5k4ar-*'
      - '.github/workflows/p101-r19a6p4r2f5k4ar-three-way-native-art.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-k4ar-road5-independent-original-sky-architecture
  cancel-in-progress: false
jobs:
  true-camera-road5-mesh-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable source and isolated scripts
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check web/p101-k4aq-road5-civic-rift-material-art.mjs
          node --check scripts/p101-r19a6p4r2f5k4aq-private-road5-art-pack.mjs
          node --check scripts/p101-r19a6p4r2f5k4ar-three-way-art-evidence.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4ar-independent-architecture-pixel-proof.py
          node --test tests/p101-r19a6p4r2f5k4aq-road5-art.test.mjs
      - name: Build isolated original WebGL2 source and K4AR sky-only control
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          node scripts/p101-r19a6p4r2f5k4aq-private-road5-art-pack.mjs
          node --check dist-private/r19a6p4r2f5k4aq/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: True Chromium native 240Hz six original / six sky / six full architecture
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4ar-three-way-art-evidence.mjs
      - name: Independently compare exact SHA PNG geometry pixels, not sky alone
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pil
          python3 scripts/p101-r19a6p4r2f5k4ar-independent-architecture-pixel-proof.py --source r19-evidence/k4ar
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('r19-evidence/k4ar/K4AR_INDEPENDENT_ARCHITECTURE_PIXEL_REVIEW.json')
          x=json.loads(p.read_text())
          assert x['verdict']=='TRUE_CAMERA_TRIAD_ARCHITECTURE_PIXEL_PROOF_ONLY_ART_HOLD'
          assert x['nativeCameraTriplets']==6 and x['verifiedPNG']==18
          assert x['originalSourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert x['ART']=='NOT_TESTED_HOLD'
          assert x['officialARTAccepted']==x['slope2DNAMetres']==0
          assert x['RELEASE']==x['MERGE']=='HOLD'
          print('K4AR_ARCHITECTURE_VISIBLE_FROM_TRUE_CAMERA_SOURCE_TECH_ONLY_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AR_18_GENUINE_ORIGINAL_SKY_MESH_RGB_ART_HOLD
          path: r19-evidence/k4ar/
          retention-days: 14
          if-no-files-found: warn
