name: DOPAGAKI K4AS original 24 WebGL2 Road5 full-screen art material views HOLD
on:
  push:
    branches:
      - research/k4as-road5-native-screen-material-rescue-20261103
    paths:
      - 'web/p101-k4as-*'
      - 'scripts/p101-r19a6p4r2f5k4as-*'
      - 'tests/p101-r19a6p4r2f5k4as-*'
      - '.github/workflows/p101-r19a6p4r2f5k4as-original-four-way-screen-material.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-k4as-native-screen-material-dedicated-independent
  cancel-in-progress: false
jobs:
  genuine-24-original-game-camera-material-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce protected native original and K4AS complete source static QA
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check web/p101-k4as-road5-original-screen-material-system.mjs
          node --check scripts/p101-r19a6p4r2f5k4as-private-road5-material-pack.mjs
          node --check scripts/p101-r19a6p4r2f5k4as-original-source-four-way-art.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4as-independent-four-way-review.py
          node --test tests/p101-r19a6p4r2f5k4as-original-screen-material.test.mjs
          node --test tests/p101-r19a6p4r2f5k4aq-road5-art.test.mjs
      - name: Build unchanged original private native WebGL2 Road5 and isolated K4AS clone
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          node scripts/p101-r19a6p4r2f5k4aq-private-road5-art-pack.mjs
          node scripts/p101-r19a6p4r2f5k4as-private-road5-material-pack.mjs
          node --check dist-private/r19a6p4r2f5k4as/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: True Chromium 24 road-native original sky city material views
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4as-original-source-four-way-art.mjs
      - name: Independent six native poses and original 24 PNG exact SHA review
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pil
          python3 scripts/p101-r19a6p4r2f5k4as-independent-four-way-review.py --root r19-evidence/k4as
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=Path('r19-evidence/k4as')
          doc=json.loads((r/'K4AS_INDEPENDENT_FOUR_WAY_RGB_AUDIT.json').read_text())
          assert doc['verdict']=='SOURCE_CAMERA_MATERIAL_RGB_TECH_ONLY_ART_HOLD'
          assert doc['verifiedTrueWebGL2PNGs']==24 and len(doc['results'])==6
          assert doc['ART']=='NOT_TESTED_HOLD'
          assert doc['formalArtAccepted']==doc['slope2DNAMetres']==0
          assert doc['HUMAN']==doc['SAT']==doc['CCD']==doc['FPS']=='HOLD'
          assert doc['RELEASE']==doc['MERGE']=='HOLD'
          assert (r/'K4AS_AUTHENTIC_FOUR_WAY_ROAD5_CONTACT.png').exists()
          print('K4AS_TRUE_SOURCE_24_PNG_MATERIAL_ONLY_TECH_HOLD_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AS_24_NATIVE_ROAD5_ORIGINAL_SKY_CITY_MATERIAL_ART_HOLD
          path: r19-evidence/k4as/
          retention-days: 14
          if-no-files-found: warn
