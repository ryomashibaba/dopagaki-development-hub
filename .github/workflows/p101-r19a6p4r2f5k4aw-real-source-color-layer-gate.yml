name: DOPAGAKI K4AW actual Road5 pink cyan source draw-layer attribution
on:
  push:
    branches:
      - research/k4aw-road5-native-layer-attribution-dcc-first-20261103
    paths:
      - 'scripts/p101-r19a6p4r2f5k4aw-*'
      - '.github/workflows/p101-r19a6p4r2f5k4aw-real-source-color-layer-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-k4aw-original-240hz-road5-draw-layer-isolation
  cancel-in-progress: false
jobs:
  actual-source-color-layer-investigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact frozen original and only source-private draw-subtraction scripts
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-r19a6p4r2f5k4aw-private-original-layer-source-audit.mjs
          node --check scripts/p101-r19a6p4r2f5k4aw-native-source-visual-layer-capture.mjs
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4aw-independent-real-layer-pixels.py
      - name: Build original 240Hz B48/B51 source-private K4AV and K4AW instrumented copy
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          node scripts/p101-r19a1-private-original-native-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k3b-private-camera-pack.mjs
          node scripts/p101-r19a6p4r2f5k4ab-private-source-draw-provenance.mjs
          node scripts/p101-r19a6p4r2f5k4ad-private-original-mesh-depth-replay.mjs
          node scripts/p101-r19a6p4r2f5k4aq-private-road5-art-pack.mjs
          node scripts/p101-r19a6p4r2f5k4as-private-road5-material-pack.mjs
          node scripts/p101-r19a6p4r2f5k4at-private-source-civic-canyon-pack.mjs
          node scripts/p101-r19a6p4r2f5k4au-private-native-lit-road5-pack.mjs
          node scripts/p101-r19a6p4r2f5k4av-full-screen-original-art-pack.mjs
          node scripts/p101-r19a6p4r2f5k4aw-private-original-layer-source-audit.mjs
          node --check dist-private/r19a6p4r2f5k4aw/drive3d.mjs
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
      - name: Capture original source Road5 B51 16 true native GPU PNG layer variants
        run: |
          npx playwright install --only-shell chromium
          node scripts/p101-r19a6p4r2f5k4aw-native-source-visual-layer-capture.mjs
      - name: Independently attribute original on-road bright pink and cyan to source buffer groups
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pil python3-numpy
          /usr/bin/python3 scripts/p101-r19a6p4r2f5k4aw-independent-real-layer-pixels.py --root r19-evidence/k4aw
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('r19-evidence/k4aw')
          d=json.loads((p/'K4AW_INDEPENDENT_REAL_SOURCE_LAYER_PIXEL_CAUSALITY.json').read_text())
          assert d['originalSourceBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
          assert d['trueSourcePNGs']==16 and len(d['originalRoad5LayerEvidence'])==2
          assert d['sourceB48']==7 and d['sourceB51']==28 and d['nativeHz']==240
          assert d['formalARTAccepted']==0 and d['slope2DNAMetres']==0
          assert d['ART']=='NOT_TESTED_HOLD'
          assert all(d[k]=='HOLD' for k in ('HUMAN','SAT','CCD','FPS','RELEASE','MERGE'))
          assert (p/'K4AW_ORIGINAL_NATIVE_SOURCE_LAYER_CONTACT.png').exists()
          print('K4AW_REAL_16_SOURCE_LAYER_GENUINE_COLOR_PIXEL_CAUSALITY_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4AW_ORIGINAL_ROAD5_16_INDIVIDUAL_GPU_COLOR_LAYERS_HOLD
          path: r19-evidence/k4aw/
          retention-days: 14
          if-no-files-found: warn
