name: DOPAGAKI K4T true original WebGL2 versus proxy site annotated research HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-r19a6p4r2f5k4t-*'
      - '.github/workflows/p101-r19a6p4r2f5k4t-original-webgl2-proxy-review.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dopagaki-k4t-true-source-screen-proxy
  cancel-in-progress: true
jobs:
  eight-source-screens-two-positions-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Immutable source and Python syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-r19a6p4r2f5k4t-original-webgl2-proxy-review.py
      - name: Download real original A5 WebGL2, K camera, K4S source BVH report with original Github artifact IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r19-evidence/r19a6p4r2f5k r19-evidence/r19a6p4r2f5k4r r19-evidence/r19a6p4r2f5k4s
          gh run download 41312758260 -n R2F5K_ORIGINAL_SOURCE_7ROAD_CAMERA_COVERAGE_ART_HOLD -D r19-evidence/r19a6p4r2f5k
          gh run download 41351118263 -n R2F5K4R_ONE_NATIVE_MARKET_TRUE_ROAD0_16_WEBGL2_ART_HOLD -D r19-evidence/r19a6p4r2f5k4r
          gh run download 41352432473 -n K4S_GENUINE_ORIGINAL_7ROAD_42_CAMERA_ORIGINAL_A5_BVH_PROXY_ONLY -D r19-evidence/r19a6p4r2f5k4s
          test -s r19-evidence/r19a6p4r2f5k/R2F5K_REAL_ORIGINAL_EXTENDED_CAMERA_COVERAGE.json
          test -s r19-evidence/r19a6p4r2f5k4r/K4R_REAL_ORIGINAL_WEBGL2_16_IMAGES.json
          test -s r19-evidence/r19a6p4r2f5k4s/K4S_REAL_SEVEN_ROADS_ORIGINAL_A5_OCCLUSION_ONLY.json
      - name: Generate eight authenticated original-camera screenshots with visibly annotated proxy boxes
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pil
          python3 scripts/p101-r19a6p4r2f5k4t-original-webgl2-proxy-review.py \
            --k4r-folder r19-evidence/r19a6p4r2f5k4r \
            --k-camera r19-evidence/r19a6p4r2f5k/R2F5K_REAL_ORIGINAL_EXTENDED_CAMERA_COVERAGE.json \
            --k4s-report r19-evidence/r19a6p4r2f5k4s/K4S_REAL_SEVEN_ROADS_ORIGINAL_A5_OCCLUSION_ONLY.json \
            --output r19-evidence/r19a6p4r2f5k4t
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('r19-evidence/r19a6p4r2f5k4t')
          a=json.loads((p/'K4T_REAL_SOURCE_WEBGL2_PROXY_REVIEW.json').read_text())
          assert a['screenshotsUsed']==8 and a['panelComparisonsProduced']==8
          assert len(a['results'])==16 and a['art']=='HOLD'
          assert a['newModels']==a['newColliders']==a['officialArtAcceptance']==0
          assert len(list(p.glob('K4T_*_SAME_ORIGINAL_WEBGL2_TWOSITE_PROXY_COMPARISON.png')))==8
          assert len(list(p.glob('K4T_*_4TICK_TRUE_ORIGINAL_WEBGL2_PROXY_SITE_SHEET.jpg')))==2
          print('K4T_ORIGINAL_8_SHA_VERIFIED_WEbGL2_SCREENSHOTS_PROXY_OVERLAYS_RESEARCH_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K4T_EIGHT_GENUINE_A5_WEBGL2_TWO_ROAD0_PROXY_SITE_COMPARISONS_ART_HOLD
          path: r19-evidence/r19a6p4r2f5k4t/
          retention-days: 7
          if-no-files-found: warn
