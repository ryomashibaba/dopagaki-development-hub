name: W9-C1 G5-C2 paired manual QA (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c1-pair-qa.mjs'
      - 'web/p101-w9c1-pair-qa.html'
      - 'tests/p101-w9c1-pair-qa.test.mjs'
      - 'tests/browser/p101-w9c1-pair-qa.spec.mjs'
      - 'scripts/build.mjs'
      - 'scripts/pack-p101-b5-review.mjs'
      - '.github/workflows/p101-w9c1-g5c2-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c1-g5c2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pair-review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DOPAGAKI_BUILD_DIR: dist-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paired 28m-vs-14m data validation, privacy and HOLD assertions
        run: node --test tests/p101-w9c1-pair-qa.test.mjs
      - name: Install and configure Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build exactly the PR candidate site
        run: npm run build:site
      - name: Local-only two-file review and intentional failure tests
        run: npx playwright test tests/browser/p101-w9c1-pair-qa.spec.mjs
      - name: Validate one-click Windows review package
        run: |
          node scripts/pack-p101-b5-review.mjs
          test -f b5-manual-review/RUN_W9C1_COMPARE_REPORTS.cmd
          test -f b5-manual-review/w9c1-pair-qa/comparison.mjs
          test -f b5-manual-review/w9c1-pair-qa/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c1-g5c2-local-review-${{ github.run_id }}
          path: |
            b5-manual-review/
            test-results/**/w9c1-g5c2-*.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
