name: W9-C2 G2 real-WebGL S-crest preview (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-s-crest-build.mjs'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - 'web/drive3d.html'
      - 'web/p101-b5-manual-qa.mjs'
      - 'web/p101-overdrive.mjs'
      - 'tests/p101-w9c2-s-crest.test.mjs'
      - 'tests/p101-rebound-recovery.test.mjs'
      - 'tests/browser/p101-w9c2-s-crest.spec.mjs'
      - '.github/workflows/p101-w9c2-g2-webgl-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g2-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-road:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DOPAGAKI_BUILD_DIR: dist-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify separate true 3D B48 road, protected Gold and nonlethal recoil
        run: node --test tests/p101-w9c2-s-crest.test.mjs tests/p101-rebound-recovery.test.mjs tests/p101-w9c1-physical.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build independent PR-only physical road previews
        run: npm run build:site
      - name: Actual WebGL both S-crest variants and frozen baseline check
        run: npx playwright test tests/browser/p101-w9c2-s-crest.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g2-physical-webgl-${{ github.run_id }}
          path: |
            test-results/**/w9c2-*.png
            test-results/**/w9c2-g2-webgl-audit.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
