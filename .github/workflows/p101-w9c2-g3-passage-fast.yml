name: W9-C2 G3 true-240Hz high-speed passage matrix (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g3-native-passage.mjs'
      - 'tests/p101-w9c2-g3-native.test.mjs'
      - 'scripts/p101-w9c2-s-crest-build.mjs'
      - '.github/workflows/p101-w9c2-g3-passage-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g3-passage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-native:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: G3 actual 240Hz dynamics and baseline differential
        run: node --test tests/p101-w9c2-g3-native.test.mjs tests/p101-w9c2-s-crest.test.mjs tests/p101-rebound-recovery.test.mjs
      - name: High-speed entrance, edge clearance and heading-demand nine-case report
        run: |
          node scripts/p101-w9c2-g3-native-passage.mjs | tee W9C2_G3_RAW.jsonl
          node --input-type=module -e "
            import fs from 'node:fs';
            const s=fs.readFileSync('W9C2_G3_RAW.jsonl','utf8').trim();
            const prefix='W9C2_G3_NATIVE_MATRIX ';
            if(!s.startsWith(prefix))throw Error('G3 matrix missing');
            const d=JSON.parse(s.slice(prefix.length));
            if(d.cases.length!==9||d.productionApproved!==false||
              d.cases.some(c=>c.actual.physicsHz!==240||c.actual.machineBodies!==28||
              !c.actual.readyOnRealPhysicalRoad))throw Error('G3 no native/honest results');
            fs.writeFileSync('W9C2_G3_FULL_EVIDENCE.json',JSON.stringify(d,null,2)+'\n');
            for(const c of d.cases)console.log('W9C2_G3_ROW',JSON.stringify({
              kind:c.kind,speed:c.speed,pass:c.actual.exited,status:c.actual.status,
              furthestU:c.actual.maxU,margin:c.actual.minimumObservedMarginMeters,
              airSeconds:c.actual.airborneSeconds,
              radius:c.shape.minimumHorizontalTurnRadiusMeters,
              highSpeedDemand:c.shape.theoreticalHorizontalAccelDemandMps2['150']
            }));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g3-native-sweep-${{ github.run_id }}
          path: |
            W9C2_G3_FULL_EVIDENCE.json
            W9C2_G3_RAW.jsonl
          if-no-files-found: ignore
          retention-days: 10
