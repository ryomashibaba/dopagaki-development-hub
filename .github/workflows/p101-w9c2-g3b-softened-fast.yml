name: W9-C2 G3B high-speed geometry correction study (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-s-crest-build.mjs'
      - 'scripts/p101-w9c2-g3-native-passage.mjs'
      - 'tests/p101-w9c2-g3b-candidate.test.mjs'
      - '.github/workflows/p101-w9c2-g3b-softened-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g3b-correction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Both real skins and frozen original G2/Gold safety
        run: node --test tests/p101-w9c2-g3b-candidate.test.mjs tests/p101-w9c2-s-crest.test.mjs
      - name: Actual native high-speed physical correction study
        run: |
          node scripts/p101-w9c2-g3-native-passage.mjs --g3b > W9C2_G3B_RAW.jsonl
          node --input-type=module -e "
            import fs from 'node:fs';
            const line=fs.readFileSync('W9C2_G3B_RAW.jsonl','utf8').trim();
            const prefix='W9C2_G3B_NATIVE_MATRIX ';
            if(!line.startsWith(prefix))throw Error('No G3B report');
            const d=JSON.parse(line.slice(prefix.length));
            if(d.cases.length!==9||d.promotion!=='OFFLINE_DIAGNOSTIC_ONLY_NOT_SELECTABLE'||
              d.cases.some(c=>!c.actual.readyOnRealPhysicalRoad||c.actual.physicsHz!==240||c.actual.machineBodies!==28))
              throw Error('Incorrect physical or promotion guarantee');
            fs.writeFileSync('W9C2_G3B_FULL_EVIDENCE.json',JSON.stringify(d,null,2)+'\n');
            for(const c of d.cases)console.log('W9C2_G3B_ROW',JSON.stringify({
              kind:c.kind,speed:c.speed,exited:c.actual.exited,
              outcome:c.actual.status,u:c.actual.maxU,
              airborne:c.actual.airborneSeconds,margin:c.actual.minimumObservedMarginMeters,
              radius:c.shape.minimumHorizontalTurnRadiusMeters,contact:c.actual.contacts
            }));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g3b-offline-native-${{ github.run_id }}
          path: |
            W9C2_G3B_FULL_EVIDENCE.json
            W9C2_G3B_RAW.jsonl
          if-no-files-found: ignore
          retention-days: 10
