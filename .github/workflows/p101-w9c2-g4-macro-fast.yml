name: W9-C2 G4 true-1800m macro-arc native QA (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4-macro-arc-build.mjs'
      - 'scripts/p101-w9c2-g4-native-matrix.mjs'
      - 'tests/p101-w9c2-g4-macro-arc.test.mjs'
      - '.github/workflows/p101-w9c2-g4-macro-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4-macro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native geometry and Gold isolation tests
        run: node --test tests/p101-w9c2-g4-macro-arc.test.mjs tests/p101-w9c2-g3b-candidate.test.mjs
      - name: Nine local high-speed B48 240Hz actual runs
        run: |
          node scripts/p101-w9c2-g4-native-matrix.mjs > W9C2_G4_RAW.jsonl
          node --input-type=module -e "
            import fs from 'node:fs';
            const s=fs.readFileSync('W9C2_G4_RAW.jsonl','utf8').trim();
            const p='W9C2_G4_NATIVE_MATRIX ';
            if(!s.startsWith(p))throw Error('Missing real G4 matrix');
            const d=JSON.parse(s.slice(p.length));
            if(d.cases.length!==9||d.productionApproved!==false||
              d.cases.some(c=>c.nativeHz!==240||c.realMachines!==28||!c.syntheticLocalStart))
              throw Error('Incorrect native or provenance constraints');
            fs.writeFileSync('W9C2_G4_FULL_EVIDENCE.json',JSON.stringify(d,null,2)+'\n');
            for(const c of d.cases)console.log('W9C2_G4_ROW',JSON.stringify({
              kind:c.kind,speed:c.startSpeedMps,exit:c.exited,air:c.longestAirSeconds,
              status:c.status,u:c.maxU,margin:c.minimumObservedEdgeMargin,
              contacts:c.contactModes,failure:c.failure
            }));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g4-macro-physics-${{ github.run_id }}
          path: |
            W9C2_G4_FULL_EVIDENCE.json
            W9C2_G4_RAW.jsonl
          if-no-files-found: ignore
          retention-days: 10
