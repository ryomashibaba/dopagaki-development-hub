name: W9-C2 G4B actual-speed and wide macro-arc physics QA (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4-macro-arc-build.mjs'
      - 'scripts/p101-w9c2-g4-native-matrix.mjs'
      - 'tests/p101-w9c2-g4b-geometry.test.mjs'
      - '.github/workflows/p101-w9c2-g4b-physics-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4b-physical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: G4B native geometry and immutable Gold/G4 evidence
        run: node --test tests/p101-w9c2-g4b-geometry.test.mjs tests/p101-w9c2-g4-macro-arc.test.mjs
      - name: Measure authentic 52mps-start W7F Gold section-IV arrival
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import {runW7Trial,W7_TRIALS} from './scripts/p101-a13-w7-candidate-matrix.mjs';
            const trial=W7_TRIALS.find(x=>x.id==='w7f-gentle');
            const result=runW7Trial(trial,{maxSeconds:68});
            const roadIV=result.trace.filter(x=>x.section===3);
            fs.writeFileSync('W9C2_G4B_NATURAL_GOLD_ARRIVAL.json',
              JSON.stringify({source:'W7F original 52mps start00 scripted',finished:result.finished,
                peak:result.peakMps,sectionIVTrace:roadIV,fullTrace:result.trace},null,2)+'\n');
            console.log('G4B_GOLD_NATURAL_ARRIVAL',JSON.stringify({
              finished:result.finished,sectionIVTrace:roadIV,peak:result.peakMps
            }));
            if(!result.finished||roadIV.length===0)throw Error('Gold baseline natural arrival invalid');
          "
      - name: G4B genuine native 100/125/150/180mps 12-case local matrix
        run: |
          node scripts/p101-w9c2-g4-native-matrix.mjs --g4b > W9C2_G4B_RAW.jsonl
          node --input-type=module -e "
            import fs from 'node:fs';
            const s=fs.readFileSync('W9C2_G4B_RAW.jsonl','utf8').trim(),p='W9C2_G4B_NATIVE_MATRIX ';
            if(!s.startsWith(p))throw Error('No G4B native matrix');
            const d=JSON.parse(s.slice(p.length));
            if(d.cases.length!==12||d.productionApproved!==false||
              d.cases.some(c=>c.nativeHz!==240||c.realMachines!==28||!c.syntheticLocalStart))
              throw Error('G4B native or HOLD integrity failed');
            fs.writeFileSync('W9C2_G4B_FULL_EVIDENCE.json',JSON.stringify(d,null,2)+'\n');
            for(const c of d.cases)console.log('W9C2_G4B_ROW',JSON.stringify({
              kind:c.kind,speed:c.startSpeedMps,exited:c.exited,status:c.status,
              maxU:c.maxU,air:c.longestAirSeconds,margin:c.minimumObservedEdgeMargin,
              failure:c.failure,contacts:c.contactModes
            }));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g4b-real-native-${{ github.run_id }}
          path: |
            W9C2_G4B_NATURAL_GOLD_ARRIVAL.json
            W9C2_G4B_FULL_EVIDENCE.json
            W9C2_G4B_RAW.jsonl
          if-no-files-found: ignore
          retention-days: 10
