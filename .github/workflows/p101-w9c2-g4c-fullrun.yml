name: W9-C2 G4C real start00 7-road 240Hz scripted QA (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4-fullrun.mjs'
      - '.github/workflows/p101-w9c2-g4c-fullrun.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4c-realstart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-real-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm frozen source, G4B real geometry and machine integrity
        run: node --test tests/p101-w9c2-g4b-geometry.test.mjs
      - name: Full 52mps start00 actual native three-candidate evidence
        run: |
          node scripts/p101-w9c2-g4-fullrun.mjs > W9C2_G4C_RAW.jsonl
          node --input-type=module -e "
            import fs from 'node:fs';
            const s=fs.readFileSync('W9C2_G4C_RAW.jsonl','utf8').trim(),p='W9C2_G4C_FULL_RUN ';
            if(!s.startsWith(p))throw Error('No G4C actual-start evidence');
            const d=JSON.parse(s.slice(p.length));
            if(d.runs.length!==3||d.humanApproval!=='HOLD'||d.runs.some(x=>
              x.startIndex!==0||x.startSpeedMps!==52||x.actualNativeHz!==240||
              x.machines!==28||x.productionApproved!==false))
              throw Error('G4C invalid native/start/HOLD metadata');
            fs.writeFileSync('W9C2_G4C_FULL_EVIDENCE.json',JSON.stringify(d,null,2)+'\n');
            for(const r of d.runs)console.log('W9C2_G4C_RESULT',JSON.stringify({
              kind:r.kind,finished:r.finished,status:r.status,
              sections:r.sectionsVisited,sectionIVSeconds:r.sectionIVSeconds,
              peak:r.peakSpeedMps,time:r.elapsedSeconds,air:r.longestAirSeconds,
              contacts:r.movingContacts,failure:r.failure
            }));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g4c-actual-start-${{ github.run_id }}
          path: |
            W9C2_G4C_FULL_EVIDENCE.json
            W9C2_G4C_RAW.jsonl
          if-no-files-found: ignore
          retention-days: 10
