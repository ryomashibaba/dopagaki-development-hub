name: W9-C2 G4D Gold-preserving skyway GPU QA (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4d-skyways.mjs'
      - 'web/drive3d.mjs'
      - 'scripts/build.mjs'
      - 'tests/p101-w9c2-g4d-skyways.test.mjs'
      - '.github/workflows/p101-w9c2-g4d-visual-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4d-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gold immutability and finite GPU skyway geometry
        run: node --test tests/p101-w9c2-g4d-skyways.test.mjs tests/p101-w9c1-g5b-skyline.test.mjs
      - name: Build private preview with G4D ESM present and no default activation
        run: |
          node scripts/build.mjs private
          test -s dist-private/drive3d/p101-w9c2-g4d-skyways.mjs
          grep -q 'g4dVisualOptIn' dist-private/drive3d/drive3d.mjs
          grep -q 'g4dOutboardSkyways' dist-private/drive3d/drive3d.mjs
          node --check dist-private/drive3d/p101-w9c2-g4d-skyways.mjs
          node --check dist-private/drive3d/drive3d.mjs
          echo G4D_GOLD_ONLY_VISUAL_BUILD_PASS
