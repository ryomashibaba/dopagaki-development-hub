name: W9-C2 G4D real WebGL Gold skyline screenshot audit (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'tests/browser/p101-w9c2-g4d-gold-skyways.spec.mjs'
      - 'web/p101-w9c2-g4d-skyways.mjs'
      - 'web/drive3d.mjs'
      - '.github/workflows/p101-w9c2-g4d-webgl-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4d-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matched-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      DOPAGAKI_BUILD_DIR: dist-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build local PR-only visual preview (not published)
        run: npm run build:site
      - name: Actual Chromium Gold section IV matched OFF/ON GPU screenshots
        run: npx playwright test tests/browser/p101-w9c2-g4d-gold-skyways.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g4d-gold-real-webgl-${{ github.run_id }}
          path: |
            test-results/**/w9c2-g4d-*.png
            test-results/**/w9c2-g4d-real-webgl-audit.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
