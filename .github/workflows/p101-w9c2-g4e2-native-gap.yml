name: W9-C2 G4E-2 true physical void and natural landing native QA (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e2-true-gap-build.mjs'
      - 'scripts/p101-w9c2-g4e2-native-gap-probe.mjs'
      - 'tests/p101-w9c2-g4e2-gap.test.mjs'
      - '.github/workflows/p101-w9c2-g4e2-native-gap.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e2-true-gap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physical-void:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real 3D collider separation, no midpoint support, 28 unchanged moving machines
        run: node --test tests/p101-w9c2-g4e2-gap.test.mjs
      - name: Real 240Hz full start00 trajectory, record any failure without faking PASS
        run: |
          node scripts/p101-w9c2-g4e2-native-gap-probe.mjs > g4e2-raw.txt
          node --input-type=module -e '
          import fs from "node:fs";
          const raw=fs.readFileSync("g4e2-raw.txt","utf8");
          const report=JSON.parse(raw.slice(raw.indexOf("{")));
          if(report.actualHz!==240||report.actual28MovingBodies!==28||!report.noMidpointFloor||!report.fromRealStart00)throw Error("Physical evidence integrity failed");
          const verdict=report.gapAirborneObserved&&report.landedOnNewPhysicalRoad&&report.finished?"NATIVE_GAP_AND_FULLRUN_PASS":"NATIVE_GAP_NOT_YET_PROVEN";
          fs.writeFileSync("g4e2-gap-verdict.json",JSON.stringify({verdict,report,humanFairness:"HOLD",productionApproved:false},null,2));
          console.log(JSON.stringify({verdict,status:report.status,air:report.gapAirborneObserved,landing:report.landedOnNewPhysicalRoad,finished:report.finished,failure:report.failure}));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e2-real-gap-native-evidence-${{ github.run_id }}
          path: |
            g4e2-raw.txt
            g4e2-gap-verdict.json
          if-no-files-found: ignore
          retention-days: 10
