name: W9-C2 G4E-2 private physical-road WebGL preview (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - 'web/p101-b5-manual-qa.mjs'
      - 'tests/browser/p101-w9c2-g4e2-optin.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e2-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e2-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      DOPAGAKI_BUILD_DIR: dist-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build PR-only preview (no deployment)
        run: npm run build:site
      - name: Check actual Chromium opt-in road trial selector
        run: npx playwright test tests/browser/p101-w9c2-g4e2-optin.spec.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: g4e2-webgl-failure-${{ github.run_id }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
