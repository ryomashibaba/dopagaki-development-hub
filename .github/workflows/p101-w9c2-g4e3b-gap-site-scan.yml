name: W9-C2 G4E-3B four-site real-gap physical scan (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e3b-site-scan.mjs'
      - '.github/workflows/p101-w9c2-g4e3b-gap-site-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e3b-site-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real 240Hz 52m/s start00, four different physical gap positions
        run: |
          node scripts/p101-w9c2-g4e3b-site-scan.mjs > g4e3b-raw.txt
          node --input-type=module -e '
          import fs from "node:fs";
          const raw=fs.readFileSync("g4e3b-raw.txt","utf8");
          const data=JSON.parse(raw.slice(raw.indexOf("{")));
          if(data.results.length!==4||data.results.some(r=>r.actualHz!==240||
           r.realMovingBodies!==28||!r.realStart00||r.fullGuideSegments!==7||
           !r.originalSplinePreserved||r.realGapMeters<5))
           throw Error("Site scan evidence integrity failure");
          fs.writeFileSync("g4e3b-site-verdict.json",
           JSON.stringify({schema:data.schema,rankedByNativeEvidence:data.rankedByNativeEvidence,
            human:"HOLD",production:"HOLD"},null,2));
          console.log(JSON.stringify(data.rankedByNativeEvidence));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e3b-real-gap-site-scan-${{ github.run_id }}
          path: |
            g4e3b-raw.txt
            g4e3b-site-verdict.json
          if-no-files-found: ignore
          retention-days: 10
