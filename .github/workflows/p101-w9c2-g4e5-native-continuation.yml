name: W9-C2 G4E-5A real downhill continuation 240Hz (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e5-physical-continuation.mjs'
      - 'scripts/p101-w9c2-g4e5-native-continuation.mjs'
      - 'tests/p101-w9c2-g4e5-continuation.test.mjs'
      - '.github/workflows/p101-w9c2-g4e5-native-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e5a-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact physical seam, unchanged original stage and true gap
        run: node --test tests/p101-w9c2-g4e5-continuation.test.mjs
      - name: Actual 240Hz full start00 400/650/900m and bridge control
        run: |
          node scripts/p101-w9c2-g4e5-native-continuation.mjs > g4e5-raw.txt
          node --input-type=module -e '
          import fs from "node:fs";
          const s=fs.readFileSync("g4e5-raw.txt","utf8");
          const d=JSON.parse(s.slice(s.indexOf("{")));
          if(d.results.length!==4||d.results.some(x=>
           x.physicsHz!==240||x.movingMachines!==28||x.originalGuideCount!==7||
           !x.realStart00||x.gapMeters<5||x.physicalSurfaceCount!==8+(x.lengthMeters?1:0)))
           throw Error("G4E5 native integrity failure");
          fs.writeFileSync("g4e5-verdict.json",JSON.stringify({
           schema:d.schema,verdict:d.verdict,human:"HOLD",release:"HOLD"},null,2));
          console.log(JSON.stringify(d.verdict));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e5-physical-continuation-${{ github.run_id }}
          path: |
            g4e5-raw.txt
            g4e5-verdict.json
          if-no-files-found: ignore
          retention-days: 10
