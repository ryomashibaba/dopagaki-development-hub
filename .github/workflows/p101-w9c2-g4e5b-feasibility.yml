name: W9-C2 G4E-5B real road-V rejoin geometry feasibility (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e5b-rejoin-feasibility.mjs'
      - 'tests/p101-w9c2-g4e5b-feasibility.test.mjs'
      - '.github/workflows/p101-w9c2-g4e5b-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e5b-survey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real geometry metrics
        run: node --test tests/p101-w9c2-g4e5b-feasibility.test.mjs
      - name: Survey exact 400/650/900m endpoints versus physical road V
        run: |
          node scripts/p101-w9c2-g4e5b-rejoin-feasibility.mjs > g4e5b-survey.txt
          node --input-type=module -e '
          import fs from "node:fs";
          const s=fs.readFileSync("g4e5b-survey.txt","utf8");
          const d=JSON.parse(s.slice(s.indexOf("{")));
          if(d.candidates.length!==3||d.originalRoads!==7||
             d.realMachines!==28||!d.noPhysicalEdits)
            throw Error("G4E5B invalid original physical geometry");
          fs.writeFileSync("g4e5b-geometry.json",JSON.stringify(d,null,2));
          console.log(JSON.stringify(d.candidates.map(c=>({
           length:c.lengthMeters,end:c.runwayEnd,
           vStart:c.roadVStart,vEnd:c.roadVEnd,
           closest:c.closest[0],plausible:c.plausibleCandidates[0]??null
          }))));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e5b-road-v-feasibility-${{ github.run_id }}
          path: |
            g4e5b-survey.txt
            g4e5b-geometry.json
          if-no-files-found: ignore
          retention-days: 10
