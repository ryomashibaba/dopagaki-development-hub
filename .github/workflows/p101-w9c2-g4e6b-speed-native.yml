name: W9-C2 G4E-6B actual early physical gap speed retention (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e6-early-gap-build.mjs'
      - 'scripts/p101-w9c2-g4e6b-speed-retention.mjs'
      - 'tests/p101-w9c2-g4e6b-early-speed.test.mjs'
      - '.github/workflows/p101-w9c2-g4e6b-speed-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e6b-speed-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physical-speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: True B48 floor-free five gap geometry and frozen Gold
        run: node --test tests/p101-w9c2-g4e6b-early-speed.test.mjs
      - name: Real start00 240Hz Gold, A0-35-2 reference and five width/placement variants
        run: |
          node scripts/p101-w9c2-g4e6b-speed-retention.mjs > g4e6b-raw.txt
          node --input-type=module -e '
          import fs from "node:fs";
          const raw=fs.readFileSync("g4e6b-raw.txt","utf8");
          const d=JSON.parse(raw.slice(raw.indexOf("{")));
          if(!d.gold.finished||d.verdict.length!==5||
             d.rawResults.length!==5||
             d.rawResults.some(x=>!x.realStart00||x.hz!==240||
              x.originalRoads!==7||x.originalMovingBodies!==28||
              !x.trueGap))
            throw Error("G4E6B invalid physical start00 evidence or Gold regression");
          const report={schema:d.schema,gold:d.gold,
            reference:d.successfulG4E6AControl,verdict:d.verdict,
            human:"HOLD",production:"HOLD"};
          fs.writeFileSync("g4e6b-speed-verdict.json",JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e6b-real-gap-speed-${{ github.run_id }}
          path: |
            g4e6b-raw.txt
            g4e6b-speed-verdict.json
          if-no-files-found: ignore
          retention-days: 10
