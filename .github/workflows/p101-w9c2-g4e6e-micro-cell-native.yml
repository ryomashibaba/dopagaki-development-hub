name: W9-C2 G4E-6E exact-cell real-gap speed and delay attribution (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e6e-micro-gap-build.mjs'
      - 'scripts/p101-w9c2-g4e6e-native-diagnosis.mjs'
      - 'scripts/p101-w9c2-g4e6-native-matrix.mjs'
      - 'tests/p101-w9c2-g4e6e-exact-cell.test.mjs'
      - '.github/workflows/p101-w9c2-g4e6e-micro-cell-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e6e-real-speed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-gap-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact physical collider and Gold integrity unit QA
        run: node --test tests/p101-w9c2-g4e6e-exact-cell.test.mjs
      - name: Native 240Hz Gold / C0-55-1 / six exact micro-gap sites, no assist
        run: |
          node scripts/p101-w9c2-g4e6e-native-diagnosis.mjs > g4e6e-raw.txt
          node --input-type=module -e '
          import fs from "node:fs";
          const raw=fs.readFileSync("g4e6e-raw.txt","utf8");
          const d=JSON.parse(raw.slice(raw.indexOf("{")));
          if(d.originalRoads!==7||d.originalMovingHazards!==28||
             d.physicsHz!==240||d.summaries.length!==6||
             d.rawResults.length!==6||d.gold.elapsedSeconds<53||
             d.gold.elapsedSeconds>54||
             !d.establishedControl.finished||
             !d.establishedControl.landing||
             !d.establishedControl.verifiedAllOriginalRoads||
             d.rawResults.some(x=>!x.realStart00||x.hz!==240||
              !x.trueGap||x.originalMovingBodies!==28||
              x.originalRoads!==7||x.originalGuideCount!==7))
            throw Error("Frozen Gold or genuine early gap evidence integrity failed");
          const report={
           schema:d.schema,physicsHz:d.physicsHz,
           gold:d.gold,establishedControl:d.establishedControl,
           verdict:d.summaries.map(x=>({
            id:x.id,gapMeters:x.gapMeters,airborne:x.airborne,landing:x.landing,
            finished:x.finished,original7:x.verifiedAllOriginalRoads,
            timeSeconds:x.timeSeconds,lossVsGoldSeconds:x.lossVsGoldSeconds,
            speedRetentionRatio:x.speedRetentionRatio,
            minimumFlightMps:x.minimumFlightMps,speedQualityGate:x.speedQualityGate,
            airSecondsDelta:x.airSecondsDelta,firstRoadDelaySeconds:x.firstRoadDelaySeconds,
            movingContactsCandidate:x.movingContactsCandidate,reason:x.reason
           })),
           physicallyQualified:d.physicallyQualified,speedQualified:d.speedQualified,
           human:"HOLD",release:"HOLD",approvedSlopeDNAMeters:0
          };
          fs.writeFileSync("g4e6e-native-verdict.json",JSON.stringify(report,null,2));
          console.log(JSON.stringify({gold:d.gold.elapsedSeconds,
           establishedControl:d.establishedControl.timeSeconds,
           verdict:report.verdict,speedQualified:d.speedQualified}));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e6e-true-gap-microcell-evidence-${{ github.run_id }}
          path: |
            g4e6e-raw.txt
            g4e6e-native-verdict.json
          if-no-files-found: ignore
          retention-days: 10
