name: W9-C2 G4E-6F physical half-cell natural jumps (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e6f-subcell-gap-build.mjs'
      - 'scripts/p101-w9c2-g4e6f-subcell-native.mjs'
      - 'tests/p101-w9c2-g4e6f-subcell.test.mjs'
      - '.github/workflows/p101-w9c2-g4e6f-subcell-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e6f-subcell-${{ github.ref }}
  cancel-in-progress: true
jobs:
  subcell-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and genuinely unsupported B48 gap geometry
        run: |
          node --check scripts/p101-w9c2-g4e6f-subcell-native.mjs
          node --check scripts/p101-w9c2-g4e6f-subcell-gap-build.mjs
          node --test tests/p101-w9c2-g4e6f-subcell.test.mjs
      - name: 240Hz native start00 Gold, C0-55-1, five higher-resolution physical gaps
        run: |
          node scripts/p101-w9c2-g4e6f-subcell-native.mjs > g4e6f-native-raw.txt
          node --input-type=module -e '
          import fs from "node:fs";
          const raw=fs.readFileSync("g4e6f-native-raw.txt","utf8");
          const d=JSON.parse(raw.slice(raw.indexOf("{")));
          if(d.physicsHz!==240||d.startSpeedMps!==52||
             d.gold.moving!==28||d.gold.guideCount!==7||
             d.gold.time<53||d.gold.time>54||
             !d.reference.completed||!d.reference.landing||
             d.candidates.length!==5||d.rawResults.length!==5||
             d.rawResults.some(x=>!x.realStart00||x.hz!==240||
              x.originalRoads!==7||x.originalMovingBodies!==28||
              !x.trueGap))
            throw Error("G4E6F native genuine gap and original Gold integrity failed");
          const report={schema:d.schema,gold:d.gold,reference:d.reference,
           verdict:d.candidates,strictSpeedCandidates:d.strictSpeedCandidates,
           physicalComplete:d.physicalComplete,
           human:"HOLD",release:"HOLD",approvedSlopeDNAMeters:0};
          fs.writeFileSync("g4e6f-native-verdict.json",JSON.stringify(report,null,2));
          console.log(JSON.stringify({
           gold:d.gold.time,reference:d.reference.timeSeconds,
           verdict:d.candidates.map(x=>({
            id:x.id,gapMeters:x.gapMeters,
            airborne:x.airborne,landing:x.landing,
            flightSeconds:x.flightSeconds,
            speedRetention:x.speedRetentionRatio,
            all7:x.allOriginalRoadsInOrder,finished:x.finished,
            elapsed:x.timeSeconds,delta:x.lossVsGoldSeconds,
            strictSpeedQuality:x.strictGameCandidate,reason:x.reason
           })),qualified:d.strictSpeedCandidates}));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e6f-short-true-gap-native-${{ github.run_id }}
          path: |
            g4e6f-native-raw.txt
            g4e6f-native-verdict.json
          if-no-files-found: ignore
          retention-days: 10
