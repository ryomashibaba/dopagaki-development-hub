name: W9-C2 G4E-7AA landing-soft authentic full 240Hz 7 roads (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7aa-full-native.mjs'
      - 'tests/p101-w9c2-g4e7aa-full-native.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7aa-full-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-seven-road:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact 240Hz 7 physical roads, 28 moving machines, paired gap controls
        run: |
          node --check scripts/p101-w9c2-g4e7aa-full-native.mjs
          node --test tests/p101-w9c2-g4e7aa-full-native.test.mjs
          node scripts/p101-w9c2-g4e7aa-full-native.mjs g4e7aa-landing-soft-full-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7aa-landing-soft-full-240hz-${{ github.run_id }}
          path: g4e7aa-landing-soft-full-native.json
          if-no-files-found: ignore
          retention-days: 14
