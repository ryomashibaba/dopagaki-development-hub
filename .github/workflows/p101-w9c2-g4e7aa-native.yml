name: W9-C2 G4E-7AA true B48 contour + causal native 240Hz (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7aa-physical.mjs'
      - 'scripts/p101-w9c2-g4e7aa-native-screen.mjs'
      - 'tests/p101-w9c2-g4e7aa-physical.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7aa-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contours:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/p101-w9c2-g4e7aa-physical.mjs
          node --check scripts/p101-w9c2-g4e7aa-native-screen.mjs
          node --test tests/p101-w9c2-g4e7aa-physical.test.mjs
      - name: Actual start00 240Hz causal cut versus exact-solid contour; no full-run claims
        run: |
          node scripts/p101-w9c2-g4e7aa-native-screen.mjs g4e7aa-actual-240hz-contour-screen.json
          node --input-type=module -e '
          import fs from "node:fs";
          const x=JSON.parse(fs.readFileSync("g4e7aa-actual-240hz-contour-screen.json","utf8"));
          if(x.physicsHz!==240||x.results.length!==6||x.officialSlope2Meters!==0||
            x.publication!=="HOLD"||x.results.some(y=>y.fullSevenRoadsProven!==false))
            throw Error("G4E-7AA falsely adopted early-only candidate");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7aa-actual-240hz-contour-screen-${{ github.run_id }}
          path: g4e7aa-actual-240hz-contour-screen.json
          if-no-files-found: ignore
          retention-days: 14
