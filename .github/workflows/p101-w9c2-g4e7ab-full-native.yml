name: W9-C2 G4E-7AB actual 240Hz 7-road submeter contour pair matrix (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ab-full-native.mjs'
      - 'tests/p101-w9c2-g4e7ab-full.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7ab-full-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structure source immutable and proper direct 240Hz P96
        run: |
          node --check scripts/p101-w9c2-g4e7ab-full-native.mjs
          node --test tests/p101-w9c2-g4e7ab-full.test.mjs
      - name: Eight original start00 seven-road physics runs, paired cut/intact
        run: |
          node scripts/p101-w9c2-g4e7ab-full-native.mjs g4e7ab-full240hz-control.json
          node --input-type=module -e '
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("g4e7ab-full240hz-control.json","utf8"));
          if(d.hz!==240||d.start00!==true||d.pairs.length!==4||
            d.originalMovingB51C!==28||d.realRoads!==7||
            d.formalSlope2Meters!==0||d.humanFairness!=="HOLD"||
            d.pairs.some(x=>x.fullRoadCut.certifiedSlope2Meters!==0))
            throw Error("G4E-7AB unauthorized adoption or bad native provenance");
          console.log("G4E7AB_FULL_VERIFIED "+
            JSON.stringify(d.pairs.map(x=>({variant:x.variant,
              cut:x.fullRoadCut.status,roads:x.fullRoadCut.visitedRoads,
              seconds:x.fullRoadCut.timeSeconds,
              landing:x.fullRoadCut.firstB48Rejoin,
              control:x.fullRoadIntact.status,
              humanFairness:"HOLD"}))));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ab-submeter-full-real240hz-${{ github.run_id }}
          path: g4e7ab-full240hz-control.json
          if-no-files-found: ignore
          retention-days: 14
