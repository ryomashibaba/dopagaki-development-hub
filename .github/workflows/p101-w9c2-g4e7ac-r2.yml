name: W9-C2 G4E-7AC R2 protected landing true 240Hz screen (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ac-r2-*.mjs'
      - 'tests/research/p101-w9c2-g4e7ac-r2.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7ac-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical reference invariant
        run: |
          node --check scripts/p101-w9c2-g4e7ac-r2-physical.mjs
          node --check scripts/p101-w9c2-g4e7ac-r2-native-screen.mjs
          node --test tests/research/p101-w9c2-g4e7ac-r2.test.mjs
      - name: 9sec genuine B48 missing-cell vs intact 240Hz pilot
        run: |
          node scripts/p101-w9c2-g4e7ac-r2-native-screen.mjs ac-r2-screen.json
          node --input-type=module -e '
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("ac-r2-screen.json","utf8"));
          if(d.physicsHz!==240||!d.start00||d.results.length!==3||
            d.originalRoads!==7||d.originalMovingMachines!==28||
            d.officialSlope2Meters!==0||d.publication!=="HOLD"||
            d.results.some(x=>x.officialSlope2Meters!==0||x.fullSevenRoadsProven!==false))
           throw Error("R2 not physically authentic and isolated");
          console.log("AC_R2_VERIFIED "+JSON.stringify(d.results.map(x=>({
            id:x.variant,extraAir:x.solidGroundGapAirTicks,
            delta:x.actualCausalPositionDeltaMeters,
            landing:x.genuineSameRoadRejoin,
            minSpeed:x.minPostGapSpeedMps,eligible:x.recommendLongRun}))));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ac-r2-true-B48-${{ github.run_id }}
          path: ac-r2-screen.json
          if-no-files-found: ignore
          retention-days: 14
