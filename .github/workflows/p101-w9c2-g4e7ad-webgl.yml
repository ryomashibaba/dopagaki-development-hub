name: W9-C2 G4E-7AD real R2 camera WebGL and city A-B (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ad-native-frames.mjs'
      - 'web/p101-w9c2-g4e7ad-city.mjs'
      - 'web/drive3d.mjs'
      - 'scripts/build.mjs'
      - 'tests/p101-w9c2-g4e7ad-art.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7ad-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7ad-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7AD_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable physical course and local GPU mesh invariants
        run: |
          node --check web/drive3d.mjs
          node --check scripts/build.mjs
          node --test tests/p101-w9c2-g4e7ad-art.test.mjs
      - name: Install browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --only-shell
      - name: Private-only genuine R2 stages plus real 240Hz camera poses
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7AD_APPROACH_ARC_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7AD_LANDING_CRESCENT_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7AD_240HZ_FRAMES_LOCAL.json
      - name: Chromium actual WebGL2 identical-pose comparisons
        run: npx playwright test tests/browser/p101-w9c2-g4e7ad-webgl.spec.mjs
      - name: Public output does not contain any private AD candidate
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7AD_APPROACH_ARC_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7AD_240HZ_FRAMES_LOCAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7AD_LANDING_CRESCENT_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ad-WebGL-12-native240Hz-${{ github.run_id }}
          path: |
            test-results/**/g4e7ad-*.png
            test-results/**/g4e7ad-*.json
            test-results/**/test-failed*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
