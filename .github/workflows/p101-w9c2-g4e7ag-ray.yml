name: W9-C2 G4E-7AG true B48 and five open city landmark rays (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ag-real-sightlines.mjs'
      - 'tests/research/p101-w9c2-g4e7ag-rays.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7ag-ray.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-240hz-rays:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare original missing B48 cell with open city triangle intersections
        run: |
          node --check scripts/p101-w9c2-g4e7ag-real-sightlines.mjs
          node scripts/p101-w9c2-g4e7ag-real-sightlines.mjs g4e7ag-ray.json
          node --test tests/research/p101-w9c2-g4e7ag-rays.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ag-five-open-city-ray-report-${{ github.run_id }}
          path: g4e7ag-ray.json
          if-no-files-found: ignore
          retention-days: 14
