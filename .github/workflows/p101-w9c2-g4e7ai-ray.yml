name: W9-C2 G4E-7AI actual 240Hz narrow real-B48 10-probe visibility rays (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ai-real-sightlines.mjs'
      - 'tests/research/p101-w9c2-g4e7ai-rays.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7ai-ray.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ray-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual B48 10-probe narrow edge/gap visibility from native 240Hz camera
        run: |
          node --check scripts/p101-w9c2-g4e7ai-real-sightlines.mjs
          node scripts/p101-w9c2-g4e7ai-real-sightlines.mjs g4e7ai-10-probe-real-B48-report.json
          node --test tests/research/p101-w9c2-g4e7ai-rays.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ai-real-narrow-240Hz-rays-${{ github.run_id }}
          path: g4e7ai-10-probe-real-B48-report.json
          if-no-files-found: ignore
          retention-days: 14
