name: W9-C2 G4E-7AJ original 28 B51-C vs genuine 11m B48 threat diagnostic
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7aj-*.mjs'
      - 'tests/research/p101-w9c2-g4e7aj-*.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7aj-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-first-road:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only 240Hz physical and swept B51 moving obstacle sampling
        run: |
          node --check scripts/p101-w9c2-g4e7aj-baseline-threat.mjs
          node scripts/p101-w9c2-g4e7aj-baseline-threat.mjs g4e7aj-original-threat.json
          node --test tests/research/p101-w9c2-g4e7aj-baseline.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7aj-native-B51-original-${{ github.run_id }}
          path: g4e7aj-original-threat.json
          if-no-files-found: ignore
          retention-days: 14
