name: W9-C2 G4E-7AK gate 3 true 240Hz B48/B51 visibility and fixed-input failure audit (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ak-g3-native-obstruction.mjs'
      - 'tests/research/p101-w9c2-g4e7ak-g3-obstruction.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7ak-g3-obstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-triangle-moving-box-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and actual OBB/B48 ray primitive checks
        run: |
          node --check scripts/p101-w9c2-g4e7ak-g3-native-obstruction.mjs
          node --test tests/research/p101-w9c2-g4e7ak-g3-obstruction.test.mjs
      - name: Native 240Hz hazard visibility proxies and actual failed A/D replay
        run: |
          node scripts/p101-w9c2-g4e7ak-g3-native-obstruction.mjs g4e7ak-g3-native-obstruction.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("g4e7ak-g3-native-obstruction.json","utf8"));
            if(r.actualNativePhysicsHz!==240||r.physicalRoads!==7||
              r.physicalMovingB51!==28||r.results.length!==2||
              r.earlyRightFailures.length!==2||r.formalSlope2Meters!==0||
              r.humanFairness!=="HOLD"||r.artQuality!=="HOLD"||
              r.publication!=="HOLD"||r.productionPromoted!==false||
              r.results.some(x=>x.status!=="running"||
                x.genuineB51Count!==28||x.exactB48TriangleCount<1000||
                x.samples.length!==45||x.warnings.length!==2||
                x.samples.some(s=>s.cues.length!==2||
                  s.cues.some(c=>c.pointCount!==13||
                    c.pointsApproxClear+c.pointsRoadOccluded+
                    c.pointsOtherB51Occluded>c.pointsInApproxFrame)))||
              r.earlyRightFailures.some(x=>x.status!=="failed"||
                x.physicsEventCounts.movingContact!==0||
                !x.authoritativeRunnerFailure?.reason||
                !x.timeline.length))
              throw Error("AK3 true physical provenance and explicit HOLD required");
            console.log("AK3_GATES_HOLD "+
              JSON.stringify({warnings:r.results.map(x=>({road:x.road,cues:x.warnings})),
              failures:r.earlyRightFailures.map(x=>({road:x.road,
                seconds:x.seconds,reason:x.authoritativeRunnerFailure.reason}))}));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ak-g3-B48-OBB-240hz-${{ github.run_id }}
          path: g4e7ak-g3-native-obstruction.json
          if-no-files-found: ignore
          retention-days: 14
