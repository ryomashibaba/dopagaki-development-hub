name: W9-C2 G4E-7AT new real B48 two-road gameplay candidate fast physical gate
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7at-crown-chasm.mjs'
      - 'tests/p101-w9c2-g4e7at-crown-chasm.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7at-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7at-local-physical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  true-b48-physics-only-no-publishing:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine 240Hz B48 second-section track and live B51 physical regression
        run: |
          node --check scripts/p101-w9c2-g4e7at-crown-chasm.mjs
          node --test tests/p101-w9c2-g4e7at-crown-chasm.test.mjs
