name: W9-C2 G4E-7AV real B48 premature-launch crest improvement 240Hz matrix
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-w9c2-g4e7av-crest-shaping.mjs
      - scripts/p101-w9c2-g4e7av-continuity.mjs
      - tests/p101-w9c2-g4e7av-crest-shaping.test.mjs
      - .github/workflows/p101-w9c2-g4e7av-crest-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-road-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical invariant and real 240Hz scripted nonhuman race comparison
        run: |
          node --check scripts/p101-w9c2-g4e7av-crest-shaping.mjs
          node --test tests/p101-w9c2-g4e7av-crest-shaping.test.mjs
          node scripts/p101-w9c2-g4e7av-continuity.mjs test-results/g4e7av-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7av-240hz-hill-geometry-not-human
          path: test-results/g4e7av-native.json
          if-no-files-found: ignore
          retention-days: 14
