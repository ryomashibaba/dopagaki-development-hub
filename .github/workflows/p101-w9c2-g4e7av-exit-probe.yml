name: W9-C2 G4E-7AV real first-road to second-road exit 240Hz probe
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - scripts/p101-w9c2-g4e7av-exit-probe.mjs
      - .github/workflows/p101-w9c2-g4e7av-exit-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-and-real-flight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native 240Hz first road exit trajectory
        run: |
          node --check scripts/p101-w9c2-g4e7av-exit-probe.mjs
          node scripts/p101-w9c2-g4e7av-exit-probe.mjs > g4e7av-exit-real.json.log
          cat g4e7av-exit-real.json.log
      - uses: actions/upload-artifact@v4
        with:
          name: g4e7av-real-exit-probe
          path: g4e7av-exit-real.json.log
          retention-days: 14
