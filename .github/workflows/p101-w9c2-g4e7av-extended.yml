name: W9-C2 G4E-7AV genuine real start00 38s continuation after road2
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7av-extended.mjs'
      - '.github/workflows/p101-w9c2-g4e7av-extended.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-240hz-extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real scripted 38s start00 A/B on preserved actual seven roads
        run: |
          node --check scripts/p101-w9c2-g4e7av-extended.mjs
          node scripts/p101-w9c2-g4e7av-extended.mjs g4e7av-38s-native.json
          test -s g4e7av-38s-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7av-38s-true-start00-not-human
          path: g4e7av-38s-native.json
          if-no-files-found: ignore
          retention-days: 14
