name: W9-C2 G4E-7AW actual 14s road2 fall vs flowing real B48 narrow-road variants
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7aw-road2-flow.mjs'
      - 'scripts/p101-w9c2-g4e7aw-compare.mjs'
      - 'tests/p101-w9c2-g4e7aw-road2-flow.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7aw-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7aw-road2-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physical-road2-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard protected gap and genuine two thin B48 cores / all 28 moving hazards
        run: |
          node --check scripts/p101-w9c2-g4e7aw-road2-flow.mjs
          node --test tests/p101-w9c2-g4e7aw-road2-flow.test.mjs
      - name: Start00 continuous real Runner 240Hz comparison: AV versus AW
        run: |
          node scripts/p101-w9c2-g4e7aw-compare.mjs g4e7aw-real-road2-240hz.json
          test -s g4e7aw-real-road2-240hz.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7aw-actual-road2-physical-and-human-hold
          path: g4e7aw-real-road2-240hz.json
          if-no-files-found: ignore
          retention-days: 14
