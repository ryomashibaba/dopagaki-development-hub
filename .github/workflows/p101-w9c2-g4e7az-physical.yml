name: W9-C2 G4E-7AZ authentic late CROWN to CHASM B48 bridge 240Hz
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7az-crown-chasm-ribbon.mjs'
      - 'scripts/p101-w9c2-g4e7az-compare.mjs'
      - 'tests/p101-w9c2-g4e7az-crown-chasm-ribbon.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7az-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7az-real-crown-chasm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-240hz-from-00:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original 7 B48 road surfaces and real 28 moving B51 objects
        run: |
          node --check scripts/p101-w9c2-g4e7az-crown-chasm-ribbon.mjs
          node --test tests/p101-w9c2-g4e7az-crown-chasm-ribbon.test.mjs
      - name: Compare authentic 29s Runner 240Hz start00 AY to AZ geometry
        run: |
          node scripts/p101-w9c2-g4e7az-compare.mjs g4e7az-29s-native.json
          test -s g4e7az-29s-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7az-real-crown-chasm-native-not-human
          path: g4e7az-29s-native.json
          if-no-files-found: ignore
          retention-days: 14
