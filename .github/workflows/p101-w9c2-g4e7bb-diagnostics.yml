name: W9-C2 G4E-7BB native 240Hz grounded trajectory and road-vector diagnosis
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7bb-vector-math.mjs'
      - 'scripts/p101-w9c2-g4e7bb-vector-audit.mjs'
      - 'tests/p101-w9c2-g4e7bb-vector-math.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7bb-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7bb-vector-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authentic-240hz-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 3D projections and native road-frame math
        run: |
          node --check scripts/p101-w9c2-g4e7bb-vector-audit.mjs
          node --check scripts/p101-w9c2-g4e7bb-vector-math.mjs
          node --test tests/p101-w9c2-g4e7bb-vector-math.test.mjs
      - name: Measure identical P96 input on AY and rejected BA in native 240 Hz physics
        run: |
          node scripts/p101-w9c2-g4e7bb-vector-audit.mjs g4e7bb-3d-vector-native.json
          test -s g4e7bb-3d-vector-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bb-nonhuman-vector-and-grounding-not-production
          path: g4e7bb-3d-vector-native.json
          if-no-files-found: ignore
          retention-days: 14
