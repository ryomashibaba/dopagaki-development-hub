name: W9-C2 G4E-7BD CHASM physical departure 240Hz vector diagnosis
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7bd-chasm-vector-audit.mjs'
      - '.github/workflows/p101-w9c2-g4e7bd-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7bd-vector-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-240hz-chasm-departure:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate true observation code and existing 3D vector math
        run: |
          node --check scripts/p101-w9c2-g4e7bd-chasm-vector-audit.mjs
          node --test tests/p101-w9c2-g4e7bb-vector-math.test.mjs
      - name: Compare original AY and true BC rollDeck through CHASM real 240Hz
        run: |
          node scripts/p101-w9c2-g4e7bd-chasm-vector-audit.mjs g4e7bd-chasm-vector.json
          test -s g4e7bd-chasm-vector.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bd-read-only-real240hz-chasm-vectors
          path: g4e7bd-chasm-vector.json
          if-no-files-found: error
          retention-days: 14
