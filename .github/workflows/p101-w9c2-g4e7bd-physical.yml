name: W9-C2 G4E-7BD authentic CHASM B48 long-radius roadway 240Hz
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7bd-full-chasm-ribbon.mjs'
      - 'scripts/p101-w9c2-g4e7bd-compare.mjs'
      - 'tests/p101-w9c2-g4e7bd-full-chasm-ribbon.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7bd-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7bd-physical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-240hz-from-00:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authentic 7 B48, 28 B51-C and actual narrow CHASM
        run: |
          node --check scripts/p101-w9c2-g4e7bd-full-chasm-ribbon.mjs
          node --check scripts/p101-w9c2-g4e7bd-compare.mjs
          node --test tests/p101-w9c2-g4e7bd-full-chasm-ribbon.test.mjs
      - name: Compare AY and BC vs BD genuine starting00 240Hz
        run: |
          node scripts/p101-w9c2-g4e7bd-compare.mjs g4e7bd-native.json
          test -s g4e7bd-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bd-real-chasm-native-not-human
          path: g4e7bd-native.json
          if-no-files-found: ignore
          retention-days: 14
