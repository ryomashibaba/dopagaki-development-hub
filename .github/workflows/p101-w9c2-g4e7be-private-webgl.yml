name: G4E-7BE BC rollDeck local manual WebGL + strict publication exclusion
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - 'web/p101-w9c2-g4e7al-manual-qa.mjs'
      - 'web/p101-w9c2-g4e7al-manual-panel.mjs'
      - 'scripts/launch-g4e7be-manual.mjs'
      - 'RUN_G4E7BE_MANUAL.cmd'
      - 'tests/p101-w9c2-g4e7be-private-manual.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7be-private-manual.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7be-private-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7be-private-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-local-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: 'true'
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: 'dist-private'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, real BC physical/manual input, original AY not broken
        run: |
          node --check scripts/build.mjs
          node --check web/drive3d.mjs
          node --check web/p101-w9c2-g4e7al-manual-qa.mjs
          node --check scripts/launch-g4e7be-manual.mjs
          node --test tests/p101-w9c2-g4e7be-private-manual.test.mjs
      - name: Install browser/Chromium dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build private real B48 240Hz BC with specific opt-in
        run: |
          node scripts/build.mjs private
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
      - name: Chromium real WebGL, authentic A/D and direct local JSON NOT human QA
        run: npx playwright test tests/browser/p101-w9c2-g4e7be-private-manual.spec.mjs
      - name: Public and public-safe build must omit BOTH BC real stage JSON even when env enabled
        run: |
          node scripts/build.mjs public
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
          node scripts/build.mjs public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7be-local-WebGL-QA-not-human
          path: |
            test-results/**/g4e7be-*.png
            test-results/**/g4e7be-*.json
            test-results/**/test-failed*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
