name: G4E-7BF private BC SKY-FRACTURE major architectural WebGL A-B
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7bf-sky-fracture.mjs'
      - 'tests/p101-w9c2-g4e7bf-sky-fracture.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7bf-sky-fracture.spec.mjs'
      - 'web/drive3d.mjs'
      - 'scripts/build.mjs'
      - '.github/workflows/p101-w9c2-g4e7bf-sky-fracture-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7bf-private-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sky-fracture-physical-invariants-and-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      CI: 'true'
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: 'dist-private'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real B48/B51 unchanged and meaningful non-rectangular skyline geometry
        run: |
          node --check web/p101-w9c2-g4e7bf-sky-fracture.mjs
          node --check web/drive3d.mjs
          node --check scripts/build.mjs
          node --test tests/p101-w9c2-g4e7bf-sky-fracture.test.mjs tests/p101-w9c2-g4e7be-private-manual.test.mjs
      - name: Install Chromium for actual WebGL camera imagery
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build exact protected PRIVATE stage with 28 native B51
        run: |
          node scripts/build.mjs private
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
      - name: Actual Chrome WebGL full skyline A-B on BC B48 with manual A-D
        run: npx playwright test tests/browser/p101-w9c2-g4e7bf-sky-fracture.spec.mjs
      - name: Both publication builds remain free of real BC stage JSON
        run: |
          node scripts/build.mjs public
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
          node scripts/build.mjs public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bf-macro-skyline-private-WebGL-not-human
          path: |
            test-results/**/g4e7bf-*.png
            test-results/**/g4e7bf-*.json
            test-results/**/test-failed*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
