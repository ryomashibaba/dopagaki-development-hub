name: G4E-7BG authentic BC native 240Hz 100mps WebGL visual audit
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7bg-native-visual-frames.mjs'
      - 'tests/p101-w9c2-g4e7bg-native-visual-frames.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7bg-native-camera.spec.mjs'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - '.github/workflows/p101-w9c2-g4e7bg-highspeed-camera.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7bg-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-240hz-camera-visual-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: 'dist-private'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valid actual P96 native 240Hz BC camera positions on 7 genuine B48 roads
        run: |
          node --check scripts/p101-w9c2-g4e7bg-native-visual-frames.mjs
          node --check scripts/build.mjs
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7bg-native-visual-frames.test.mjs
      - name: Install Chromium WebGL
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build explicit private-only two original BC courses and real 240Hz frame proof
        run: |
          node scripts/build.mjs private
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
      - name: Compare real 15-18.5s camera BF vs default at exact same native physical frames
        run: npx playwright test tests/browser/p101-w9c2-g4e7bg-native-camera.spec.mjs
      - name: Public and public-safe must never ship BG frames or BC prototypes
        run: |
          node scripts/build.mjs public
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          node scripts/build.mjs public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bg-native100mps-BC-WebGL-not-human
          path: |
            test-results/**/g4e7bg-*.png
            test-results/**/test-failed*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
