name: G4E-7BH real BC open-horizon 100mps WebGL visual QA
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7bh-open-horizon.mjs'
      - 'tests/p101-w9c2-g4e7bh-open-horizon.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7bh-open-horizon.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7bh-open-horizon-webgl.yml'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-B48-and-WebGL:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: 'dist-private'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real B48/B51 and original BG 240Hz native frames
        run: |
          node --check web/p101-w9c2-g4e7bh-open-horizon.mjs
          node --check web/drive3d.mjs
          node --check scripts/build.mjs
          node --test tests/p101-w9c2-g4e7bh-open-horizon.test.mjs tests/p101-w9c2-g4e7bg-native-visual-frames.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate exact private BC roads and native camera proof
        run: |
          node scripts/build.mjs private
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
      - name: Compare real 100mps WebGL original BF BH and A-D manual
        run: npx playwright test tests/browser/p101-w9c2-g4e7bh-open-horizon.spec.mjs
      - name: Verify public and public-safe excluded real BC and native frame data
        run: |
          node scripts/build.mjs public
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
          node scripts/build.mjs public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bh-real-100mps-open-city-WebGL-not-human
          path: |
            test-results/**/g4e7bh-*.png
            test-results/**/g4e7bh-*.json
            test-results/**/test-failed*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
