name: G4E-7BI private parallax city genuine 240Hz 100mps WebGL
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7bi-parallax-quarters.mjs'
      - 'tests/p101-w9c2-g4e7bi-parallax-quarters.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7bi-parallax-quarters.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7bi-parallax-webgl.yml'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-B48-native-100mps-WebGL:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      CI: 'true'
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: 'dist-private'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check physical BC and visible new parallax layers without changing world
        run: |
          node --check web/p101-w9c2-g4e7bi-parallax-quarters.mjs
          node --check web/drive3d.mjs
          node --check scripts/build.mjs
          node --test tests/p101-w9c2-g4e7bi-parallax-quarters.test.mjs tests/p101-w9c2-g4e7bg-native-visual-frames.test.mjs
      - name: Install real Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: PRIVATE build native exact 7 B48/28 B51 and true BG camera proof
        run: |
          node scripts/build.mjs private
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
      - name: Compare road-ahead BI against offscreen BH on identical REAL native camera
        run: npx playwright test tests/browser/p101-w9c2-g4e7bi-parallax-quarters.spec.mjs
      - name: Both public outputs exclude private BC and BG source data
        run: |
          node scripts/build.mjs public
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
          node scripts/build.mjs public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bi-real-native-parallax-city-WebGL-not-human
          path: |
            test-results/**/g4e7bi-*.png
            test-results/**/g4e7bi-*.json
            test-results/**/test-failed*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
