name: G4E-7BJ real native camera in-frame undercity WebGL QA
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7bj-abyssal-strata.mjs'
      - 'tests/p101-w9c2-g4e7bj-abyssal-strata.test.mjs'
      - 'tests/p101-w9c2-g4e7bj-visible-native.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7bj-abyssal-strata.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7bj-native-visual.yml'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7bj-real-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-B48-native-road-view-WebGL:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      CI: 'true'
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: 'dist-private'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine B48 physics integrity and on-camera image occupancy native240Hz
        run: |
          node --check web/p101-w9c2-g4e7bj-abyssal-strata.mjs
          node --check web/drive3d.mjs
          node --check scripts/build.mjs
          node --test tests/p101-w9c2-g4e7bj-abyssal-strata.test.mjs tests/p101-w9c2-g4e7bj-visible-native.test.mjs
      - name: Install Chromium real WebGL dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Explicit private BC native sources and P96 nonhuman evidence
        run: |
          node scripts/build.mjs private
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BC_PINCH_SWITCH_ROLLDECK_LOCAL_TRIAL.json
          test -s dist-private/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
      - name: Native visual comparator actual 112-126mps and human-only A-D controls
        run: npx playwright test tests/browser/p101-w9c2-g4e7bj-abyssal-strata.spec.mjs
      - name: Public and public-safe exclude private original BC source and native frames
        run: |
          node scripts/build.mjs public
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
          node scripts/build.mjs public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7BC_TRUE_PINCH_ROLLDECK_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7BG_240HZ_FRAMES_LOCAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bj-real-native-inhabited-abyss-WebGL-not-human
          path: |
            test-results/**/g4e7bj-*.png
            test-results/**/g4e7bj-*.json
            test-results/**/test-failed*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
