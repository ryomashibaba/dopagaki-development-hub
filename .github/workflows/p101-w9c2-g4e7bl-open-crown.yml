name: G4E-7BL PRIVATE open-crown GLB same-camera art QA
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7bl-open-crown-author.mjs'
      - 'scripts/p101-w9c2-g4e7bk-glb-author.mjs'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - 'tests/p101-w9c2-g4e7bl-open-crown.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7bl-open-crown.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7bl-open-crown.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7bl-open-crown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-open-crown-WebGL:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
      DOPAGAKI_G4E7BK_VISUAL: '1'
      DOPAGAKI_G4E7BL_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: 'dist-private'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: BL genuine native B48 and binary material tests
        run: |
          node --check scripts/p101-w9c2-g4e7bl-open-crown-author.mjs
          node --check web/drive3d.mjs
          node --check scripts/build.mjs
          node --test tests/p101-w9c2-g4e7bl-open-crown.test.mjs
      - name: Install Chromium WebGL2
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build PRIVATE real BL GLB2 and BK comparator
        run: |
          node scripts/build.mjs private
          test -s dist-private/generated/P101_A13_W9C2_G4E7BL_TRUE_PINCH_CROWN_LOCAL.glb
          test -s dist-private/generated/P101_A13_W9C2_G4E7BL_PINCH_SWITCH_CROWN_LOCAL.glb
      - name: Actual identical 240Hz fast native WebGL camera BK2 vs BL
        run: npx playwright test tests/browser/p101-w9c2-g4e7bl-open-crown.spec.mjs
      - name: Public and public-safe prevent experimental GLB leaks
        run: |
          node scripts/build.mjs public
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BL_TRUE_PINCH_CROWN_LOCAL.glb
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7BL_PINCH_SWITCH_CROWN_LOCAL.glb
          node scripts/build.mjs public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7BL_TRUE_PINCH_CROWN_LOCAL.glb
          test ! -e dist/generated/P101_A13_W9C2_G4E7BL_PINCH_SWITCH_CROWN_LOCAL.glb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7bl-BK2-vs-open-crown-actual-WebGL-HOLD
          path: |
            dist-private/generated/P101_A13_W9C2_G4E7BL_*_CROWN_LOCAL.glb
            test-results/**/g4e7bl-*.png
            test-results/**/test-failed*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
