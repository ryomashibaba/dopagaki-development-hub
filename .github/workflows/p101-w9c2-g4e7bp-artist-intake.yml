name: G4E-7BP artist GLB intake (independent HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7bp-artist-asset-intake.mjs'
      - 'tests/p101-w9c2-g4e7bp-artist-intake.test.mjs'
      - 'scripts/p101-w9c2-g4e7cb-native-asset-preflight.mjs'
      - 'tests/p101-w9c2-g4e7cb-native-asset-preflight.test.mjs'
      - 'docs/G4E7CC_VERIFIED_ARCHITECTURE_SOURCES.json'
      - 'scripts/p101-w9c2-g4e7cc-vetted-artist-source.mjs'
      - 'tests/p101-w9c2-g4e7cc-vetted-artist-source.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7bp-artist-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bp-intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  binary-source-rights-check-not-art-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No broad game rebuild, only authentic binary, rights and HOLD QA
        run: |
          node --check scripts/p101-w9c2-g4e7bp-artist-asset-intake.mjs
          node --test tests/p101-w9c2-g4e7bp-artist-intake.test.mjs
      - name: Reject fake camera and verify real CA negative-control GLB projection
        run: |
          node --check scripts/p101-w9c2-g4e7cb-native-asset-preflight.mjs
          node --test tests/p101-w9c2-g4e7cb-native-asset-preflight.test.mjs
          node scripts/p101-w9c2-g4e7cb-native-asset-preflight.mjs \
            artifacts/private/g4e7ca-rift-exchange/G4E7CA_RIFT_EXCHANGE_ART_ONLY.glb \
            g4e7cb-camera-preflight-CA-rejected-control.json
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('g4e7cb-camera-preflight-CA-rejected-control.json'));
          if(p.art!=='REJECTED_CONTROL_NOT_ART_PASS'||p.views.length!==6||p.publicRelease!=='FORBIDDEN'||p.actualWebGL!=='NOT_TESTED')throw Error('CB false art/game promotion');
          console.log('NATIVE CAMERA PREFLIGHT GENERATED, NOT A VISUAL ART PASS',p.flags);
          NODE
      - name: Evaluate ONE credible human-authored urban building lead without fake downloaded models
        run: |
          node --check scripts/p101-w9c2-g4e7cc-vetted-artist-source.mjs
          node --test tests/p101-w9c2-g4e7cc-vetted-artist-source.test.mjs
          node scripts/p101-w9c2-g4e7cc-vetted-artist-source.mjs docs/G4E7CC_VERIFIED_ARCHITECTURE_SOURCES.json g4e7cc-source-review.json
          node - <<'NODE'
          const a=require('./g4e7cc-source-review.json');
          if(a.fullyAuthenticatedGLB!==0||a.art!=='NOT_TESTED'||a.officialSlope2Meters!==0)
            throw Error('Unlicensed or unseen human art falsely passed');
          console.log('G4E7CC no art binary yet: source discovery only');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7cb-real240hz-camera-preflight-NOT-art-acceptance
          path: |
            g4e7cb-camera-preflight-CA-rejected-control.json
            g4e7cc-source-review.json
          if-no-files-found: ignore
          retention-days: 7
