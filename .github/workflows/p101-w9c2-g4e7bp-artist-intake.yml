name: G4E-7BP artist GLB intake (independent HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7bp-artist-asset-intake.mjs'
      - 'tests/p101-w9c2-g4e7bp-artist-intake.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7bp-artist-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bp-intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  binary-source-rights-check-not-art-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No broad game rebuild, only authentic binary, rights and HOLD QA
        run: |
          node --check scripts/p101-w9c2-g4e7bp-artist-asset-intake.mjs
          node --test tests/p101-w9c2-g4e7bp-artist-intake.test.mjs
