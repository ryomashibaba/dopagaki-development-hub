name: G4E-7BR actual Blender authoring and independent 4-view ART HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7br-blender-art.py'
      - '.github/workflows/p101-w9c2-g4e7br-blender-art.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g4e7br-blender-asset-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-blender-art-independent-from-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      ART: artifacts/private/g4e7br-fractured-tide-citadel
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p101-velocity-overdrive-native-trial
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Blender (no fake software renderer or AI image)
        run: |
          set -eu
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq blender
          blender --version | head -n 2
          python3 -m py_compile scripts/p101-w9c2-g4e7br-blender-art.py
      - name: Author real native Blender 3D city scene, export GLB and four camera renders
        run: |
          set -eu
          mkdir -p "$ART"
          blender --background --threads 4 \
            --python scripts/p101-w9c2-g4e7br-blender-art.py \
            -- --out "$ART"
          test -s "$ART/G4E7BR_FRACTURED_TIDE_CITADEL_SOURCE.blend"
          test -s "$ART/G4E7BR_FRACTURED_TIDE_CITADEL_ART_ONLY.glb"
          for view in OBLIQUE FRONT AERIAL SIDE; do
            test -s "$ART/G4E7BR_${view}_REAL_BLENDER_RENDER.png"
          done
      - name: Verify nonproduction original glTF binary intake and asset provenance
        run: |
          set -eu
          node --test tests/p101-w9c2-g4e7bp-artist-intake.test.mjs
          cat > "$ART/G4E7BR_BP_CLAIM.json" <<'JSON'
          {
            "assetId": "g4e7br-fractured-tide-citadel-001",
            "author": "DOPAGAKI original code-assisted Blender art study",
            "sourceTool": "Blender bpy scripted modelling and cycles",
            "sourceFile": "G4E7BR_FRACTURED_TIDE_CITADEL_SOURCE.blend",
            "rights": "original-work",
            "unitsMetersPerUnit": 1,
            "coordinateSystem": "glTF-Y-UP",
            "reviewStatus": "HOLD",
            "publicationStatus": "HOLD"
          }
          JSON
          node scripts/p101-w9c2-g4e7bp-artist-asset-intake.mjs \
            "$ART/G4E7BR_FRACTURED_TIDE_CITADEL_ART_ONLY.glb" \
            "$ART/G4E7BR_BP_CLAIM.json" \
            "$ART/G4E7BR_BP_ADMISSION.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root=process.env.ART;
          const report=JSON.parse(fs.readFileSync(path.join(root,'G4E7BR_BP_ADMISSION.json'),'utf8'));
          if(report.admission!=='METADATA_AND_BINARY_CONTRACT_ONLY_NOT_ART_PASS'||
             report.humanVisualReview!=='HOLD'||
             report.publicRelease!=='FORBIDDEN'||
             report.realCameraWebGLProof!=='NOT_YET_RUN'||
             report.glb.meshes<5||report.glb.triangles<5000||
             report.glb.materials<5)
             throw Error('BR authentic native GLB / HOLD admission failed: '+JSON.stringify(report));
          const files=fs.readdirSync(root).filter(x=>!x.startsWith('SHA256'));
          const hashes=files.map(f=>{
           const b=fs.readFileSync(path.join(root,f));
           return {file:f,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')};
          });
          if(hashes.length<9)throw Error('Missing authentic Blender assets');
          fs.writeFileSync(path.join(root,'SHA256_ART_HOLD_MANIFEST.json'),JSON.stringify({
           schema:'dopagaki.g4e7br-blender-art-archive/1',
           source:'ACTUAL_BLENDER_CYCLES_NOT_GAMEPLAY',
           originalScript:'scripts/p101-w9c2-g4e7br-blender-art.py',
           studioViews:['OBLIQUE','FRONT','AERIAL','SIDE'],
           blenderSceneAuthoring:'SCRIPTED_BPY_NOT_HAND_SCULPTED',
           actualGameCameraProof:'NOT_YET_RUN',
           humanArtApproval:'HOLD',publication:'FORBIDDEN',
           originalPhysicsUnchanged:true,officialSlope2CertifiedMeters:0,
           files:hashes
          },null,2)+'\n');
          console.log('BR accepted ART INTAKE (not art PASS): triangles='+report.glb.triangles+
            ' meshes='+report.glb.meshes+' materials='+report.glb.materials);
          JS
      - name: Preserve native .blend, GLB and independent Blender images in draft branch only
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$ART"
          if git diff --cached --quiet; then
            echo "Identical assets already archived"
            exit 0
          fi
          git commit -m "art(g4e7br): save actual Blender source, GLB, 4 native views and HOLD provenance"
          git push origin HEAD:refs/heads/p101-velocity-overdrive-native-trial
      - name: Native artist study is a nonproduction HOLD
        run: |
          test ! -e dist-site/generated/G4E7BR_FRACTURED_TIDE_CITADEL_ART_ONLY.glb
          test ! -e dist/generated/G4E7BR_FRACTURED_TIDE_CITADEL_ART_ONLY.glb
