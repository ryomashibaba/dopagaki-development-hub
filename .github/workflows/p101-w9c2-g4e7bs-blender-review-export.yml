name: G4E-7BS deliver original Blender visuals for independent art review
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - '.github/workflows/p101-w9c2-g4e7bs-blender-review-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-preserved-original-art-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify originals were produced by native Blender renderer and SHA manifest
        run: |
          set -eu
          d=artifacts/private/g4e7br-fractured-tide-citadel
          test -s "$d/G4E7BR_FRACTURED_TIDE_CITADEL_SOURCE.blend"
          test -s "$d/G4E7BR_FRACTURED_TIDE_CITADEL_ART_ONLY.glb"
          test -s "$d/SHA256_ART_HOLD_MANIFEST.json"
          for p in OBLIQUE FRONT AERIAL SIDE; do test -s "$d/G4E7BR_${p}_REAL_BLENDER_RENDER.png"; done
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import path from 'node:path';
          const d='artifacts/private/g4e7br-fractured-tide-citadel';
          const m=JSON.parse(fs.readFileSync(path.join(d,'SHA256_ART_HOLD_MANIFEST.json')));
          if(m.source!=='ACTUAL_BLENDER_CYCLES_NOT_GAMEPLAY'||m.humanArtApproval!=='HOLD'||m.publication!=='FORBIDDEN')
            throw Error('Unverified Blender proof state');
          for(const f of m.files){
            const b=fs.readFileSync(path.join(d,f.file)),hex=crypto.createHash('sha256').update(b).digest('hex');
            if(hex!==f.sha256||b.length!==f.bytes)throw Error('Modified GLB/render: '+f.file);
          }
          console.log('REAL_BLENDER_ASSETS_VERIFIED_SHA256',m.files.length);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: g4e7br-FOUR-REAL-BLENDER-ART-VIEWS-HOLD
          path: |
            artifacts/private/g4e7br-fractured-tide-citadel/G4E7BR_*_REAL_BLENDER_RENDER.png
            artifacts/private/g4e7br-fractured-tide-citadel/G4E7BR_FRACTURED_TIDE_CITADEL_ART_ONLY.glb
            artifacts/private/g4e7br-fractured-tide-citadel/G4E7BR_BP_ADMISSION.json
            artifacts/private/g4e7br-fractured-tide-citadel/SHA256_ART_HOLD_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
