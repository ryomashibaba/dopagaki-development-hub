name: G4E-7CF legitimate city GLB 240Hz preflight (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7cf-spectra-source-preflight.mjs'
      - '.github/workflows/p101-w9c2-g4e7cf-source-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7cf-source-proof
  cancel-in-progress: true
jobs:
  public-github-artist-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One authorized public artist GLB - immutable URL and exact Git blob only
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/SpectraStudios/SourceCityToolkit_glb/4db7cf1aecba9bbc011d153d6d923a0cb4ac9d9d/Market_Day.glb'
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 150 --retry 2 --output /tmp/g4e7cf-original.glb "$url"
          test "$(wc -c < /tmp/g4e7cf-original.glb | tr -d ' ')" = '17786532'
          test "$(git hash-object /tmp/g4e7cf-original.glb)" = 'ee3334d9f13f63e38a1f813eee8eb9e7c720b4e1'
          echo 'Original Git blob verified, not published to our repo or artifact'
          sha256sum /tmp/g4e7cf-original.glb
      - name: Run real GLB and six ORIGINAL BG 240Hz native-camera checks - NOT WebGL
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/p101-w9c2-g4e7cf-spectra-source-preflight.mjs
          node scripts/p101-w9c2-g4e7cf-spectra-source-preflight.mjs /tmp/g4e7cf-original.glb g4e7cf-audit-ART-HOLD.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('g4e7cf-audit-ART-HOLD.json','utf8'));
          if(x.art!=='NOT_TESTED'||x.human!=='HOLD'||x.webgl!=='NOT_TESTED'||
             x.publish!=='FORBIDDEN'||x.formalSlope2Meters!==0||
             x.materialRights!=='UNVERIFIED_THIRD_PARTY_TEXTURES_COM_EXCEPTION')
            throw Error('TECH/RIGHTS falsely promoted to ART');
          console.log('HONEST TECH RESULT:',x.technicalResult);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7cf-original-source-camera-numbers-NOT-ART-PASS
          path: g4e7cf-audit-ART-HOLD.json
          if-no-files-found: ignore
          retention-days: 7
