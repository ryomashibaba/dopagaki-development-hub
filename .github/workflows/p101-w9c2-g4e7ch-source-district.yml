name: G4E-7CH true isolated WebGL source geometry 240Hz camera (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ch-source-district.html'
      - 'scripts/p101-w9c2-g4e7ch-source-district.mjs'
      - '.github/workflows/p101-w9c2-g4e7ch-source-district.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7ch-source-webgl
  cancel-in-progress: true
jobs:
  original-source-webgl-without-third-party-textures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only original checked upstream binary, never redistribute GLB
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 150 -o /tmp/original-source.glb 'https://raw.githubusercontent.com/billpwchan/neon-zenith/27ad04ef04aa9e1e1366fccc63e15a379b999f01/public/district/district.glb'
          test "$(wc -c < /tmp/original-source.glb | tr -d ' ')" = 8040396
          test "$(git hash-object /tmp/original-source.glb)" = 92e2ed214034c9cd7bed5248991924d3af9a6d24
      - name: Install isolated three.js renderer and Chromium
        run: |
          npm install --no-save --no-audit --no-fund three@0.180.0
          npx playwright install --with-deps chromium
          node --check scripts/p101-w9c2-g4e7ch-source-district.mjs
      - name: Render real GLB mesh WebGL 12 frames with genuine original 240Hz poses (not game)
        run: |
          node scripts/p101-w9c2-g4e7ch-source-district.mjs /tmp/original-source.glb test-results/g4e7ch-geometry-only
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('test-results/g4e7ch-geometry-only/G4E7CH_GEOMETRY_PIXELS_NOT_GAME_ART.json','utf8'));
          if(r.sampleCount!==12||!r.nonBlank||r.originalTexturesRendered!==false||
             r.actualGameWebgl!=='NOT_TESTED'||r.rights!=='CC_BY_4_0_ORIGINAL_ARTISTS_ATTRIBUTION_REQUIRED'||
             r.art!=='NOT_TESTED'||r.slope2Meters!==0)throw Error('False art/rights approval');
          console.log('REAL CHROMIUM GEOMETRY PIXELS, NOT REAL GAME SCREENSHOTS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ch-geometry-only-real-webgl-12-BG-240hz-HOLD
          path: test-results/g4e7ch-geometry-only/
          if-no-files-found: ignore
          retention-days: 7
