name: G4E-7CI integrated streetscape real private game WebGL (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7ci-integrated-streetscape.mjs'
      - 'web/drive3d.mjs'
      - 'scripts/build.mjs'
      - 'tests/p101-w9c2-g4e7ci-integrated-streetscape.test.mjs'
      - 'scripts/p101-w9c2-g4e7ci-real-game-capture.mjs'
      - '.github/workflows/p101-w9c2-g4e7ci-real-game.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7ci-private-native
  cancel-in-progress: true
jobs:
  original-game-paired-native-240hz:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine BC/B48 unchanged physics and 3 layers geometry tests
        run: |
          node --check web/p101-w9c2-g4e7ci-integrated-streetscape.mjs
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7ci-integrated-streetscape.test.mjs
      - name: PRIVATE original game only
        run: |
          npm ci --no-audit --no-fund
          npm run build:private
          npx playwright install --with-deps chromium
      - name: Real game original WebGL baseline vs integrated 6 scripted 240Hz frames
        run: node scripts/p101-w9c2-g4e7ci-real-game-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7ci-real-private-B48-WebGL-12-paired-images-ART-HOLD
          path: test-results/g4e7ci-real-game
          if-no-files-found: ignore
          retention-days: 7
