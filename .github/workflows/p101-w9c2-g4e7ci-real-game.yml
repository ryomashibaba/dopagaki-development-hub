name: G4E-7CI integrated streetscape real private game WebGL (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7ci-integrated-streetscape.mjs'
      - 'web/drive3d.mjs'
      - 'scripts/build.mjs'
      - 'tests/p101-w9c2-g4e7ci-integrated-streetscape.test.mjs'
      - 'scripts/p101-w9c2-g4e7ci-real-game-capture.mjs'
      - '.github/workflows/p101-w9c2-g4e7ci-real-game.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7ci-private-native
  cancel-in-progress: true
jobs:
  original-game-paired-native-240hz:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genuine BC/B48 unchanged physics and 3 layers geometry tests
        run: |
          node --check web/p101-w9c2-g4e7ci-integrated-streetscape.mjs
          node --check web/drive3d.mjs
          node --check scripts/p101-w9c2-g4e7ci-real-game-capture.mjs
          node --test tests/p101-w9c2-g4e7ci-integrated-streetscape.test.mjs
      - name: PRIVATE original game only
        run: |
          # No package-lock.json is checked into this repo: npm ci would always EUSAGE.
          # The installation stays ephemeral in the CI workspace, without lockfile mutation.
          npm install --no-save --no-package-lock --no-audit --no-fund
          npm run build:private
          # Ubuntu-24.04 GitHub runner has the standard graphical runtimes.
          # Installing all OS dependencies here ran apt for 18 minutes until
          # GitHub cancelled CU before any screenshots could be produced.
          # The native 240Hz WebGL comparison uses headless Chromium only.
          npx playwright install --only-shell chromium
      - name: Real game 12 core WebGL + 2 CR source-ID + 3 CT diagnostic screenshots
        run: node scripts/p101-w9c2-g4e7ci-real-game-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7cu-real-private-B48-WebGL-12core-2CR-3CT-ART-HOLD
          path: test-results/g4e7ci-real-game
          if-no-files-found: ignore
          retention-days: 7
