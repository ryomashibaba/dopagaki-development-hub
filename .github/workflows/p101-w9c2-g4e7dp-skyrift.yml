name: G4E-7DP genuine Blender single urban-world art candidate (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dp-skyrift-author.py'
      - '.github/workflows/p101-w9c2-g4e7dp-skyrift.yml'
      - 'tests/p101-w9c2-g4e7dp-spatial-story.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7dp-blender-actual-world
  cancel-in-progress: true
jobs:
  dp-original-240hz-reference-and-authored-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate protected source and fixed temporal composition
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dp-skyrift-author.py
          node --test tests/p101-w9c2-g4e7dp-spatial-story.test.mjs
          node scripts/p101-w9c2-g4e7do-master-export.mjs
      - name: Install verified Blender CPU renderer
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender libegl1 libgl1 libx11-6
      - name: Create genuine unchanged camera Blender reference master for both roads
        run: |
          mkdir -p test-results/g4e7dp-skyrift/references/true-pinch test-results/g4e7dp-skyrift/references/pinch-switch
          for road in true-pinch pinch-switch; do
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7do-master-blender.py -- --source test-results/g4e7do-master-camera/${road}.json --out test-results/g4e7dp-skyrift/references/${road}
          done
      - name: Produce actual editable single-world city and ten original-camera Blender views
        run: |
          for road in true-pinch pinch-switch; do
            mkdir -p test-results/g4e7dp-skyrift/${road}
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7dp-skyrift-author.py -- --source test-results/g4e7do-master-camera/${road}.json --master test-results/g4e7dp-skyrift/references/${road}/G4E7DO_${road}_ORIGINAL_NATIVE_CAMERA_MASTER_ART_HOLD.blend --out test-results/g4e7dp-skyrift/${road}
          done
          python3 - <<'PY'
          import glob,json,os
          root='test-results/g4e7dp-skyrift'
          png=glob.glob(root+'/**/*.png',recursive=True)
          edit=glob.glob(root+'/**/*.blend',recursive=True)
          dp=glob.glob(root+'/*/*_AUDIT.json')
          assert len(png)==20,(len(png),png)
          assert len(edit)==4,(len(edit),edit)
          assert len(dp)==2,dp
          for f in dp:
           x=json.load(open(f))
           assert x['cameraCount']==5 and x['originalCXTriangles']==22920
           assert x['addedColliders']==x['addedRoads']==x['addedHazards']==0
           assert x['actualGameWebGL']=='NOT_RUN' and x['art']=='HOLD'
          print('DP_4_EDITABLE_BLENDS_20_GENUINE_BLENDER_REFERENCES_NOT_WEBGL_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DP_SKYRIFT_ONE_WORLD_ORIGINAL_CAMERAS_REAL_BLENDER_ART_HOLD
          path: test-results/g4e7dp-skyrift
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
