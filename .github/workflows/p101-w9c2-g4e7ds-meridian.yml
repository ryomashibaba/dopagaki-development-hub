name: G4E-7DS ONE MERIDIAN inhabited urban composition with real B48 B51 and native cameras (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7ds-meridian-site.mjs'
      - 'scripts/p101-w9c2-g4e7ds-meridian-author.py'
      - 'tests/p101-w9c2-g4e7ds-meridian.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7ds-meridian.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7ds-one-authored-city-actual-road-and-camera
  cancel-in-progress: true
jobs:
  compose-and-review-real-physical-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove source CX, genuine B48/B51 and five stations have protected temporal clearance
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7ds-meridian-author.py
          node --test tests/p101-w9c2-g4e7ds-meridian.test.mjs
          node scripts/p101-w9c2-g4e7do-master-export.mjs
          node scripts/p101-w9c2-g4e7dr-physical-export.mjs
          node scripts/p101-w9c2-g4e7ds-meridian-site.mjs
      - name: Install real Cycles Blender without EGL GPU
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender libegl1 libgl1 libx11-6
      - name: Reconstruct exact unmodified art and physical source, then author ONE joined 3D city
        run: |
          mkdir -p test-results/g4e7ds-meridian
          for road in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7ds-meridian/do-$road" "test-results/g4e7ds-meridian/dr-$road" "test-results/g4e7ds-meridian/ds-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7do-master-blender.py -- --source "test-results/g4e7do-master-camera/$road.json" --out "test-results/g4e7ds-meridian/do-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7dr-physical-blender.py -- --master "test-results/g4e7ds-meridian/do-$road/G4E7DO_$road"_ORIGINAL_NATIVE_CAMERA_MASTER_ART_HOLD.blend --source "test-results/g4e7dr-physical-reference/data/$road.json" --binary "test-results/g4e7dr-physical-reference/data/$road.b48-f64.bin" --out "test-results/g4e7ds-meridian/dr-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7ds-meridian-author.py -- --source "test-results/g4e7ds-meridian/dr-$road/G4E7DR_$road"_B48_B51_240HZ_EDITABLE_ART_HOLD.blend --plan "test-results/g4e7ds-meridian/plan/$road.json" --out "test-results/g4e7ds-meridian/ds-$road"
          done
      - name: Reject missing evidence, mutation or falsely claimed WebGL or approval
        run: |
          python3 - <<'PY'
          import glob,json
          root='test-results/g4e7ds-meridian'
          png=glob.glob(root+'/**/*.png',recursive=True)
          blends=glob.glob(root+'/**/*.blend',recursive=True)
          audits=glob.glob(root+'/ds-*/*_ART_AUDIT.json')
          assert len(png)==30,(len(png),png)
          assert len(blends)==6,(len(blends),blends)
          assert len(audits)==2,audits
          for f in audits:
           a=json.load(open(f))
           assert a['siteCount']==5
           assert a['originalB48Surfaces']==7 and a['originalB51MovingOBB']==28
           assert a['originalCXObjects']==18 and a['genuineCameraFrames']==5
           assert a['addedArchitecturalObjects']>300
           assert a['geometricIntent']['occupiedFloors']>=55
           assert a['geometricIntent']['realDoorOpenings']>=30
           assert a['newGameColliders']==0 and not a['originalGamePhysicsEdited']
           assert a['originalWebGLGameFramebuffer']=='NOT_RENDERED'
           assert a['art']=='HOLD' and a['formalSlope2Meters']==0
          print('DS_30_GENUINE_BLENDER_VIEWS_6_EDITABLE_SCENES_REAL_PHYSICS_ART_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DS_MERIDIAN_ONE_CITY_NATIVE_PHYSICAL_240HZ_BLENDER_ART_HOLD
          path: |
            test-results/g4e7ds-meridian
            test-results/g4e7dr-physical-reference/data
          if-no-files-found: error
          retention-days: 7
          compression-level: 6