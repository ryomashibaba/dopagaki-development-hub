name: G4E-7DU authentic 56k triangle B48 CX + B51 ray tests and public street visibility overlays (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7du-exact-sightline.mjs'
      - 'scripts/p101-w9c2-g4e7du-visibility-blender.py'
      - 'tests/p101-w9c2-g4e7du-exact-sightline.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7du-exact-sightline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7du-exact-sightline-non-art
  cancel-in-progress: true
jobs:
  exact-sightline-civic-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact CX original blob, 56012 static source triangle & B51 ray tests
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-w9c2-g4e7du-exact-sightline.mjs
          python3 -m py_compile scripts/p101-w9c2-g4e7du-visibility-blender.py
          node --test tests/p101-w9c2-g4e7du-exact-sightline.test.mjs
          node scripts/p101-w9c2-g4e7du-exact-sightline.mjs
          node scripts/p101-w9c2-g4e7do-master-export.mjs
          node scripts/p101-w9c2-g4e7dr-physical-export.mjs
      - name: Install real Blender offline CPU without GPU display
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender libegl1 libgl1 libx11-6
      - name: Reconstruct authentic DO DR stage and render PRIVATE physical-world visual witness
        run: |
          for road in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7du-civic-sightlines/do-$road" "test-results/g4e7du-civic-sightlines/dr-$road" "test-results/g4e7du-civic-sightlines/du-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7do-master-blender.py -- --source "test-results/g4e7do-master-camera/$road.json" --out "test-results/g4e7du-civic-sightlines/do-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7dr-physical-blender.py -- --master "test-results/g4e7du-civic-sightlines/do-$road/G4E7DO_$road"_ORIGINAL_NATIVE_CAMERA_MASTER_ART_HOLD.blend --source "test-results/g4e7dr-physical-reference/data/$road.json" --binary "test-results/g4e7dr-physical-reference/data/$road.b48-f64.bin" --out "test-results/g4e7du-civic-sightlines/dr-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7du-visibility-blender.py -- --source "test-results/g4e7du-civic-sightlines/dr-$road/G4E7DR_$road"_B48_B51_240HZ_EDITABLE_ART_HOLD.blend --plan "test-results/g4e7du-civic-sightlines/plan/$road.json" --out "test-results/g4e7du-civic-sightlines/du-$road"
          done
      - name: Check unmodified city/physics, real comparison PNGs and no art approval
        run: |
          python3 - <<'PY'
          import glob,json
          root='test-results/g4e7du-civic-sightlines'
          png=glob.glob(root+'/**/*.png',recursive=True)
          blends=glob.glob(root+'/**/*.blend',recursive=True)
          reports=glob.glob(root+'/du-*/G4E7DU_*_VISIBILITY_AUDIT.json')
          assert len(png)==26,(len(png),png)
          assert len(blends)==6,(len(blends),blends)
          assert len(reports)==2,reports
          for f in reports:
           a=json.load(open(f))
           assert a['cxSourceCount']==18 and a['realB48Count']==7 and a['realB51Count']==28
           assert a['originalActualTrianglesTested']==56012
           assert a['originalCameraRaysClear']==117
           assert a['originalWorldCorridorSegmentChecks']==36
           assert a['negativeControlBlockedFrames']>=1
           assert a['newCityArchitecture']==0 and a['newGameColliders']==0
           assert a['realGameWebGL']=='NOT_RENDERED'
           assert a['physicalGameplayAccess']=='NOT_TESTED'
           assert a['art']=='HOLD' and a['officialSlope2Meters']==0
          print('DU_EXACT_CX_B48_B51_RAY_GUARD_AND_26_REAL_BLENDER_FRAMES_PASS_NOT_ART')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DU_ORIGINAL_WORLD_VISIBILITY_117_RAYS_120M_NOT_ART_APPROVED
          path: |
            test-results/g4e7du-civic-sightlines
            test-results/g4e7dr-physical-reference/data
          retention-days: 7
          if-no-files-found: error
          compression-level: 6