name: G4E-7DW LOW-LIFT realistic B48 road-edge 2m portal original Blender camera visual (ART HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dw-road-portal-blender.py'
      - '.github/workflows/p101-w9c2-g4e7dw-road-portal-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7dw-real-road-h2-low-lift-unadopted-art
  cancel-in-progress: true
jobs:
  camera-size-vs-safe-access-physical-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      DOPAGAKI_G4E7BE_VISUAL: '1'
      DOPAGAKI_G4E7BG_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute native exact 56012-triangle original-world candidate search
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dw-road-portal-blender.py
          node scripts/p101-w9c2-g4e7dw-screen-road-visibility.mjs
          node scripts/p101-w9c2-g4e7do-master-export.mjs
          node scripts/p101-w9c2-g4e7dr-physical-export.mjs
      - name: Install genuine Blender CPU Cycles
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender libegl1 libgl1 libx11-6
      - name: Stage original DO native Blender, DR original B48/B51, then one road-edge original-camera study
        run: |
          for road in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dw-blender/do-$road" "test-results/g4e7dw-blender/dr-$road" "test-results/g4e7dw-blender/dw-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7do-master-blender.py -- --source "test-results/g4e7do-master-camera/$road.json" --out "test-results/g4e7dw-blender/do-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7dr-physical-blender.py -- --master "test-results/g4e7dw-blender/do-$road/G4E7DO_$road"_ORIGINAL_NATIVE_CAMERA_MASTER_ART_HOLD.blend --source "test-results/g4e7dr-physical-reference/data/$road.json" --binary "test-results/g4e7dr-physical-reference/data/$road.b48-f64.bin" --out "test-results/g4e7dw-blender/dr-$road"
            blender -b --factory-startup -t 2 --python-exit-code 4 --python scripts/p101-w9c2-g4e7dw-road-portal-blender.py -- --source "test-results/g4e7dw-blender/dr-$road/G4E7DR_$road"_B48_B51_240HZ_EDITABLE_ART_HOLD.blend --site-report "test-results/g4e7dw-road-screen-selection/G4E7DW_WORLD_SOURCE_SELECTION_ART_HOLD.json" --road "$road" --out "test-results/g4e7dw-blender/dw-$road"
          done
      - name: Verify all original source objects and forbid art/gameplay certification
        run: |
          python3 - <<'PY'
          import glob,json
          root='test-results/g4e7dw-blender'
          assert len(glob.glob(root+'/**/*.png',recursive=True))==26
          assert len(glob.glob(root+'/**/*.blend',recursive=True))==6
          audit=glob.glob(root+'/dw-*/*_LOWLIFT_2M_ART_AUDIT.json')
          assert len(audit)==2
          for f in audit:
           x=json.load(open(f))
           assert x['originalExactB48Count']==7
           assert x['originalCXCount']==18 and x['originalB51MovingCount']==28
           assert x['originalNativeCameraCount']==5
           assert x['provenProjectionsBothRoads']==6
           assert 17.9<=x['entryCandidateH2MinWidthPixels']<18
           assert x['entryCandidateH24MinWidthPixels']>=18
           assert x['addedWireDiagnosticsOnly']==4
           assert x['addedGameColliders']==0 and not x['originalPhysicsModified']
           assert x['actualPlayableRoadAccess']=='UNPROVEN'
           assert x['actualWebGLFramebuffer']=='NOT_RENDERED'
           assert x['art']=='HOLD' and x['officialSlope2Meters']==0
          print('DW_COMPARE_LOW_2M_LIFT_ENTRY_ORIGINAL_240HZ_NOT_ADOPTED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DW_ROAD_NEAR_ENTRANCE_H2_ORIGINAL_BLENDER_ART_HOLD
          path: |
            test-results/g4e7dw-blender
            test-results/g4e7dw-road-screen-selection
          retention-days: 7
          if-no-files-found: error
          compression-level: 6