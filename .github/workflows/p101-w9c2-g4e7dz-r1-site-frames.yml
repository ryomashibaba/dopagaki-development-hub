name: G4E-7DZ R1 original WebGL camera-first position guides PRIVATE HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r1-native-aperture-contactsheet.mjs'
      - 'tests/p101-w9c2-g4e7dz-r1-native-aperture-contactsheet.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7dz-r1-site-frames.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r1-native-webgl-site-private
  cancel-in-progress: true
jobs:
  untouched-original-webgl-guides:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test projection source / refuse modified source CX
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-w9c2-g4e7dz-r1-native-aperture-contactsheet.mjs
          node --test tests/p101-w9c2-g4e7dz-r1-native-aperture-contactsheet.test.mjs
      - name: Retrieve actual genuine DJ WebGL screenshots / no fresh render
        run: |
          mkdir -p test-results/dz-r1-source
          gh run download 40417051913 \
            --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DJ_PRIVATE_TRUE_GAME_20_FRAME_STORYBOARD_ART_HOLD \
            --dir test-results/dz-r1-source
          test "$(find test-results/dz-r1-source -maxdepth 1 -name '*.png' | wc -l)" -eq 20
      - name: Native 240Hz camera placement overlay and SHA-256 verification
        run: |
          node scripts/p101-w9c2-g4e7dz-r1-native-aperture-contactsheet.mjs test-results/dz-r1-source test-results/dz-r1-guides
          test "$(find test-results/dz-r1-guides -name '*-GUIDE.svg' | wc -l)" -eq 24
      - uses: actions/upload-artifact@v4
        with:
          name: G4E7DZ_R1_REAL_BASE_WEBGL_CAMERA_PLACEMENT_OVERLAYS_ONLY_ART_HOLD
          path: test-results/dz-r1-guides/
          if-no-files-found: error
          retention-days: 7
