name: G4E-7DZ R2 original WebGL multi-layer city study PRIVATE ART HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r2-native-city-narrative.mjs'
      - 'tests/p101-w9c2-g4e7dz-r2-native-city-narrative.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7dz-r2-native-narrative.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r2-private-city-narrative
  cancel-in-progress: true
jobs:
  original-webgl-city-guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source protection and test geometry
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          node --check scripts/p101-w9c2-g4e7dz-r2-native-city-narrative.mjs
          node --test tests/p101-w9c2-g4e7dz-r2-native-city-narrative.test.mjs
          node --test tests/p101-w9c2-g4e7dz-r1-native-aperture-contactsheet.test.mjs
      - name: Fetch genuine DJ game WebGL frames
        run: |
          mkdir -p test-results/dz-r2-source
          gh run download 40417051913 --repo ryomashibaba/dopagaki-development-hub --name G4E7DJ_PRIVATE_TRUE_GAME_20_FRAME_STORYBOARD_ART_HOLD --dir test-results/dz-r2-source
          test "$(find test-results/dz-r2-source -maxdepth 1 -name '*.png' | wc -l)" -eq 20
      - name: Native camera narrative storyboard and source sha verification
        run: |
          node scripts/p101-w9c2-g4e7dz-r2-native-city-narrative.mjs test-results/dz-r2-source test-results/dz-r2-guides
          test "$(find test-results/dz-r2-guides -name '*-R2-GUIDE.svg' | wc -l)" -eq 24
      - uses: actions/upload-artifact@v4
        with:
          name: G4E7DZ_R2_REAL_DJ_WEBGL_WITH_PROJECTED_NOT_RENDERED_CITY_ART_HOLD
          path: test-results/dz-r2-guides/
          if-no-files-found: error
          retention-days: 7
