name: G4E-7DZ R5B PRIVATE actual CX junction Blender images HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r5b-native-junction.py'
      - '.github/workflows/p101-w9c2-g4e7dz-r5b-native-junction.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r5b-editable-junction-private
  cancel-in-progress: true
jobs:
  genuine-two-road-junction-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Immutable CX and syntax checks
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dz-r5b-native-junction.py
      - name: Reuse source original DR and actual R5A evidence
        run: |
          mkdir -p test-results/g4e7dz-r5b/source test-results/g4e7dz-r5b/contact
          gh run download 40587470014 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DY_R1_ORIGINAL_B48_SKY_CIVIC_CITY_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/g4e7dz-r5b/source
          gh run download 40635016206 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R5A_PRIVATE_SOURCE_CX_B48_CONNECTION_HOLD \
            --dir test-results/g4e7dz-r5b/contact
          python3 - <<'PY'
          import json
          for r in ('true-pinch','pinch-switch'):
            p='test-results/g4e7dz-r5b/contact/result-'+r+'/R5A_'+r+'_SOURCE_CONTACT.json'
            a=json.load(open(p))
            assert a['best'] and a['best']['preliminaryCandidate'] and a['officialArt']==0
          PY
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Render new truly editable junction in authentic DR Blender cameras
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dz-r5b/junction-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-w9c2-g4e7dz-r5b-native-junction.py -- \
              --source "test-results/g4e7dz-r5b/source/dr-$r/G4E7DR_$r"_B48_B51_240HZ_EDITABLE_ART_HOLD.blend \
              --site-report test-results/g4e7dz-r5b/source/G4E7DY_R1_NATIVE_APPROACH_SPATIAL_DATA.json \
              --contact "test-results/g4e7dz-r5b/contact/result-$r/R5A_$r"_SOURCE_CONTACT.json \
              --road "$r" --out "test-results/g4e7dz-r5b/junction-$r"
          done
      - name: Verify real files without promoting visual quality
        run: |
          python3 - <<'PY'
          import glob,json
          x=glob.glob('test-results/g4e7dz-r5b/junction-*/*_AUDIT.json')
          assert len(x)==2,x
          assert len(glob.glob('test-results/g4e7dz-r5b/junction-*/*.blend'))==2
          assert len(glob.glob('test-results/g4e7dz-r5b/junction-*/*.png'))==8
          for f in x:
            a=json.load(open(f))
            assert (a['sourceCX'],a['sourceB48'],a['sourceB51'],a['sourceCameras'])==(18,7,28,5)
            assert a['gap52'] and a['newEditableMeshCount']==2
            assert not a['sourceChanged'] and a['gameNewColliders']==0
            assert a['officialArt']==a['officialSlope2Meters']==0
            assert a['newCityWebGL']=='NOT_RENDERED' and a['humanPlay']=='NOT_RUN'
            assert a['art']==a['release']==a['merge']=='HOLD'
          print('R5B_ACTUAL_BLENDER_SOURCE_JUNCTION_ONLY_ART_NOT_CERTIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DZ_R5B_GENUINE_BLENDER_CX_JUNCTION_UNADOPTED_PRIVATE
          path: test-results/g4e7dz-r5b/junction-*
          retention-days: 7
          if-no-files-found: warn
