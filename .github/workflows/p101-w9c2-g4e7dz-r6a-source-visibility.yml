name: G4E-7DZ R6A PRIVATE original camera source visibility HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r6a-source-visibility.py'
      - '.github/workflows/p101-w9c2-g4e7dz-r6a-source-visibility.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r6a-private-original-visibility
  cancel-in-progress: true
jobs:
  native-source-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Frozen CX and Python syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dz-r6a-source-visibility.py
      - name: Reuse original DR editable Blender source and R5A actual contact
        run: |
          mkdir -p test-results/g4e7dz-r6a/source test-results/g4e7dz-r6a/contact
          gh run download 40587470014 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DY_R1_ORIGINAL_B48_SKY_CIVIC_CITY_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/g4e7dz-r6a/source
          gh run download 40635016206 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R5A_PRIVATE_SOURCE_CX_B48_CONNECTION_HOLD \
            --dir test-results/g4e7dz-r6a/contact
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Actual untouched source 240Hz camera Blender renders and ray masks
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dz-r6a/result-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-w9c2-g4e7dz-r6a-source-visibility.py -- \
              --source "test-results/g4e7dz-r6a/source/dr-$r/G4E7DR_$r"_B48_B51_240HZ_EDITABLE_ART_HOLD.blend \
              --site-report test-results/g4e7dz-r6a/source/G4E7DY_R1_NATIVE_APPROACH_SPATIAL_DATA.json \
              --contact "test-results/g4e7dz-r6a/contact/result-$r/R5A_$r"_SOURCE_CONTACT.json \
              --road "$r" --out "test-results/g4e7dz-r6a/result-$r"
          done
      - name: Verify source-only evidence, no unsupported art promotion
        run: |
          python3 - <<'PY'
          import json,glob
          files=glob.glob('test-results/g4e7dz-r6a/result-*/*_SOURCE_AUDIT.json')
          images=glob.glob('test-results/g4e7dz-r6a/result-*/*.png')
          assert len(files)==2 and len(images)==16,(files,len(images))
          for f in files:
           d=json.load(open(f))
           assert d['schema']=='dopagaki.g4e7dz-r6a-source-visibility/1'
           assert (d['sourceCX'],d['sourceB48'],d['sourceB51'],d['sourceCameras'])==(18,7,28,5)
           assert d['gap52'] and len(d['frames'])==4
           assert not d['sourceGameChanged'] and d['newArtMeshes']==d['newGameColliders']==0
           assert d['officialArt']==d['officialSlope2Meters']==0
           assert d['newCityWebGL']=='NOT_RENDERED' and d['humanPlay']=='NOT_RUN'
           assert all(d[x]=='HOLD' for x in ('ART','GAMEPLAY','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
           assert all(sum(a['categories'].values())==2560 for a in d['frames'])
          print('R6A_SOURCE_PROJECTION_ONLY_NEVER_ART_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DZ_R6A_TRUE_DR_SOURCE_VISIBILITY_PRIVATE_HOLD
          path: test-results/g4e7dz-r6a/result-*
          retention-days: 7
          if-no-files-found: warn
