name: G4E-7DZ R6B PRIVATE inhabitable road-section native Blender HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r6b-integrated-section.py'
      - '.github/workflows/p101-w9c2-g4e7dz-r6b-integrated-section.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r6b-private-road-section
  cancel-in-progress: true
jobs:
  genuine-two-road-section:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected CX and Python syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dz-r6b-integrated-section.py
      - name: Reuse source DR original world and actual R5A contact evidence
        run: |
          mkdir -p test-results/g4e7dz-r6b/source test-results/g4e7dz-r6b/contact
          gh run download 40587470014 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DY_R1_ORIGINAL_B48_SKY_CIVIC_CITY_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/g4e7dz-r6b/source
          gh run download 40635016206 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R5A_PRIVATE_SOURCE_CX_B48_CONNECTION_HOLD \
            --dir test-results/g4e7dz-r6b/contact
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Create one editable inhabited urban cross-section from true source
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dz-r6b/result-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-w9c2-g4e7dz-r6b-integrated-section.py -- \
              --source "test-results/g4e7dz-r6b/source/dr-$r/G4E7DR_$r"_B48_B51_240HZ_EDITABLE_ART_HOLD.blend \
              --site-report test-results/g4e7dz-r6b/source/G4E7DY_R1_NATIVE_APPROACH_SPATIAL_DATA.json \
              --contact "test-results/g4e7dz-r6b/contact/result-$r/R5A_$r"_SOURCE_CONTACT.json \
              --road "$r" --out "test-results/g4e7dz-r6b/result-$r"
          done
      - name: Verify evidence and NEVER promote art based on CI
        run: |
          python3 - <<'PY'
          import glob,json
          root='test-results/g4e7dz-r6b'
          a=glob.glob(root+'/result-*/*_AUDIT.json')
          blends=glob.glob(root+'/result-*/*.blend')
          pngs=glob.glob(root+'/result-*/*.png')
          assert len(a)==2 and len(blends)==2 and len(pngs)==8,(a,blends,pngs)
          for p in a:
            d=json.load(open(p))
            assert d['schema']=='dopagaki.g4e7dz-r6b-integrated-section/1'
            assert (d['sourceCX'],d['sourceB48'],d['sourceB51'],d['sourceCameras'])==(18,7,28,5)
            assert d['gap52'] and d['sourceIdentityPreserved']
            assert d['newEditableMeshCount']==9 and len(d['images'])==4
            assert d['gameNewColliders']==d['officialArt']==d['officialSlope2Meters']==0
            assert not d['sourceGameChanged'] and d['newCityWebGL']=='NOT_RENDERED'
            assert d['humanPlay']=='NOT_RUN'
            assert all(d[x]=='HOLD' for x in ('ART','GAMEPLAY','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
            assert len(d['nativeCameraVisibilityNotArtQuality'])==4
            print(d['road'],'B48 hits',len(d['B48TriangleOverlaps']),
              'CX hits',len(d['CXTriangleOverlaps']),
              'B51 sampled hits',sum(len(v) for v in d['B51FourTimeSampleTriangleOverlaps'].values()))
          print('R6B_GENUINE_BLENDER_AND_AUDIT_ONLY_NOT_ART_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DZ_R6B_ONE_TRUE_DR_BLENDER_CITY_SECTION_PRIVATE_HOLD
          path: test-results/g4e7dz-r6b/result-*
          retention-days: 7
          if-no-files-found: warn
