name: G4E-7DZ R6C PRIVATE true-source B51-04 keepout guide HOLD
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r6c-machine04-volume.py'
      - '.github/workflows/p101-w9c2-g4e7dz-r6c-machine04-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r6c-private-sampled-keepout
  cancel-in-progress: true
jobs:
  original-machine-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected CX and Python syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dz-r6c-machine04-volume.py
      - name: Reuse authentic original DR editable Blender sources
        run: |
          mkdir -p test-results/g4e7dz-r6c/source
          gh run download 40587470014 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DY_R1_ORIGINAL_B48_SKY_CIVIC_CITY_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/g4e7dz-r6c/source
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Build original B51-04 four-snapshot keep-out guide in editable source
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dz-r6c/result-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-w9c2-g4e7dz-r6c-machine04-volume.py -- \
              --source "test-results/g4e7dz-r6c/source/dr-$r/G4E7DR_$r"_B48_B51_240HZ_EDITABLE_ART_HOLD.blend \
              --road "$r" --out "test-results/g4e7dz-r6c/result-$r"
          done
      - name: Check genuine Blender outputs and explicit non-certification
        run: |
          python3 - <<'PY'
          import glob,json
          root='test-results/g4e7dz-r6c'
          audits=glob.glob(root+'/result-*/*_AUDIT.json')
          blends=glob.glob(root+'/result-*/*.blend')
          pngs=glob.glob(root+'/result-*/*.png')
          assert len(audits)==2 and len(blends)==2 and len(pngs)==8,(audits,blends,pngs)
          assert {json.load(open(p))['road'] for p in audits}=={'true-pinch','pinch-switch'}
          for path in audits:
           d=json.load(open(path))
           assert d['schema']=='dopagaki.g4e7dz-r6c-sampled-machine-keepout/1'
           assert (d['sourceCX'],d['sourceB48'],d['sourceB51'],d['sourceCameras'])==(18,7,28,5)
           assert d['sourceIdentityPreserved'] and d['gap52']
           assert d['newCityMeshes']==d['newGameColliders']==d['officialArt']==d['officialSlope2Meters']==0
           assert d['newDiagnosticCurves']==5 and len(d['trueBlenderGuidePngs'])==4
           assert d['sourceGameChanged'] is False
           assert d['motionBetweenSnapshots']=='UNKNOWN' and d['futureSafeSpace']=='NOT_CERTIFIED'
           assert d['newCityWebGL']=='NOT_RENDERED' and d['humanPlay']=='NOT_RUN'
           assert all(d[k]=='HOLD' for k in ('ART','GAMEPLAY','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
           assert set(d['frameWorldAabb'])=={'t1550','t1600','t1650','t1700'}
          print('R6C_GENUINE_ORIGINAL_WORLD_DIAGNOSTIC_ONLY_NO_CITY_ADOPTION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DZ_R6C_MACHINE04_ORIGINAL_WORLD_PRIVATE_KEEP_OUT_ART_HOLD
          path: test-results/g4e7dz-r6c/result-*
          retention-days: 7
          if-no-files-found: warn
