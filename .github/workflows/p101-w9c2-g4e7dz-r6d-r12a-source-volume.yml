name: G4E-7DZ R6D-R12A private native-camera safe-city-volume field
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r6d-r12a-true-camera-volume-field.py'
      - '.github/workflows/p101-w9c2-g4e7dz-r6d-r12a-source-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r12a-original-safe-volumes
  cancel-in-progress: true
jobs:
  original-volume-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Original immutable source identity and candidate script syntax
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dz-r6d-r12a-true-camera-volume-field.py
      - name: Retrieve R1 exact original scene and native 13-frame 240Hz source and R4 original B51 721-tick study
        run: |
          mkdir -p test-results/g4e7dz-r12a/r1 test-results/g4e7dz-r12a/r4
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/g4e7dz-r12a/r1
          gh run download 40671430779 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R4_28HAZARD_7VIEW_TRUE_SOURCE_WORLD_DIAG_HOLD \
            --dir test-results/g4e7dz-r12a/r4
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Real source world safe 3D candidate and original native 13-camera visibility on both roads
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dz-r12a/result-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-w9c2-g4e7dz-r6d-r12a-true-camera-volume-field.py -- \
              --blend "test-results/g4e7dz-r12a/r1/result-$r/R1_$r"_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
              --native "test-results/g4e7dz-r12a/r1/source/$r.json" \
              --hazards "test-results/g4e7dz-r12a/r4/source/$r.json" \
              --road "$r" --out "test-results/g4e7dz-r12a/result-$r"
          done
      - name: Independent source and non-adoption checks
        run: |
          python3 - <<'PY'
          import glob,json
          paths=glob.glob('test-results/g4e7dz-r12a/result-*/*_SAFE_NATIVE_VOLUME_FIELD.json')
          assert len(paths)==2,paths
          for path in paths:
           x=json.load(open(path))
           assert x['schema']=='dopagaki.g4e7dz-r6d-r12a-source-cameras-safe-volume-field/1'
           assert x['sourceCXBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
           assert x['sourceCX18B48_7B51_28Cameras5Unchanged']
           assert x['testedSourceBoxDimensionsMetres']==[26,30,36]
           assert x['originalR1Native13FramesUsed'] and x['all28Moving721TickConservativeAABBUsed']
           assert len(x['allSafeCameraVisibleCandidatePositions'])==x['candidateCount']
           assert sum(x['candidateCountByEra'].values())==x['candidateCount']
           for v in x['allSafeCameraVisibleCandidatePositions']:
            assert v['clearOriginalCXAndB48SourceTriangles']
            assert v['clearAll28Moving721TickSampleAABBs']
            assert v['cameraFramesWithTwoClearInteriorHeights']>=1
           assert not x['sourceGameChanged']
           assert x['newResearchArchitectureMeshes']==x['newGameColliders']==x['officialArt']==x['officialSlope2Metres']==0
           assert all(x[k]=='HOLD' for k in ('ART','GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
           print('R12A_EVIDENCE_REAL_SOURCE',x['road'],x['candidateCountByEra'],
             {k:v['worldXYZ'] if v else None for k,v in x['bestPerEra'].items()})
          print('R12A_REAL_SOURCE_RESEARCH_ONLY_NOT_GAME_OR_ART_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DZ_R12A_ORIGINAL_13CAM_SAFE_VOLUME_ALL28_B51_HOLD
          path: test-results/g4e7dz-r12a/result-*/
          retention-days: 7
          if-no-files-found: warn
