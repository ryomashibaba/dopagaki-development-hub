name: G4E-7DZ R6D-R13B PRIVATE true-source corridor width floor support and 14 source cameras
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r6d-r13b-true-source-wide-volume-and-support.py'
      - '.github/workflows/p101-w9c2-g4e7dz-r6d-r13b-real-width-support-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r13b-native-real-debug-source
  cancel-in-progress: true
jobs:
  original-source-wide-void-and-support-diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify original protected source and compiled Blender script
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dz-r6d-r13b-true-source-wide-volume-and-support.py
      - name: Reuse original R1/R4 evidence and genuinely proven R13A 8m 3D empty-space path
        run: |
          mkdir -p test-results/g4e7dz-r13b/r1 test-results/g4e7dz-r13b/r4 test-results/g4e7dz-r13b/r13a
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/g4e7dz-r13b/r1
          gh run download 40671430779 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R4_28HAZARD_7VIEW_TRUE_SOURCE_WORLD_DIAG_HOLD \
            --dir test-results/g4e7dz-r13b/r4
          gh run download 40690352681 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R13A_TRUE_SOURCE_8M_3D_CONNECTED_EARLY_MIDDLE_RESEARCH_HOLD \
            --dir test-results/g4e7dz-r13b/r13a
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Real Blender original-world widened corridor and structural 7 source-camera debug images per road
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dz-r13b/result-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-w9c2-g4e7dz-r6d-r13b-true-source-wide-volume-and-support.py -- \
              --source "test-results/g4e7dz-r13b/r1/result-$r/R1_$r"_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
              --native "test-results/g4e7dz-r13b/r1/source/$r.json" \
              --hazards "test-results/g4e7dz-r13b/r4/source/$r.json" \
              --r13a "test-results/g4e7dz-r13b/r13a/result-$r/R13A_$r"_ORIGINAL_SOURCE_8M_VOXEL_CORRIDOR.json \
              --road "$r" --out "test-results/g4e7dz-r13b/result-$r"
          done
      - name: Independently review source geometry integrity and refuse false 'empty air = public bridge' approval
        run: |
          python3 - <<'PY'
          import glob,json
          root='test-results/g4e7dz-r13b'
          audits=glob.glob(root+'/result-*/*_ORIGINAL_3D_WIDTH_AND_FOOTINGS.json')
          previews=glob.glob(root+'/result-*/*.png')
          edits=glob.glob(root+'/result-*/*.blend')
          assert len(audits)==2 and len(previews)==14 and len(edits)==2,(audits,len(previews),edits)
          assert {json.load(open(x))['road'] for x in audits}=={'true-pinch','pinch-switch'}
          for f in audits:
           x=json.load(open(f))
           assert x['schema']=='dopagaki.g4e7dz-r6d-r13b-true-original-expanded-3d-width-and-support/1'
           assert x['sourceCXBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
           assert x['sourceCX18B48_7B51_28Cameras5Unchanged']
           assert x['R13AOriginalSource8mRouteWasGenuinelyClear']
           assert x['all28B51_721SampledAabbUsed']
           assert x['originalSource3DProbesAlongPath']>=30
           assert [q['horizontalSourceVolumeWidthMetres'] for q in x['real3DSafeWidthComparisons']]==[8,12,16,24,32]
           for q in x['real3DSafeWidthComparisons']:
            assert q['3DVolumesSampledIncludingQuarterStep']==x['originalSource3DProbesAlongPath']
            assert 0<=q['originalWorldClearVolumes']<=q['3DVolumesSampledIncludingQuarterStep']
           assert not x['realPublicBridgeOrHumanWalkwayExists']
           assert not x['structuralSupportsBuiltAndCertified']
           assert len(x['genuineOriginalSourceFloorDownwardProbes'])==10
           assert 0<=x['existingFloorWithin12mSamples']<=10
           assert x['original8mCorridorProposedGrade']>.15
           assert len(x['originalNativeSource7CameraDiagnosticPNG'])==7
           assert x['diagnosticCyanMeshesNotCityArt']>0
           assert not x['originalGameSourceChanged']
           assert x['officialArt']==x['officialSlope2Metres']==x['newGameColliders']==0
           assert all(x[k]=='HOLD' for k in ('ART','GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
           print('R13B_ACTUAL_WIDE_WORLD_GEOMETRY',x['road'],
            [(q['horizontalSourceVolumeWidthMetres'],q['originalWorldClearVolumes']) for q in x['real3DSafeWidthComparisons']],
            'supports12m',x['existingFloorWithin12mSamples'],
            'native true images',len(x['originalNativeSource7CameraDiagnosticPNG']))
          print('R13B_RESEARCH_VOLUMES_NOT_A_BUILT_BRIDGE_OR_ART')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DZ_R13B_ORIGINAL_SOURCE_WIDE_VOXEL_REAL_14_CAMERA_DEBUG_ART_HOLD
          path: test-results/g4e7dz-r13b/result-*/
          retention-days: 7
          if-no-files-found: warn
