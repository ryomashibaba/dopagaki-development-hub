name: G4E-7DZ R6D-R8D PRIVATE existing CX early-source floor anchor alternatives
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7dz-r6d-r8d-source-anchor-audit.py'
      - '.github/workflows/p101-w9c2-g4e7dz-r6d-r8d-anchor.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: g4e7dz-r8d-source-floor-alternative
  cancel-in-progress: true
jobs:
  actual-original-cx-mesh-floor-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Protect source and syntax check
        run: |
          test "$(git hash-object web/p101-w9c2-g4e7ci-integrated-streetscape.mjs)" = af076d67492a677d2235e4730aef8cdf4808e106
          python3 -m py_compile scripts/p101-w9c2-g4e7dz-r6d-r8d-source-anchor-audit.py
      - name: Fetch R1 actual source plus chronological R8B selected original geometry coordinates
        run: |
          mkdir -p test-results/g4e7dz-r8d/source-r1 test-results/g4e7dz-r8d/source-r8b
          gh run download 40666518657 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R6D_R1_EARLY_11_17_NATIVE_BLENDER_PRIVATE_ART_HOLD \
            --dir test-results/g4e7dz-r8d/source-r1
          gh run download 40678683173 --repo ryomashibaba/dopagaki-development-hub \
            --name G4E7DZ_R8B_TIME_ORDERED_ROUTE_GRAPH_NO_ART_HOLD \
            --dir test-results/g4e7dz-r8d/source-r8b
      - uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.2'
      - name: Query truly existing upward CX floor polygons for earlier physical anchor, no new art
        run: |
          for r in true-pinch pinch-switch; do
            mkdir -p "test-results/g4e7dz-r8d/result-$r"
            blender -b --factory-startup -t 2 --python-exit-code 5 \
              --python scripts/p101-w9c2-g4e7dz-r6d-r8d-source-anchor-audit.py -- \
              --blend "test-results/g4e7dz-r8d/source-r1/result-$r/R1_$r"_11TO17_TRUE_NATIVE_EDITABLE_PRIVATE.blend \
              --native "test-results/g4e7dz-r8d/source-r1/source/$r.json" \
              --r8b "test-results/g4e7dz-r8d/source-r8b/R8B_$r"_TEMPORAL_GRADE_GRAPH.json \
              --road "$r" --out "test-results/g4e7dz-r8d/result-$r"
          done
      - name: Validate true source CX surface evidence, no false public access certification
        run: |
          python3 - <<'PY'
          import glob,json
          reports=glob.glob('test-results/g4e7dz-r8d/result-*/*_REAL_SOURCE_ALTERNATIVE_CX_FACE.json')
          assert len(reports)==2,reports
          for f in reports:
           d=json.load(open(f))
           assert d['schema']=='dopagaki.g4e7dz-r6d-r8d-alternative-existing-cx-floor/1'
           assert d['sourceCXBlob']=='af076d67492a677d2235e4730aef8cdf4808e106'
           assert d['sourceIdentityProtected']
           assert (d['originalCX'],d['originalB48'],d['originalB51'],d['originalCameras'])==(18,7,28,5)
           assert d['existingR5ACXInitialRouteHorizontalMetres']>400
           assert len(d['bestFloorFaceWithinEarlyNativeCameraFrame'])==13
           for item in d['topPotentialRealExistingCxFloorFaces']:
            assert item['floorNormalY']>=.82
            assert item['sourceMeshPolygonArea']>=10
            assert item['horizontalDistanceToEarly']<=420
            assert not item['physicalPedestrianAccessCertified']
           assert d['physicalHumanRouteCertified'] is False
           assert d['noNewBlenderCityMesh'] is True
           assert d['newGameColliders']==d['officialArt']==d['officialSlope2Meters']==0
           assert all(d[k]=='HOLD' for k in ('ART','GAMEPLAY','HUMAN','PERFORMANCE','INTEGRATION','RELEASE','MERGE'))
           best=d['bestExistingSourceCxFloorCandidate']
           print('R8D_SOURCE_FLOOR_RESEARCH',d['road'],'faces',d['surveyedActualUpwardCXPolygonsWithin420m'],
            'closest alternative',best['horizontalDistanceToEarly'] if best else 'NONE',
            'direct grade',best['directLineGrade'] if best else 'NONE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G4E7DZ_R8D_EARLY_CX_REAL_SOURCE_FACE_ALTERNATIVES_ART_HOLD
          path: test-results/g4e7dz-r8d/result-*/
          retention-days: 7
          if-no-files-found: warn
