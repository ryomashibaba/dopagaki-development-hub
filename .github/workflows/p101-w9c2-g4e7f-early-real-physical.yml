name: W9-C2 G4E-7F true early Slope road physics research (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7f-real-slope-build.mjs'
      - 'scripts/p101-w9c2-g4e7f-native-matrix.mjs'
      - 'tests/p101-w9c2-g4e7f-real-slope.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7f-early-real-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e7f-real-slope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gold lattice, 28 machines, 300m actual 3D physics and 2 prior protected stages
        run: node --test tests/p101-w9c2-g4e7f-real-slope.test.mjs
      - name: Five genuine 240Hz real start00 runs: Gold, two failed originals, glide and flow
        run: |
          node scripts/p101-w9c2-g4e7f-native-matrix.mjs g4e7f-real-physics.json
          node --input-type=module -e '
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("g4e7f-real-physics.json","utf8"));
          if(!d.control.finished||d.control.roadCount!==7||d.candidates.length!==4||
            d.candidates.some(c=>c.physicsWindowMeters!==300||c.officiallyApprovedSlopeDnaMeters!==0)||
            d.candidates.some(c=>c.id!=="glide"&&c.finished)||
            !d.candidates.some(c=>c.id==="glide"&&c.finished&&c.allSevenInOrder&&
              c.elapsedSeconds<=d.control.time+3&&c.peakSpeedMps>=200)||
            !d.fullRuns.some(r=>r.variant==="glide"&&r.movingContactCount>=1&&
              r.airborneSeconds<3&&r.source.includes("SCRIPTED_NOT_HUMAN"))||
            d.fullRuns.some(r=>r.hz!==240||r.originalMovingCount!==28||r.initialSpeedMps!==52||
              r.approvedSlopeDnaMeters!==0)||d.release!=="HOLD")
            throw Error("G4E7F physical evidence/Gold integrity invalid");
          console.log(JSON.stringify(d.candidates));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9c2-g4e7f-real-physical-native-${{ github.run_id }}
          path: g4e7f-real-physics.json
          if-no-files-found: ignore
          retention-days: 10
