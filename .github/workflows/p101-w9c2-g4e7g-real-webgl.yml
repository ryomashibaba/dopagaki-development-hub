name: W9-C2 G4E-7G real GLIDE WebGL private visual review (nonpublishing)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7g-visual-stage.mjs'
      - 'tests/p101-w9c2-g4e7g-visual-stage.test.mjs'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - 'tests/browser/p101-w9c2-g4e7g-real-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7g-real-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e7g-real-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-glide-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOPAGAKI_G4E7G_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: dist-private
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real 300m geometry, Gold immutability and isolated camera-spawn tests
        run: |
          node --check scripts/build.mjs
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7f-real-slope.test.mjs tests/p101-w9c2-g4e7g-visual-stage.test.mjs
      - name: Install pinned Chromium on supported Ubuntu
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate only PRIVATE Gold and Glide research assets
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GOLD_LOCAL_VISUAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
      - name: Actual 8 screenshots, paired normalized road positions and Gold-default WebGL gate
        run: npx playwright test tests/browser/p101-w9c2-g4e7g-real-webgl.spec.mjs
      - name: Public and public-safe builds MUST omit all G4E7G view assets with flag still set
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7G_GOLD_LOCAL_VISUAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7G_GOLD_LOCAL_VISUAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7g-glide-gold-real-webgl-${{ github.run_id }}
          path: |
            test-results/**/g4e7g-*.png
            test-results/**/g4e7g-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
