name: W9-C2 G4E-7I readable HUD and native-road contours private WebGL
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7i-readability.mjs'
      - 'tests/p101-w9c2-g4e7i-readability.test.mjs'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - 'tests/browser/p101-w9c2-g4e7i-readability.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7i-readability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e7i-readable-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      DOPAGAKI_G4E7G_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: dist-private
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual B48 non-collider geometry and independent Gold
        run: |
          node --check web/drive3d.mjs
          node --check web/p101-w9c2-g4e7i-readability.mjs
          node --test tests/p101-w9c2-g4e7i-readability.test.mjs tests/p101-w9c2-g4e7g-visual-stage.test.mjs tests/p101-w9c2-g4e7h-hud-focus.test.mjs
      - name: Install supported pinned Playwright Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build strictly private real GLIDE/GOLD docs
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GOLD_LOCAL_VISUAL.json
      - name: Actual WebGL screenshots, same-pose HUD 12px warning audit
        run: npx playwright test tests/browser/p101-w9c2-g4e7i-readability.spec.mjs
      - name: Exclude non-approved GLIDE geometry from public distributions
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7i-real-webgl-${{ github.run_id }}
          path: |
            test-results/**/g4e7i-*.png
            test-results/**/g4e7i-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
