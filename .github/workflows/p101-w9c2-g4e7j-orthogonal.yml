name: W9-C2 G4E-7J orthogonal HUD vs genuine B48 contour real WebGL
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7j-matrix.mjs'
      - 'web/p101-w9c2-g4e7i-readability.mjs'
      - 'tests/p101-w9c2-g4e7j-matrix.test.mjs'
      - 'web/drive3d.mjs'
      - 'scripts/build.mjs'
      - 'tests/browser/p101-w9c2-g4e7j-orthogonal.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7j-orthogonal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e7j-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      DOPAGAKI_G4E7G_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: dist-private
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node physics protection, 2x2 truth table, no fake road and JS syntax
        run: |
          node --check web/drive3d.mjs
          node --check web/p101-w9c2-g4e7j-matrix.mjs
          node --test tests/p101-w9c2-g4e7j-matrix.test.mjs tests/p101-w9c2-g4e7i-readability.test.mjs tests/p101-w9c2-g4e7g-visual-stage.test.mjs
      - name: Install supported Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate private-only physical GLIDE stage
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GOLD_LOCAL_VISUAL.json
      - name: Twelve actual same-camera screenshots of 2x2 factors including DOM vs canvas
        run: npx playwright test tests/browser/p101-w9c2-g4e7j-orthogonal.spec.mjs
      - name: Public variants cannot contain unapproved GLIDE
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7j-orthogonal-real-webgl-${{ github.run_id }}
          path: |
            test-results/**/g4e7j-*.png
            test-results/**/g4e7j-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
