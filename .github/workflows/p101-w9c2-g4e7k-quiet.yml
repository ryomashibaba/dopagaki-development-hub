name: W9-C2 G4E-7K quiet Skyline original-chevron real-WebGL review
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-a13-road-art.mjs'
      - 'web/p101-w9c2-g4e7k-quiet-visual.mjs'
      - 'tests/p101-w9c2-g4e7k-quiet.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7k-quiet.spec.mjs'
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - '.github/workflows/p101-w9c2-g4e7k-quiet.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e7k-quiet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quiet-real-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      DOPAGAKI_G4E7G_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: dist-private
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gold W8 art regression, 7 REAL B48 skins, 28 moving machines, no phantom road
        run: |
          node --check web/drive3d.mjs
          node --check web/p101-a13-road-art.mjs
          node --test tests/p101-a13-road-art.test.mjs tests/p101-w9c2-g4e7k-quiet.test.mjs tests/p101-w9c2-g4e7g-visual-stage.test.mjs
      - name: Install Chromium on supported system
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate only private Gold and GLIDE
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7G_GOLD_LOCAL_VISUAL.json
      - name: Real WebGL same-pose 12 snapshots of actual GL and unchanged HUD
        run: npx playwright test tests/browser/p101-w9c2-g4e7k-quiet.spec.mjs
      - name: Public stage builds must not include private trials
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7G_GLIDE_LOCAL_VISUAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7k-quiet-skyline-real-webgl-${{ github.run_id }}
          path: |
            test-results/**/g4e7k-*.png
            test-results/**/g4e7k-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
