name: W9-C2 G4E-7O real B48 narrow road human manual QA controls
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7o-manual-qa.mjs'
      - 'web/p101-w9c2-g4e7o-manual-panel.mjs'
      - 'web/drive3d.mjs'
      - 'scripts/build.mjs'
      - 'tests/p101-w9c2-g4e7o-manual.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7o-manual.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7o-manual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w9c2-g4e7o-manual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manual-controls-no-human-claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      DOPAGAKI_G4E7M_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: dist-private
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact B48 half-width/signed edge margin and no data upload
        run: |
          node --check web/drive3d.mjs
          node --check web/p101-w9c2-g4e7o-manual-panel.mjs
          node --test tests/p101-w9c2-g4e7o-manual.test.mjs tests/p101-w9c2-g4e7m-physical.test.mjs
      - name: Install pinned Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build real private road trials
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7M_THREAD_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7M_PRECIPICE_LOCAL_TRIAL.json
      - name: Real Chromium controls, in-memory two-run session and JSON export (NOT human)
        run: npx playwright test tests/browser/p101-w9c2-g4e7o-manual.spec.mjs
      - name: Gold and production builds cannot receive unapproved 13m-road JSON
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7M_THREAD_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7M_PRECIPICE_LOCAL_TRIAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7M_THREAD_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7M_PRECIPICE_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7o-human-qa-ui-not-human-${{ github.run_id }}
          path: |
            test-results/**/g4e7o-*.png
            test-results/**/g4e7o-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
