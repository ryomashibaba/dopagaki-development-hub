name: W9-C2 G4E-7Q actual B48 dive leap private WebGL (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/build.mjs'
      - 'scripts/p101-w9c2-g4e7q-dive-build.mjs'
      - 'web/drive3d.mjs'
      - 'web/p101-a13-road-art.mjs'
      - 'web/p100-road-read.mjs'
      - 'web/p101-b5-road-optic.mjs'
      - 'tests/p101-w9c2-g4e7q-gap-visual.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7q-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7q-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7q-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physics-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOPAGAKI_G4E7Q_VISUAL: '1'
      DOPAGAKI_BUILD_DIR: dist-private
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, native surface and optical physical gap guards
        run: |
          node --check web/drive3d.mjs
          node --check scripts/build.mjs
          node --test tests/p101-w9c2-g4e7q-dive.test.mjs tests/p101-w9c2-g4e7q-gap-visual.test.mjs tests/p101-a13-road-art.test.mjs
      - name: Pinned Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build separate private physical DROP and LEAP JSON
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7Q_DROP_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7Q_LEAP_LOCAL_TRIAL.json
      - name: Actual B48 real-WebGL footage of crest and landing with honest gap
        run: npx playwright test tests/browser/p101-w9c2-g4e7q-webgl.spec.mjs
      - name: Public leak gate even if local G4E7Q environment flag is ON
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7Q_DROP_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7Q_LEAP_LOCAL_TRIAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7Q_DROP_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7Q_LEAP_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7q-physical-dive-gap-WebGL-${{ github.run_id }}
          path: |
            test-results/**/g4e7q-*.png
            test-results/**/g4e7q-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
