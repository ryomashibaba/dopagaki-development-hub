name: W9-C2 G4E-7R graded physical dive and genuine leap physics (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7r-grade-build.mjs'
      - 'scripts/p101-w9c2-g4e7r-native.mjs'
      - 'tests/p101-w9c2-g4e7r-grade.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7r-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7r-physical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-real-B48:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real graded B48, missing strip, original Gold/Q protected
        run: |
          node --check scripts/p101-w9c2-g4e7r-grade-build.mjs
          node --check scripts/p101-w9c2-g4e7r-native.mjs
          node --test tests/p101-w9c2-g4e7r-grade.test.mjs tests/p101-w9c2-g4e7q-dive.test.mjs
      - name: Genuine 240Hz start00 and SEPARATE local launch physics evidence
        run: |
          node scripts/p101-w9c2-g4e7r-native.mjs g4e7r-native.json
          node --input-type=module -e '
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("g4e7r-native.json","utf8"));
          if(d.hz!==240||!d.goldControl||!d.glideControl||
           d.canonical.length!==2||d.local.length!==4||
           d.canonical.some(x=>x.local||x.initialSpeedMps!==52)||
           d.local.some(x=>!x.local||x.certifiedSlope2Meters!==0)||
           d.certifiedSlope2Meters!==0||d.approval!=="HOLD"||
           d.humanPlaytest!=="NOT_RUN")throw Error("G4E7R must record authentic honest native results");
          console.log("G4E7R honest native evidence recorded; NOT an approval");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7r-real-graded-native-${{ github.run_id }}
          path: g4e7r-native.json
          if-no-files-found: ignore
          retention-days: 10
