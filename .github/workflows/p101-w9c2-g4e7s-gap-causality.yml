name: W9-C2 G4E-7S causal physical-gap A/B diagnostic (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7s-gap-causality.mjs'
      - 'tests/p101-w9c2-g4e7s-gap-causality.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7s-gap-causality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-240hz-causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare real CUT with exactly matching solid SWEEP
        run: |
          node --check scripts/p101-w9c2-g4e7s-gap-causality.mjs
          node --test tests/p101-w9c2-g4e7s-gap-causality.test.mjs
          node scripts/p101-w9c2-g4e7s-gap-causality.mjs g4e7s-gap-causality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7s-real-gap-causal-${{ github.run_id }}
          path: g4e7s-gap-causality.json
          if-no-files-found: ignore
          retention-days: 10
