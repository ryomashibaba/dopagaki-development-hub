name: W9-C2 G4E-7S native 240Hz high-speed camera evidence (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7s-native-camera.mjs'
      - 'tests/p101-w9c2-g4e7s-native-camera.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7s-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-speed-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical 240Hz native camera poses and Gold/R regression
        run: |
          node --check scripts/p101-w9c2-g4e7s-native-camera.mjs
          node --test tests/p101-w9c2-g4e7s-native-camera.test.mjs tests/p101-w9c2-g4e7r-grade.test.mjs
          node scripts/p101-w9c2-g4e7s-native-camera.mjs g4e7s-native-camera.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7s-actual-start00-240hz-${{ github.run_id }}
          path: g4e7s-native-camera.json
          if-no-files-found: ignore
          retention-days: 10
