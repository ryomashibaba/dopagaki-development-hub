name: W9-C2 G4E-7S native-speed true WebGL skyline A/B (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/build.mjs'
      - 'web/drive3d.mjs'
      - 'web/p101-w9c2-g4e7s-shard-city.mjs'
      - 'scripts/p101-w9c2-g4e7s-native-camera.mjs'
      - 'tests/p101-w9c2-g4e7s-shard-city.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7s-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7s-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7s-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  true-native-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7R_VISUAL: '1'
      DOPAGAKI_G4E7S_VISUAL: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure camera and independent 6-spire geometry
        run: |
          node --check scripts/build.mjs
          node --check web/drive3d.mjs
          node --check web/p101-w9c2-g4e7s-shard-city.mjs
          node --test tests/p101-w9c2-g4e7s-native-camera.test.mjs tests/p101-w9c2-g4e7s-shard-city.test.mjs
      - name: Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate private real B48 and real 240Hz snapshots
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7R_CUT_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7S_240HZ_PRIVATE.json
      - name: Matched exact physics camera A/B, 8 screenshots
        run: npx playwright test tests/browser/p101-w9c2-g4e7s-webgl.spec.mjs
      - name: No private R/S trace leaked to public or public-safe builds
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7S_240HZ_PRIVATE.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7R_CUT_LOCAL_TRIAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7S_240HZ_PRIVATE.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7R_CUT_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7s-matched-240hz-WebGL-${{ github.run_id }}
          path: |
            test-results/**/g4e7s-*.png
            test-results/**/g4e7s-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
