name: W9-C2 G4E-7T real B48 grounded-lip scout (HOLD)
# Restart the corrected native ready-state 240Hz lip detection.
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7t-grounded-lip-scout.mjs'
      - 'tests/p101-w9c2-g4e7t-grounded-lip-scout.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7t-grounded-lip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-lip:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan grounded physical lip and original 28 machines
        run: |
          node --check scripts/p101-w9c2-g4e7t-grounded-lip-scout.mjs
          node scripts/p101-w9c2-g4e7t-grounded-lip-scout.mjs g4e7t-grounded-lip.json
          node --test tests/p101-w9c2-g4e7t-grounded-lip-scout.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7t-grounded-lip-scout-${{ github.run_id }}
          path: g4e7t-grounded-lip.json
          if-no-files-found: ignore
          retention-days: 10
