name: W9-C2 G4E-7T R2 real lowered-B48 landing 240Hz (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7t-lower-landing-build.mjs'
      - 'scripts/p101-w9c2-g4e7t-lower-landing-native.mjs'
      - 'tests/p101-w9c2-g4e7t-lower-landing.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7t-lower-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-lower-landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact native B48 vertical grade and actual early gap
        run: |
          node --check scripts/p101-w9c2-g4e7t-lower-landing-build.mjs
          node --check scripts/p101-w9c2-g4e7t-lower-landing-native.mjs
          node --test tests/p101-w9c2-g4e7t-lower-landing.test.mjs
          node scripts/p101-w9c2-g4e7t-lower-landing-native.mjs g4e7t-lowered-landing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7t-lower-real-B48-landing-${{ github.run_id }}
          path: g4e7t-lowered-landing.json
          if-no-files-found: ignore
          retention-days: 10
