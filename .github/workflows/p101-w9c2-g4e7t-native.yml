name: W9-C2 G4E-7T 240Hz early real gap native matrix (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7t-native-matrix.mjs'
      - 'scripts/p101-w9c2-g4e7t-real-early-gap-build.mjs'
      - 'tests/p101-w9c2-g4e7t-native.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7t-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-240hz-early-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gold GLIDE controls and 240Hz gameplay-causal comparisons
        run: |
          node --check scripts/p101-w9c2-g4e7t-native-matrix.mjs
          node scripts/p101-w9c2-g4e7t-native-matrix.mjs g4e7t-native-matrix.json
          node --test tests/p101-w9c2-g4e7t-native.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7t-native-early-neck-${{ github.run_id }}
          path: g4e7t-native-matrix.json
          if-no-files-found: ignore
          retention-days: 10
