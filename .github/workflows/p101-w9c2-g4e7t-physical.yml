name: W9-C2 G4E-7T real early 13m B48 neck and gaps (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7t-real-early-gap-build.mjs'
      - 'tests/p101-w9c2-g4e7t-real-early-gap.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7t-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-early-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify B48 13m early waist and native collision gap
        run: |
          node --check scripts/p101-w9c2-g4e7t-real-early-gap-build.mjs
          node --test tests/p101-w9c2-g4e7t-real-early-gap.test.mjs tests/p101-w9c2-g4e7r-grade.test.mjs
