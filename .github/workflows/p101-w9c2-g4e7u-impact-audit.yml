name: W9-C2 G4E-7U non-mutating true B48 impact audit (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7u-impact-audit.mjs'
      - 'tests/p101-w9c2-g4e7u-impact-audit.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7u-impact-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-CCD-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify large speed loss from physical event evidence, no gameplay edits
        run: |
          node --check scripts/p101-w9c2-g4e7u-impact-audit.mjs
          node --test tests/p101-w9c2-g4e7u-impact-audit.test.mjs
          node scripts/p101-w9c2-g4e7u-impact-audit.mjs g4e7u-impact-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7u-native-CCD-impact-${{ github.run_id }}
          path: g4e7u-impact-audit.json
          if-no-files-found: ignore
          retention-days: 10
