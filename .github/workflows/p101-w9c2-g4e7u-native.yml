name: W9-C2 G4E-7U genuine one-cell B48 gap landing 240Hz (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7u-single-cell-build.mjs'
      - 'scripts/p101-w9c2-g4e7u-short-gap-native.mjs'
      - 'tests/p101-w9c2-g4e7u-one-cell.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7u-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-one-cell-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual B48 one-cell missing collider and all original hazards
        run: |
          node --check scripts/p101-w9c2-g4e7u-single-cell-build.mjs
          node --check scripts/p101-w9c2-g4e7u-short-gap-native.mjs
          node --test tests/p101-w9c2-g4e7u-one-cell.test.mjs tests/p101-w9c2-g4e7t-real-early-gap.test.mjs
      - name: Canonical 240Hz start00 cause and full route (HONEST HUMAN HOLD)
        run: |
          node scripts/p101-w9c2-g4e7u-short-gap-native.mjs g4e7u-real-gap-native.json
          node --input-type=module -e '
          import fs from "node:fs";
          const a=JSON.parse(fs.readFileSync("g4e7u-real-gap-native.json","utf8"));
          if(a.nativeHz!==240||!a.start00||a.initialSpeed!==52||
           a.movingMachines!==28||a.realRoads!==7||
           a.candidates.length!==10||a.candidates[0].variant!=="control"||
           a.candidates.some(c=>c.certifiedSlope2Meters!==0)||
           a.acceptance!=="HOLD")throw Error("G4E7U native evidence tampered");
          console.log("G4E7U 240Hz honest FULL or failed native run recorded");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7u-native-short-B48-${{ github.run_id }}
          path: g4e7u-real-gap-native.json
          if-no-files-found: ignore
          retention-days: 10
