name: W9-C2 G4E-7V true gap causal physics versus identical solid (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7v-causal-gap.mjs'
      - 'tests/p101-w9c2-g4e7v-causal-gap.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7v-causal-gap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-causal-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Matched 240Hz start00 no-floor versus true ONE53 lip
        run: |
          node --check scripts/p101-w9c2-g4e7v-causal-gap.mjs
          node --test tests/p101-w9c2-g4e7v-causal-gap.test.mjs
          node scripts/p101-w9c2-g4e7v-causal-gap.mjs g4e7v-physical-gap-causality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7v-causal-240hz-actual-B48-${{ github.run_id }}
          path: g4e7v-physical-gap-causality.json
          if-no-files-found: ignore
          retention-days: 10
