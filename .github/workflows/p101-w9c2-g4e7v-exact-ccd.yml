name: W9-C2 G4E-7V native exact CCD triangle shadow (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7v-exact-ccd-audit.mjs'
      - 'tests/p101-w9c2-g4e7v-exact-ccd.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7v-exact-ccd.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-exact-native-CCD:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify selected native CCD triangle and shadow physics exact 240Hz parity
        run: |
          node --check scripts/p101-w9c2-g4e7v-exact-ccd-audit.mjs
          node --test tests/p101-w9c2-g4e7v-exact-ccd.test.mjs
          node scripts/p101-w9c2-g4e7v-exact-ccd-audit.mjs g4e7v-selected-real-ccd.json
          git diff --exit-code -- private/reference_only/director/physics.js
          test ! -e private/reference_only/director/physics.g4e7v-untracked-shadow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7v-real-selected-CCD-${{ github.run_id }}
          path: g4e7v-selected-real-ccd.json
          if-no-files-found: ignore
          retention-days: 10
