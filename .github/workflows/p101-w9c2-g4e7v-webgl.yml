name: W9-C2 G4E-7V authentic high-speed B48 Chrome visual (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/build.mjs'
      - 'scripts/p101-w9c2-g4e7v-exit-build.mjs'
      - 'scripts/p101-w9c2-g4e7v-camera-frames.mjs'
      - 'web/drive3d.mjs'
      - 'web/p101-a13-road-art.mjs'
      - 'web/p100-road-read.mjs'
      - 'web/p101-b5-road-optic.mjs'
      - 'tests/p101-w9c2-g4e7v-camera-frames.test.mjs'
      - 'tests/p101-w9c2-g4e7v-visual.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7v-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7v-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7v-webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  true-240hz-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7V_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real B48 and source camera evidence
        run: |
          node --check scripts/build.mjs
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7v-exit.test.mjs tests/p101-w9c2-g4e7v-camera-frames.test.mjs tests/p101-w9c2-g4e7v-visual.test.mjs
      - name: Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate only private real B48 and 240Hz actual camera files
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7V_ORIGINAL_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7V_EXIT6_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7V_SLOPE6_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7V_240HZ_FRAMES_LOCAL.json
      - name: 12 real high-speed WebGL comparison screenshots
        run: npx playwright test tests/browser/p101-w9c2-g4e7v-webgl.spec.mjs
      - name: Assert nonpublication of unapproved real B48 trials
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7V_SLOPE6_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7V_240HZ_FRAMES_LOCAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7V_SLOPE6_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7V_240HZ_FRAMES_LOCAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7v-real-240hz-GPU-sightlines-${{ github.run_id }}
          path: |
            test-results/**/g4e7v-*.png
            test-results/**/g4e7v-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 10
