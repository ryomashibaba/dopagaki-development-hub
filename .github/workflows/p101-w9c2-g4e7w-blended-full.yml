name: W9-C2 G4E-7W R2 full native 7-road improved grounded jump (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7w-blended-full-native.mjs'
      - 'tests/p101-w9c2-g4e7w-blended-full.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7w-blended-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-seven-road-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual early grounded B48 15m lanes retain physical machines and cut
        run: |
          node --check scripts/p101-w9c2-g4e7w-blended-full-native.mjs
          node --test tests/p101-w9c2-g4e7w-blended-full.test.mjs
      - name: Native 240Hz canonical full seven-road P96 research, three paired comparisons
        run: |
          node scripts/p101-w9c2-g4e7w-blended-full-native.mjs g4e7w-blended-full-240hz.json
          node --input-type=module -e '
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("g4e7w-blended-full-240hz.json","utf8"));
          if(d.hz!==240||!d.start00||d.pairs.length!==3||
           d.startSpeedMps!==52||d.realRoads!==7||
           d.originalMovingB51C!==28||d.formalSlope2Meters!==0||
           d.publication!=="HOLD"||
           d.pairs.some(p=>p.fullRoadCut.certifiedSlope2Meters!==0))
           throw Error("G4E7W R2 full 7-road physics provenance/acceptance violation");
          console.log("G4E7W improved grounded-true-gap complete 240Hz physics recorded.");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7w-r2-full-real-240hz-${{ github.run_id }}
          path: g4e7w-blended-full-240hz.json
          if-no-files-found: ignore
          retention-days: 12
