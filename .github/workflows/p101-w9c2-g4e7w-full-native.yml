name: W9-C2 G4E-7W true narrow B48 full 7-road 240Hz (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7w-full-native.mjs'
      - 'tests/p101-w9c2-g4e7w-full-native.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7w-full-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-seven-physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: canonical complete 240Hz seven-road native four real runs
        run: |
          node --check scripts/p101-w9c2-g4e7w-full-native.mjs
          node --test tests/p101-w9c2-g4e7w-full-native.test.mjs
          node scripts/p101-w9c2-g4e7w-full-native.mjs g4e7w-complete-native.json
          node --input-type=module -e '
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("g4e7w-complete-native.json","utf8"));
          if(d.physicsHz!==240||!d.start00||d.initialSpeedMps!==52||
          d.pairs.length!==2||d.originalMovingMachines!==28||
          d.pairs.some(x=>x.trueGap.officialSlope2Meters!==0||
             x.trueGap.humanApproval!=="NOT_TESTED")||
          d.publish!=="HOLD")throw Error("W full physics evidence must not be promoted");
          console.log("W native 7-road evidence recorded; quality remains HOLD.");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7w-full-240hz-B48-7-road-${{ github.run_id }}
          path: g4e7w-complete-native.json
          if-no-files-found: ignore
          retention-days: 12
