name: W9-C2 G4E-7W real grounded takeoff 240Hz causal shortlisting (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7w-grounded-cut-build.mjs'
      - 'scripts/p101-w9c2-g4e7w-causal-screen.mjs'
      - 'tests/p101-w9c2-g4e7w-grounded-cut.test.mjs'
      - '.github/workflows/p101-w9c2-g4e7w-grounded-cut.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-grounded-causal-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact narrow B48 and nonbridging open-hole structural guardrails
        run: |
          node --check scripts/p101-w9c2-g4e7w-grounded-cut-build.mjs
          node --check scripts/p101-w9c2-g4e7w-causal-screen.mjs
          node --test tests/p101-w9c2-g4e7w-grounded-cut.test.mjs
      - name: Genuine start00 240Hz causal grounded hole versus SAME skin no hole
        run: |
          node scripts/p101-w9c2-g4e7w-causal-screen.mjs g4e7w-real-grounded-screen.json
          node --input-type=module -e '
          import fs from "node:fs";
          const a=JSON.parse(fs.readFileSync("g4e7w-real-grounded-screen.json","utf8"));
          if(a.hz!==240||!a.start00||a.testedCandidates<9||
          !a.sameRealB48ExceptVoid||a.certifiedSlope2Meters!==0||
          a.results.some(x=>x.officialSlope2Meters!==0||x.humanFairness!=="HOLD"||
           x.notAFullCourseTest!==true)||a.publication!=="HOLD")
           throw Error("W9C2 G4E7W invalid true short-screen provenance");
          console.log("G4E7W true native 240Hz local screen only; full 7/7 is not claimed.");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7w-grounded-true-gap-shortscreen-${{ github.run_id }}
          path: g4e7w-real-grounded-screen.json
          if-no-files-found: ignore
          retention-days: 12
