name: W9-C2 G4E-7W physical true 15m gap WebGL actual-speed sightlines (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/build.mjs'
      - 'scripts/p101-w9c2-g4e7w-camera-frames.mjs'
      - 'tests/p101-w9c2-g4e7w-camera-frames.test.mjs'
      - 'web/drive3d.mjs'
      - 'tests/browser/p101-w9c2-g4e7w-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7w-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7w-native-WebGL-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-240hz-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7W_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original native Runner cameras and B48 original protection
        run: |
          node --check scripts/build.mjs
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7w-camera-frames.test.mjs tests/p101-w9c2-g4e7w-takeoff-blend.test.mjs
      - name: Install Chromium WebGL
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Only private build emits unapproved actual 15m physical gap JSON
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7W_A070_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7W_240HZ_FRAMES_LOCAL.json
      - name: True start00 native 240Hz 10 WebGL screenshots
        run: npx playwright test tests/browser/p101-w9c2-g4e7w-webgl.spec.mjs
      - name: Production and site leak tests, no experimental B48
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7W_240HZ_FRAMES_LOCAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7W_240HZ_FRAMES_LOCAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7w-real-15m-240hz-WebGL-${{ github.run_id }}
          path: |
            test-results/**/g4e7w-*.png
            test-results/**/g4e7w-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 12
