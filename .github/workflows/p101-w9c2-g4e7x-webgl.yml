name: W9-C2 G4E-7X true B48 15m visual approach A/B (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7x-gap-reading.mjs'
      - 'tests/p101-w9c2-g4e7x-gap-reading.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7x-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7x-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-native-physics-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7W_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 195m geometry cues do not cross gap, stage record key legal
        run: |
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7x-gap-reading.test.mjs tests/p101-w9c2-g4e7w-camera-frames.test.mjs
      - name: Install Chromium headless shell without apt dependency churn
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --only-shell
      - name: True physical track and actual 240Hz camera frames private only
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7W_A070_LOCAL_TRIAL.json
      - name: 20 real GPU screenshots baseline vs physical-grounded guides
        run: npx playwright test tests/browser/p101-w9c2-g4e7x-webgl.spec.mjs
      - name: Public and site must not publish unapproved genuine B48 evidence
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7W_240HZ_FRAMES_LOCAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7W_A070_LOCAL_TRIAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7W_240HZ_FRAMES_LOCAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7x-native-B48-real-GPU-before-after-${{ github.run_id }}
          path: |
            test-results/**/g4e7x-*.png
            test-results/**/g4e7x-*.json
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 12
