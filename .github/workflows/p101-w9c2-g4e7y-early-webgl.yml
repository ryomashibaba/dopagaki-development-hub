name: W9-C2 G4E-7Y R2 early real 240Hz 30 WebGL lookahead A/B/C (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'scripts/p101-w9c2-g4e7w-camera-frames.mjs'
      - 'tests/p101-w9c2-g4e7y-early-native.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7y-early-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7y-early-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-early-240hz-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7W_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original ball-locked physics early camera evidence
        run: |
          node --check scripts/p101-w9c2-g4e7w-camera-frames.mjs
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7y-early-native.test.mjs tests/p101-w9c2-g4e7y-sightline.test.mjs
      - name: Chromium headless-only
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --only-shell
      - name: Private render only true 240Hz
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7Y_EARLY_240HZ_FRAMES_LOCAL.json
          test -f dist-private/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
      - name: 30 paired GPU screenshots and unchanged native camera coordinates
        run: npx playwright test tests/browser/p101-w9c2-g4e7y-early-webgl.spec.mjs
      - name: Public and site leak guards
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7Y_EARLY_240HZ_FRAMES_LOCAL.json
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7W_A070_LOCAL_TRIAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7Y_EARLY_240HZ_FRAMES_LOCAL.json
          test ! -e dist/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7y-r2-early-30scene-real-native-${{ github.run_id }}
          path: |
            test-results/**/g4e7y-r2-*.png
            test-results/**/g4e7y-r2-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 12
