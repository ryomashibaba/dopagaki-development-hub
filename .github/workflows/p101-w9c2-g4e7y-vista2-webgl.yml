name: W9-C2 G4E-7Y R4 road-safe 2-chapter exterior WebGL comparison (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p93-void-breaker-visual.mjs'
      - 'web/drive3d.mjs'
      - 'tests/p101-w9c2-g4e7y-vista2.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7y-vista2-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7y-vista2-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-road-GPU:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7W_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7y-vista2.test.mjs
      - run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --only-shell
      - run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7Y_EARLY_240HZ_FRAMES_LOCAL.json
      - run: npx playwright test tests/browser/p101-w9c2-g4e7y-vista2-webgl.spec.mjs
      - run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7Y_EARLY_240HZ_FRAMES_LOCAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7y-r4-12-frame-two-chapter-GPU-${{ github.run_id }}
          path: |
            test-results/**/g4e7y-r4-*.png
            test-results/**/g4e7y-r4-*.json
            test-results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 12
