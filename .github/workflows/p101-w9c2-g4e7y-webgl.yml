name: W9-C2 G4E-7Y first-road 240Hz visual occlusion A/B/C (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/drive3d.mjs'
      - 'web/p101-a13-architecture.mjs'
      - 'web/p101-a13-w9-architecture.mjs'
      - 'tests/p101-w9c2-g4e7y-sightline.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7y-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7y-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g4e7y-real-WebGL-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-b48-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7W_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural noncollision and B51-C 28 machines untouched
        run: |
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7y-sightline.test.mjs tests/p101-w9c2-g4e7w-camera-frames.test.mjs
      - name: Install native Chromium headless shell
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --only-shell
      - name: Generate original physics and actual-speed camera ONLY for private render
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
      - name: Matched 18 GPU views for actual first-road visual blocking
        run: npx playwright test tests/browser/p101-w9c2-g4e7y-webgl.spec.mjs
      - name: Public stage leakage denied
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7W_A065_LOCAL_TRIAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7W_A070_LOCAL_TRIAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7y-real-240hz-scene-clearance-${{ github.run_id }}
          path: |
            test-results/**/g4e7y-*.png
            test-results/**/g4e7y-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 12
