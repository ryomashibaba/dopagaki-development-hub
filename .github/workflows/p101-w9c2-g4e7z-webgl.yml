name: W9-C2 G4E-7Z true narrow B48 small nonblocking signals A/B (HOLD)
on:
  push:
    branches: [p101-velocity-overdrive-native-trial]
    paths:
      - 'web/p101-w9c2-g4e7x-gap-reading.mjs'
      - 'web/drive3d.mjs'
      - 'tests/p101-w9c2-g4e7z-signal.test.mjs'
      - 'tests/browser/p101-w9c2-g4e7z-webgl.spec.mjs'
      - '.github/workflows/p101-w9c2-g4e7z-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-B48-gap-vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
      DOPAGAKI_BUILD_DIR: dist-private
      DOPAGAKI_G4E7W_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All surface geometries pass and stage source immutability
        run: |
          node --check web/p101-w9c2-g4e7x-gap-reading.mjs
          node --check web/drive3d.mjs
          node --test tests/p101-w9c2-g4e7z-signal.test.mjs tests/p101-w9c2-g4e7y-vista2.test.mjs
      - name: Use reproducible Chromium headless browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium --only-shell
      - name: Generate real 240Hz proof and private collision geography
        run: |
          npm run build:private
          test -f dist-private/generated/P101_A13_W9C2_G4E7Y_EARLY_240HZ_FRAMES_LOCAL.json
      - name: Matched authentic viewport with and without visual markers
        run: npx playwright test tests/browser/p101-w9c2-g4e7z-webgl.spec.mjs
      - name: No private stage releases
        run: |
          npm run build:site
          test ! -e dist-site/generated/P101_A13_W9C2_G4E7W_A070_LOCAL_TRIAL.json
          npm run build:public-safe
          test ! -e dist/generated/P101_A13_W9C2_G4E7Y_EARLY_240HZ_FRAMES_LOCAL.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4e7z-16-real-240hz-B48-signal-A-B-${{ github.run_id }}
          path: |
            test-results/**/g4e7z-*.png
            test-results/**/g4e7z-*.json
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 12
