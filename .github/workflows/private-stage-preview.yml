name: DOPAGAKI P64 public stage preview (QA-gated)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-p64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P62 SHA, B48 surface, moving obstacles, frozen B45 physics
        run: npm run test:core
      - name: P94 native 240Hz full course observability (HOLD until full completion)
        run: |
          set -o pipefail
          node scripts/p94-void-native-acceptance.mjs neutral corrective | tee p94-void-physics-report.jsonl
          {
            echo '### P94 VOID BREAKER physical acceptance probe'
            echo 'Native Runner replay under neutral and scripted steering (NOT human test).'
            echo 'See the log lines prefixed P94_VOID_NATIVE for full diagnostics.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: P95 experimental machine gauntlet native 240Hz probes (candidate HOLD)
        run: |
          set -o pipefail
          node scripts/p95-hazard-probe.mjs | tee p95-machine-probe.jsonl
          {
            echo '### P95 experimental B51-C moving hazard pilot'
            echo 'Native trial reports are in the job logs under P95_HAZARD_NATIVE.'
            echo 'QA SUCCESS does NOT certify full-machine-course completion or human fairness.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: P96 physical dodge plan audit (4 profiles, human playability HOLD)
        run: |
          set -o pipefail
          node scripts/p96-native-dodge-probe.mjs | tee p96-dodge-profiles.jsonl
          {
            echo '### P96 physical motion-aware dodge audit'
            echo 'Each P96_NATIVE_* log is 240Hz true collision/finish evidence.'
            echo 'A green CI proves the probe executed, not that any plan won.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'P99 authentic varied-width roads and 12 moving machines — native 240Hz probe'
        run: |
          set -o pipefail
          node scripts/p99-real-roadplay-probe.mjs | tee p99-physical-run.jsonl
          {
            echo '### P99 separate REAL physical roadplay candidate'
            echo 'Seven actual width-modulated B48 skins with 12 active B51-C machines.'
            echo 'P99_NATIVE_* log lines are physical trials, never human fairness approval.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: P100 real changed-centerline + twelve-machine native 240Hz audit (HOLD until proven)
        run: |
          set -o pipefail
          node scripts/p100-native-sweep.mjs | tee p100-native-trial.jsonl
          echo '### P100 independent S-bend/crest physical candidate; human handling HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo 'P100_NATIVE_* lines report every real 240Hz attempt; CI green is NOT full finish approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: P101 OVERDRIVE independent true 240Hz speed and steering native trials (HOLD)
        run: |
          set -o pipefail
          node scripts/p101-native-probe.mjs | tee p101-native-hold.jsonl
          echo '### P101 real B48 physical 4x / 4.8x / 6x lateral trial: HUMAN HANDLING AND FULL FINISH HOLD' >> "$GITHUB_STEP_SUMMARY"
      - name: P101 B2 physical speed-envelope across all seven real roads (continuous acceleration, human HOLD)
        run: |
          set -o pipefail
          node scripts/p101-speed-envelope.mjs | tee p101-speed-envelope.jsonl
          echo '### P101 independent B2 speed versus curve stability (no pass inferred from any native script)' >> "$GITHUB_STEP_SUMMARY"
      - name: Reproduce all four stages deterministically
        run: npm run test:repro
      - name: Build exact public stage assets
        run: npm run build:site
      - name: Check HTTP 200, imports, and P62-404 regression
        env:
          DOPAGAKI_BUILD_DIR: dist-site
        run: npm run smoke
      - name: Keep optional public-safe fallback tested
        run: |
          npm run build:public-safe
          npm run test:core
  browser:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOPAGAKI_BUILD_DIR: dist-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the exact public website
        run: npm run build:site
      - name: 'Chromium: four stages, changing focus, timeline, HTTP errors'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p98-real-playfeel-frames-${{ github.run_id }}
          path: |
            test-results/**/p98-*.png
            test-results/**/p98-playfeel-report.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p99-physical-roadplay-comparison-${{ github.run_id }}
          path: |
            test-results/**/p99-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p100-terrain-pulse-real-frames-${{ github.run_id }}
          path: |
            test-results/**/p100-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: p64-chromium-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [qa, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release after QA and Chromium PASS
        run: npm run build:site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload immutable static site build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
      - name: Deploy stage preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live Pages HTTP, frozen P62 plus P66 and deployed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://ryomashibaba.github.io/dopagaki-development-hub/';
          const names=['EP-001','HG-001','HS-001','WV-001'];
          const suffix='_P62_KINETIC_ARCHITECTURE.json';
          async function fetchOK(path) {
            const response=await fetch(new URL(path,base),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(12000)});
            assert.equal(response.status,200,'HTTP '+response.status+' '+path);
            return response;
          }
          let info;
          for(let retry=0;retry<20;retry++){
            try {
              info=await (await fetchOK('build-info.json')).json();
              if(info.gitCommit===process.env.EXPECTED_SHA)break;
              console.log('Deployed SHA not propagated yet:',info.gitCommit);
            }catch(e){console.log('Pages propagation pending:',e.message);}
            if(retry===19)throw Error('Pages never exposed expected commit');
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          assert.equal(info.gitCommit,process.env.EXPECTED_SHA);
          assert.equal(info.version,'P100');
          assert.equal(info.stageCount,4);
          assert.equal(info.experimentalStageCount,4);
          assert.equal(info.movingObstacleCount,24);
          assert.equal(info.experimentalMovingObstacleCount,24);
          for(const path of ['','web/','drive3d/','drive3d/drive3d.mjs','drive3d/drive3d-camera.mjs','drive3d/drive3d-loop.mjs','drive3d/p73-machine-visual.mjs','drive3d/p74-nearmiss.mjs','drive3d/p75-survival.mjs','drive3d/p78-demo.mjs','drive3d/p79-practice.mjs','drive3d/p80-trackflow.mjs','drive3d/p81-edge-radar.mjs','drive3d/p82-megastructure.mjs','drive3d/p83-render-quality.mjs','drive3d/p84-visibility.mjs','drive3d/p85-energyball.mjs','drive3d/p86-chapter-splits.mjs','drive3d/p87-ghost.mjs','drive3d/p88-ghost-gap.mjs','drive3d/p89-ghost-sector-pace.mjs','drive3d/p90-racecard.mjs','drive3d/p91-approach-beacons.mjs','drive3d/p92-failure-practice.mjs','drive3d/p93-void-breaker-visual.mjs','drive3d/p94-native-steer.mjs','generated/P93_VOID_BREAKER.json','generated/P94_VOID_NATIVE_ACCEPTANCE.json','generated/P95_VOID_HAZARD_CANDIDATE.json','generated/P96_NATIVE_DODGE_ACCEPTANCE.json','drive3d/p95-hazard-layout.mjs','drive3d/p96-avoidance-steer.mjs','drive3d/p97-roadplay-gates.mjs','generated/P97_ROADPLAY_READABILITY.json','generated/P99_PRESSURE_LINES.json','generated/P99_PHYSICAL_TRIAL.json','generated/P100_TERRAIN_PULSE.json','generated/P87_REFERENCE_GHOST.json']){
            const response=await fetchOK(path);
            assert((await response.text()).length>300,'Empty public asset: '+path);
          }
          for(const id of names){
            const doc=await (await fetchOK('generated/'+id+suffix)).json();
            assert.equal(doc.stageForge.id,id);
            assert.equal(doc.movingObstacles.length,6);
          }
          const p66=await(await fetchOK('generated/P66_ECHO_RUSH.json')).json();
          assert.equal(p66.stageForge.id,'EP-P66');
          assert.equal(p66.movingObstacles.length,6);
          assert(p66.visualBlueprint.spiralRings.length>=5);
          const p93=await(await fetchOK('generated/P93_VOID_BREAKER.json')).json();
          assert.equal(p93.stageForge.id,'VB-P93');
          assert.equal(p93.surfaces.length,7);
          assert.equal(p93.stageForge.humanPlaytest,'NOT_RUN');
          assert.equal(p93.stageForge.fullStartToFinish,'NATIVE_SCRIPTED_240HZ_7_OF_7_PASS_P94');
          const p94=await(await fetchOK('generated/P94_VOID_NATIVE_ACCEPTANCE.json')).json();
          assert.equal(p94.scriptedFullPass,true);assert.equal(p94.corrective.runnerStatus,'finished');
          assert.equal(p94.corrective.visited.length,7);assert(p94.corrective.distanceMeters>3400);
          assert.equal(p94.neutral.status,'HOLD_NOT_FULLY_TRAVERSED');
          assert.equal(p94.humanPlaytest,'NOT_RUN');
          const p95=await(await fetchOK('generated/P95_VOID_HAZARD_CANDIDATE.json')).json();
          assert.equal(p95.stageForge.id,'VB-P95');
          assert.equal(p95.movingObstacles.length,12);
          assert.equal(p95.stageForge.humanPlaytest,'NOT_RUN');
          assert.equal(p95.stageForge.fullStartToFinish,'SCRIPTED_240HZ_12_ACTIVE_7_OF_7_PASS_P96');
          const p96=await(await fetchOK('generated/P96_NATIVE_DODGE_ACCEPTANCE.json')).json();
          assert.equal(p96.activeCollidingMachines,12);
          assert.equal(p96.scriptedFullPass,true);assert.equal(p96.best.status,'SCRIPTED_NATIVE_FULL_PASS');
          assert.equal(p96.best.visited.length,7);assert.equal(p96.best.machineContacts.length,0);
          assert.equal(p96.best.decisionStations.length,12);
          assert.equal(p96.unsafe.status,'HOLD_NOT_FULLY_TRAVERSED');
          assert.equal(p96.humanPlaytest,'NOT_RUN');
          assert.equal(p95.stageForge.inheritedP94Evidence,false);
          const p97=await(await fetchOK('generated/P97_ROADPLAY_READABILITY.json')).json();
          assert.equal(p97.advanceGateCount,36);assert.equal(p97.nativeCollidersActive,12);
          // P98 browser verifies the 42 giant portals + real road-edge markers visually.
          assert.equal(p97.warningBudgetSeconds,3.08);assert.equal(p97.humanPlaytest,'NOT_RUN');
          assert.equal(p97.fairness,'UNASSESSED');
          const p99=await(await fetchOK('generated/P99_PRESSURE_LINES.json')).json();
          const native99=await(await fetchOK('generated/P99_PHYSICAL_TRIAL.json')).json();
          assert.equal(p99.stageForge.id,'VB-P99');
          assert.equal(p99.surfaces.length,7);assert.equal(p99.movingObstacles.length,12);
          assert.equal(p99.stageForge.priorP96CompletionApplicable,false);
          assert.equal(native99.activeColliders,12);assert.equal(native99.physicalWidths.length,7);
          assert.equal(native99.humanPlaytest,'NOT_RUN');
          const p100=await(await fetchOK('generated/P100_TERRAIN_PULSE.json')).json();
          assert.equal(p100.stageForge.id,'VB-P100');
          assert.equal(p100.surfaces.length,7);
          assert.equal(p100.movingObstacles.length,12);
          assert.equal(p100.stageForge.heightScale,0.25);
          assert.equal(p100.stageForge.humanPlaytest,'NOT_RUN');
          assert.equal(p100.stageForge.fullStartToFinish,'P100_NATIVE_240HZ_12_ACTIVE_TWO_PROFILE_FINISH_VERIFIED');
          assert.equal(JSON.stringify(p100.movingObstacles),JSON.stringify(p99.movingObstacles),'P100 machines modified');
          let realBends=0;
          for(let i=0;i<7;i++){
            assert(p100.surfaces[i].collidable&&p100.surfaces[i].rideable);
            const delta=Math.max(...[6,9,12,15,18,21,24].map(row=>
              Math.hypot(...p100.surfaces[i].points[row*5+2].map((x,j)=>x-p99.surfaces[i].points[row*5+2][j]))));
            if(delta>5)realBends++;
          }
          assert(realBends>=5,'P100 real physical road deformation missing on published site');
          const ghost=await(await fetchOK('generated/P87_REFERENCE_GHOST.json')).json();
          assert.equal(ghost.schema,'dopagaki.native-reference-ghost/1');
          assert(ghost.finished&&ghost.finishSeconds>82&&ghost.finishSeconds<85);
          assert(ghost.samples.length>1200&&ghost.samples.length<1450);
          assert.equal(ghost.sectors.length,8);
          assert(Math.abs(ghost.sectors.at(-1).time-ghost.finishSeconds)<.002);
          const gpu=await(await fetchOK('drive3d/p66-visual.mjs')).text();
          assert(gpu.includes('epicGeometry'));
          console.log('PUBLIC HTTP VERIFIED',process.env.EXPECTED_SHA,'P62 4 frozen stages / 24 obstacles + P66 cathedral / 6 machines');
          NODE
