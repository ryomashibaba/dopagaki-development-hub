name: DOPAGAKI P64 public stage preview (QA-gated)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-p64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P62 SHA, B48 surface, moving obstacles, frozen B45 physics
        run: npm run test:core
      - name: Reproduce all four stages deterministically
        run: npm run test:repro
      - name: Build exact public stage assets
        run: npm run build:site
      - name: Check HTTP 200, imports, and P62-404 regression
        env:
          DOPAGAKI_BUILD_DIR: dist-site
        run: npm run smoke
      - name: Keep optional public-safe fallback tested
        run: |
          npm run build:public-safe
          npm run test:core
  browser:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOPAGAKI_BUILD_DIR: dist-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the exact public website
        run: npm run build:site
      - name: Chromium: four stages, changing focus, timeline, HTTP errors
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: p64-chromium-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [qa, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release after QA and Chromium PASS
        run: npm run build:site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload immutable static site build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
      - name: Deploy stage preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
