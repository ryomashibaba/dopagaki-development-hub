name: DOPAGAKI P64 public stage preview (QA-gated)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dopagaki-p64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P62 SHA, B48 surface, moving obstacles, frozen B45 physics
        run: npm run test:core
      - name: Reproduce all four stages deterministically
        run: npm run test:repro
      - name: Build exact public stage assets
        run: npm run build:site
      - name: Check HTTP 200, imports, and P62-404 regression
        env:
          DOPAGAKI_BUILD_DIR: dist-site
        run: npm run smoke
      - name: Keep optional public-safe fallback tested
        run: |
          npm run build:public-safe
          npm run test:core
  browser:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOPAGAKI_BUILD_DIR: dist-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the exact public website
        run: npm run build:site
      - name: 'Chromium: four stages, changing focus, timeline, HTTP errors'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: p64-chromium-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: [qa, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release after QA and Chromium PASS
        run: npm run build:site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload immutable static site build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site
      - name: Deploy stage preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live Pages HTTP, frozen P62 plus P66 and deployed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://ryomashibaba.github.io/dopagaki-development-hub/';
          const names=['EP-001','HG-001','HS-001','WV-001'];
          const suffix='_P62_KINETIC_ARCHITECTURE.json';
          async function fetchOK(path) {
            const response=await fetch(new URL(path,base),{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(12000)});
            assert.equal(response.status,200,'HTTP '+response.status+' '+path);
            return response;
          }
          let info;
          for(let retry=0;retry<20;retry++){
            try {
              info=await (await fetchOK('build-info.json')).json();
              if(info.gitCommit===process.env.EXPECTED_SHA)break;
              console.log('Deployed SHA not propagated yet:',info.gitCommit);
            }catch(e){console.log('Pages propagation pending:',e.message);}
            if(retry===19)throw Error('Pages never exposed expected commit');
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          assert.equal(info.gitCommit,process.env.EXPECTED_SHA);
          assert.equal(info.version,'P74');
          assert.equal(info.stageCount,4);
          assert.equal(info.experimentalStageCount,1);
          assert.equal(info.movingObstacleCount,24);
          for(const path of ['','web/','drive3d/','drive3d/drive3d.mjs','drive3d/drive3d-camera.mjs','drive3d/drive3d-loop.mjs','drive3d/p73-machine-visual.mjs','drive3d/p74-nearmiss.mjs']){
            const response=await fetchOK(path);
            assert((await response.text()).length>300,'Empty public asset: '+path);
          }
          for(const id of names){
            const doc=await (await fetchOK('generated/'+id+suffix)).json();
            assert.equal(doc.stageForge.id,id);
            assert.equal(doc.movingObstacles.length,6);
          }
          const p66=await(await fetchOK('generated/P66_ECHO_RUSH.json')).json();
          assert.equal(p66.stageForge.id,'EP-P66');
          assert.equal(p66.movingObstacles.length,6);
          assert(p66.visualBlueprint.spiralRings.length>=5);
          const gpu=await(await fetchOK('drive3d/p66-visual.mjs')).text();
          assert(gpu.includes('epicGeometry'));
          console.log('PUBLIC HTTP VERIFIED',process.env.EXPECTED_SHA,'P62 4 frozen stages / 24 obstacles + P66 cathedral / 6 machines');
          NODE
